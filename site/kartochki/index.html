:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:32px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15}.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.main{padding:22px 20px}
@media(max-width:600px){.main{padding:18px 14px}}
h2{font-size:25px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:6px}
.lead{font-size:16.5px;line-height:1.5;margin-top:10px}
.lead b{color:var(--ink)}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 10px}
.list{display:grid;gap:12px;margin-top:16px}
.ti{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-align:left;width:100%}
.ti .no{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font:900 22px Nunito;color:#fff;background:var(--ac)}
.ti b{display:block;font-size:16.5px;color:var(--ink);line-height:1.25}.ti small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}

/* game on the whole screen */
.app:has(.kst){max-width:1120px}
.kst{position:relative;width:min(100%,calc((100vh - 24px) * 16 / 9));margin-left:auto!important;margin-right:auto!important;aspect-ratio:16/9;border-radius:22px;overflow:hidden;margin:14px 0;background:#191B2E;box-shadow:0 10px 30px rgba(30,35,80,.25);
 --ink:#191B2E;--ink-3:#3E4262;--muted:#6C6982;--vio:#4E4C8E;--vio-2:#33315F;--jade:#2E7F6C;--rose:#A8456A;--serif:'Lora',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--ease-out:cubic-bezier(.22,.9,.3,1)}
.kst.kfull{position:fixed;inset:0;z-index:1000;margin:0!important;border-radius:0;aspect-ratio:auto;width:100vw;height:100vh;height:100dvh}

.kstage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;font-family:var(--sans)}
.kstage *{box-sizing:border-box}
.kfs,.kx{position:absolute;right:8px;bottom:8px;z-index:50;width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.85);font-size:20px;cursor:pointer;color:#2B3270}
.kx{display:none;top:10px;left:10px;right:auto;bottom:auto;width:44px;height:44px;font-size:22px}
.kst.kfull .kx{display:block}.kst.kfull .kfs{display:none}
.kbig{display:flex;width:100%;font-size:19px;padding:16px;margin-top:14px;background:linear-gradient(135deg,#2DBE8C,#5B6BD8)}
.khint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:55;display:none;align-items:center;gap:10px;padding:10px 18px;border-radius:18px;background:rgba(18,14,50,.85);color:#fff;font:900 18px Nunito;pointer-events:none;white-space:nowrap}

@keyframes khint{0%,80%{opacity:1}100%{opacity:0}}
.khint .kph{font-size:30px;display:inline-block;animation:kturn 1.3s ease-in-out infinite}
@keyframes kturn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
.kst:fullscreen,.kst:-webkit-full-screen{width:100vw;height:100vh}
/* ===== ДЗ 7 ===== */
.pbar{position:relative;margin:-6px 0 16px;padding:10px 16px 12px;border-radius:18px}
.pbt{display:flex;justify-content:space-between;align-items:baseline;font:800 14px Manrope;color:var(--mu)}.pbt b{font:900 20px Nunito;color:var(--ac2)}
.pbl{height:12px;border-radius:7px;background:#D6DBE6;margin-top:6px;overflow:hidden}.pbl i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#2DBE8C,#5B6BD8);transition:width .5s}
.ti .sc7{margin-left:auto;font:900 15px Nunito;color:var(--ok);white-space:nowrap}
.ti.todo .no{background:#AEB5C8}
.left{margin-top:18px;padding:16px 18px;border-radius:22px;background:#FFF0F4;box-shadow:inset 0 0 0 3px #FFB3C8}

.left button{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px;margin-top:8px;border-radius:16px;background:#fff;text-align:left;font-weight:800;color:var(--ink);font-size:16px}

.left button small{margin-left:auto;color:var(--ac);font-weight:800;white-space:nowrap}
.allok{margin-top:18px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#2DBE8C,#5B6BD8);color:#fff;text-align:center;font:900 22px Nunito}
/* tones */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.tc{position:relative;padding:14px 10px 12px;border-radius:24px;color:#fff;text-align:center;background:var(--tc);box-shadow:0 10px 22px rgba(30,35,80,.18)}
.tc .tn{position:absolute;left:10px;top:10px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--tc);display:grid;place-items:center;font:900 26px Nunito}
.tc .tm{font:900 74px/1 Nunito;height:70px;display:grid;place-items:center}
.tc svg{width:100%;max-width:150px;height:46px;margin:2px auto 0;display:block}
.tc .ts{font:900 34px Nunito;margin-top:2px}
.tc small{display:block;font:800 14.5px Manrope;line-height:1.3;opacity:.95;margin-top:4px}
.tc button{margin-top:8px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.25);color:#fff;font-weight:900;font-size:16px}
@media(max-width:420px){.tc .tm{font-size:60px;height:58px}.tc .ts{font-size:28px}.tc small{font-size:13px}}
.big7{font:900 96px/1.1 Nunito;color:var(--ac2);margin:10px 0 0}
.big7.zh{font-family:var(--han);font-weight:400}
.big7 .num{display:inline-grid;place-items:center;width:120px;height:120px;border-radius:50%;color:#fff;font-size:76px}
.opt.num{font-size:34px}.opt.num small{display:block;font:800 13px Manrope;color:var(--mu)}
.opt.mk{font-size:60px;line-height:1}
.opt.tx{font:800 19px Manrope;padding:16px 8px}
.opt.zh{font-family:var(--han);font-weight:400;font-size:52px}
.opts.o4{grid-template-columns:repeat(2,1fr)}
.qq{font-size:20px;font-weight:800;color:var(--ink);line-height:1.35;margin-top:12px}.qq b{color:#B0284F}
.nxt{margin-top:14px;width:100%}
/* the ci / chi rule */
.zwarn{margin-top:14px;padding:18px 18px 16px;border-radius:26px;background:linear-gradient(135deg,#FF3D77,#FF8A3D);color:#fff;box-shadow:0 14px 30px rgba(255,61,119,.35)}
.zwarn .k2{display:inline-block;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.25);font:900 14px Manrope;letter-spacing:.06em;text-transform:uppercase}
.zwarn .h{font:900 27px/1.2 Nunito;margin-top:8px}
.zwarn p{font:700 17px/1.45 Manrope;margin-top:8px}.zwarn p b{background:rgba(255,255,255,.22);padding:0 6px;border-radius:8px}
.zpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.zpair div{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;color:var(--ink)}
.zpair .a{font:900 30px Nunito;color:#FF3D77}.zpair .a s{color:#9AA2BC;text-decoration-thickness:3px}
.zpair .r{font:900 24px Nunito;color:var(--ac2)}.zpair small{display:block;font:800 13px Manrope;color:var(--mu)}
.zrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.zrow button{padding:10px 4px;border-radius:18px;text-align:center}.zrow b{display:block;font:900 26px Nunito;color:var(--ac2)}.zrow small{font:800 15px Manrope;color:var(--mu)}
.zrow button.hot{box-shadow:0 0 0 3px #FF3D77,6px 6px 14px var(--sh1)}.zrow button.hot b{color:#FF3D77}
/* radicals */
.keyh{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;padding:12px;border-radius:22px;background:linear-gradient(135deg,#FFE3EB,#FFF1D6)}
.keyh .zh{font-size:72px;line-height:1;color:#FF3D77}.keyh b{display:block;font:900 22px Nunito;color:var(--ink)}.keyh small{font:800 13px Manrope;color:var(--mu)}
.newb{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:10px;background:#5B6BD8;color:#fff;font:900 12.5px Manrope;letter-spacing:.05em}
.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.reveal div{padding:8px 4px;border-radius:16px;background:#fff;text-align:center}.reveal .zh{font-size:40px;color:var(--ac2);line-height:1.1}.reveal .py{font-size:16px;color:var(--ac)}.reveal small{display:block;font:800 13px Manrope;color:var(--ink)}
.reveal div.ok{box-shadow:inset 0 0 0 3px var(--ok);background:#E6F7EF}
.reveal i{font-style:normal;color:#FF3D77}
.split{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font:900 22px Nunito;color:var(--mu)}.split .zh{font-size:48px;color:var(--ac2)}
/* stroke order */
.sopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sopts button{padding:8px;border-radius:20px;background:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.sopts svg{width:100%;aspect-ratio:1/1;display:block}
.sopts button.ok{box-shadow:inset 0 0 0 4px var(--ok);background:#E6F7EF}.sopts button.no{box-shadow:inset 0 0 0 4px var(--no);background:#FFE3EB}
.sbig{width:min(150px,40vw);margin:10px auto 0;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;position:relative}
.sbig svg{display:block;width:100%;aspect-ratio:1/1}
.anim{width:min(220px,60vw);height:min(220px,60vw);margin:12px auto 0;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;position:relative}
.anim .hw{position:absolute;inset:0}.anim svg.grid{position:absolute;inset:0;width:100%;height:100%}
.srules{display:grid;gap:8px;margin-top:10px}.srules span{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);border-radius:16px;padding:9px 12px}.srules .zh{font-size:32px;line-height:1;min-width:40px;text-align:center}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#D9D2F5 url(img/fon.webp) 50% 100%/cover no-repeat}
html,body{background:transparent}
.opt.sv{padding:8px;background:#fff}.opt.sv svg{width:100%;aspect-ratio:1/1;display:block}
.opt.sv.ok{background:#DDF5EC}.opt.sv.no{background:#FFE3EB}
.zpair .a,.zpair .r{display:block}
.opts:has(.opt.sv){max-width:520px;margin-left:auto;margin-right:auto}
body{font-family:Manrope,'LXGW WenKai GB',system-ui,-apple-system,sans-serif}
/* ===== Карточки: наши иероглифы ===== */
.kc-tlogo{font-size:30px!important;color:var(--ac2);line-height:1}
.kc-six{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.kc-six span{display:grid;place-items:center;aspect-ratio:1;border-radius:16px;background:#fff;font-size:clamp(28px,8vw,44px);color:var(--ac2);box-shadow:0 6px 14px rgba(30,35,80,.10)}
.ti.kc-lock{opacity:.55}
.kc-qh{align-items:center;margin-bottom:10px}
.kc-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#D6DBE6;margin-left:5px}
.kc-dot.d{background:var(--ok)}.kc-dot.c{background:var(--ac);box-shadow:0 0 0 3px rgba(91,107,216,.25)}
/* карточка с переворотом */
.kc-card{perspective:1400px;width:100%;max-width:440px;margin:0 auto}
.kc-in{position:relative;display:grid;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.kc-card.fl .kc-in{transform:rotateY(180deg)}
.kc-face{grid-area:1/1;min-height:300px;border-radius:28px;padding:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.kc-front{position:relative;background:linear-gradient(160deg,#fff 0%,#F3F0FF 100%);box-shadow:0 14px 30px rgba(30,35,80,.16),inset 0 0 0 3px #E3E0FA}
.kc-back{transform:rotateY(180deg);background:#fff;box-shadow:0 14px 30px rgba(30,35,80,.16),inset 0 0 0 3px #CFE9DF;gap:10px}
.kc-big{font-size:min(170px,40vw);line-height:1.05;color:var(--ac2)}
.kc-ask{font:800 15px Manrope;color:var(--mu);margin-top:6px}
.kc-pl{position:absolute;right:14px;top:14px;width:58px;height:58px;margin:0;font-size:24px}
.kc-inp{display:block;width:100%;max-width:440px;margin:16px auto 0;font:inherit;font-size:20px;padding:14px 18px;border:0;outline:none;color:var(--ink);text-align:center}
.kc-verd{font:900 24px Nunito;padding:6px 16px;border-radius:14px}
.kc-verd.g{color:#14855E;background:#DDF5EC}.kc-verd.m{color:#9A6400;background:#FFF1D6}.kc-verd.b{color:#B0284F;background:#FFE3EB}
.kc-bh{display:flex;align-items:center;gap:16px}
.kc-bh .zh{font-size:88px;line-height:1;color:var(--ac2)}
.kc-bh>div{display:grid;text-align:left}.kc-bh .py{font-size:30px;color:var(--ac)}
.kc-ru{font:900 24px Nunito;color:var(--ink)}
.kc-ex{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 12px;width:100%;max-width:440px;margin:0 auto;padding:10px 16px;border-radius:18px;background:#F4F6FB;text-align:left}
.kc-ex .zh{font-size:30px;color:var(--ac2)}.kc-ex .py{font-size:17px;color:var(--ac);grid-column:1}.kc-ex small{grid-column:1;font:700 14.5px Manrope;color:var(--t)}
.kc-ex i{grid-column:2;grid-row:1/4;font-style:normal;font-size:24px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 4px 10px rgba(30,35,80,.12)}
.kc-ex.on i{background:var(--ac);color:#fff}
.kc-your{font:700 15px Manrope;color:var(--mu)}.kc-your b{color:var(--ink)}
.kc-ap{font-size:15px!important;white-space:normal;line-height:1.3}
/* № 2 */
.kc-wq{text-align:center;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,#FF5C8A,#8E5BE8);color:#fff}
.kc-wq small{display:block;font:800 13px Manrope;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.kc-wq b{font:900 28px/1.2 Nunito}
.kc-red{background:#E04A6E!important;color:#fff!important}
button:disabled{opacity:.5;cursor:default}
/* списки результатов */
.kc-rl{display:grid;gap:8px;margin-top:14px}
.kc-rl>div{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:8px 14px;border-radius:16px}
.kc-rl .zh{font-size:40px;line-height:1;color:var(--ac2);text-align:center}
.kc-rl b{font:900 18px Nunito;color:var(--ink);display:block}.kc-rl small{font:700 13.5px Manrope;color:var(--mu)}
.kc-rl i{font-style:normal;font:900 22px Nunito}
.kc-rl .g{background:#E6F7EF}.kc-rl .g i{color:var(--ok)}.kc-rl .m{background:#FFF6E3}.kc-rl .m i{color:#C98200}.kc-rl .b{background:#FFF0F4}.kc-rl .b i{color:#B0284F}
/* зоны */
.kc-zone{margin-top:14px;padding:14px 16px;border-radius:22px}
.kc-zone h3{margin:0;font-size:21px}.kc-zone>small{display:block;font:700 14px Manrope;color:var(--mu);margin-top:2px}
.kc-zone>div{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kc-zone.g{background:#E6F7EF}.kc-zone.g h3{color:#14855E}.kc-zone.y{background:#FFF6E3}.kc-zone.y h3{color:#9A6400}.kc-zone.r{background:#FFF0F4}.kc-zone.r h3{color:#B0284F}
.kc-chip{display:grid;justify-items:center;min-width:84px;padding:8px 10px;border-radius:16px;background:#fff;box-shadow:0 4px 10px rgba(30,35,80,.08)}

.kc-chip.on{box-shadow:0 0 0 3px var(--ac)}
@media(max-width:420px){.kc-face{min-height:260px}.kc-bh .zh{font-size:72px}.kc-bh .py{font-size:26px}}
/* № 3 Тренировка: 8 фаз */
.fz-top{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 12px}.fz-top b{font:900 22px Nunito;color:var(--ink)}.fz-top small{font:700 14px Manrope;color:var(--mu)}
.blk{border-radius:22px;background:#fff;padding:14px 14px 6px;margin-bottom:12px;box-shadow:0 6px 16px rgba(30,35,80,.08)}
.blk h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:900 17px Nunito;color:var(--ink)}.blk h3 span{font:800 13px Manrope;color:var(--mu);text-align:right}
.blk.lock{opacity:.55;background:#F4F6FB}
.ph{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid #EEF0F6}

.ph small{grid-column:2/4;font:700 12px Manrope;color:var(--mu)}
.q-ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font:800 14px Manrope;color:var(--mu)}.q-ph b{color:#5B4FD6}
.q-big{border-radius:28px;background:linear-gradient(160deg,#fff 0%,#F3F0FF 100%);box-shadow:0 14px 30px rgba(30,35,80,.16),inset 0 0 0 3px #E3E0FA;padding:30px 16px;text-align:center}
.q-big .py{font:900 56px Nunito;color:var(--ac2)}.q-big .ru{font:900 clamp(26px,7vw,40px) Nunito;color:var(--ac2);overflow-wrap:anywhere}.q-big small{display:block;font:800 15px Manrope;color:var(--mu);margin-top:8px}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.q-opts button{padding:16px 10px;border-radius:18px;border:0;background:#fff;font:800 17px Manrope;color:var(--ink);box-shadow:0 6px 14px rgba(30,35,80,.10);cursor:pointer}
.q-opts.zh4 button{font-family:var(--han);font-size:44px;font-weight:400;padding:10px;color:var(--ac2)}
.q-opts button.ok{background:#DDF5EC;color:#14855E}.q-opts button.no{background:#FFE3EB;color:#B0284F}
.tones{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.tones button{padding:12px 0;border-radius:14px;border:0;background:#fff;font:900 20px Nunito;color:var(--ink);box-shadow:0 4px 10px rgba(30,35,80,.10);cursor:pointer}.tones button small{display:block;font:900 18px Nunito;color:var(--mu);line-height:1}
.tones button:last-child small{font:700 11px Manrope}
.tones button.on{background:#5B6BD8;color:#fff}.tones button.on small{color:#fff}

  const choose=(opts,right,render,html)=>{const [a]=arrange(opts,right,prevOk);prevOk.push(a.indexOf(right));
   shell(head+html+`<div class="q-opts${render==='zh'?' zh4':''}">${a.map((o,i)=>`<button data-i="${i}" class="${render==='zh'?'zh':''}">${esc(o)}</button>`).join('')}</div><div id="nx"></div>`);
   document.querySelectorAll('.q-opts button').forEach(b=>b.onclick=()=>{if(answered)return;const v=a[+b.dataset.i],ok=v===right;given=v;
    b.classList.add(ok?'ok':'no');if(!ok)document.querySelectorAll('.q-opts button').forEach(x=>{if(a[+x.dataset.i]===right)x.classList.add('ok');});
    document.querySelectorAll('.q-opts button').forEach(x=>x.disabled=true);verdict(ok);});};
  const typeIn=(html,ph,check,extraHtml)=>{shell(head+html+`<input id="an3" class="in kc-inp" placeholder="${ph}" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false">${extraHtml||''}
    <div class="row" style="justify-content:center"><button class="btn" id="ok3" style="width:100%">✓ Проверить</button></div><div id="nx"></div>`);
   const inp=$('#an3');setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},50);
   const go=()=>{if(answered)return;const r=check(inp.value.trim());if(r===null)return;given=inp.value.trim()+(given?' '+given:'');inp.disabled=true;$('#ok3').style.display='none';
    document.querySelectorAll('.tones button').forEach(x=>x.disabled=true);verdict(r,inp.value.trim()&&!r?`<div class="kc-your" style="text-align:center">Твой ответ: <b>${esc(inp.value.trim())}</b></div>`:'');};
   $('#ok3').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};};
  const ruOpts=excl=>{const pool=shuffle(W.filter(x=>x.c!==w.c&&!excl.includes(x.c))).slice(0,3).map(x=>x.ru);return [w.ru,...pool];};
  const zhOpts=excl=>{let pool=(LOOK[w.c]||[]).filter(c=>WC[c]&&c!==w.c&&!excl.includes(c));
   pool=shuffle(pool).slice(0,Math.random()<.5?2:1);const rest=shuffle(W.map(x=>x.c).filter(c=>c!==w.c&&!pool.includes(c)&&!excl.includes(c)));
   return [w.c,...pool,...rest].slice(0,4);};
  const okRu=v=>accepted(w,v)||(TWIN[w.c]&&p<=2&&accepted(WC[TWIN[w.c]],v));
  const plBtn=`<button class="play n kc-pl" id="pl3" aria-label="Послушать">🔊</button>`;
  if(p===1)choose(ruOpts(TWIN[w.c]?[TWIN[w.c]]:[]),w.ru,'ru',big(w.py,'py','Что это значит?'));
  else if(p===2)typeIn(big(w.py,'py','Напиши, что это значит, по-русски'),'Перевод по-русски',v=>{if(!v){toast('Напиши перевод');return null;}return okRu(v);});
  else if(p===3){let tone=null;typeIn(big('«'+ruQ+'»','ru','Напиши пиньинь и выбери тон'),'Пиньинь без тона, например ni',v=>{
     if(!v){toast('Напиши пиньинь');return null;}if(tone===null){toast('Выбери тон');return null;}given='тон '+tone;return plainPy(v)===plainPy(w.py)&&tone===TN[w.c];},
    `<div class="tones">${[1,2,3,4,0].map(t=>`<button data-t="${t}">${t}<small>${['','ˉ','ˊ','ˇ','ˋ'][t]||'нулевой'}</small></button>`).join('')}</div>`);
   document.querySelectorAll('.tones button').forEach(b=>b.onclick=()=>{tone=+b.dataset.t;document.querySelectorAll('.tones button').forEach(x=>x.classList.toggle('on',x===b));});}
  else if(p===4)choose(zhOpts(TWIN[w.c]?[TWIN[w.c]]:[]),w.c,'zh',big(w.py,'py','Выбери иероглиф'));
  else if(p===5||p===6){const html=`<div class="q-big" style="position:relative">${plBtn}<div class="zh kc-big" style="font-size:min(140px,34vw)">${w.c}</div><small>${p===5?'Послушай и выбери перевод':'Послушай и напиши перевод'}</small></div>`;
   if(p===5)choose(ruOpts([]),w.ru,'ru',html);else typeIn(html,'Перевод по-русски',v=>{if(!v){toast('Напиши перевод');return null;}return okRu(v);});
   const pl=$('#pl3');pl.onclick=()=>playW(w.c,pl);later(()=>playW(w.c,pl),300);}
  else if(p===7)choose(zhOpts([]),w.c,'zh',big('«'+ruQ+'»','ru','Выбери иероглиф'));
  else{shell(head+big('«'+ruQ+'»','ru','Диктант: напиши иероглиф по памяти')+`<div class="wbox" style="margin-top:12px">${GRID}<div class="hw" id="hw"></div></div>
    <p class="hint2" id="wh" style="text-align:center;margin-top:8px">Пиши черту за чертой 👇</p><div class="row" style="justify-content:center"><button class="btn g" id="dk3">🤷 Не помню</button></div><div id="nx"></div>`);
   const el=$('#hw'),wh=$('#wh'),sz=el.clientWidth||280;el.innerHTML='';let mist=0;
   if(!window.HanziWriter||!HZDATA[w.c]){verdict(false);return;}
   const hw=HanziWriter.create(el,w.c,hwOpts(sz));KW=hw;
   hw.quiz({showHintAfterMisses:1,highlightOnComplete:true,
    onMistake:()=>{mist++;wh.textContent='Не та черта — посмотри подсказку и продолжай 👀';},
    onCorrectStroke:()=>{wh.textContent='Так держать! ✓';},
    onComplete:()=>{if(KW!==hw||answered)return;$('#dk3').style.display='none';wh.textContent=mist?'Написано, но с ошибкой — потренируем ещё':'✓ Написано по памяти без ошибок!';given=mist?'ошибок в чертах: '+mist:'';later(()=>verdict(!mist),400);}});
   $('#dk3').onclick=()=>{if(answered)return;given='не помню';$('#dk3').style.display='none';try{hw.cancelQuiz()}catch(e){}wh.textContent='Смотри, как он пишется 👀';hw.hideCharacter();
    hw.animateCharacter({onComplete:()=>{if(KW!==hw)return;verdict(false);}});};}};
 next();}


route();
</script></body></html>
