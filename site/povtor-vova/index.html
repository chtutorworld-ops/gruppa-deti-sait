:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:34px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:19px;font-weight:800;color:var(--ink);line-height:1.15}
.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.prog{margin-left:auto;min-width:120px;font-size:13px;font-weight:800;color:var(--mu);text-align:right}
.prog .bar{height:8px;border-radius:5px;background:#D6DBE6;margin-top:6px;overflow:hidden}.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));border-radius:5px;transition:width .4s}
@media(max-width:600px){.top small{display:none}.top .zh{font-size:28px}.top h1{font-size:16px}.prog{min-width:90px}}
.main{padding:24px 24px 22px}
@media(max-width:600px){.main{padding:18px 14px}}
.part{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.part b{color:#fff;background:var(--ac);padding:3px 9px;border-radius:9px;letter-spacing:.04em}
.part b.l1{background:var(--t2)}
h2{font-size:28px;font-weight:800;color:var(--ink);line-height:1.15;letter-spacing:-.01em;margin-top:10px}
@media(max-width:600px){h2{font-size:23px}}
.hz{display:flex;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap}.hz .zh{font-size:34px;color:var(--ac2)}.hz .py{font-size:18px;color:var(--ac)}
.lead{font-size:17px;line-height:1.55;margin-top:12px}
.lead b{color:var(--ink)}
.lead em,.zh-i{font-family:var(--han);font-style:normal;color:var(--ac2);font-size:1.15em}
.ipy{font-family:Nunito;font-weight:800;color:var(--ac)}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:16.5px;background:var(--ac);color:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2);transition:transform .1s;text-decoration:none}
.btn:active{transform:scale(.97)}.btn.g{background:var(--bg);color:var(--ac2)}.btn.okb{background:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.cards{display:grid;gap:14px;margin-top:16px}@media(min-width:700px){.cards.c2{grid-template-columns:1fr 1fr}.cards.c3{grid-template-columns:repeat(3,1fr)}.cards.c4{grid-template-columns:repeat(4,1fr)}}
.card{padding:16px 18px;border-radius:22px;font-size:15.5px;line-height:1.5}
.card b.h{display:block;font-size:18px;color:var(--ac2);margin-bottom:4px;line-height:1.25}
.card .ic{font-size:26px;display:block;margin-bottom:4px}
.tip{margin-top:16px;padding:12px 16px;border-radius:16px;background:#FFF6DC;color:#6B5310;font-size:15.5px;line-height:1.5}
.say{display:inline-flex;align-items:center;gap:8px}
.say:after{content:'🔊';font-size:.6em;opacity:.55}
.say.on{color:var(--ok)!important}
/* check */
.chk{margin-top:22px;padding:18px;border-radius:22px}
.chk .q{font-size:17px;font-weight:800;color:var(--ink);line-height:1.4}
.chk .q:before{content:'✏️ Проверь себя';display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.mcq{display:grid;gap:10px;margin-top:12px}@media(min-width:700px){.mcq.two{grid-template-columns:1fr 1fr}}
.opt{padding:13px 16px;border-radius:18px;font-size:16px;font-weight:700;text-align:left;line-height:1.35;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.opt.ok{background:#DDF5EC;box-shadow:inset 3px 3px 8px #B9DCCD}.opt.no{background:#FFE3EB;box-shadow:inset 3px 3px 8px #F0C2D0}
.opt .zh{font-size:1.25em}
.fb{margin-top:12px;font-size:15.5px;font-weight:700;line-height:1.45;min-height:22px}.fb.ok{color:#14855E}.fb.no{color:#D9366A}
/* nav */
.nextbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid #D6DBE6;flex-wrap:wrap}
.nextbar .btn{flex:1 1 auto}.nextbar .btn.nx{flex:2 1 240px}
/* pieces */
.motto{text-align:center;padding:26px 10px 10px}
.motto .zh{font-size:46px;line-height:1.3;color:var(--ac2);letter-spacing:.04em}
.motto .py{font-size:19px;color:var(--ac);margin-top:8px}
.motto .ru{font-size:22px;font-weight:800;color:var(--ink);margin-top:12px}
@media(max-width:600px){.motto .zh{font-size:34px}}
.sys{padding:20px;border-radius:26px;color:#fff;text-align:center;display:grid;gap:4px;justify-items:center}
.sys .zh{font-size:58px;line-height:1.1;color:#fff}.sys .py{font-size:22px}.sys small{font-size:14.5px;font-weight:700;opacity:.92;line-height:1.4}
.phone{width:290px;max-width:100%;margin:18px auto 0;border-radius:40px;padding:12px;background:#1E2350;box-shadow:10px 10px 24px var(--sh1),-8px -8px 18px var(--sh2)}
.phone .sc{background:#F2F3F7;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;min-height:440px}
.phone .hd{text-align:center;font-weight:800;font-size:14px;padding:14px 0 8px;color:#111}
.chat{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 13px;border-radius:18px;font-size:19px;font-family:var(--han);line-height:1.3}
.bub.l{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}.bub.r{background:#5B6BD8;color:#fff;align-self:flex-end;border-bottom-right-radius:6px;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.kbd{background:#D5D8E0;padding:8px 5px 12px}
.ipt{background:#fff;border-radius:10px;padding:8px 10px;font-size:18px;font-weight:800;font-family:Nunito;min-height:38px;color:#111}
.ipt i{color:var(--ac);font-style:normal;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.cand{display:flex;gap:6px;padding:7px 2px;min-height:44px;overflow-x:auto}
.cand button{padding:4px 12px;border-radius:9px;font-family:var(--han);font-size:22px;background:#fff;white-space:nowrap}
.cand button.best{background:#5B6BD8;color:#fff;animation:pop .3s}

.fd .fire{position:absolute;left:18%;bottom:120px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#FFF7C2 0,#FFB23D 40%,#FF4D1A 75%,rgba(255,77,26,0) 100%);box-shadow:0 0 30px #FF7A1A;opacity:0}
.fd.hit .fire{animation:shoot .45s ease-in forwards}
@keyframes shoot{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:1;transform:translate(var(--fx,220px),var(--fy,-60px)) scale(1.6)}}
.fd.hit .orb{animation-play-state:paused;animation:boom .55s .4s forwards}
@keyframes boom{50%{transform:scale(1.8);filter:brightness(2.5);opacity:1}100%{transform:scale(2.4);opacity:0}}
.fd.hit .dr{animation:roar .5s}
@keyframes roar{40%{transform:scale(1.18) rotate(-6deg)}}
.fd.miss .orb{animation-play-state:paused}
.fd.miss{animation:quake .45s}
@keyframes quake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.fd .tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 16px;border-radius:14px;background:rgba(255,255,255,.14);backdrop-filter:blur(4px);color:#FFE59A;font:900 22px Nunito;letter-spacing:.04em;white-space:nowrap}
.fd .wall{position:absolute;right:0;bottom:0;width:38%;height:62px;background:linear-gradient(180deg,#7A2E3A,#4A1A28);clip-path:polygon(0 30%,10% 30%,10% 0,20% 0,20% 30%,40% 30%,40% 0,50% 0,50% 30%,70% 30%,70% 0,80% 0,80% 30%,100% 30%,100% 100%,0 100%)}
.zk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.zk .opt{font-size:34px;padding:18px 6px;background:linear-gradient(160deg,#1E5F4C,#0E3B30);color:#E9FFF6;box-shadow:0 6px 14px rgba(14,59,48,.35),inset 0 0 0 2px rgba(120,255,200,.35);text-shadow:0 0 10px rgba(120,255,200,.8)}
.zk .opt.ok{background:linear-gradient(160deg,#2DBE8C,#16865F)}.zk .opt.no{background:linear-gradient(160deg,#FF5C8A,#C2335C)}
.gst{background:linear-gradient(180deg,rgba(18,11,58,.25) 0,rgba(18,11,58,.92) 62%),url(../urok-6/zadaniya/img/dragon-hero.jpg) 50% 0/100% auto no-repeat,#120B3A;color:#fff;border-radius:26px;padding:210px 22px 22px;text-align:center}
.gst h3{margin:0 0 6px;font-size:28px;color:#FFE59A}.gst p{margin:4px 0;color:#DCD6FF;font-size:17px;line-height:1.45}

/* povtor-vova: seals, hero, gate, pinyin, dragon */
.top{flex-wrap:wrap}
.seals{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.top .seals{width:100%;justify-content:flex-start;margin-top:2px}
.seal{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-family:var(--han);font-size:20px;line-height:1;color:#B9BFD0;border:2px dashed #C5CBD8;transition:all .4s}
.seal.on{color:#fff;background:#D9363E;border:2px solid #A31F27;box-shadow:0 3px 8px rgba(217,54,62,.35);transform:rotate(-6deg)}
.seals.big{gap:10px;margin-top:16px}.seals.big .seal{width:58px;height:58px;font-size:34px;border-radius:14px}
@media(max-width:600px){.seals.big{gap:6px}.seals.big .seal{width:40px;height:40px;font-size:24px;border-radius:11px}}
.hero{border-radius:26px;overflow:hidden;color:#fff;padding:190px 22px 22px;margin-top:4px;background:linear-gradient(180deg,rgba(18,11,58,.1) 0,rgba(18,11,58,.92) 58%),url(../urok-6/zadaniya/img/dragon-hero.jpg) 50% 0/100% auto no-repeat,#120B3A}
.hero h2{color:#FFE59A;margin-top:0}.hero .lead{color:#E4E0FF}.hero .lead b{color:#fff}
@media(max-width:600px){.hero{padding-top:130px}}
.lvls{display:grid;gap:10px;margin-top:16px}@media(min-width:700px){.lvls{grid-template-columns:1fr 1fr}}
.lvls div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;font-weight:700;font-size:15.5px;line-height:1.3}
.lvls .seal{flex:none;width:40px;height:40px;font-size:24px}
.btn.lock{background:#B9BFD0;color:#fff}
.pyl{display:grid;gap:14px;margin-top:16px}
.pyl .card{display:grid;gap:8px}
.pyl .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pyl .hd .zh{font-size:30px;color:var(--ac2)}.pyl .hd small{font-size:14px;font-weight:700;color:var(--mu)}
.pyl input{width:100%;font:800 22px Nunito,Manrope,sans-serif;color:var(--ink);padding:12px 14px;border:0;outline:0}
.pyl input:focus{box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2),0 0 0 3px rgba(91,107,216,.35)}
.pyl .pv{font-size:15px;font-weight:700;min-height:20px;line-height:1.4;color:var(--mu)}
.pyl .pv.ok{color:#14855E}.pyl .pv.no{color:#D9366A}
.pyl .card.done{box-shadow:inset 0 0 0 3px var(--ok),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.tkeys{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.tkeys button{padding:9px 0;border-radius:12px;font:900 20px Nunito}
@media(max-width:600px){.tkeys{grid-template-columns:repeat(5,1fr)}}
.nomic{margin-top:10px;font-size:14px;font-weight:700;color:var(--mu);text-decoration:underline;display:none}
.zk.c4{grid-template-columns:repeat(4,1fr)}
.zk .opt svg{width:100%;max-width:70px;height:auto;display:block;margin:0 auto}
.zk .opt small{display:block;font:900 15px Nunito;opacity:.85}
.zk.tn .opt{padding:10px 4px;background:linear-gradient(160deg,#2A2470,#140F45);box-shadow:0 6px 14px rgba(20,15,69,.35),inset 0 0 0 2px rgba(160,150,255,.35)}
.zk.tn .opt.ok{background:linear-gradient(160deg,#2DBE8C,#16865F)}.zk.tn .opt.no{background:linear-gradient(160deg,#FF5C8A,#C2335C)}
.gst{margin-top:14px}
.qbox .opt .crv{display:block;margin:4px auto 0;max-width:64px}
.memo{margin-top:12px}
.qcard{padding:12px;border-radius:18px;margin-top:12px}
.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mu)}

.rule{margin-top:14px;padding:18px 20px;border-radius:24px;color:#fff;font-size:20px;line-height:1.5;font-weight:700;background:linear-gradient(135deg,#5B6BD8,#7C4FD8);box-shadow:0 10px 24px rgba(91,107,216,.35)}
.rule b{color:#FFE59A;font-weight:900}.rule .zh-i{color:#FFE59A}.rule .big{display:block;font:900 26px Nunito,Manrope,sans-serif;margin-bottom:6px;color:#fff}
.rule.pink{background:linear-gradient(135deg,#FF5C8A,#E0533D);box-shadow:0 10px 24px rgba(255,92,138,.35)}.rule.green{background:linear-gradient(135deg,#2DBE8C,#178A7A);box-shadow:0 10px 24px rgba(45,190,140,.35)}.rule.orange{background:linear-gradient(135deg,#F5A524,#E0533D);box-shadow:0 10px 24px rgba(245,165,36,.35)}
@media(max-width:600px){.rule{font-size:18px;padding:16px}.rule .big{font-size:22px}}

/* ===================== pitch (YIN), as in ДЗ 3 ===================== */
async function toPCM(ab){const buf=await new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});
 const sr=16000,len=Math.ceil(buf.duration*sr);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);
 const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start();const r=await oc.startRendering();return r.getChannelData(0);}
function yin(x,sr){const W=512,tmin=Math.floor(sr/550),tmax=Math.floor(sr/65),d=new Float32Array(tmax+1);
 for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
 let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
 for(let t=tmin;t<tmax;t++){if(d[t]<0.15){while(t+1<tmax&&d[t+1]<d[t])t++;const a=d[t-1],b=d[t],c=d[t+1],den=a+c-2*b;const p=den?t+(a-c)/(2*den):t;return [sr/p,b];}}
 return [0,1];}
// melody of the whole word: pitched frames only, gaps between syllables kept as gaps
function melody(pcm){const sr=16000,hop=160,F=512+Math.floor(sr/65)+2;let mx=0;const rms=[];
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<512;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/512);rms.push(r);if(r>mx)mx=r;}
 const thr=Math.max(0.01,mx*0.12),f=[];let k=0;
 for(let i=0;i+F<pcm.length;i+=hop,k++){const [v,ap]=rms[k]>=thr?yin(pcm.subarray(i,i+F),sr):[0,1];f.push(v>65&&v<550&&ap<0.2?v:0);}
 for(let i=0;i<f.length;i++){if(!f[i])continue;const nb=[];for(let d=1;d<=5;d++){if(f[i-d])nb.push(f[i-d]);if(f[i+d])nb.push(f[i+d]);}
  if(!nb.length){f[i]=0;continue;}nb.sort((p,q)=>p-q);if(Math.abs(12*Math.log2(f[i]/nb[nb.length>>1]))>5)f[i]=0;}
 let a=f.findIndex(x=>x>0),b=f.length-1;while(b>=0&&!f[b])b--;if(a<0||b-a<8)return null;
 const seg=f.slice(a,b+1),vs=seg.filter(x=>x>0).sort((p,q)=>p-q);if(vs.length<8)return null;const med=vs[vs.length>>1];
 return seg.map(x=>x>0?Math.max(-9,Math.min(9,12*Math.log2(x/med))):null);}

const PYL=[{hz:'你好！',ru:'Привет!',want:['nǐ','hǎo']},{hz:'我叫小明。',ru:'Меня зовут Сяо Мин.',want:['wǒ','jiào','xiǎo','míng']},{hz:'好！',ru:'Хорошо!',want:['hǎo']},{hz:'我叫'+ME.hz+'。',ru:'Меня зовут Владимир.',want:['wǒ','jiào'],name:'fulajimier'}];
const pl=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const NUM=s=>s.replace(/([a-zü]+)([1-4])/gi,(m,b,t)=>mark(b.toLowerCase(),+t));
const TN=s=>{const t=[1,2,3,4].find(k=>TMARK[k].test(s));return t||0;};
function chkPy(L,inp){const s=NUM(inp).normalize('NFC').toLowerCase().replace(/[^a-zāáǎàōóǒòēéěèīíǐìūúǔùü]/g,'');
 const want=L.want.join(''),head=L.name?s.slice(0,want.length):s,rest=L.name?s.slice(want.length):'';
 if(!s)return {ok:false,msg:'Строчка пустая'};
 if(pl(head)!==pl(want)){
  if(L.want[1]==='jiào'&&/^wohao/.test(pl(s)))return {ok:false,msg:'«Меня зовут» — это <b>wǒ jiào</b> 我叫. А <b>hǎo</b> 好 — «хорошо»'};
  if(L.want[0]==='nǐ'&&/jiao/.test(pl(s)))return {ok:false,msg:'«Привет» — это 你好: <b>hǎo</b>, а не jiào'};
  return {ok:false,msg:'Проверь буквы. Нажми 🔊 и послушай ещё раз',letters:1};}
 let p=0;for(const syl of L.want){const got=head.slice(p,p+syl.length);p+=syl.length;
  if(got!==syl){const t=TN(syl);return {ok:false,msg:TN(got)?`Тон в <b>${got}</b> другой: здесь ${t}-й тон`:`Поставь тон на <b>${pl(syl)}</b> (здесь ${t}-й тон)`};}}
 if(L.name&&pl(rest)!==L.name)return {ok:false,msg:rest?'Проверь имя: Fúlājīmǐ\'ěr (тоны в имени можно не ставить)':'А имя? После wǒ jiào напиши своё имя: Fulajimier'};
 return {ok:true,msg:'✓ Верно! '+L.want.join(' ')+(L.name?' Fúlājīmǐ\'ěr':'')};}
function pyTask(box){const el=$(box);const st=ST.pyd=ST.pyd||{first:{},log:[],good:{}};
 el.innerHTML=`<div class="pyl">${PYL.map((L,i)=>`<div class="card n${st.good[i]?' done':''}" id="pc${i}"><div class="hd"><button class="btn g" style="padding:8px 12px" data-pz="${L.hz.replace(/[！。]/g,'')}">🔊</button><span class="zh">${L.hz}</span><small>${L.ru}</small></div>
  <input class="in" id="pi${i}" placeholder="${L.name?'wǒ jiào + твоё имя':'пиньинь с тонами'}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${st.good[i]?L.want.join(' ')+(L.name?' Fúlājīmǐ\'ěr':''):''}"><div class="pv" id="pv${i}">${st.good[i]?'✓ Готово':''}</div></div>`).join('')}</div>
  <div class="tkeys">${['ā','á','ǎ','à','ō','ó','ǒ','ò','ē','é','ě','è','ī','í','ǐ','ì','ū','ú','ǔ','ù'].map(x=>`<button class="n" data-tk="${x}">${x}</button>`).join('')}</div>
  <p class="hint2" style="text-align:center;margin-top:8px">Тон можно ставить кнопкой выше или цифрой: <b>ni3</b> → <b>nǐ</b></p>
  <div class="row" style="justify-content:center"><button class="btn" id="pchk">✓ Проверить</button></div><div class="fb" id="pfb" style="text-align:center"></div>`;
 el.querySelectorAll('[data-pz]').forEach(b=>b.onclick=()=>playHz(b.dataset.pz,b));

 $('#pchk').onclick=()=>{let n=0;PYL.forEach((L,i)=>{const v=$('#pi'+i).value.trim();const r=chkPy(L,v);if(r.ok)n++;
   if(!st.good[i]){if(st.first[i]==null&&v)st.first[i]=r.ok?1:0;if(v&&st.log.length<60)st.log.push({line:L.hz,text:v,ok:r.ok?1:0});

   if(r.ok)st.good[i]=1;
   const pv=$('#pv'+i);pv.className='pv '+(r.ok?'ok':'no');pv.innerHTML=r.msg+(!r.ok&&st.fails&&st.fails[i]>=2?` <span style="color:var(--mu)">· образец: ${L.want.join(' ')}${L.name?' Fulajimier':''}</span>`:'');$('#pc'+i).classList.toggle('done',r.ok);});

const HZI={你:['nǐ','ты'],我:['wǒ','я'],好:['hǎo','хорошо'],叫:['jiào','зваться, меня зовут']};
function memoBox(el,chars,cb){let k=0,w=null,cur2=0;const res=[];
 const one=()=>{const c=chars[k],[py,ru]=HZI[c];let hints=0,show=0,mist=0;cur2=0;
  el.innerHTML=`<div class="wch">${chars.map((x,j)=>`<span class="n${j<k?' ok':j===k?' cur':''}">${j<k?x:'?'}</span>`).join('')}</div>
   <div class="qcard in"><div class="qhead"><span>Иероглиф ${k+1} из ${chars.length}</span><span>💡 подсказок: <b id="hc">0</b></span></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px"><button class="play n" id="mpl" style="width:58px;height:58px;font-size:22px;margin:0">🔊</button><div style="text-align:left"><div class="py" style="font-size:26px;color:${TCOL[TN(py)]}">${py}</div><div style="font-weight:800;font-size:18px;color:var(--ink)">«${ru}»</div></div></div></div>
   <div class="wbox">${GRID}<div class="hw" id="mhw"></div></div>
   <p class="hint2" id="mwh" style="text-align:center;margin-top:8px">Напиши этот иероглиф по памяти. Не помнишь — бери подсказку 👇</p>
   <div class="row" style="justify-content:center;gap:8px"><button class="btn g" id="mh1">👉 Следующая черта</button><button class="btn g" id="mh2">💡 Контур</button><button class="btn g" id="mh3">👀 Покажи весь</button></div>`;
  const mpl=$('#mpl');mpl.onclick=()=>playHz(c,mpl);
  const hw=$('#mhw');const sz=hw.clientWidth||280;
  if(!window.HanziWriter||!HZDATA[c]){$('#mwh').textContent='Напиши '+c+' пальцем в воздухе 🙂';res.push({c,hints,show:1,mist});later(next,1500);return;}
  w=HanziWriter.create(hw,c,Object.assign(hwOpts(sz),{showOutline:false,showCharacter:false}));
  const hc=()=>{$('#hc').textContent=hints+show;};
  const q=()=>w.quiz({showHintAfterMisses:3,highlightOnComplete:true,onMistake:()=>{mist++;if(mist===3)$('#mwh').textContent='Ничего страшного! Нужная черта мигнёт зелёным — повтори её 🙂';},
   onCorrectStroke:d=>{cur2=d.strokeNum+1;$('#mwh').textContent='Так держать! ✓';},
   onComplete:()=>{res.push({c,hints,show,mist});$('#mwh').textContent=hints+show===0?'🏆 Без подсказок — супер!':'✓ Написано!';later(next,1200);}});
  $('#mh1').onclick=()=>{hints++;hc();try{w.highlightStroke(cur2);}catch(e){}};
  $('#mh2').onclick=()=>{hints++;hc();w.showOutline();later(()=>w.hideOutline(),2500);};
  $('#mh3').onclick=()=>{show++;hc();w.cancelQuiz();cur2=0;$('#mwh').textContent='Смотри внимательно…';w.showCharacter();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();$('#mwh').textContent='А теперь ты — по памяти!';q();},700)});};
  q();};
 const next=()=>{k++;if(k<chars.length)one();else cb(res);};
 one();}
function memoRun(){const el=$('#mb');const order=shuffle(['你','我','好','叫']);
 memoBox(el,order,res=>{const clean=res.filter(r=>!r.show&&!r.hints).length;const miss=res.filter(r=>r.show||r.hints).map(r=>r.c);
  ST.res.memo={t:'По памяти: 你 我 好 叫',ok:clean,of:4,miss};keep();send('memo',{t:'По памяти: 你 我 好 叫',score:clean,of:4,miss,res});gate();

   <div class="row" style="justify-content:center"><button class="btn g" id="mag">↻ Ещё раз</button></div>`;$('#mag').onclick=memoRun;});}

 {lv:1,need:['ini'],t:'Звуки b p m f d t n l g k h',h:()=>`${BL(1)}<h2>Первые звуки слога 声母</h2>
  <div class="rule "><span class="big">🧩 Правило: из чего слог</span>Слог = <b>первый звук</b> (инициаль) + <b>гласная</b> (финаль) + <b>тон</b>. Нажимай и слушай чистые звуки, повторяй вслух.</div>
  <div class="ini">${INI.map(x=>`<button class="n${'ptk'.includes(x)?' asp':''}" data-k0="${x}" data-alt="${mark(x+(x==='f'?'u':'a'),1)}"><b>${x}</b><small>${INIW[x]}</small></button>`).join('')}</div>
  <div class="tip">💨 Розовые <b>p t k</b> — <b>предыхательные</b>: со струёй воздуха. Их пары <b>b d g</b> — <b>непредыхательные</b>, глухо и мягко, без воздуха.</div>
  <h3>👂 Какой первый звук?</h3><div class="qbox in" id="q2"></div>`,
  on:()=>{const S=['mā','fó','nǐ','lù','hē','tí','gǔ','bà'];const PART={m:'n',f:'h',n:'l',l:'n',h:'f',t:'d',g:'k',b:'p'};
   quiz('#q2','ini','Какой первый звук?',S.map(s=>{const i=SYL.plain(s)[0];const o=[i,PART[i],...shuffle(INI.filter(x=>x!==i&&x!==PART[i])).slice(0,2)];
    return {play:[urlS(s)],lab:s,q:'Послушай слог. С какого звука он начинается?',opts:o.map(x=>`<span class="py" style="font-size:30px">${x}</span>`),right:`<span class="py" style="font-size:30px">${i}</span>`,ok:`${s} — начинается с ${i}`};}),4);}},
 {lv:1,need:['asp'],t:'Предыхательный или нет?',h:()=>`${BL(1)}<h2>💨 Предыхательный или нет?</h2>
  <div class="rule pink"><span class="big">💨 Правило: p t k — предыхательные</span>Частая ошибка — читать <b>p</b> как русское «п», а <b>b</b> как русское «б». В китайском <b>p t k</b> — <b>предыхательные</b>: «пх», «тх», «кх». <b>b d g</b> — <b>непредыхательные</b>: глухо, без воздуха.</div>
  <div class="cards c2">
   <div class="card n"><span class="ic">📄</span><b class="h">Проверь листком бумаги</b>Поднеси листок ко рту. На <b>pā</b> он отлетает, на <b>bā</b> не шевелится.</div>
   <div class="card n"><span class="ic">✋</span><b class="h">Или ладонью</b>На <b>p t k</b> ладонь у рта чувствует струю воздуха.</div>
  </div>
  <div class="chips">${[['bā','pā'],['dé','tè'],['gē','kē'],['bǔ','pǔ'],['dì','tì'],['gǔ','kǔ']].map(([a,b])=>`<span style="display:inline-flex;gap:6px"><button class="chip n" data-s="${a}">${a} 🔊</button><button class="chip n" data-s="${b}" style="color:var(--t4)">${b} 💨</button></span>`).join('')}</div>
  <div class="qbox in" id="q3"></div>`,
  on:()=>{const P=[['pa',4,'ba'],['ti',2,'di'],['ku',3,'gu'],['bo',1,'po'],['da',4,'ta'],['ke',1,'ge'],['pu',3,'bu'],['de',2,'te'],['ta',1,'da'],['gu',4,'ku'],['bi',3,'pi'],['pi',2,'bi']];
   const order=noTriple(P,x=>'ptk'.includes(x[0][0]));
   quiz('#q3','asp','Предыхательный или нет?',order.map(([b,t,alt])=>({play:[urlS(mark(b,t))],lab:mark(b,t),q:'Какой слог прозвучал?',opts:[mark(b,t),mark(alt,t)].map(x=>`<span class="py" style="font-size:28px">${x}</span>`),right:`<span class="py" style="font-size:28px">${mark(b,t)}</span>`,ok:mark(b,t)+('ptk'.includes(b[0])?' — предыхательный 💨':' — непредыхательный')})),2);}},
 {lv:1,need:['drg-asp'],t:'🐉 Дракон: b p d t g k',h:()=>`${BL(1)}<h2>🐉 Огненный дракон: b p d t g k</h2><p class="lead">Слушай слог и жми его первый звук. Помни: <b>p t k</b> — с воздухом 💨.</p><div id="g2"></div>`,on:()=>dragon('#g2','drg-asp','ini')},
 {lv:1,need:['dict'],t:'Диктант на слух',h:()=>`${BL(1)}<h2>👂 Диктант на слух 听写</h2>
  <p class="lead">Послушай слог и выбери, как он пишется. Слушай <b>три вещи</b>: первый звук, гласную и тон.</p><div class="qbox in" id="q4"></div>`,
  on:()=>quiz('#q4','dict','Диктант',['pō','dǐ','hú','tà','mǐ','gē','fù','ná','kǔ','lè'].map(s=>({play:[urlS(s)],lab:s,q:'Какой слог прозвучал?',opts:opts4(s).map(x=>`<span class="py">${x}</span>`),right:`<span class="py">${s}</span>`,ok:s})),2)},

 /* ---------- level 3: 3+3, 3+4, 你好, 我叫 ---------- */
 {lv:2,t:'3 + 3 и 你好',h:()=>`${BL(2)}<h2>Два 3-х тона подряд и 你好</h2>
  <div class="cmp">
   <div class="card n"><span class="k">Пишем</span><div class="tn"><span style="color:var(--t3)">3</span> + <span style="color:var(--t3)">3</span></div>${curve([3,3],100,80,0)}</div>
   <div class="card n"><span class="k">Говорим</span><div class="tn"><span style="color:var(--t2)">2</span> + <span style="color:var(--t3)">3</span></div>${curve([2,3],100,80)}</div>
  </div>
  <div class="rule "><span class="big">🎵 Правило: 3 + 3 → звучит 2 + 3</span>Две «галочки» подряд говорить трудно, поэтому <b>первый 3-й тон звучит как 2-й</b> (голос вверх). Пишем при этом <b>как в словаре</b>: значок не меняем.</div>
  <div class="motto"><div class="zh say" data-w="你好" style="cursor:pointer;font-size:76px">你好</div><div class="py">nǐ hǎo · звучит <span style="color:var(--t2)">ní</span> <span style="color:var(--t3)">hǎo</span></div><div class="ru">Привет! Здравствуй!</div></div>
  <h3>Нажми и повтори вслух 2–3 раза</h3>${wordBtns(W33.slice(0,4),true)}
  ${chk('Как <b>звучит</b> <span class="ipy">nǐ hǎo</span>?',['<span class="ipy">ní hǎo</span> — первый слог вверх','<span class="ipy">nǐ hǎo</span> — две «галочки»','<span class="ipy">nì hǎo</span> — первый слог вниз'],0,'3 + 3 говорим как 2 + 3.')}
  ${chk('А как <span class="zh-i">你好</span> <b>пишется</b> в пиньине?',['<span class="ipy">nǐ hǎo</span> — как в словаре','<span class="ipy">ní hǎo</span> — как слышим'],0,'Пишем как в словаре, меняется только голос.',true)}`},
 {lv:2,t:'3 + 4 и 我叫',h:()=>`${BL(2)}<h2>Неполный 3-й тон и 我叫</h2>
  <div class="cmp">
   <div class="card n"><span class="k">Один 3-й тон</span>${curve([3],120,80)}<div>вниз — и вверх</div></div>
   <div class="card n"><span class="k">3-й перед 4-м</span>${curve(['h',4],100,80)}<div>только <b>вниз</b>, потом резкий 4-й</div></div>
  </div>
  <div class="rule "><span class="big">🎵 Правило: неполный 3-й тон</span>Перед 1-м, 2-м и 4-м тоном 3-й тон звучит <b>наполовину</b>: голос опускается низко-низко и <b>не поднимается</b>.</div>
  <div class="motto"><div class="zh say" data-w="我叫" style="cursor:pointer;font-size:76px">我叫</div><div class="py"><span style="color:var(--t3)">wǒ</span> <span style="color:var(--t4)">jiào</span></div><div class="ru">Меня зовут…</div></div>
  <h3>Нажми и повтори вслух 2–3 раза</h3>${wordBtns(W34.slice(0,4))}
  ${chk('Что делает голос на <span class="ipy">wǒ</span> в <span class="ipy">wǒ jiào</span>?',['Опускается вниз и не поднимается','Делает полную «галочку»','Поднимается, как 2-й тон'],0,'Это неполный 3-й тон.')}`},
 {lv:2,need:['mix'],t:'3 + 3 или 3 + 4?',h:()=>`${BL(2)}<h2>3 + 3 или 3 + 4?</h2><p class="lead">Послушай слово. Первый слог <b>поднимается</b> — это 3 + 3. Первый слог <b>низкий и короткий</b>, а второй падает — это 3 + 4.</p><div class="qbox in" id="q5"></div>`,
  on:()=>{const A='3 + 3 <small style="display:block;font-size:13px;color:var(--mu)">звучит 2 + 3</small>',B='3 + 4 <small style="display:block;font-size:13px;color:var(--mu)">неполный 3-й</small>';
   const L=noTriple([['打鼓',A],['可怕',B],['母马',A],['马路',B],['马匹',A],['可乐',B],['你好',A],['我叫',B]],x=>x[1]);
   quiz('#q5','mix','3 + 3 или 3 + 4',L.map(([hz,r])=>({play:[urlW(hz)],lab:hz,q:'Какое сочетание тонов?',opts:[A,B],right:r,ok:`<span class="zh">${hz}</span> — ${r===A?'3 + 3':'3 + 4'}`})),2);}},
 {lv:2,need:['rec'],t:'Скажи сам: 你好 и 我叫',h:()=>`${BL(2)}<h2>🎤 Скажи сам и посмотри на мелодию</h2>
  <p class="lead">1) Послушай образец ▶. 2) Нажми «● Скажи» и произнеси. 3) Сравни линии: серая — образец, синяя — твой голос. Запиши <b>оба</b>: <span class="zh-i">你好</span> и <span class="zh-i">我叫</span>. Учитель послушает твои записи.</p>
  ${recBox('rw',[['你好','nǐ hǎo','ní hǎo'],['我叫','wǒ jiào','']])}
  <div class="tip">💡 Линия не появилась — скажи громче и ближе к микрофону.</div>`,
  on:()=>bindRec('rw',[['你好','nǐ hǎo','ní hǎo'],['我叫','wǒ jiào','']],'rec','Запись: 你好 и 我叫')},

 /* ---------- level 4: pinyin and meaning ---------- */
 {lv:3,need:['mean'],t:'好 или 叫?',h:()=>`${BL(3)}<h2>好 или 叫? Не перепутай!</h2>
  <div class="rule orange"><span class="big">🧠 Правило: 叫 jiào ≠ 好 hǎo</span><b>wǒ jiào</b> 我叫 = «меня зовут». <b>nǐ hǎo</b> 你好 = «привет», 好 — «хорошо». Если сказать «wǒ hǎo» — получится «мне хорошо», а не «меня зовут»!</div>
  <div class="cards c2">
   <div class="card n" style="text-align:center"><button class="zh say" data-hz="你好" style="font-size:64px;color:var(--ac2)">你好</button><div class="py" style="font-size:20px">${tpy('nǐ hǎo')}</div><b>Привет!</b><br><span class="zh-i">好</span> <span class="ipy">hǎo</span> — «хорошо»</div>
   <div class="card n" style="text-align:center"><button class="zh say" data-hz="我叫" style="font-size:64px;color:var(--ac2)">我叫</button><div class="py" style="font-size:20px">${tpy('wǒ jiào')}</div><b>Меня зовут…</b><br><span class="zh-i">叫</span> <span class="ipy">jiào</span> — «зваться»</div>
  </div>
  
  <div class="qbox in" id="q6"></div>`,
  on:()=>{const P=x=>`<span class="py" style="font-size:22px">${x}</span>`,Z=x=>`<span class="zh" style="font-size:34px">${x}</span>`;
   const L=[
    {lab:'«Привет!» → ?',q:'Как сказать <b>«Привет!»</b>?',opts:[Z('你好'),Z('我叫'),Z('我好'),Z('你叫')],right:Z('你好'),ok:'你好 nǐ hǎo — привет'},
    {lab:'«Меня зовут…» → ?',q:'Как сказать <b>«Меня зовут…»</b>?',opts:[Z('我叫'),Z('我好'),Z('你好'),Z('你叫')],right:Z('我叫'),ok:'我叫 wǒ jiào — меня зовут'},
    {lab:'叫 = ?',q:`${Z('叫')}<br>Что значит этот иероглиф?`,opts:['зваться','хорошо','я','ты'],right:'зваться',ok:'叫 jiào — зваться'},
    {lab:'好 = ?',q:`${Z('好')}<br>Что значит этот иероглиф?`,opts:['хорошо','зваться','ты','я'],right:'хорошо',ok:'好 hǎo — хорошо'},
    {lab:'我 = ?',q:`${Z('我')}<br>Что значит этот иероглиф?`,opts:['я','ты','хорошо','зваться'],right:'я',ok:'我 wǒ — я'},
    {lab:'你 = ?',q:`${Z('你')}<br>Что значит этот иероглиф?`,opts:['ты','я','зваться','хорошо'],right:'ты',ok:'你 nǐ — ты'},
    {lab:'пиньинь «привет»',q:'Как правильно написать <b>«Привет»</b> пиньинем?',opts:[P('nǐ hǎo'),P('ni hao'),P('ní hǎo'),P('nǐ hào')],right:P('nǐ hǎo'),ok:'nǐ hǎo — оба 3-и тона, пишем как в словаре',trap:{[P('ni hao')]:'Без тонов нельзя! Тон — часть слова 🎵',[P('ní hǎo')]:'Так <b>звучит</b>, но пишем как в словаре: nǐ'}},
    {lab:'пиньинь «меня зовут»',q:'Как правильно написать <b>«Меня зовут»</b> пиньинем?',opts:[P('wǒ jiào'),P('wo jiao'),P('wǒ hǎo'),P('wó jiào')],right:P('wǒ jiào'),ok:'wǒ jiào — 3 + 4',trap:{[P('wo jiao')]:'Без тонов нельзя! Тон — часть слова 🎵',[P('wǒ hǎo')]:'hǎo 好 — это «хорошо», а «зовут» — jiào 叫'}}];
   quiz('#q6','mean','好 или 叫?',L,2);}},
 {lv:3,need:['py'],t:'Напиши пиньинем',h:()=>`${BL(3)}<h2>✏️ Напиши пиньинем с тонами</h2>
  <p class="lead">В ДЗ 5 ты писал <b>ni hao</b> — без тонов. А без тона китаец может не понять слово! Напиши каждую фразу пиньинем <b>с тонами</b>. Нажми 🔊, чтобы послушать.</p>
  <div id="py"></div>`,on:()=>pyTask('#py')},

 /* ---------- level 5: radicals, meaning and sound ---------- */
 {lv:4,t:'Ключи 部首',h:()=>`${BL(4)}<h2>Ключи — подсказки смысла</h2><div class="hz"><span class="zh">部首</span><span class="py">bùshǒu</span></div>
  <div class="rule green"><span class="big">🔑 Правило: ключ = подсказка смысла</span>🔑 <b>Ключ</b> — часть иероглифа, которая подсказывает, <b>о чём он</b>. Увидел 氵 — значит, что-то про воду.</div>
  <div class="rad">${[['亻','rén','человек','🧍',['你','他','们']],['口','kǒu','рот','👄',['叫','吃','喝']],['女','nǚ','женщина','👩',['好','妈','她']],['氵','shuǐ','вода','💧',['河','湖','海']]].map(([r,p,ru,e,ex])=>`<div class="card n"><div class="e">${e}</div><div class="k">${r}</div><div class="py" style="font-size:16px">${p} · ${ru}</div><div class="ex">${ex.map(c=>`<button class="n" data-hz="${c}">${c}</button>`).join('')}</div></div>`).join('')}</div>
  <h3>🔍 Слева — смысл, справа — звук</h3>
  <div class="rule green"><span class="big">👈 смысл слева · звук справа 👉</span>Во многих иероглифах две части. <b>Слева</b> часто стоит ключ — он подсказывает <b>смысл</b>. <b>Справа</b> — часть, которая подсказывает, <b>как он звучит</b>.</div>
  <div class="lr">
   <div class="card n"><div class="big"><i>女</i>马</div><b>妈 mā — мама</b><div style="font-size:14.5px;margin-top:4px"><span style="color:var(--t4);font-weight:800">女</span> «женщина» — смысл, <b>马</b> — звучит <b>ma</b></div></div>
   <div class="card n"><div class="big"><i>口</i>马</div><b>吗 ma — вопрос?</b><div style="font-size:14.5px;margin-top:4px"><span style="color:var(--t4);font-weight:800">口</span> «рот» — что-то говорим, <b>马</b> — звучит <b>ma</b></div></div>
  </div>
  ${chk('Где в иероглифе 妈 подсказка, <b>как он звучит</b>?',['Справа: 马 — звучит ma','Слева: 女 «женщина»','Подсказки нет'],0,'Слева ключ 女 — смысл, справа 马 — звучит ma.')}`},
 {lv:4,need:['box'],t:'📦 Разложи по ключам',h:()=>`${BL(4)}<h2>📦 Разложи по ключам</h2><p class="lead">Найди в иероглифе ключ и отправь его в нужный ящик. Подсказка: ключ чаще всего <b>слева</b>.</p><div class="qbox in" id="q7"></div>`,
  on:()=>{const K={'亻':'🧍 человек','口':'👄 рот','女':'👩 женщина','氵':'💧 вода'};const H=[['你','亻','ты'],['他','亻','он'],['们','亻','(много людей)'],['休','亻','отдыхать'],['叫','口','зваться'],['吃','口','есть'],['喝','口','пить'],['吗','口','вопрос?'],['好','女','хорошо'],['妈','女','мама'],['她','女','она'],['姐','女','старшая сестра'],['河','氵','река'],['湖','氵','озеро'],['海','氵','море'],['汁','氵','сок']];
   const pick=noTriple(shuffle(H).slice(0,12),x=>x[1]);const O=Object.keys(K).map(k=>`<span class="zh" style="font-size:34px">${k}</span><small style="display:block;font-size:12px;color:var(--mu)">${K[k]}</small>`);
   quiz('#q7','box','Разложи по ключам',pick.map(([c,k,ru])=>({play:el=>playHz(c,el),lab:c,q:`<div class="qbig zh" style="color:var(--ac2)">${c}</div><div style="font-size:14px;color:var(--mu)">${ru} · В какой ящик?</div>`,opts:O.slice(),fixed:1,right:O[Object.keys(K).indexOf(k)],ok:`<span class="zh">${c}</span> — ключ <span class="zh">${k}</span> ${K[k]}`})),4);}},
 {lv:4,need:['alch'],t:'Смысл и звук',h:()=>`${BL(4)}<h2>🧪 Где смысл, а где звук?</h2><p class="lead">Ключ подсказывает <b>смысл</b>, другая часть — <b>как звучит</b>. Найди нужную часть.</p><div class="qbox in" id="q8"></div>`,
  on:()=>{const Z=x=>`<span class="zh" style="font-size:38px">${x}</span>`,Q=(c,w)=>`<div class="qbig zh" style="color:var(--ac2)">${c}</div>${w}`;
   const L=[
    {lab:'妈: где смысл',q:Q('妈','Какая часть подсказывает <b>смысл</b> «мама»?'),opts:[Z('女'),Z('马')],right:Z('女'),ok:'女 «женщина» — мама'},
    {lab:'吗: где звук',q:Q('吗','Какая часть подсказывает, <b>как звучит</b>?'),opts:[Z('马'),Z('口')],right:Z('马'),ok:'马 — звучит ma, поэтому 吗 ma'},
    {lab:'妈: где звук',q:Q('妈','Какая часть подсказывает, <b>как звучит</b>?'),opts:[Z('女'),Z('马')],right:Z('马'),ok:'马 — звучит ma, поэтому 妈 mā'},
    {lab:'吗: где смысл',q:Q('吗','Какая часть подсказывает <b>смысл</b>: что-то говорим, спрашиваем?'),opts:[Z('马'),Z('口')],right:Z('口'),ok:'口 «рот» — говорим, спрашиваем'},
    {lab:'好 = ?',q:Q('好','女 «женщина» + 子 «ребёнок». Что значит 好?'),opts:['хорошо','мама','зваться'],right:'хорошо',ok:'Мама с ребёнком — это хорошо: 好 hǎo'},
    {lab:'叫: ключ',q:Q('叫','Какой ключ в 叫 «зваться»?'),opts:[Z('口'),Z('亻'),Z('女'),Z('氵')],right:Z('口'),ok:'口 «рот»: звать, кричать'},

/* ===================== 小明: scripted dialog, the kid speaks into the mic ===================== */
let stream=null;
async function getMicXM(){if(stream&&stream.active)return stream;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});return stream;}
function wav16(f32,sr){const n=f32.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f32[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);}return new Blob([buf],{type:'audio/wav'});}
async function toWav(blob){const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();const src=await ac.decodeAudioData(await blob.arrayBuffer());ac.close&&ac.close();
 const len=Math.ceil(src.duration*16000);const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const oc=new OAC(1,len,16000);const b=oc.createBufferSource();b.buffer=src;b.connect(oc.destination);b.start();return wav16((await oc.startRendering()).getChannelData(0),16000);}
function talkBtn(btn,onAudio,onFail){let rec=null,chunks=[],t0=0,toggle=false,raf=0,ac=null;
 async function start(){stopAll();try{await getMicXM();}catch(e){onFail();return false;}
  chunks=[];const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  try{rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);}catch(e){onFail();return false;}rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start();t0=performance.now();btn.classList.add('rec');btn.textContent='⏹';
  try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(stream).connect(an);const d=new Uint8Array(an.fftSize);
   const loop=()=>{an.getByteTimeDomainData(d);let s=0;for(const x of d){const y=(x-128)/128;s+=y*y;}btn.style.setProperty('--lvl',(1+Math.min(.3,Math.sqrt(s/d.length)*2.5)).toFixed(3));raf=requestAnimationFrame(loop);};loop();}catch(e){}
  return true;}
 function stop(){if(!rec)return;const r=rec;rec=null;btn.classList.remove('rec');btn.textContent='🎤';cancelAnimationFrame(raf);btn.style.removeProperty('--lvl');if(ac){ac.close();ac=null;}const dur=performance.now()-t0;
  r.onstop=async()=>{if(dur<500){toast('Слишком коротко. Скажи фразу целиком.');return;}btn.classList.add('busy');
   try{const raw=new Blob(chunks,{type:r.mimeType});await onAudio(await toWav(raw),raw);}catch(e){toast('Не расслышал. Попробуй ещё раз, чуть громче.');}finally{btn.classList.remove('busy');}};r.stop();}
 btn.addEventListener('pointerdown',async e=>{e.preventDefault();if(btn.classList.contains('busy'))return;if(rec&&toggle){toggle=false;stop();return;}const ok=await start();if(!ok)return;
  const up=()=>{btn.removeEventListener('pointerup',up);btn.removeEventListener('pointercancel',up);if(performance.now()-t0<400)toggle=true;else stop();};btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);});}
const clean=t=>String(t||'').replace(/[,]/g,'，').replace(/[?]/g,'？').replace(/[!]/g,'！').replace(/[.]/g,'。').replace(/[^㐀-鿿，。？！、]/g,'').trim();
async function stt(wav){const r=await fetch(II+'/stt',{method:'POST',headers:{'Content-Type':'audio/wav'},body:wav});const j=await r.json();if(j.error)throw new Error(j.error);return clean(j.text);}
function xiaoming(){const me=ME;
 const XS=[{xm:'你好！',py:'nǐ hǎo!',ru:'Привет!'},{me:'hi',zh:'你好！',py:'nǐ hǎo!',ru:'Привет!'},
  {xm:'我叫小明。',py:'wǒ jiào Xiǎo Míng.',ru:'Меня зовут Сяо Мин.'},{xm:'你叫什么名字？',py:'nǐ jiào shénme míngzi?',ru:'Как тебя зовут?',nw:1},
  {me:'name',zh:'我叫'+me.hz+'。',py:'wǒ jiào '+me.py.join(' ')+'.',ru:'Меня зовут Владимир.'},{xm:'好！',py:'hǎo!',ru:'Хорошо!'}];
 let k=0,ok=0,log=[],notes=[],noMic=false;$('#xc').innerHTML='';
 const line=(who,st,extra)=>{const d=document.createElement('div');d.className='ln'+(who==='me'?' me':'');
  d.innerHTML=(who==='me'?'<span class="av me">В</span>':`<img class="av" src="${IMG}xiaoming.jpg" alt="小明">`)+`<div class="bb">${st.nw?'<span class="nw">✨ новая фраза</span><br>':''}<span class="zh">${st.zh||st.xm}</span>${st.py?`<span class="py">${st.py}</span>`:''}${st.ru?`<small>${st.ru}</small>`:''}${extra||''}</div>`;
  $('#xc').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d;};
 const next=async()=>{if(!$('#xc'))return;if(k>=XS.length)return end();const st=XS[k];
  if(st.xm){const d=line('xm',st,' <button class="btn g" style="padding:4px 10px;font-size:13px;margin-top:6px">🔊</button>');log.push({who:'xm',text:st.xm});d.querySelector('button').onclick=()=>xmSay(st.xm);
   $('#ctl').innerHTML='<p class="hint2" style="text-align:center;margin-top:14px">小明 говорит…</p>';await xmSay(st.xm);await new Promise(r=>later(r,st.nw?900:450));if(!$('#xc'))return;k++;return next();}
  turn(st,0);};
 const turn=(st,tries)=>{const say1=st.zh;
  $('#ctl').innerHTML=`<div class="qbox in"><div class="hint2">Твоя очередь! Скажи:</div><div class="zh" style="font-size:34px;color:var(--ac2);margin-top:4px">${say1}</div><div class="py" style="color:var(--ac)">${st.py}</div><small style="font-weight:700;color:var(--mu)">${st.ru}</small>
   ${noMic?'':'<button class="mic" id="mic" aria-label="Говорить">🎤</button><div class="hint2">Нажми 🎤 и говори, потом ⏹</div>'}<div class="fb" id="xf"></div>
   <div class="row" style="justify-content:center"><button class="btn g" id="hl">🔊 Как сказать</button>${noMic||tries>=2?`<button class="btn" id="tp">${noMic?'Сказал вслух ✓':'Дальше →'}</button>`:''}</div></div>`;
  $('#hl').onclick=()=>playHz(say1.replace(/[！。]/g,''));
  const goOn=(text,good,note)=>{if(good)ok++;if(note)notes.push(note);log.push({who:'me',text:text||'—',ok:good});line('me',{zh:text||say1,py:'',ru:good?'✓':''});k++;later(next,500);};
  const tp=$('#tp');if(tp)tp.onclick=()=>goOn(noMic?say1:'',noMic,noMic?'без микрофона: '+(st.me==='hi'?'приветствие':'представился')+' вслух':'не распознано: '+say1);
  const mic=$('#mic');if(!mic)return;
  talkBtn(mic,async(wav,raw)=>{upAud('xm'+(st.me==='hi'?1:2),raw);let t='';try{t=await stt(wav);}catch(e){toast('Распознавание не ответило. Попробуй ещё раз.');return;}
   const fb=$('#xf');if(!t){fb.className='fb no';fb.textContent='Не расслышал. Скажи чуть громче 🙂';if(tries>=1)turn(st,tries+1);return;}
   if(st.me==='hi'){const good=/好/.test(t)&&/[你您尼泥妳]/.test(t);if(good)return goOn(t,true);
    fb.className='fb no';fb.innerHTML=`Услышал: <span class="zh">${t}</span>. ${/好/.test(t)?'Начни с 你 nǐ.':'Скажи 你好 — nǐ hǎo.'} Попробуй ещё раз!`;notes.push('привет: «'+t+'»');if(tries>=1)later(()=>turn(st,tries+1),1600);return;}
   const jiao=/叫/.test(t),hit=[...me.hz].filter(c=>t.includes(c)).length;
   if(jiao){if(hit<Math.ceil(me.hz.length/2))notes.push('имя распознано как «'+t+'»');return goOn(t,true);}
   fb.className='fb no';fb.innerHTML=`Услышал: <span class="zh">${t}</span>. Начни с <b>我叫</b> wǒ jiào — «меня зовут». Попробуй ещё раз!`;notes.push('имя: «'+t+'»');if(tries>=1)later(()=>turn(st,tries+1),1600);},
  ()=>{noMic=true;toast('Микрофон недоступен — скажи вслух и нажми кнопку');turn(st,tries);});};
 const end=()=>{ST.res.xm={t:'Разговор с 小明',ok,of:2};keep();send('xm',{t:'Разговор с 小明',score:ok,of:2,log,notes});
  $('#ctl').innerHTML=`<div class="qbox in"><div style="font-size:54px">🎉</div><div class="res" style="font-size:30px">Вы познакомились!</div><p class="lead">${ok===2?'小明 понял тебя с первого раза. 好！':'Молодец! В следующий раз скажи ещё чётче.'}</p>
   <div class="row" style="justify-content:center"><button class="btn g" id="again">↺ Ещё раз</button></div></div>`;$('#again').onclick=xiaoming;};
 next();}

let cur=0;try{cur=Math.min(STEPS.length-1,+localStorage.getItem('zh-pv-vova-step')||0);}catch(e){}
if(/[?&]uchitel/.test(location.search)){ST.name='учитель';ST.res._who={t:'',ok:1,of:1};}
// a step can be opened only when every step before it is done (no skipping ahead)
const firstOpen=()=>{for(let i=0;i<STEPS.length;i++)if(!needOk(STEPS[i]))return i;return STEPS.length-1;};
if(!isTest())cur=Math.min(cur,firstOpen());
function render(){const s=STEPS[cur];try{localStorage.setItem('zh-pv-vova-step',cur)}catch(e){}LASTPOS=[];stopAll();TM.forEach(clearTimeout);TM=[];try{speechSynthesis.cancel()}catch(e){}

 $('#app').innerHTML=`<div class="top n"><span class="zh">复习</span><div><h1>Большое повторение</h1><small>Уроки 1–5 · 7 уровней · для Володи</small></div>
   <div class="prog">Шаг ${cur} из ${N}<div class="bar"><i style="width:${cur/N*100}%"></i></div></div>${cur?seals():''}</div>
  <div class="main n">${s.h()}
   <div class="nextbar">${cur?'<button class="btn g" id="pv">‹ Назад</button>':''}${cur<N?`<button class="btn nx" id="nx"></button>`:''}</div></div>`;
 bind();s.on&&s.on();gate();if(cur&&ST.name&&!isTest())markStep();
 const nx=$('#nx'),pv=$('#pv');
 nx&&(nx.onclick=()=>{if(!needOk(STEPS[cur])){toast(cur?'Сначала выполни задание на этом шаге 🙂':'Сначала нажми, кто проходит 🙂');const t=document.querySelector('.qbox,#g1,#g2,#py,#mb,#tr,.rec,#ctl');t&&t.scrollIntoView({behavior:'smooth',block:'center'});return;}cur++;render();scrollTo({top:0,behavior:'smooth'});});
 pv&&(pv.onclick=()=>{cur--;render();scrollTo({top:0,behavior:'smooth'});});}
