:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:32px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15}.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.main{padding:22px 20px}
@media(max-width:600px){.main{padding:18px 14px}}
h2{font-size:25px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:6px}
.lead{font-size:16.5px;line-height:1.5;margin-top:10px}
.lead b{color:var(--ink)}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 10px}
.list{display:grid;gap:12px;margin-top:16px}
.ti{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-align:left;width:100%}
.ti .no{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font:900 22px Nunito;color:#fff;background:var(--ac)}
.ti b{display:block;font-size:16.5px;color:var(--ink);line-height:1.25}.ti small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.ti .st{margin-left:auto;font-size:13px;font-weight:800;color:var(--ok);white-space:nowrap}
.ti.hot{box-shadow:0 0 0 3px var(--t2),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--ac);padding:8px 14px;border-radius:14px;margin-bottom:12px}
.tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#B0284F;padding:4px 10px;border-radius:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:16.5px;background:var(--ac);color:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.btn.g{background:var(--bg);color:var(--ac2)}.btn:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.qcard{padding:20px;margin-top:16px;text-align:center}
.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}.dots i{width:22px;height:6px;border-radius:3px;background:#D6DBE6}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}.dots i.cur{background:var(--ac)}
.play{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:16px auto 6px;font-size:38px;color:var(--ac)}
.play.on{color:var(--ok);box-shadow:inset 6px 6px 12px var(--sh1),inset -6px -6px 12px var(--sh2)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.opts.o3{grid-template-columns:repeat(3,1fr)}
.opt{min-width:0;padding:16px 8px;border-radius:18px;font-family:Nunito;font-weight:900;font-size:30px;color:var(--ac2);box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.opt.ok{background:#DDF5EC;box-shadow:inset 3px 3px 8px #B9DCCD;color:#14855E}.opt.no{background:#FFE3EB;box-shadow:inset 3px 3px 8px #F0C2D0;color:#B0284F}
.fb{margin-top:12px;font-size:16px;font-weight:700;line-height:1.45;min-height:24px}.fb.ok{color:#14855E}.fb.no{color:#D9366A}
.res{font-size:46px;font-weight:900;font-family:Nunito;color:var(--ac2);margin-top:8px}
.ans{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.ans span{padding:8px 4px;border-radius:12px;font-family:Nunito;font-weight:800;font-size:18px;text-align:center}
.ans .ok{background:#DDF5EC;color:#14855E}.ans .no{background:#FFE3EB;color:#B0284F}
@media(max-width:480px){.ans{grid-template-columns:repeat(4,1fr)}}
.cards{display:grid;gap:12px;margin-top:14px}@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{padding:14px 16px;border-radius:20px;font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.chip{padding:8px 15px;border-radius:15px;font-family:Nunito;font-weight:900;font-size:21px;line-height:1.1}
.chip.on{box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 7px var(--sh2)}
.vow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.vow .col{padding:10px 2px;border-radius:20px;display:grid;gap:2px;justify-items:center}
.vow .col small{font-size:13px;font-weight:800;color:var(--mu)}
.vow button{font-family:Nunito;font-weight:900;font-size:30px;line-height:1.2;padding:2px 6px;border-radius:12px}
.vow button.on{box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 7px var(--sh2)}
@media(max-width:480px){.vow button{font-size:25px}}
.tip{margin-top:14px;padding:12px 16px;border-radius:16px;background:#FFF6DC;color:#6B5310;font-size:15px;line-height:1.45}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.hole{position:relative;height:170px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#E9EDF4 0 55%,#D3D9E6 55%)}
.hole::after{content:'';position:absolute;left:10%;right:10%;bottom:14px;height:34px;border-radius:50%;background:#2B3270;opacity:.85}
.ml{position:absolute;left:50%;bottom:-150px;transform:translateX(-50%);width:96px;transition:bottom .22s ease-out;z-index:1;cursor:pointer;border:0;background:none;padding:0}
.ml.up{bottom:26px}.ml svg{width:96px;height:110px;display:block}
.ml b{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:#fff;border-radius:10px;padding:2px 8px;font:900 22px Nunito;color:#2B3270;white-space:nowrap;box-shadow:0 2px 0 #C5CBD8}
.ml.hit b{background:#2DBE8C;color:#fff}.ml.bad b{background:#FF5C8A;color:#fff}
.tbar{height:8px;border-radius:5px;background:#D6DBE6;margin-top:14px;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#F5A524,#FF5C8A);width:100%}
@media(max-width:600px){.top small{display:none}.top .zh{font-size:26px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ti.lk{opacity:.5}.ti.lk .no{background:#AEB5C8!important}
.ti .st.lk{color:var(--mu)}
/* shooter */
.arena{position:relative;height:min(62vh,430px);border-radius:22px;overflow:hidden;margin-top:12px;background:linear-gradient(180deg,#DCE6FF,#F3E9FF 70%,#FFE9F1);touch-action:manipulation}
.bub{position:absolute;bottom:-110px;width:74px;height:74px;margin-left:-37px;border-radius:50%;display:grid;place-items:center;font:900 23px Nunito;color:#2B3270;
 background:radial-gradient(circle at 32% 28%,#fff 0 12%,rgba(255,255,255,.55) 13% 30%,rgba(255,255,255,.18) 60%),var(--bc,#9FB4FF);box-shadow:inset -6px -8px 14px rgba(43,50,112,.18),0 6px 14px rgba(43,50,112,.15)}
.bub.pop{transform:scale(1.5);opacity:0;transition:transform .25s,opacity .25s}
.bub.bad{animation:shake .35s}.bub.show{outline:4px solid var(--ok);outline-offset:3px}
@keyframes shake{25%{translate:-8px 0}75%{translate:8px 0}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font:900 18px Nunito;color:var(--ac2)}
.hud .cmb{color:var(--t4)}
/* dictation keyboard */
.kb h4{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px;text-align:left}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{min-width:52px;padding:10px 10px;border-radius:14px;font:900 23px Nunito;color:var(--ac2);box-shadow:4px 4px 10px var(--sh1),-4px -4px 10px var(--sh2)}
.key.on{background:var(--ac);color:#fff;box-shadow:inset 3px 3px 7px #3D4BB0}
.key.tn{min-width:66px;font-size:26px}.key.tn small{display:block;font:800 11px Manrope}
.prev{font:900 54px Nunito;color:var(--ac2);min-height:66px;margin-top:6px}
.prev i{color:#C5CBD8;font-style:normal}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;margin-top:10px;font-size:16px;align-items:center}
.cmp .py{font-size:28px}
.why{text-align:left;margin-top:10px;display:grid;gap:8px}
.why div{padding:10px 14px;border-radius:14px;background:#FFF0F4;color:#7A1F3D;font-size:15px;line-height:1.45}
.why div.ok{background:#E6F7EF;color:#14674A}
/* cards to say aloud */
.say{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.sc{padding:14px 10px;border-radius:20px;text-align:center}
.sc .zh{font-size:44px;color:var(--ac2);line-height:1.1}.sc .py{font-size:19px;color:var(--ac)}.sc small{display:block;font-size:13px;color:var(--mu);font-weight:700}
.sc .row{justify-content:center;margin-top:8px;gap:8px}.sc .btn{padding:9px 14px;font-size:14.5px}
.sc.done{box-shadow:0 0 0 3px var(--ok),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
/* radicals */
.radq{font-size:96px;line-height:1.1;margin:12px 0 4px}
.radq.zh{color:var(--ac2)}
.opts .opt.em{font-size:46px;font-family:inherit}.opts .opt.zh{font-family:var(--han);font-size:48px;font-weight:400}
/* writing */
.wbox{position:relative;width:min(300px,78vw);height:min(300px,78vw);margin:14px auto 0;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;touch-action:none}
.wbox svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wbox .hw{position:absolute;inset:0}
.wch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wch span{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--han);font-size:30px;color:var(--ac2)}
.wch span.cur{box-shadow:0 0 0 3px var(--ac)}.wch span.ok{background:#DDF5EC;color:#14855E}
/* name */
.nmch{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.nmch button{padding:12px 18px;border-radius:16px;font-weight:800;font-size:17px;box-shadow:5px 5px 12px var(--sh1),-5px -5px 12px var(--sh2)}
.bigname{font-family:var(--han);font-size:64px;color:var(--ac2);line-height:1.15;margin-top:6px}
/* xiaoming */
.xm{display:grid;gap:12px;margin-top:14px}
.xm .ln{display:flex;gap:10px;align-items:flex-end}
.xm .ln.me{flex-direction:row-reverse}
.xm .av{flex:none;width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(43,50,112,.2)}
.xm .av.me{display:grid;place-items:center;background:var(--t2);color:#fff;font:900 22px Nunito}
.xm .bb{padding:12px 16px;border-radius:20px 20px 20px 6px;background:#fff;max-width:78%;text-align:left;box-shadow:0 4px 10px rgba(43,50,112,.08)}
.xm .me .bb{border-radius:20px 20px 6px 20px;background:#E3E8FF}
.xm .bb .zh{font-size:30px;color:var(--ink);line-height:1.25}.xm .bb .py{display:block;color:var(--ac);font-size:16px}.xm .bb small{display:block;color:var(--mu);font-weight:700;font-size:13.5px}
.xm .bb .nw{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--t4);border-radius:8px;padding:2px 7px;margin-bottom:4px}
.mic{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin:16px auto 4px;font-size:44px;background:var(--bg);box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2);transform:scale(var(--lvl,1));transition:transform .08s}
.mic.rec{background:#FFE3EB;box-shadow:0 0 0 6px rgba(255,92,138,.35)}.mic.busy{opacity:.5}
.hint2{font-size:14.5px;font-weight:700;color:var(--mu)}
/* lesson 6 */
.pc2 .row{gap:6px}.pc2 .btn{padding:9px 12px;font-size:14px}
.pc2{min-width:0}.say:has(.pc2){grid-template-columns:repeat(2,minmax(0,1fr))}
.scl{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.scl button{display:grid;justify-items:center;gap:4px;padding:14px 6px;border-radius:20px}.scl span{font-size:40px;line-height:1}.scl small{font-size:13px;font-weight:800;color:var(--mu)}
.scl button.on{box-shadow:0 0 0 3px var(--ac),inset 3px 3px 8px var(--sh1)}
.chip.n{box-shadow:4px 4px 10px var(--sh1),-4px -4px 10px var(--sh2)}.chip.on{background:var(--ac);color:#fff;box-shadow:inset 3px 3px 7px #3D4BB0}
.fd{position:relative;height:min(calc(100vh - 300px),460px);min-height:300px;margin-top:8px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,rgba(10,6,40,.15),rgba(10,6,40,.35)),url(img/fon.jpg) 30% 50%/cover,#1A1050;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.fd::before{content:'';position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 48% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 66% 8%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 22% 44%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 58% 52%,#fff 50%,transparent 51%);opacity:.8;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
.fd .mt{position:absolute;left:0;right:0;bottom:0;height:120px}
.fd .lan{position:absolute;font-size:22px;filter:drop-shadow(0 0 8px #FF7A3D);animation:lf 5s ease-in-out infinite alternate}
@keyframes lf{to{transform:translateY(-14px) rotate(6deg)}}
.fd .dr{position:absolute;left:-12%;bottom:40px;width:440px;height:235px;display:grid;place-items:center;font-size:118px;line-height:1;animation:dfl 2.4s ease-in-out infinite alternate;transform-origin:50% 60%}
.fd .dr img{width:100%;height:100%;object-fit:contain}
@keyframes dfl{to{transform:translateY(-12px)}}
.fd .orb{position:absolute;right:14%;top:-100px;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font:900 30px Nunito;color:#fff;background:radial-gradient(circle at 35% 30%,#FFFFFF 0,#9AE8FF 18%,#3B6BFF 55%,#1A1E7A 100%);box-shadow:0 0 30px #5BB8FF,0 0 70px rgba(91,184,255,.6);animation:fall var(--t,7s) linear forwards}
@keyframes fall{to{top:calc(100% - 120px)}}
.fd .fire{position:absolute;left:calc(-12% + 395px);bottom:150px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#FFF7C2 0,#FFB23D 40%,#FF4D1A 75%,rgba(255,77,26,0) 100%);box-shadow:0 0 30px #FF7A1A;opacity:0}
.fd.hit .fire{animation:shoot .45s ease-in forwards}
@keyframes shoot{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:1;transform:translate(var(--fx,220px),var(--fy,-60px)) scale(1.6)}}
.fd.hit .orb{animation-play-state:paused;animation:boom .55s .4s forwards}
@keyframes boom{50%{transform:scale(1.8);filter:brightness(2.5);opacity:1}100%{transform:scale(2.4);opacity:0}}
.fd.hit .dr{animation:roar .5s}
@keyframes roar{40%{transform:scale(1.18) rotate(-6deg)}}
.fd.miss .orb{animation-play-state:paused}
.fd.miss{animation:quake .45s}
@keyframes quake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.fd .tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 16px;border-radius:14px;background:rgba(255,255,255,.14);backdrop-filter:blur(4px);color:#FFE59A;font:900 22px Nunito;letter-spacing:.04em;white-space:nowrap}
.fd .wall{position:absolute;right:0;bottom:0;width:38%;height:62px;background:linear-gradient(180deg,#7A2E3A,#4A1A28);clip-path:polygon(0 30%,10% 30%,10% 0,20% 0,20% 30%,40% 30%,40% 0,50% 0,50% 30%,70% 30%,70% 0,80% 0,80% 30%,100% 30%,100% 100%,0 100%)}
.zk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.zk .opt{font-size:34px;padding:18px 6px;background:linear-gradient(160deg,#1E5F4C,#0E3B30);color:#E9FFF6;box-shadow:0 6px 14px rgba(14,59,48,.35),inset 0 0 0 2px rgba(120,255,200,.35);text-shadow:0 0 10px rgba(120,255,200,.8)}
.zk .opt.ok{background:linear-gradient(160deg,#2DBE8C,#16865F)}.zk .opt.no{background:linear-gradient(160deg,#FF5C8A,#C2335C)}
.gst{background:linear-gradient(180deg,rgba(18,11,58,.25) 0,rgba(18,11,58,.92) 62%),url(img/dragon-hero.jpg) 50% 0/100% auto no-repeat,#120B3A;color:#fff;border-radius:26px;padding:210px 22px 22px;text-align:center}
.gst h3{margin:0 0 6px;font-size:28px;color:#FFE59A}.gst p{margin:4px 0;color:#DCD6FF;font-size:17px;line-height:1.45}
.xm .ln .btn{flex:none;align-self:center}
/* ===== ДЗ 6 ===== */
.stc{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(min-width:640px){.stc{grid-template-columns:repeat(3,1fr)}}
.sti{position:relative;display:grid;justify-items:center;gap:6px;padding:16px 10px 14px;border-radius:22px;text-align:center}
.sti .ic{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:40px;overflow:hidden}
.sti .ic img{width:100%;height:100%;object-fit:cover}
.sti b{font-size:16px;color:var(--ink);line-height:1.2}.sti small{font-size:12.5px;color:var(--mu);font-weight:700;line-height:1.3}
.sti .num{position:absolute;left:10px;top:8px;font:900 15px Nunito;color:var(--mu)}
.sti .pd{display:flex;gap:4px;justify-content:center}.sti .pd i{width:10px;height:10px;border-radius:50%;background:#D6DBE6}.sti .pd i.ok{background:var(--ok)}
.sti.done{box-shadow:0 0 0 3px var(--ok),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.sti.hot{box-shadow:0 0 0 3px var(--t2),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.sti.fin .ic{background:linear-gradient(160deg,#2B1460,#120B3A)}
.shd{display:flex;align-items:center;gap:14px;margin-top:4px}.shd .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:34px;flex:none;overflow:hidden}.shd .ic img{width:100%;height:100%;object-fit:cover}
.stepl{display:grid;gap:10px;margin-top:16px}
.stp{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;text-align:left;width:100%}
.stp .k{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:900 17px Nunito;color:#fff;background:var(--ac)}
.stp.ok .k{background:var(--ok)}.stp b{display:block;color:var(--ink);font-size:16px}.stp small{display:block;color:var(--mu);font-weight:600;font-size:13px}
.stp .st{margin-left:auto;font:800 13px Manrope;color:var(--ok);white-space:nowrap}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--mu)}
.crumb .tag{background:var(--ac)}
.nextbar{display:flex;gap:12px;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:1px solid #D6DBE6;flex-wrap:wrap}.nextbar .btn{flex:1 1 auto}.nextbar .nx{flex:2 1 220px}
/* mole */
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.mg .hole{height:128px}
.mg .ml{width:84px}.mg .ml svg{width:84px;height:96px}.mg .ml.up{bottom:22px}
.mg .ml b{top:38px;font-size:21px}
.mg .ml.hit{animation:bonk .3s}.mg .ml.bad{animation:shake .35s}
@keyframes bonk{40%{transform:translateX(-50%) scale(1.15,.8)}}
.puff{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:26px;opacity:0;z-index:2;pointer-events:none}
.ml.air .puff{animation:puff 1s ease-out forwards}
@keyframes puff{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(10%,-26px) scale(1.4)}}
.rule{margin-top:12px;padding:14px 16px;border-radius:18px;font-weight:800;font-size:18px;color:#fff;text-align:center}
/* pair input */
.big1{font:900 110px Nunito;color:var(--ac2);line-height:1;margin:6px 0}
.tin{width:100%;max-width:260px;font:900 34px Nunito;text-align:center;padding:12px;border:0;outline:none;color:var(--ink);margin-top:10px}
/* row of initials */
.irow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.irow span{min-width:54px;padding:10px 8px;border-radius:14px;font:900 30px Nunito;color:var(--ac2);text-align:center}
/* tree */
.tree{position:relative;margin-top:14px;padding:16px 10px 18px;border-radius:26px;background:radial-gradient(ellipse at 50% 100%,#CDEFD9 0,#E9F6EE 45%,#F3F6FB 70%)}
.tree svg.br{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trow{position:relative;display:flex;justify-content:center;gap:clamp(14px,6vw,60px);flex-wrap:nowrap}
.trow+.trow{margin-top:26px}
.tn{display:grid;justify-items:center;gap:4px;width:clamp(96px,28vw,150px);padding:10px 6px 12px;border-radius:22px;background:#fff;box-shadow:0 6px 16px rgba(43,50,112,.12);position:relative}
.tn img{width:clamp(64px,18vw,96px);height:clamp(64px,18vw,96px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px #FFE3EB}
.tn .ph{width:clamp(64px,18vw,96px);height:clamp(64px,18vw,96px);border-radius:50%;display:grid;place-items:center;font-size:40px;background:#E4E8FF;box-shadow:0 0 0 4px #E4E8FF}
.tn .rl{font:900 19px Nunito;color:var(--ac)}.tn .nm{font-weight:800;font-size:15px;color:var(--ink);text-align:center;line-height:1.2}.tn small{font-size:12.5px;font-weight:700;color:var(--mu)}
.tn.on{box-shadow:0 0 0 4px var(--ok),0 6px 16px rgba(43,50,112,.12)}
.tn button.btn{padding:7px 12px;font-size:14px}
/* facts */
.fact{padding:16px 18px;border-radius:22px;margin-top:12px;font-size:15.5px;line-height:1.55}
.fact .fh{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;color:var(--ink)}
.fact .fi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex:none}
.fact p{margin-top:8px}
.fact .zh{font-size:1.4em;color:var(--ac2)}
.anc{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.anc div{display:grid;justify-items:center;gap:2px;padding:10px 12px;border-radius:16px;background:#fff;min-width:84px}
.anc div .zh{font-size:44px;line-height:1.1}.anc small{font-size:12px;font-weight:800;color:var(--mu)}
/* composition */
.comp{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.comp .pc{display:grid;justify-items:center;gap:2px;padding:12px 14px;border-radius:20px;min-width:96px}
.comp .pc .zh{font-size:60px;line-height:1.05}.comp .pc small{font-size:13px;font-weight:800}
.comp .op{font:900 34px Nunito;color:var(--mu)}
.comp .pc.m{background:#FFE3EB}.comp .pc.m .zh,.comp .pc.m small{color:#B0284F}
.comp .pc.s{background:#E4E8FF}.comp .pc.s .zh,.comp .pc.s small{color:#3B4BD8}
.comp .pc.r{background:#fff;box-shadow:0 0 0 3px var(--ok)}
/* alchemy */
.alc{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.alc .slot{width:92px;height:92px;border-radius:22px;display:grid;place-items:center;font-family:var(--han);font-size:56px;color:var(--ac2)}
.alc .slot.f{background:#fff}
.alc .pot{font-size:44px}
.ings{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.ings button{width:70px;height:70px;border-radius:20px;font-family:var(--han);font-size:42px;color:var(--ac2)}
.ings button.used{opacity:.3}
.alc.boom .pot{animation:roar .6s}
/* family of characters */
.fam{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.fam div{padding:8px 4px;border-radius:16px;background:#fff;display:grid;justify-items:center}
.fam .zh{font-size:40px;line-height:1.1;color:var(--ac2)}.fam small{font-size:12px;font-weight:800;color:var(--mu);text-align:center}
.hzq{font-family:var(--han);font-size:110px;line-height:1.1;color:var(--ac2);margin:8px 0 2px}
/* match triples */
.mt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mt3 .col{display:grid;gap:8px;align-content:start}

<script>/* Ядро каталога: голос, звуки, картинки, реестр игр. */
(function(){
  const K = window.KAT = window.KAT || {};
  K.AUDIO = K.AUDIO || {};   // 'текст' или 'голос:текст' -> data:audio/mpeg;base64,...
  K.IMG = K.IMG || {};       // имя -> data:image/webp;base64,...
  K.GAMES = K.GAMES || [];
  K.TTS_FALLBACK = K.TTS_FALLBACK || '';   // в тестовой обвязке — адрес сервера голоса
  K.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let AC = null;
  K.ac = () => { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; };
  K.img = name => K.IMG[name] || '';
  // ДЗ 6: голос берём из озвучки сайта (window.KSAY), звуки заранее загружены — без паузы
  K.say = (text) => window.KSAY ? window.KSAY(text) : Promise.resolve();
  K.stopVoice = () => { if (window.KSTOP) window.KSTOP(); };

  /* ---- синтезированные звуки ---- */
  function env(g, t, a, d, peak = .3){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(type, f1, f2, dur, peak = .25, delay = 0){
    const c = K.ac(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(g, t, .005, dur, peak); o.connect(g).connect(K.master()); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, filt = 'lowpass', f1 = 2000, f2 = 400, peak = .3, delay = 0){
    const c = K.ac(), t = c.currentTime + delay, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = filt; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); env(g, t, .004, dur, peak); s.connect(f).connect(g).connect(K.master()); s.start(t); s.stop(t + dur + .05);
  }
  let M = null;
  K.volume = .8;
  K.master = () => { const c = K.ac(); if (!M) { M = c.createGain(); M.gain.value = K.volume; M.connect(c.destination); } return M; };
  const SFX = {
    pop:   () => { noise(.12, 'bandpass', 1800, 600, .5); tone('sine', 700, 180, .1, .25); },
    laser: () => tone('square', 1400, 180, .16, .12),
    boom:  () => { noise(.55, 'lowpass', 1200, 80, .6); tone('sine', 120, 40, .4, .35); },
    coin:  () => { tone('square', 988, 0, .08, .12); tone('square', 1319, 0, .25, .12, .08); },
    ok:    () => { tone('triangle', 523, 0, .12, .25); tone('triangle', 659, 0, .12, .25, .09); tone('triangle', 784, 0, .25, .25, .18); },
    no:    () => { tone('sawtooth', 220, 180, .18, .12); tone('sawtooth', 180, 140, .25, .12, .16); },
    win:   () => { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, 0, .22, .25, i * .11)); tone('triangle', 1319, 0, .5, .2, .48); },
    whoosh:() => noise(.35, 'bandpass', 400, 3000, .25),
    click: () => tone('square', 1800, 900, .03, .08),
    tick:  () => tone('sine', 1500, 0, .03, .12),
    bell:  () => { tone('sine', 1760, 0, .9, .2); tone('sine', 2640, 0, .6, .08); },
    paper: () => noise(.28, 'highpass', 1500, 5000, .18),
    chew:  () => { noise(.07, 'bandpass', 900, 500, .3); noise(.07, 'bandpass', 800, 450, .25, .12); },
    pour:  () => noise(.9, 'bandpass', 900, 1400, .12),
    cash:  () => { tone('sine', 2093, 0, .5, .18); tone('sine', 2637, 0, .6, .12, .05); noise(.25, 'highpass', 4000, 8000, .12, .1); },
    step:  () => noise(.06, 'lowpass', 600, 200, .25),
    zap:   () => tone('sawtooth', 600, 1800, .12, .1),
    gem:   () => { tone('sine', 1047, 1568, .15, .2); tone('sine', 1568, 2093, .2, .15, .08); },
  };
  K.sfx = name => { try { (SFX[name] || SFX.click)(); } catch (e) {} };
  K.register = g => { K.GAMES.push(g); };
  // координаты указателя на сцене 1280×720 (сцена может быть повёрнута на телефоне)
  K.toXY = (stage, e) => { const q = stage._rot; if (q) return [(e.clientY - q.ty) / q.k, (q.tx - e.clientX) / q.k]; const r = stage.getBoundingClientRect(); return [(e.clientX - r.left) * 1280 / r.width, (e.clientY - r.top) * 720 / r.height]; };

  K.rectIn = (stage, el) => { const r = el.getBoundingClientRect(), [x1, y1] = K.toXY(stage, {clientX: r.left, clientY: r.top}), [x2, y2] = K.toXY(stage, {clientX: r.right, clientY: r.bottom}); return {x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1)}; };
  K.game = id => K.GAMES.find(g => g.id === id);
  // черты иероглифов: из данных Hanzi Writer, которые вшиты в страницу
  K.HZ = K.HZ || {};
  if (window.HZDATA) for (const c in window.HZDATA) { const d = window.HZDATA[c]; K.HZ[c] = {s: d.strokes, m: d.medians, r: d.radStrokes || []}; }

  K.pick = a => a[Math.floor(Math.random() * a.length)];
})();

`;

  KAT.register({
    id: 'alchemy',
    title: 'Алхимия иероглифов',
    kind: 'Лаборатория',
    text: 'Брось ключ в тигель к части-подсказке — и получится новый иероглиф. Ключ подсказывает смысл, вторая часть — звучание, поэтому 妈 mā, 吗 ma и 骂 mà звучат похоже.',
    where: ['урок', 'домашка'],
    topic: 'Ключи и фоноидеограммы · 20 знаков',
    css,
    audio: [...SETS.map(s => s.part), ...SETS.flatMap(s => s.makes.map(m => m.ch))],
    mount(stage, K) {
      const R = !!K.reduce;
      const timers = new Set(); let alive = true, raf = 0;
      const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); if (alive) fn(); }, R ? Math.min(ms, 60) : ms); timers.add(t); return t; };
      const wait = ms => new Promise(r => later(r, ms));
      if (R) stage.classList.add('al-reduce');
      stage.addEventListener('scroll', () => { if (stage.scrollLeft || stage.scrollTop) { stage.scrollLeft = 0; stage.scrollTop = 0; } });
      stage.style.setProperty('--al-noise', 'url("data:image/svg+xml,' + encodeURIComponent(NOISE) + '")');
      const shelfKeys = K.shuffle(Object.keys(KEYS));
      stage.innerHTML = `<div class="al-bg"></div><div class="al-noise"></div><div class="al-astro">${ASTRO}</div><div class="al-vig"></div><div class="al-frame"></div>
        <div class="al-top"><div class="al-title"><small>Ключи и звучание</small>Алхимия иероглифов</div><div class="al-sets"></div>
          <button class="al-bookbtn">${BOOK}Книга рецептов <b class="al-cnt">0 / ${TOTAL}</b></button></div>
        <div class="al-panel al-shelf"><div class="al-cap">Ключи</div><div class="al-sub">подсказывают смысл</div><div class="al-grid"></div></div>
        <div class="al-panel al-part"><div class="al-cap">Подсказка к звучанию</div>
          <div class="al-med" title="Послушать"><div class="gl"></div></div><div class="al-ppy"></div><div class="al-pru"></div><div class="al-div"></div>
          <div class="al-fcap"><span>Знаки этой части</span><span class="al-fn"></span></div><div class="al-slots"></div><div class="al-pnote">Знаки с одной частью звучат похоже — сравни пиньинь.</div>
          <button class="al-hintbtn">Подсказка</button></div>
        <div class="al-glow"></div><div class="al-cru">${CRUCIBLE}</div>
        <div class="al-drop">Перетащи ключ в тигель или просто нажми на него</div>
        <canvas class="al-fx" width="1280" height="720"></canvas>
        <div class="al-res"></div><div class="al-toast"><span></span></div><div class="al-over hide"></div>`;
      const $ = s => stage.querySelector(s);
      const grid = $('.al-grid'), setsEl = $('.al-sets'), cnt = $('.al-cnt'), bookBtn = $('.al-bookbtn');
      const med = $('.al-med'), ppy = $('.al-ppy'), pru = $('.al-pru'), fn = $('.al-fn'), slots = $('.al-slots'), hintBtn = $('.al-hintbtn');
      const cru = $('.al-cru'), glow = $('.al-glow'), res = $('.al-res'), toast = $('.al-toast'), over = $('.al-over'), drop = $('.al-drop');
      const cv = $('canvas.al-fx'), cx = cv.getContext('2d');

      // полка
      shelfKeys.forEach((k, i) => {
        const f = document.createElement('div'); f.className = 'al-fl'; f.dataset.k = k; f.style.setProperty('--c', KEYS[k].c);
        f.innerHTML = flaskSVG(k, i) + `<div class="gl">${k}</div><div class="nm">${KEYS[k].name}</div>`;
        grid.appendChild(f);
        if (i % 3 === 2) { const r = document.createElement('div'); r.className = 'al-row'; grid.appendChild(r); }
      });
      SETS.forEach((s, i) => { const b = document.createElement('button'); b.className = 'al-set'; b.textContent = s.part; b.title = s.part + ' ' + s.py; b.onclick = () => { if (!busy && over.classList.contains('hide')) { K.sfx('click'); goSet(i); } }; setsEl.appendChild(b); });

      let si = 0, found = new Set(), busy = false, misses = 0, streak = 0, liquid = ['#7C6BE0', '#2B2A8C'];
      const setDone = i => SETS[i].makes.every(m => found.has(m.ch));
      const toXY = e => K.toXY(stage, e);

      function renderSets(){ [...setsEl.children].forEach((b, i) => { b.classList.toggle('cur', i === si); b.classList.toggle('done', setDone(i)); }); cnt.textContent = found.size + ' / ' + TOTAL; }
      function renderSlots(){
        const s = SETS[si]; const n = s.makes.filter(m => found.has(m.ch)).length;
        fn.innerHTML = `<b>${n}</b> из ${s.makes.length}`;
        slots.innerHTML = s.makes.map(m => found.has(m.ch)
          ? `<div class="al-slot on" data-ch="${m.ch}">${hzColored(m.ch, 52, KEYS[m.k].c, keyStrokes(m))}<div class="py">${m.py}</div></div>`
          : `<div class="al-slot">?</div>`).join('');
        slots.querySelectorAll('.al-slot.on').forEach(e => { e.style.animation = 'none'; });
      }
      function goSet(i){
        si = i; streak = 0; hintBtn.classList.remove('pulse');
        const s = SETS[i];
        med.querySelector('.gl').textContent = s.part; med.classList.remove('swap'); void med.offsetWidth; med.classList.add('swap');
        ppy.textContent = s.py; pru.textContent = s.ru;
        renderSlots(); renderSets(); setLiquid('#7C6BE0', '#2B2A8C');
        grid.querySelectorAll('.al-fl').forEach(f => f.classList.remove('hint'));
      }
      function setLiquid(a, b){ liquid = [a, b]; cru.style.setProperty('--lq1', a); cru.style.setProperty('--lq2', b); glow.style.setProperty('--gc', hexA(a, .55)); }
      const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
      function showToast(t){ toast.querySelector('span').innerHTML = t; toast.classList.add('show'); clearTimeout(showToast.t); showToast.t = later(() => toast.classList.remove('show'), 2300); }

      // ---------- эффекты на холсте ----------
      const parts = [], bubbles = [], motes = [], steam = [];
      for (let i = 0; i < 46; i++) motes.push({x: Math.random() * 1280, y: Math.random() * 720, r: .6 + Math.random() * 1.8, v: .08 + Math.random() * .25, p: Math.random() * 6.28});
      function burst(color, n = 90){
        for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7.5;
          parts.push({x: CX, y: CY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .55 - 4.2, life: 1, dec: .011 + Math.random() * .016, r: 1.4 + Math.random() * 3.2, c: Math.random() < .35 ? '#FFFFFF' : Math.random() < .5 ? REST : color, g: .1, star: Math.random() < .25}); }
        parts.push({ring: 1, x: CX, y: CY, r: 20, life: 1, c: color});
        parts.push({ring: 1, x: CX, y: CY, r: 6, life: 1.2, c: '#FFFFFF'});
        parts.push({flash: 1, life: 1, c: color});
      }
      function smoke(){
        for (let i = 0; i < 26; i++) parts.push({smoke: 1, x: CX + (Math.random() - .5) * 180, y: CY - 4, vx: (Math.random() - .5) * .9, vy: -.7 - Math.random() * 1.4, r: 16 + Math.random() * 20, life: 1, dec: .007 + Math.random() * .006});
      }
      function splash(color){ for (let i = 0; i < 26; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * 1.8, sp = 2 + Math.random() * 4; parts.push({x: CX + (Math.random() - .5) * 40, y: CY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, dec: .03, r: 2 + Math.random() * 2.5, c: color, g: .25}); } }
      function frame(t){
        raf = requestAnimationFrame(frame);
        cx.clearRect(0, 0, 1280, 720);
        // пылинки
        for (const m of motes) { m.y -= m.v; m.x += Math.sin(t / 2200 + m.p) * .15; if (m.y < -4) { m.y = 724; m.x = Math.random() * 1280; }
          cx.globalAlpha = .25 + .25 * Math.sin(t / 900 + m.p); cx.fillStyle = '#D6C8B0'; cx.beginPath(); cx.arc(m.x, m.y, m.r, 0, 6.29); cx.fill(); }
        cx.globalAlpha = 1;
        // пламя под тиглем
        const fy = CY + 184;
        for (let i = 0; i < 7; i++) { const fx = CX - 66 + i * 22, h = 34 + 14 * Math.sin(t / 110 + i * 1.7) + 8 * Math.sin(t / 47 + i);
          const g = cx.createLinearGradient(0, fy, 0, fy - h); g.addColorStop(0, 'rgba(120,150,255,.85)'); g.addColorStop(.5, 'rgba(160,120,255,.55)'); g.addColorStop(1, 'rgba(200,160,255,0)');
          cx.fillStyle = g; cx.beginPath(); cx.moveTo(fx - 11, fy); cx.quadraticCurveTo(fx - 10, fy - h * .5, fx + Math.sin(t / 90 + i) * 4, fy - h); cx.quadraticCurveTo(fx + 10, fy - h * .5, fx + 11, fy); cx.fill(); }
        const fg = cx.createRadialGradient(CX, fy, 4, CX, fy, 120); fg.addColorStop(0, 'rgba(140,150,255,.35)'); fg.addColorStop(1, 'rgba(140,150,255,0)'); cx.fillStyle = fg; cx.fillRect(CX - 130, fy - 90, 260, 120);
        // пузырьки в зелье
        if (Math.random() < .3) bubbles.push({x: CX + (Math.random() - .5) * 230, y: CY + 12, r: 1.5 + Math.random() * 4, life: 1});
        cx.save(); cx.beginPath(); cx.ellipse(CX, CY + 6, 134, 25, 0, 0, 6.29); cx.clip();
        for (let i = bubbles.length - 1; i >= 0; i--) { const b = bubbles[i]; b.y -= .25; b.life -= .02; if (b.life <= 0) { bubbles.splice(i, 1); continue; }
          cx.globalAlpha = b.life * .8; cx.strokeStyle = 'rgba(255,255,255,.8)'; cx.lineWidth = 1.2; cx.beginPath(); cx.arc(b.x, b.y, b.r * (1.4 - b.life * .4), 0, 6.29); cx.stroke(); }
        cx.restore(); cx.globalAlpha = 1;
        // пар
        if (Math.random() < .08) steam.push({x: CX + (Math.random() - .5) * 160, y: CY - 6, r: 10 + Math.random() * 12, life: 1});
        for (let i = steam.length - 1; i >= 0; i--) { const s = steam[i]; s.y -= .55; s.x += Math.sin(t / 700 + i) * .3; s.r += .18; s.life -= .006; if (s.life <= 0) { steam.splice(i, 1); continue; }
          const g = cx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r); g.addColorStop(0, hexA(liquid[0], .12 * s.life)); g.addColorStop(1, hexA(liquid[0], 0)); cx.fillStyle = g; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.29); cx.fill(); }
        // частицы
        for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i];
          if (p.flash) { p.life -= .04; if (p.life <= 0) { parts.splice(i, 1); continue; } const g = cx.createRadialGradient(CX, CY - 40, 0, CX, CY - 40, 420); g.addColorStop(0, hexA(p.c, .5 * p.life)); g.addColorStop(1, hexA(p.c, 0)); cx.fillStyle = g; cx.fillRect(0, 0, 1280, 720); continue; }
          if (p.ring) { p.r += 9; p.life -= .03; if (p.life <= 0) { parts.splice(i, 1); continue; } cx.globalAlpha = Math.min(1, p.life); cx.strokeStyle = p.c; cx.lineWidth = 3 * p.life; cx.beginPath(); cx.ellipse(p.x, p.y, p.r, p.r * .32, 0, 0, 6.29); cx.stroke(); cx.globalAlpha = 1; continue; }
          if (p.smoke) { p.x += p.vx; p.y += p.vy; p.r += .45; p.life -= p.dec; if (p.life <= 0) { parts.splice(i, 1); continue; }
            const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); g.addColorStop(0, `rgba(150,146,178,${.42 * p.life})`); g.addColorStop(1, 'rgba(150,146,178,0)'); cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill(); continue; }
          p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.life -= p.dec; if (p.life <= 0) { parts.splice(i, 1); continue; }
          cx.globalAlpha = Math.min(1, p.life * 1.4); cx.fillStyle = p.c;
          if (p.star) { const s = p.r * 2.2; cx.beginPath(); cx.moveTo(p.x, p.y - s); cx.lineTo(p.x + s * .25, p.y - s * .25); cx.lineTo(p.x + s, p.y); cx.lineTo(p.x + s * .25, p.y + s * .25); cx.lineTo(p.x, p.y + s); cx.lineTo(p.x - s * .25, p.y + s * .25); cx.lineTo(p.x - s, p.y); cx.lineTo(p.x - s * .25, p.y - s * .25); cx.fill(); }
          else { cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.29); cx.fill(); }
          cx.globalAlpha = 1; }
      }
      if (!R) raf = requestAnimationFrame(frame);
      else { frame(0); cancelAnimationFrame(raf); raf = 0; }
      const fxBurst = c => { if (!R) burst(c); };
      const fxSmoke = () => { if (!R) smoke(); };
      const fxSplash = c => { if (!R) splash(c); };

      // ---------- полёт шарика ----------
      function orb(g, c, x, y, cls = ''){ const o = document.createElement('div'); o.className = 'al-orb ' + cls; o.textContent = g; if (c) o.style.setProperty('--c', c); o.style.transform = `translate(${x}px,${y}px)`; stage.appendChild(o); return o; }
      function fly(o, x0, y0, x1, y1, dur){
        if (R || !o.animate) { o.style.transform = `translate(${x1}px,${y1}px) scale(.4)`; return Promise.resolve(); }
        const mx = (x0 + x1) / 2, my = Math.min(y0, y1) - 120;
        const a = o.animate([
          {transform: `translate(${x0}px,${y0}px) scale(1)`},
          {transform: `translate(${mx}px,${my}px) scale(1.1)`, offset: .5},
          {transform: `translate(${x1}px,${y1}px) scale(.35)`}], {duration: dur, easing: 'cubic-bezier(.45,.05,.4,1)', fill: 'forwards'});
        return new Promise(r => { a.onfinish = r; later(r, dur + 80); });
      }

      async function brew(k, sx, sy, orbEl){
        if (busy) return; busy = true;
        const s = SETS[si], kc = KEYS[k].c;
        res.classList.remove('show'); res.innerHTML = '';
        const o = orbEl || orb(k, kc, sx, sy);
        const mr = K.rectIn(stage, med);
        const px = mr.x + mr.w / 2, py = mr.y + mr.h / 2;

    }

function nmTranslit(ru,fem){const w=ru.toLowerCase().replace(/[^а-яё]/g,'');let out='',i=0;const V='аоуыэеияюё';
 while(i<w.length){const c=w[i],nx=w[i+1]||'';

  if(V.includes(c)){let s=NM_T[''][c];if(fem&&c==='я'&&i===w.length-1)s='娅';out+=s;i++;continue;}
  const row=NM_T[c];if(!row){i++;continue;}
  if(V.includes(nx)){let s=row[nx];const last=i+2>=w.length;
   if(fem&&last){if(c==='н'&&nx==='а')s='娜';else if(c==='ш'&&nx==='а')s='莎';else if(c==='м'&&nx==='а')s='玛';else if(nx==='я')s=s.replace(/亚$/,'娅');}

   out+=s;i+=2;continue;}
  out+=row[''];i++;}
 return out.slice(0,7);}

 const ask=()=>{if(i>=list.length){fin('para',ok,6,{miss});sshell(`${score(ok,6)}<div class="ans" style="grid-template-columns:repeat(3,1fr)">${['b','d','g'].map(x=>`<span class="ok">${x} — ${PAIRS6[x]}</span>`).join('')}</div>${doneRow}`);again(para);return;}
  const q=list[i];let lock=false;
  sshell(`<p class="lead">У нас 6 парных согласных. Видишь одну — напиши с клавиатуры её пару.</p><div class="qcard in"><div class="qhead"><span>${i+1} из ${list.length}</span><span>${ok} ✓</span></div>
   <div class="big1">${q}</div><button class="btn g" id="pl" style="padding:8px 14px">🔊 ${q}</button><br><input class="tin in" id="ti" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="?"><div class="row" style="justify-content:center"><button class="btn" id="ck">Проверить</button></div><div class="fb" id="fb"></div></div>`);
  const pl=$('#pl');pl.onclick=()=>playS(mark(q+'a',1),pl);
  const ti=$('#ti');setTimeout(()=>ti.focus(),100);
  const check=()=>{if(lock)return;const v=ti.value.trim().toLowerCase(),fb=$('#fb');if(!v){toast('Напиши букву');return;}
   const lat={'б':'b','п':'p','д':'d','т':'t','г':'g','к':'k'}[v]||v;
   if(lat===PAIRS6[q]){lock=true;if(!ret[q])ok++;res.push(!ret[q]);fb.className='fb ok';fb.innerHTML='✓ Верно! '+PAIRW(q,PAIRS6[q]);playS(mark(PAIRS6[q]+'a',1));later(()=>{i++;ask();},1700);}
   else{if(!ret[q]){ret[q]=1;miss.push(q);list.push(q);}fb.className='fb no';fb.innerHTML=(/[а-я]/.test(v)?'Пиши латинскими буквами. ':'Не совсем. ')+'Пара к <b>'+q+'</b> — <b>'+PAIRS6[q]+'</b>. Этот вопрос повторится в конце 🙂';ti.value='';ti.focus();}};
  $('#ck').onclick=check;ti.onkeydown=e=>{if(e.key==='Enter')check();};};
 ask();}

function fam(){
 sshell(`<p class="lead">Иероглифы живут <b>семейками</b>: у них одна и та же часть-звук, поэтому и читаются они похоже. А ключ слева подсказывает смысл. Нажимай и слушай!</p>
  ${FAMS.map(([h,s,l])=>`<h3>Семейка <span class="zh" style="font-size:30px;color:#3B4BD8">${h}</span> — читается похоже на «${s}»</h3><div class="fam">${l.map(([c,p,r,k])=>`<div class="n" data-say="${c}" style="cursor:pointer"><span class="zh">${c}</span><span class="py" style="font-size:16px;color:${TCOL[toneOf(p)]}">${p}</span><small>${r}</small><small style="color:#B0284F">${k}</small></div>`).join('')}</div>`).join('')}
  <div class="tip">😮 Даже <span class="zh">爬</span> pá («ползать») из семейки <span class="zh">巴</span>: звук немного изменился, но похож!</div>
  <div class="row" style="justify-content:center"><button class="btn" id="st">Угадай чтение: 8 вопросов →</button></div>`);
 document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>playW(b.dataset.say,b));
 const all=FAMS.flatMap(([h,s,l])=>l.map(x=>[...x,s]));
 const meaning=[['妈','мама',['мама','папа','ругать']],['把','держать',['держать','мама','код']],['爬','ползать',['ползать','вопрос?','мама']],['码','код, номер',['код, номер','папа','ползать']]];
 $('#st').onclick=()=>quiz({id:'fam',run:fam,label:x=>x.l,cols:4,items:shuffle(all.filter(x=>x[0]!=='爬')).slice(0,4).map(x=>({l:x[0],q:`<div class="hzq">${x[0]}</div><p class="lead">Найди часть-звук. Как он примерно читается?</p>`,o:['ma','ba'],r:x[4],show:v=>`<span class="py">${v}</span>`,yes:`✓ Верно! ${x[0]} — <span class="py">${x[1]}</span>, «${x[2]}»`,after:()=>playW(x[0])}))
  .concat(shuffle(meaning).map(([c,r,o])=>({l:c,q:`<div class="hzq">${c}</div><p class="lead">Посмотри на ключ слева. Что значит иероглиф?</p>`,o,r,show:v=>`<span style="font-size:18px">${v}</span>`,yes:`✓ Верно! Ключ подсказал смысл.`,after:()=>playW(c)})))});}

const GRID='<svg class="grid" viewBox="0 0 100 100"><g stroke="#FFB3C8" stroke-width=".6" stroke-dasharray="2 2"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></g></svg>';
const HZI={'你':['nǐ','ты'],'我':['wǒ','я'],'好':['hǎo','хорошо'],'叫':['jiào','зваться'],'妈':['mā','мама'],'爸':['bà','папа']};
const hwOpts=(sz,extra)=>Object.assign({width:sz,height:sz,padding:sz*.08,showOutline:true,showCharacter:false,outlineColor:'#E1E5EE',strokeColor:'#2B3270',radicalColor:'#FF5C8A',drawingColor:'#5B6BD8',drawingWidth:Math.round(sz/16),highlightColor:'#2DBE8C',strokeAnimationSpeed:1.2,delayBetweenStrokes:250,charDataLoader:(ch,ok)=>ok(HZDATA[ch])},extra||{});
function tracer(box,chars,cb){let k=0,mist=0,w=null;
 box.innerHTML=`<div class="wch">${[...chars].map((c,j)=>`<span class="n" data-j="${j}">${c}</span>`).join('')}</div><div class="wbox">${GRID}<div class="hw" id="hw"></div></div>
  <p class="hint2" id="wh" style="text-align:center;margin-top:8px"></p><div class="row" style="justify-content:center"><button class="btn g" id="wa">▶ Покажи порядок черт</button><button class="btn g" id="wr">↺ Заново</button></div>`;
 const one=()=>{const c=chars[k];box.querySelectorAll('[data-j]').forEach(s=>{s.classList.toggle('cur',+s.dataset.j===k);s.classList.toggle('ok',+s.dataset.j<k);});
  const el=box.querySelector('#hw');el.innerHTML='';const sz=el.clientWidth||280;
  if(!window.HanziWriter||!HZDATA[c]){$('#wh').textContent='Пропиши '+c+' пальцем в воздухе 🙂';later(()=>{k++;k<chars.length?one():cb(mist);},1500);return;}
  w=HanziWriter.create(el,c,hwOpts(sz));
  const quiz=()=>{$('#wh').innerHTML=`Обведи <span class="zh" style="font-size:20px">${c}</span> по порядку черт`;w.quiz({showHintAfterMisses:2,highlightOnComplete:true,onMistake:()=>{mist++;},onComplete:()=>{if(!document.body.contains(el))return;$('#wh').textContent='✓ Отлично!';later(()=>{k++;if(k<chars.length)one();else cb(mist);},1100);}});};
  $('#wa').onclick=()=>{w.cancelQuiz();$('#wh').textContent='Смотри порядок черт…';w.showCharacter();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();quiz();},600)});};
  $('#wr').onclick=()=>{w.cancelQuiz();quiz();};
  w.animateCharacter({onComplete:()=>{if(document.body.contains(el))later(()=>{w.hideCharacter();quiz();},500);}});$('#wh').textContent='Смотри порядок черт…';};
 one();}
// writing one character from memory with hints; reports hints / "show all" / stroke mistakes
function memoOne(el,c,wh,ctl,done){const sz=el.clientWidth||280;let hints=0,show=0,mist=0,cur=0;el.innerHTML='';
 if(!window.HanziWriter||!HZDATA[c]){wh.textContent='Напиши '+c+' пальцем в воздухе 🙂';later(()=>done({c,hints,show,mist}),1500);return;}
 const w=HanziWriter.create(el,c,hwOpts(sz,{showOutline:false}));
 const q=()=>w.quiz({showHintAfterMisses:3,highlightOnComplete:true,onMistake:()=>{mist++;if(mist===3)wh.textContent='Ничего страшного! Нужная черта мигнёт зелёным — повтори её 🙂';},
  onCorrectStroke:d=>{cur=d.strokeNum+1;wh.textContent='Так держать! ✓';},
  onComplete:()=>{if(!document.body.contains(el))return;wh.textContent=hints+show===0?'🏆 Без подсказок — супер!':'✓ Написано!';later(()=>done({c,hints,show,mist}),1100);}});
 ctl.h1.onclick=()=>{hints++;ctl.cnt(hints+show);try{w.highlightStroke(cur);}catch(e){}};
 ctl.h2.onclick=()=>{hints++;ctl.cnt(hints+show);w.showOutline();later(()=>w.hideOutline(),2500);};
 ctl.h3.onclick=()=>{show++;ctl.cnt(hints+show);w.cancelQuiz();cur=0;wh.textContent='Смотри внимательно…';w.showCharacter();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();wh.textContent='А теперь ты — по памяти!';q();},700)});};
 q();}
const HINTS=`<div class="row" style="justify-content:center;gap:8px"><button class="btn g" id="h1">👉 Следующая черта</button><button class="btn g" id="h2">💡 Контур</button><button class="btn g" id="h3">👀 Покажи весь</button></div>`;
function prop(){

   const c=order[k],[py,ru]=HZI[c];
   $('#mb').innerHTML=`<div class="qcard in" style="padding:12px"><div class="qhead"><span>Иероглиф ${k+1} из 2</span><span>💡 <b id="hc">0</b></span></div><div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px"><button class="play n" id="pl" style="width:58px;height:58px;font-size:22px;margin:0">🔊</button><div style="text-align:left"><div class="py" style="font-size:26px;color:${TCOL[toneOf(py)]}">${py}</div><div style="font-weight:800;font-size:18px;color:var(--ink)">«${ru}»</div></div></div></div>

   $('#pl').onclick=()=>playW(c,$('#pl'));
   memoOne($('#hw'),c,$('#wh'),{h1:$('#h1'),h2:$('#h2'),h3:$('#h3'),cnt:n=>$('#hc').textContent=n},r=>{res.push(r);k++;one();});};

/* ===================== 4. Words ===================== */
const WORDS=[['你好','nǐ hǎo',['привет','здравствуй','здравствуйте','добрый день']],['我','wǒ',['я']],['你','nǐ',['ты']],['好','hǎo',['хорошо','хороший']],['叫','jiào',['звать','зваться','зовут','звали']],['妈妈','mā ma',['мама']],['爸爸','bà ba',['папа']],['我叫','wǒ jiào',['меня зовут','я зовусь']],['你呢','nǐ ne',['а ты','а у тебя','а тебя']],['再见','zài jiàn',['до свидания','пока','до встречи']]];
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^а-я ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function perev(){let list=shuffle(WORDS),i=0,ok=0;const res=[],miss=[],ret={};
 const ask=()=>{if(i>=list.length){fin('perev',ok,WORDS.length,{miss});sshell(`${score(ok,WORDS.length)}<div class="ans" style="grid-template-columns:repeat(2,1fr)">${WORDS.map(w=>`<span class="${miss.includes(w[1])?'no':'ok'}" style="font-size:15px">${w[1]} — ${w[2][0]}</span>`).join('')}</div>${doneRow}`);again(perev);return;}
  const [hz,py,ru]=list[i];let lock=false;
  sshell(`<p class="lead">Видишь пиньинь — напиши перевод <b>по-русски</b> с клавиатуры.</p><div class="qcard in"><div class="qhead"><span>Карточка ${i+1} из ${list.length}</span><span>${ok} ✓</span></div>
   <div style="font:900 60px Nunito;margin:14px 0 4px" class="py">${tpy(py)}</div><button class="btn g" id="pl" style="padding:8px 14px">🔊 Послушать</button><br>
   <input class="tin in" id="ti" style="font:800 24px Manrope;max-width:340px" autocomplete="off" spellcheck="false" placeholder="перевод…"><div class="row" style="justify-content:center"><button class="btn" id="ck">Проверить</button></div><div class="fb" id="fb"></div></div>`);
  const pl=$('#pl');pl.onclick=()=>playWord(py,hz,pl);later(()=>playWord(py,hz,pl),300);const ti=$('#ti');setTimeout(()=>ti.focus(),100);
  const check=()=>{if(lock)return;const v=norm(ti.value),fb=$('#fb');if(!v){toast('Напиши перевод');return;}
   const exact=ru.some(r=>norm(r)===v),typo=!exact&&ru.some(r=>norm(r).length>=4&&lev(norm(r),v)<=1);
   if(exact||typo){lock=true;if(!ret[py])ok++;fb.className='fb ok';fb.innerHTML=(typo?'✓ Засчитано! Только опечатка: правильно <b>'+ru.find(r=>lev(norm(r),v)<=1)+'</b>':'✓ Верно!')+` <span class="zh" style="font-size:26px">${hz}</span>`;later(()=>{i++;ask();},typo?2200:1500);}
   else{if(!ret[py]){ret[py]=1;miss.push(py);list.push(list[i]);}fb.className='fb no';fb.innerHTML=`Не совсем. <b class="py">${py}</b> — это «<b>${ru[0]}</b>». Карточка повторится в конце 🙂`;ti.value='';lock=true;later(()=>{i++;ask();},2600);}};
  $('#ck').onclick=check;ti.onkeydown=e=>{if(e.key==='Enter')check();};};
 ask();}

const TRI=[['你','nǐ','ты'],['我','wǒ','я'],['好','hǎo','хорошо'],['叫','jiào','зваться'],['妈','mā','мама'],['爸','bà','папа']];
function troiki(){let sel={},done=0,err=0;const cols=[shuffle(TRI),shuffle(TRI),shuffle(TRI)];
 sshell(`<p class="lead">Собери тройки: нажми <b>иероглиф</b>, его <b>пиньинь</b> и <b>перевод</b> — в любом порядке.</p>
  <div class="mt3">${cols.map((c,ci)=>`<div class="col">${c.map(x=>`<button class="n ${ci===0?'zh':ci===1?'py':''}" data-c="${ci}" data-v="${x[0]}">${x[ci]}</button>`).join('')}</div>`).join('')}</div><div class="fb" id="fb"></div>`);
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(sel[c])sel[c].classList.remove('sel');sel[c]=b;b.classList.add('sel');if(c==='0')playW(b.dataset.v);
  if(!(sel[0]&&sel[1]&&sel[2]))return;const v=[0,1,2].map(k=>sel[k].dataset.v),fb=$('#fb');
  if(v[0]===v[1]&&v[1]===v[2]){[0,1,2].forEach(k=>{sel[k].classList.remove('sel');sel[k].classList.add('done');});done++;fb.className='fb ok';fb.textContent='✓ Тройка собрана!';sel={};
   if(done===TRI.length){const ok=Math.max(0,TRI.length-err);fin('troi',ok,TRI.length,{err});later(()=>{sshell(`<div class="res">🔗 ${TRI.length} троек</div><p class="lead">${err===0?'Без единой ошибки! 🏆':'Ошибок: '+err+'. Можно повторить для закрепления 🙂'}</p>${doneRow}`);again(troiki);},900);}}
  else{err++;const s=sel;[0,1,2].forEach(k=>{s[k].classList.add('bad');});fb.className='fb no';fb.textContent='Не подходят друг к другу. Попробуй ещё!';later(()=>[0,1,2].forEach(k=>s[k].classList.remove('bad','sel')),500);sel={};}});}

/* ===================== 5. Lanterns: recognise the character ===================== */
const LPOOL=['你','我','好','叫','妈','爸'];const LDIS=['女','马','父','巴','吗','吧'];
const LCITY='<svg class="city" viewBox="0 0 800 140" preserveAspectRatio="none"><path fill="#1B0E3D" d="M0 140V92h40V70h26v22h30V50l22-18 22 18v42h34V78h40V60h18v-16h10v16h18v32h40V40l36-26 36 26v52h28V74h44v-18h26v36h34V62l20-14 20 14v30h40V80h30V58h26v34h40v48z"/><path fill="#2A1655" d="M0 140v-30h60v-14h50v14h70v-20h60v20h80v-26h40v26h90v-16h70v16h90v-24h50v24h70v-10h70v40z"/><g fill="#FFC86B" opacity=".8"><rect x="140" y="64" width="6" height="8"/><rect x="152" y="64" width="6" height="8"/><rect x="320" y="56" width="6" height="8"/><rect x="334" y="70" width="6" height="8"/><rect x="560" y="74" width="6" height="8"/><rect x="574" y="74" width="6" height="8"/><rect x="690" y="70" width="6" height="8"/></g></svg>';
function lamps(){const best=+(localStorage.getItem('zh-dz6-lamp')||0);
 sshell(`<div class="njh"><div class="hero">🏮</div><h3>Праздник фонарей</h3><p>Над городом поднимаются фонарики с иероглифами. Слушай, читай задание и лови <b>нужный</b> фонарик, пока он не улетел!</p><p>🔥 3 подряд — двойные очки · 15 заданий</p></div>
  ${best?`<p class="lead" style="text-align:center">Твой рекорд: <b>${best}</b></p>`:''}<div class="row" style="justify-content:center"><button class="btn" id="st" style="font-size:20px;padding:18px 34px">🏮 Начать</button></div>`);
 $('#st').onclick=play;
 function play(){let i=0,pts=0,hits=0,cmb=0;const N=15,miss=[];let prevT='';
  // поле строим один раз — дальше меняем только фонарики и задание, поэтому окно не прыгает
  sshell(`<div class="hud lhud"><span id="lpts">⭐ 0</span><span class="cmb" id="lcmb"></span><span id="lnum">1/${N}</span></div>
   <div class="lg" id="lg"><div class="moon"></div><div class="stars"></div><div class="stars s2"></div>${LCITY}<div class="ask" id="lask"></div><div id="lay"></div></div><div class="fb lfb" id="fb"></div>`);
  const lay=$('#lay'),ask=$('#lask'),fb=$('#fb');
  const hd=document.querySelector('.lhud');if(hd)hd.scrollIntoView({block:'start',behavior:'smooth'});
  const round=()=>{if(!document.body.contains(lay))return;if(i>=N)return end();i++;let t;do{t=LPOOL[Math.random()*LPOOL.length|0];}while(t===prevT);prevT=t;const [py,ru]=HZI[t];
   const mode=['sound','ru','py'][i%3];const others=shuffle(LPOOL.filter(x=>x!==t).concat(LDIS)).slice(0,3);const opts=shuffle([t,...others]);let lock=false;
   $('#lg').dataset.t=t;   $('#lnum').textContent=i+'/'+N;fb.className='fb lfb';fb.innerHTML='&nbsp;';
   ask.innerHTML=mode==='sound'?'<button id="rp">🔊</button> Лови то, что слышишь':mode==='ru'?`Лови: «${ru}»`:`Лови: <span class="py">${py}</span>`;
   lay.innerHTML=opts.map((x,k)=>`<button class="ln6" data-v="${x}" style="left:${13+k*24.5}%;--t:${(7-Math.min(2.5,i*.15)+k*.35).toFixed(2)}s;--sw:${(k%2?-1:1)*(3+k)}deg;animation-delay:${(k*.25).toFixed(2)}s"><i class="lt">${x}</i></button>`).join('');
   if(mode==='sound'){const rp=$('#rp');rp.onclick=()=>playW(t,rp);playW(t,rp);}
   const resolve=(b,good)=>{if(lock)return;lock=true;
    if(good){hits++;cmb++;pts+=cmb>=3?2:1;b.classList.add('ok');const r=b.getBoundingClientRect(),g=$('#lg').getBoundingClientRect();burst(r.left-g.left+r.width/2,r.top-g.top+r.height/2);fb.className='fb lfb ok';fb.innerHTML=`✓ <span class="zh" style="font-size:26px">${t}</span> ${py} — ${ru}`;playW(t);}
    else{cmb=0;miss.push(t);if(b)b.classList.add('no');const r=lay.querySelector(`[data-v="${t}"]`);if(r)r.classList.add('right');fb.className='fb lfb no';fb.innerHTML=`${b?'Это не он.':'Улетел!'} Нужен был <span class="zh" style="font-size:26px">${t}</span> ${py} — ${ru}`;}
    $('#lpts').textContent='⭐ '+pts;$('#lcmb').textContent=cmb>=3?'🔥 ×2':'';
    later(round,good?1100:2300);};
   lay.querySelectorAll('.ln6').forEach(b=>{b.onclick=()=>resolve(b,b.dataset.v===t);if(b.dataset.v===t)b.addEventListener('animationend',e=>{if(e.animationName==='rise')resolve(null,false);});});};
  // салют при поимке
  function burst(x,y){const g=$('#lg');if(!g)return;const cols=['#FFE27A','#FF8A5B','#7CF5C4','#FF5C8A','#9AD8FF'];for(let k=0;k<18;k++){const d=document.createElement('i');d.className='spark';const a=k/18*Math.PI*2,r=60+Math.random()*50;d.style.cssText=`left:${x}px;top:${y}px;background:${cols[k%5]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;g.appendChild(d);setTimeout(()=>d.remove(),900);}}
  round();
  function end(){if(pts>best)try{localStorage.setItem('zh-dz6-lamp',pts)}catch(e){}fin('lamp',hits,N,{pts,miss:[...new Set(miss)]});

 const end=()=>{const full=lives>0,rec=pts>best;if(rec)try{localStorage.setItem('zh-dz6-best',pts)}catch(e){}
  const ov=q('#dov');ov.classList.remove('hide');ov.innerHTML=`<h2>${full?'Крепость спасена! 🏯':'Дракон устал 😴'}</h2><div class="big">⭐ ${pts}</div><p>${rec?'Новый рекорд! 🏆 ':''}Угадано ${hits} из ${i}.${miss.length?' Можно повторить для закрепления: '+[...new Set(miss)].join(', '):''}</p><button id="dagain">↺ Ещё раз</button>`;
  q('#dagain').onclick=()=>{ov.classList.add('hide');i=0;pts=0;hits=0;cmb=0;lives=3;miss=[];q('#dpts').textContent='⭐ 0';q('#dlv').textContent='🏮🏮🏮';round();};
  if(KAT.onResult)KAT.onResult('dragon',{hits,of:i,pts,miss:[...new Set(miss)]});};
 stage.querySelectorAll('.dkeys button').forEach(b=>b.onclick=()=>{if(cur&&!cur.done)answer(b);});
 q('#dsay').onclick=()=>{if(cur)playT(cur.s);};
 q('#dgo').onclick=()=>{q('#dov').classList.add('hide');K.ac&&K.ac();later(round,400);};
 stage._dbg={cur:()=>cur&&!cur.done?cur.ini:null};
 return {destroy(){alive=false;cancelAnimationFrame(raf);timers.forEach(clearTimeout);}};}});
function dragon(){
 sshell(`<p class="lead">Защити крепость! Слушай слог и жми его инициаль. На телефоне игра сама откроется на весь экран — поверни телефон боком.</p><div id="kg"></div>`);

/* ===================== Final 2: the character ninja (canvas) ===================== */
const NIMG={};(()=>{['a','b'].forEach(k=>{const i=new Image();i.onload=()=>{NIMG[k]=i;};i.src='img/ninja-'+k+'.png';});})();
const NORD=[{t:'Руби: <span class="zh">妈</span>',ok:c=>c==='妈'},{t:'Руби: «папа»',ok:c=>c==='爸'},{t:'Руби всё с ключом <span class="zh">女</span>',ok:c=>c==='妈'||c==='好'},{t:'Руби: <span class="py">wǒ</span>',ok:c=>c==='我'},
 {t:'Руби всё с ключом <span class="zh">口</span>',ok:c=>'叫吗吧'.includes(c)},{t:'Руби: «ты»',ok:c=>c==='你'},{t:'Руби всё со звуком ma',ok:c=>'妈吗马'.includes(c)},{t:'Руби всё со звуком ba',ok:c=>'爸吧巴'.includes(c)}];
const NPOOL=[...'你我好叫妈爸吗吧马巴女父'];
function ninja(){const best=+(localStorage.getItem('zh-dz6-nj')||0);
 sshell(`<div class="njh">${NIMG.a?'<img class="hero" src="img/ninja-a.png" alt="">':'<div class="hero">🥷</div>'}<h3>Иероглифный ниндзя</h3><p>Вверх летят иероглифы. Наверху — приказ: что рубить. <b>Нажми на иероглиф или проведи по нему пальцем</b>, чтобы разрубить его!</p><p>Нужный иероглиф — очки и комбо. Чужой — минус жизнь ❤️ (их 5). Приказ меняется каждые 5 ударов.</p></div>
  ${best?`<p class="lead" style="text-align:center">Твой рекорд: <b>${best}</b></p>`:''}<div class="row" style="justify-content:center"><button class="btn" id="st" style="font-size:20px;padding:18px 34px">⚔️ В бой!</button></div>`);
 $('#st').onclick=play;
 function play(){sshell(`<div class="nj" id="nj"><canvas id="cv"></canvas><div class="hudin"><span id="np">⭐ 0</span><span id="nc"></span><span id="nl">❤️❤️❤️❤️❤️</span></div><div class="ord" id="no"></div><div class="cover" id="cov"><h3>3</h3></div></div><div class="fb" id="fb"></div>`);
  const box=$('#nj'),cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1);
  const fit=()=>{const r=box.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);};fit();if(innerHeight<=520)box.scrollIntoView({block:'center'});
  const items=[],halves=[],parts=[],trail=[];box._it=items;let pts=0,cmb=0,lives=5,cuts=0,good=0,bad=0,ordI=0,ordCut=0,t0=0,last=0,spawnT=0,slashT=0,slashX=0,slashY=0,over=false,miss=[];
  const orders=shuffle(NORD);let ord=orders[0];const sayOrd=()=>tryURL(AUDIO+'ru/nj'+NORD.indexOf(ord)+'.mp3');
  const setOrd=()=>{ord=orders[ordI%orders.length];$('#no').innerHTML=`${ord.t} <button class="nsay" title="Послушать">🔊</button>`;$('#no .nsay').onclick=sayOrd;sayOrd();};
  const font=Math.max(34,Math.min(54,W/9));
  const spawn=()=>{const wantOk=Math.random()<.45;let c;const okList=NPOOL.filter(ord.ok),noList=NPOOL.filter(x=>!ord.ok(x));c=(wantOk?okList:noList)[Math.random()*(wantOk?okList:noList).length|0];
   const x=W*.15+Math.random()*W*.7;items.push({c,x,y:H+40,vx:(W/2-x)*.18+(Math.random()-.5)*30,vy:-Math.sqrt(2*H*.5*H*(.62+Math.random()*.25)),r:font*.75,rot:0,vr:(Math.random()-.5)*2,ok:ord.ok(c)});};
  const burst=(x,y,col,n)=>{for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,v=80+Math.random()*260;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.7+Math.random()*.4,col});}};
  const cut=(it,ang)=>{it.dead=true;cuts++;const n={a:-1,b:1};['a','b'].forEach(s=>halves.push({c:it.c,x:it.x,y:it.y,vx:it.vx*.4+Math.cos(ang+Math.PI/2)*n[s]*140,vy:it.vy*.3-60,rot:it.rot,vr:n[s]*3,ang,side:n[s],life:1.2,ok:it.ok}));
   slashT=.25;slashX=it.x;slashY=it.y;const fb=$('#fb');
   if(it.ok){cmb++;good++;pts+=cmb>=4?2:1;ordCut++;burst(it.x,it.y,'#FFD36B',22);fb.className='fb ok';fb.innerHTML=`✓ <span class="zh" style="font-size:24px">${it.c}</span> ${HZI[it.c]?HZI[it.c][0]+' — '+HZI[it.c][1]:''}`;if(ordCut>=5){ordCut=0;ordI++;setOrd();}}
   else{cmb=0;bad++;lives--;miss.push(it.c);burst(it.x,it.y,'#FF5C8A',16);box.style.animation='quake .4s';setTimeout(()=>box.style.animation='',420);fb.className='fb no';fb.innerHTML=`Ой! <span class="zh" style="font-size:24px">${it.c}</span> — не по приказу`;}
   $('#np').textContent='⭐ '+pts;$('#nc').textContent=cmb>=4?'🔥 ×2':'';$('#nl').textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(5-Math.max(0,lives));if(lives<=0)stop();};
  let down=false,lp=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.onpointerdown=e=>{e.preventDefault();down=true;lp=pos(e);trail.length=0;trail.push({...lp,t:performance.now()});try{cv.setPointerCapture(e.pointerId)}catch(_){}
   // нажатие тоже рубит: ближайший иероглиф под пальцем
   if(!over){let best=null,bd=1e9;items.forEach(it=>{if(it.dead)return;const d=(it.x-lp.x)**2+(it.y-lp.y)**2;if(d<(it.r*1.25)**2&&d<bd){bd=d;best=it;}});if(best)cut(best,-0.6);}};
  cv.onpointermove=e=>{if(!down||over)return;const p=pos(e);trail.push({...p,t:performance.now()});
   items.forEach(it=>{if(it.dead)return;const dx=p.x-lp.x,dy=p.y-lp.y,L=dx*dx+dy*dy||1;let u=((it.x-lp.x)*dx+(it.y-lp.y)*dy)/L;u=Math.max(0,Math.min(1,u));const qx=lp.x+u*dx,qy=lp.y+u*dy;if((qx-it.x)**2+(qy-it.y)**2<it.r*it.r&&L>30)cut(it,Math.atan2(dy,dx));});lp=p;};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  const DUR=60;
  const frame=ts=>{if(!t0){t0=ts;last=ts;}const dt=Math.min(.05,(ts-last)/1000);last=ts;const el=(ts-t0)/1000;
   if(!over){spawnT-=dt;if(spawnT<=0){spawn();if(Math.random()<.35)spawn();spawnT=Math.max(1,1.8-el*.01);}if(el>=DUR)stop();}
   const g=H*.5;
   items.forEach(it=>{it.vy+=g*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.rot+=it.vr*dt;if(it.y>H+80&&it.vy>0)it.dead=true;});
   for(let k=items.length-1;k>=0;k--)if(items[k].dead)items.splice(k,1);
   halves.forEach(h=>{h.vy+=g*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;h.rot+=h.vr*dt;h.life-=dt;});for(let k=halves.length-1;k>=0;k--)if(halves[k].life<=0||halves[k].y>H+100)halves.splice(k,1);
   parts.forEach(p=>{p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;});for(let k=parts.length-1;k>=0;k--)if(parts[k].life<=0)parts.splice(k,1);
   const now=performance.now();while(trail.length&&now-trail[0].t>160)trail.shift();
   cx.clearRect(0,0,W,H);
   // ninja at the bottom
   const nk=slashT>0?'b':'a',ni=NIMG[nk];slashT=Math.max(0,slashT-dt);const nh=Math.min(130,H*.28);
   if(ni){const nw=nh*ni.width/ni.height;cx.globalAlpha=.95;cx.drawImage(ni,W/2-nw/2,H-nh-4,nw,nh);cx.globalAlpha=1;}
   else{cx.font=`${nh*.7}px serif`;cx.textAlign='center';cx.textBaseline='bottom';cx.save();cx.translate(W/2,H-6);if(slashT>0)cx.rotate(-.25);cx.fillText('🥷',0,0);cx.restore();}
   cx.textAlign='center';cx.textBaseline='middle';
   const hz=`${font}px 'LXGW WenKai GB','Noto Sans SC',sans-serif`;
   items.forEach(it=>{cx.save();cx.translate(it.x,it.y);cx.rotate(it.rot*.3);cx.beginPath();cx.arc(0,0,it.r,0,Math.PI*2);const gr=cx.createRadialGradient(-it.r*.3,-it.r*.3,2,0,0,it.r);gr.addColorStop(0,'#FFF8E1');gr.addColorStop(1,'#F5C24B');cx.fillStyle=gr;cx.shadowColor='rgba(255,210,100,.7)';cx.shadowBlur=18;cx.fill();cx.shadowBlur=0;cx.fillStyle='#2B1460';cx.font=hz;cx.fillText(it.c,0,2);cx.restore();});
   halves.forEach(h=>{cx.save();cx.globalAlpha=Math.max(0,Math.min(1,h.life));cx.translate(h.x,h.y);cx.rotate(h.rot*.3);cx.save();cx.rotate(h.ang);cx.beginPath();cx.rect(-90,h.side>0?0:-90,180,90);cx.restore();cx.clip();cx.beginPath();cx.arc(0,0,font*.75,0,Math.PI*2);cx.fillStyle=h.ok?'#B8F5DC':'#FFC2D1';cx.fill();cx.fillStyle='#2B1460';cx.font=hz;cx.fillText(h.c,0,2);cx.restore();});
   parts.forEach(p=>{cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,3.5,0,Math.PI*2);cx.fill();});cx.globalAlpha=1;
   if(trail.length>1){cx.lineCap='round';for(let k=1;k<trail.length;k++){const a=k/trail.length;cx.strokeStyle=`rgba(190,230,255,${a})`;cx.lineWidth=2+a*8;cx.shadowColor='#8FD3FF';cx.shadowBlur=12;cx.beginPath();cx.moveTo(trail[k-1].x,trail[k-1].y);cx.lineTo(trail[k].x,trail[k].y);cx.stroke();}cx.shadowBlur=0;}
   if(!over){cx.fillStyle='rgba(255,255,255,.6)';cx.fillRect(0,H-4,W*(1-el/DUR),4);}
   if(over&&!items.length&&!halves.length&&!parts.length)return end();
   RAF=requestAnimationFrame(frame);};
  const stop=()=>{if(over)return;over=true;items.forEach(it=>it.vy=Math.max(it.vy,0));};
  setOrd();let n=3;const cov=$('#cov');const cd=()=>{if(!document.body.contains(cov))return;if(n>0){cov.innerHTML=`<h3>${n}</h3><p>${ord.t}</p>`;n--;later(cd,800);}else{cov.remove();RAF=requestAnimationFrame(frame);}};cd();
  function end(){cancelAnimationFrame(RAF);RAF=0;const rec=pts>best;if(rec)try{localStorage.setItem('zh-dz6-nj',pts)}catch(e){}
   fin('ninja',good,good+bad||1,{pts,bad,miss:[...new Set(miss)]});
   sshell(`<div class="njh"><div class="hero">${lives>0?'🥷':'😵'}</div><h3>${lives>0?'Время вышло!':'Ниндзя устал'}</h3><p>Нужных ударов: <b>${good}</b> · по чужим: <b>${bad}</b></p></div><div class="res" style="text-align:center">⭐ ${pts}</div>
    <p class="lead" style="text-align:center">${rec?'Новый рекорд! 🏆':'Попробуй побить рекорд!'}</p>${miss.length?`<p class="lead">Можно повторить для закрепления: <span class="zh" style="font-size:24px">${[...new Set(miss)].join(' ')}</span></p>`:''}${doneRow}`);again(ninja);}}}

  if(d){const k=d.of?d.best/d.of:1;lv=k>=.8?3:k>=.5?2:1;txt=d.pts!=null?'⭐ '+d.pts:d.of>1?d.best+' / '+d.of:d.noMic?'на уроке':'✓';}

 const done=rows.filter(r=>r.d).length,again=rows.filter(r=>r.d&&r.lv<2);

  <div class="res">${done} / ${STEPS.length}</div><p class="lead">${done===STEPS.length?'Всё ДЗ сделано! Ты молодец 🏆':'Сделано шагов: '+done+'. Остальные ждут тебя на станциях 🙂'}</p>
