:root{
 --ink:#15131d;--ink2:rgba(28,26,40,.72);--mu:rgba(60,58,80,.56);
 --gl:rgba(255,255,255,.52);--gl2:rgba(255,255,255,.30);--gls:rgba(255,255,255,.72);
 --st:rgba(255,255,255,.75);--st2:rgba(255,255,255,.22);
 --sh:0 10px 34px rgba(60,40,140,.13),0 2px 6px rgba(60,40,140,.06);
 --ok:#1fb85a;--okbg:rgba(52,199,89,.16);--todo:#f08a00;--todobg:rgba(255,159,10,.17);
 --acc:#6a4cf5;--acc2:#e9468f;--acc3:#12a7c9;
 --shb1:rgba(255,255,255,.90);--shb2:rgba(246,242,255,.84);
 --bg:#efeaf9;--b1:#ffb3c9;--b2:#b9a6ff;--b3:#9fe3f5;--b4:#ffd9a0;
 --hz:'LXGW WenKai GB',serif;
 --sf:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
 --sfd:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
 --ink:#f6f4ff;--ink2:rgba(240,236,255,.78);--mu:rgba(225,220,250,.55);
 --gl:rgba(48,44,70,.50);--gl2:rgba(40,36,60,.32);--gls:rgba(62,58,88,.72);
 --st:rgba(255,255,255,.20);--st2:rgba(255,255,255,.05);
 --sh:0 10px 34px rgba(0,0,0,.40),0 2px 6px rgba(0,0,0,.25);
 --okbg:rgba(52,199,89,.20);--todobg:rgba(255,159,10,.20);--acc:#9c86ff;
 --shb1:rgba(52,48,74,.92);--shb2:rgba(30,27,44,.88);
 --bg:#14121c;--b1:#7a2b55;--b2:#3d2c8f;--b3:#0f5568;--b4:#6b4a1c;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sf);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.hz{font-family:var(--hz);font-weight:400}

/* ===== фон: цветные пятна под стеклом ===== */
.bgx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bgx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9;animation:fl 22s ease-in-out infinite alternate}
.bgx i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:var(--b2)}
.bgx i:nth-child(2){width:55vmax;height:55vmax;right:-22vmax;top:8vmax;background:var(--b1);animation-delay:-6s}
.bgx i:nth-child(3){width:60vmax;height:60vmax;left:-10vmax;bottom:-30vmax;background:var(--b3);animation-delay:-12s}
.bgx i:nth-child(4){width:38vmax;height:38vmax;right:-8vmax;bottom:6vmax;background:var(--b4);animation-delay:-3s}
@keyframes fl{to{transform:translate3d(4vmax,6vmax,0) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.bgx i{animation:none}}

/* ===== стекло ===== */
.g{position:relative;background:linear-gradient(150deg,var(--gls),var(--gl) 45%,var(--gl2));
 -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
 border:1px solid var(--st);border-radius:26px;
 box-shadow:var(--sh),inset 0 1px 0 var(--st),inset 0 -1px 0 var(--st2)}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(120% 60% at 12% 0%,rgba(255,255,255,.45),transparent 55%);mix-blend-mode:soft-light}

/* ===== каркас ===== */
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px)}
.demo{display:flex;align-items:center;gap:8px;justify-content:center;margin:0 auto 12px;width:max-content;max-width:100%;
 padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:#8a4b00;background:rgba(255,196,92,.55);
 border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
@media (prefers-color-scheme:dark){.demo{color:#ffd79a;background:rgba(140,90,10,.45)}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.kid{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;
 background:linear-gradient(140deg,#8b6cff,#e9468f);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.kid b{display:block;font-size:16px;line-height:1.1}.kid small{display:block;font-size:12px;color:var(--mu);font-weight:600}
.top .sp{flex:1}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.round svg{width:22px;height:22px}
h1{font-family:var(--sfd);font-size:34px;line-height:1.1;letter-spacing:-.02em;margin:14px 4px 14px;font-weight:800}

/* компактный заголовок при прокрутке */
.bar{position:fixed;z-index:20;left:50%;transform:translate(-50%,-140%);top:calc(env(safe-area-inset-top) + 8px);
 padding:10px 20px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap}
.bar.on{transform:translate(-50%,0)}

.page{display:none;animation:pin .42s cubic-bezier(.2,.8,.2,1)}
.page.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:22px 6px 9px}
.card{padding:18px;margin-bottom:12px}
.tap{transition:transform .18s ease}
.tap:active{transform:scale(.975)}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.chev{width:9px;height:15px;opacity:.35;flex:none}

/* главная карточка ДЗ */
.hero{padding:20px}
.hero .lbl{font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.02em}
.hero h2{font-size:21px;line-height:1.2;margin:4px 0 4px;font-family:var(--sfd);letter-spacing:-.01em}
.hero .due{font-size:14px;color:var(--ink2);font-weight:600}
.ring{flex:none;position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;font-family:var(--sfd);font-weight:800;letter-spacing:-.02em}
.left{margin-top:16px;padding:14px 14px 6px;border-radius:18px;background:var(--todobg)}
.left .h{font-size:14px;font-weight:800;color:var(--todo);margin-bottom:6px}
.left .t{display:flex;gap:10px;align-items:baseline;font-size:15px;font-weight:600;padding:5px 0}
.nn{flex:none;min-width:30px;height:24px;padding:0 6px;border-radius:8px;display:inline-grid;place-items:center;font-size:13px;font-weight:800;background:var(--gls);border:1px solid var(--st)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:15px;border-radius:18px;font-weight:700;font-size:16px;
 color:#fff;background:linear-gradient(135deg,#7b5cff,#5a3df0);box-shadow:0 8px 22px rgba(106,76,245,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.sec2{color:var(--acc);background:var(--gls);box-shadow:inset 0 1px 0 var(--st);border:1px solid var(--st)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{padding:14px 10px 12px;text-align:center}
.tile b{display:block;font-family:var(--sfd);font-size:26px;font-weight:800;letter-spacing:-.02em}
.tile b small{font-size:15px;color:var(--mu);font-weight:700}
.tile span{display:block;font-size:12.5px;line-height:1.25;color:var(--ink2);font-weight:600;margin-top:2px}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none;
 background:var(--gls);border:1px solid var(--st);box-shadow:inset 0 1px 0 var(--st)}
.next h3,.msg h3{margin:0;font-size:17px}
.next p,.msg p{margin:3px 0 0;font-size:14.5px;color:var(--ink2);line-height:1.4}
.msg .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.msg .who .ava{width:34px;height:34px;font-size:14px;background:linear-gradient(140deg,#12a7c9,#6a4cf5)}
.msg .who small{display:block;color:var(--mu);font-size:12.5px;font-weight:600}
.msg blockquote{margin:0;font-size:15.5px;line-height:1.5}
.feed .it{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--st2)}
.feed .it:first-child{border-top:0;padding-top:0}.feed .it:last-child{padding-bottom:0}
.feed .d{flex:none;width:52px;font-size:12.5px;font-weight:700;color:var(--mu);padding-top:2px}
.feed .ft{font-size:14.5px;line-height:1.4}
.upd{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px auto 0;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;width:max-content}
.upd small{color:var(--mu);font-weight:600}

/* списки уроков и ДЗ */
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px}
.num{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-family:var(--sfd);font-weight:800;font-size:19px;color:#fff;
 background:linear-gradient(140deg,#8b6cff,#5a3df0);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.num.miss{background:linear-gradient(140deg,#ffb24c,#f08a00)}
.li h4{margin:0;font-size:16px;line-height:1.25}
.li p{margin:2px 0 0;font-size:13px;color:var(--mu);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-top:6px}
.chip.ok{color:var(--ok);background:var(--okbg)}.chip.todo{color:var(--todo);background:var(--todobg)}.chip.inf{color:var(--acc);background:rgba(106,76,245,.13)}
.mini{height:6px;border-radius:9px;background:var(--st2);overflow:hidden;margin-top:8px;box-shadow:inset 0 0 0 1px var(--st2)}
.mini i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7b5cff,#e9468f)}
.mini i.full{background:linear-gradient(90deg,#28c76f,#1fb85a)}

/* сегменты */
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:16px;margin-bottom:14px;position:relative}
.seg button{position:relative;z-index:1;padding:10px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--ink2);transition:color .25s}
.seg button.on{color:var(--ink)}

  T:['Карточки: пиньинь','Карточки: иероглиф','Как устроены иероглифы','Блиц','Пропись','Сяо Мэй и имена','Контрольная','Инициали b p m…','z c s zh ch sh, ci chi','Крот'],
  p:{1:{s:12,of:12},2:{s:12,of:12},3:{s:5,of:6},4:{s:9,of:10},5:{x:'6 иероглифов'},6:{s:4,of:4},7:{s:4,of:4},8:{s:9,of:10,m:['p–b']},9:{s:7,of:8,m:['chi']},10:{s:19,of:20}}},
 {id:'kart',e:'🃏',t:'Карточки: наши иероглифы',sub:'你 我 好 叫 妈 爸',due:'По желанию',
  T:['Узнай иероглиф','Напиши иероглиф'],p:{1:{s:6,of:6}}},
 {id:'zv',e:'🔤',t:'Звуки китайского',sub:'Все инициали и финали',due:'По желанию',
  T:['Таблица звуков','Узнай инициаль','Предыхательный или нет','Как читается по-русски','Какая финаль','Диктант: выбери слог'],p:{}},
];
const ALL=Object.fromEntries([...HW,...EXTRA].map(h=>[h.id,h]));

/* ===== помощники ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const doneN=h=>h.T.filter((_,i)=>h.p[i+1]).length;
const pct=h=>Math.round(doneN(h)*100/h.T.length);
const leftOf=h=>h.T.map((x,i)=>[i+1,x]).filter(([n])=>!h.p[n]);
const lp=l=>l.T?Math.round(l.done.length*100/l.T.length):null;
const HZ=s=>esc(s).replace(/([㐀-鿿]+)/g,'<span class="hz">$1</span>');
const ring=(p,sz,w,c1,c2,fs)=>{const r=(sz-w)/2,C=2*Math.PI*r,id='g'+Math.random().toString(36).slice(2,7);
 return `<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
 <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="${w}"/>
 <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" style="transition:stroke-dashoffset 1s"/></svg><b style="font-size:${fs}px">${p}%</b></div>`;};
const chev='<svg class="chev" viewBox="0 0 9 15" aria-hidden="true"><path d="M1.5 1.5 7.5 7.5l-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const bar=(p)=>`<div class="mini"><i class="${p>=100?'full':''}" style="width:${p}%"></i></div>`;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400);}

/* ===== Главная ===== */

 const was=LESSONS.filter(l=>l.was).length,hwDone=HW.filter(x=>pct(x)===100).length;
 return `<h1>Главная</h1>
 <div class="g card hero tap" data-hw="dz8" role="button" tabindex="0">
  <div class="row"><div class="grow"><div class="lbl">СЕЙЧАС · ДЗ ${h.n}</div><h2>${esc(h.t)}</h2><div class="due">${esc(h.due)}</div></div>${ring(p,84,9,'#7b5cff','#e9468f',21)}</div>
  <div class="left"><div class="h">Не доделано ${lf.length} из ${h.T.length}:</div>${lf.map(([n,x])=>`<div class="t"><span class="nn">№ ${n}</span>${HZ(x)}</div>`).join('')}</div>
  <div class="btn">Все задания ДЗ ${h.n}</div>
 </div>
 <div class="tiles">
  <div class="g tile"><b>${was}<small>/${LESSONS.length}</small></b><span>урока посетил</span></div>

  <div class="g tile"><b>6</b><span>иероглифов знает</span></div>
 </div>
 <div class="sec">Следующий урок</div>
 <div class="g card next row"><div class="ico">📅</div><div class="grow"><h3>Урок 9 · понедельник, 16 ноября</h3><p>17:00 по Москве · Zoom · 60 минут<br>Нужен второй экран (телефон) для заданий</p></div></div>
 <div class="sec">Комментарий учителя</div>
 <div class="g card msg"><div class="who"><div class="ava">Д</div><div><b>Дарья</b><small>после урока 8 · 11 ноября</small></div></div>
  <blockquote>Миша отлично слышит тоны и уверенно пишет все шесть иероглифов. Пока путает на слух d и t — в ДЗ 8 это задание № 5, хорошо бы повторить его ещё раз до понедельника.</blockquote></div>
 <div class="sec">Что было недавно</div>
 <div class="g card feed">
  <div class="it"><div class="d">13 нояб</div><div class="ft">Сделал в ДЗ 8 задания № 1–3, 5–8, 10, 11</div></div>
  <div class="it"><div class="d">11 нояб</div><div class="ft">Был на уроке 8 · на уроке сделал все 3 задания</div></div>
  <div class="it"><div class="d">10 нояб</div><div class="ft">ДЗ 7 сделано полностью 🏆</div></div>
  <div class="it"><div class="d">8 нояб</div><div class="ft">Пропустил урок 7 и догнал его дома — все 10 заданий</div></div>
 </div>
 <button class="upd g tap" id="upd">↻ Обновить <small id="updt">· сегодня, 9:12</small></button>
 <div class="foot">Это пробный вариант кабинета. Ребёнок, родитель и результаты придуманы, названия уроков и заданий — настоящие из курса.</div>`;}

/* ===== Уроки ===== */
function lessons(){return `<h1>Уроки</h1>`+[...LESSONS].reverse().map(l=>{const p=lp(l),c=l.catch?ALL[l.catch]:null;
 const st=l.was?`<span class="chip ok">✓ Был на уроке</span>`:(c&&pct(c)===100?`<span class="chip todo">Пропустил</span> <span class="chip ok">✓ Догнал дома</span>`:`<span class="chip todo">Пропустил</span>`);
 return `<div class="g li tap" data-les="${l.n}" role="button" tabindex="0"><div class="num${l.was?'':' miss'}">${l.n}</div><div class="grow"><h4>${HZ(l.t)}</h4><p>${esc(l.d)}${p!=null?` · задания на уроке ${l.done.length} из ${l.T.length}`:''}</p>${st}</div>${chev}</div>`;}).join('');}

/* ===== ДЗ ===== */
let dzSeg=0;
function dz(){const one=h=>{const p=pct(h),lf=leftOf(h).length;
  return `<div class="g li tap" data-hw="${h.id}" role="button" tabindex="0">${h.n?`<div class="num">${h.n}</div>`:`<div class="ico">${h.e}</div>`}<div class="grow"><h4>${h.n?'ДЗ '+h.n+' · ':''}${HZ(h.t)}</h4><p>${HZ(h.sub||h.due)}</p>
  ${p===100?`<span class="chip ok">✓ Всё сделано</span>`:p===0?`<span class="chip inf">Ещё не начинал</span>`:`<span class="chip todo">Не доделано: ${lf}</span>`}${bar(p)}</div><div style="font-weight:800;font-size:15px;min-width:44px;text-align:right">${p}%</div></div>`;};
 return `<h1>Домашние задания</h1>
 <div class="g seg${dzSeg?' r':''}" id="seg"><div class="pill"></div><button class="${dzSeg?'':'on'}" data-s="0">Домашние</button><button class="${dzSeg?'on':''}" data-s="1">Дополнительно</button></div>
 <div>${(dzSeg?EXTRA:HW).map(one).join('')}</div>`;}

/* ===== Успехи ===== */
const SK=[['Тоны',88,'Различает все 4 тона на слух, знает, как меняется 3-й тон рядом с другим 3-м и с 4-м.'],
 ['Инициали b p m f d t n l g k h',90,'Почти не ошибается. Иногда путает d и t на слух.'],
 ['Инициали z c s zh ch sh',72,'Знает все шесть. Нужно закрепить: ci читается «цы», chi — «чшы».'],
 ['Финали a o e i u ü',95,'Читает и слышит уверенно.'],
 ['Иероглифы',92,'Узнаёт все 6 пройденных, пишет по памяти с правильным порядком черт.']];
const HZS=[['你','nǐ','ты',1],['我','wǒ','я',1],['好','hǎo','хорошо',1],['叫','jiào','звать',1],['妈','mā','мама',1],['爸','bà','папа',0]];
function skills(){return `<h1>Успехи</h1>
 <div class="g card">${SK.map(([t,p,d])=>`<div class="sk"><div class="h">${esc(t)}<span>${p}%</span></div>${bar(p)}<p>${esc(d)}</p></div>`).join('')}</div>
 <div class="sec">Иероглифы, которые знает</div>
 <div class="hzg">${HZS.map(([c,py,ru,w])=>`<div class="g hzc"><div class="c">${c}</div><div class="py">${py}</div><div class="ru">${ru}</div><div class="dots"><span>узнаёт</span><span class="${w?'':'w'}">${w?'пишет':'учит'}</span></div></div>`).join('')}</div>
 <div class="sec">Может сказать по-китайски</div>
 <div class="g card">
  <div class="ph"><div class="zh">你好！</div><div class="tr"><b>Привет!</b></div></div>
  <div class="ph"><div class="zh">我叫…</div><div class="tr"><b>Меня зовут…</b></div></div>
  <div class="ph"><div class="zh py2">nǐ ne?</div><div class="tr"><b>А тебя?</b>пока только на слух</div></div>
  <div class="ph"><div class="zh">我妈妈叫…</div><div class="tr"><b>Мою маму зовут…</b></div></div>
  <div class="ph"><div class="zh">我爸爸叫…</div><div class="tr"><b>Моего папу зовут…</b></div></div>
 </div>
 <div class="sec">Как помочь дома</div>
 <div class="g card">
  <div class="tip"><div class="e">👂</div><div><b>Слух d — t</b><span>Попросите Мишу ещё раз пройти ДЗ 8, задание № 5. Это 5 минут.</span></div></div>
  <div class="tip"><div class="e">🗣️</div><div><b>Расскажи о себе</b><span>Попросите сказать по-китайски, как его зовут и как зовут маму и папу. Китайский знать не нужно — просто послушайте.</span></div></div>
  <div class="tip"><div class="e">✍️</div><div><b>Иероглиф 爸</b><span>Пусть напишет его пальцем в «Карточках» (задание № 2) — это последний, который он пока пишет с подсказкой.</span></div></div>
 </div>`;}

/* ===== шторки: ДЗ, урок, профиль ===== */
function taskList(h){const p=pct(h),d=doneN(h),lf=leftOf(h);
 const rows=h.T.map((x,i)=>{const n=i+1,r=h.p[n];const sc=r?(r.x?r.x:`${r.s} из ${r.of}`):'';
  return `<div class="t${r?'':' no'}"><span class="nn">${n}</span><div class="nm">${HZ(x)}${r?`<small>${esc(sc)}</small>`:''}</div><span class="mk ${r?'ok':'no'}"><i>${r?'✓':'!'}</i>${r?'сделал':'не сделал'}</span></div>`;}).join('');
 const det=h.T.map((x,i)=>{const r=h.p[i+1];if(!r)return '';return `<div><b>№ ${i+1} ${HZ(x)}</b>: ${r.x?esc(r.x):`${r.s} из ${r.of}`}${r.m&&r.m.length?` · путал: ${r.m.map(HZ).join(', ')}`:' · без ошибок'}</div>`;}).join('');
 const rep=[...new Set(Object.values(h.p).flatMap(r=>r.m||[]))];
 return `<div class="pbig">${ring(p,64,7,'#7b5cff','#e9468f',16)}<div class="bar2"><span>Сделано ${d} из ${h.T.length} заданий</span>${bar(p)}</div></div>
 ${lf.length?`<div class="note">Осталось доделать: <b>${lf.map(([n])=>'№ '+n).join(', ')}</b>. Номера те же, что у ребёнка в задании.</div>`:`<div class="note">🏆 Все задания сделаны!</div>`}
 <div class="tl">${rows}</div>
 ${rep.length?`<div class="note" style="background:var(--todobg)">Можно повторить для закрепления: ${rep.map(HZ).join(', ')}</div>`:''}
 <details class="dt"><summary>Подробно: как сделано каждое задание</summary><div class="dl">${det||'<div>Пока ничего не сделано.</div>'}</div></details>`;}
function openHw(id){const h=ALL[id];openSheet(h.n?`ДЗ ${h.n} · ${h.t}`:h.t,h.due,taskList(h));}
function openLes(n){const l=LESSONS.find(x=>x.n===n),hw=HW.find(h=>h.n===n),c=l.catch?ALL[l.catch]:null;let b='';
 b+=`<div class="h3s">Что прошли</div><ul class="topics">${l.topics.map(t=>`<li>${HZ(t)}</li>`).join('')}</ul>`;
 if(!l.was){b+=`<div class="note">Миша пропустил этот урок. Учитель дал «Догоняем урок ${n}» — тот же материал дома, по шагам.</div>`;
  if(c)b+=`<div class="h3s">Догоняем урок ${n}</div>`+taskList(c);}
 else if(l.T){const p=lp(l);b+=`<div class="h3s">Задания на уроке</div><div class="pbig">${ring(p,64,7,'#7b5cff','#e9468f',16)}<div class="bar2"><span>Сделано ${l.done.length} из ${l.T.length}</span>${bar(p)}</div></div>
  <div class="tl">${l.T.map((x,i)=>{const ok=l.done.includes(i+1);return `<div class="t${ok?'':' no'}"><span class="nn">${i+1}</span><div class="nm">${HZ(x)}</div><span class="mk ${ok?'ok':'no'}"><i>${ok?'✓':'!'}</i>${ok?'сделал':'не успел'}</span></div>`;}).join('')}</div>`;}
 else b+=`<div class="note">На этом уроке задания делали вместе со всеми на экране, отдельной страницы заданий не было.</div>`;
 if(hw)b+=`<div class="h3s">Домашнее задание</div><div class="g li tap" data-hw="${hw.id}" role="button" tabindex="0" style="margin:0"><div class="num">${hw.n}</div><div class="grow"><h4>ДЗ ${hw.n} · ${HZ(hw.t)}</h4>${bar(pct(hw))}</div><b>${pct(hw)}%</b></div>`;
 openSheet(`Урок ${n} · ${l.t}`,l.d+(l.was?' · был на уроке':' · пропустил'),b);}
function openProf(){openSheet('Анна Сергеевна','Мама Миши',`
 <div class="h3s">Ребёнок</div><div class="g li" style="margin:0"><div class="ava" style="width:46px;height:46px">М</div><div class="grow"><h4>Миша, 12 лет</h4><p>Группа «Дети» · пн и ср, 17:00 по Москве</p></div></div>
 <div class="h3s">Связь с учителем</div>
 <button class="btn" data-demo="Здесь откроется чат с учителем">💬 Написать Дарье</button>
 <div class="h3s">Уведомления</div>
 <div class="g card" style="padding:4px 16px">
  <div class="set">Новое ДЗ<button class="tg on" aria-label="Новое ДЗ" aria-pressed="true"></button></div>
  <div class="set">Напоминание за день до урока<button class="tg on" aria-label="Напоминание" aria-pressed="true"></button></div>
  <div class="set">Комментарий учителя<button class="tg on" aria-label="Комментарий" aria-pressed="true"></button></div>
  <div class="set">ДЗ не доделано накануне урока<button class="tg" aria-label="ДЗ не доделано" aria-pressed="false"></button></div>
 </div>
 <div class="note">🧪 Пробный вариант: родитель и ребёнок придуманы, кнопки показывают, как это будет работать.</div>`);}

/* шторка: открыть / закрыть / потянуть вниз */
const sw=$('#sw'),sh=$('#sheet');let lastFocus=null;
function openSheet(t,s,b){$('#sht').innerHTML=HZ(t);$('#shs').textContent=s||'';$('#sb').innerHTML=b;$('#sb').scrollTop=0;lastFocus=document.activeElement;
 sw.classList.add('on');sw.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.body.classList.add('so');setTimeout(()=>$('#shx').focus({preventScroll:true}),60);}
function closeSheet(){sw.classList.remove('on');sw.setAttribute('aria-hidden','true');sh.style.transform='';document.body.style.overflow='';document.body.classList.remove('so');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
$('#dim').onclick=closeSheet;$('#shx').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sw.classList.contains('on'))closeSheet();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();}});
(()=>{let y0=null,dy=0;const st=e=>{y0=(e.touches?e.touches[0]:e).clientY;dy=0;sh.classList.add('drag');};
 const mv=e=>{if(y0==null)return;dy=Math.max(0,(e.touches?e.touches[0]:e).clientY-y0);sh.style.transform=`translate(-50%,${dy}px)`;};
 const en=()=>{if(y0==null)return;y0=null;sh.classList.remove('drag');sh.style.transform='';if(dy>110)closeSheet();};
 ['grab','shd'].forEach(id=>{const el=$('#'+id);el.addEventListener('touchstart',st,{passive:true});el.addEventListener('mousedown',e=>{if(e.target.closest('button'))return;st(e);});});
 window.addEventListener('touchmove',mv,{passive:true});window.addEventListener('mousemove',mv);
 window.addEventListener('touchend',en);window.addEventListener('mouseup',en);})();

/* ===== вкладки ===== */
const PAGES={home,les:lessons,dz,sk:skills},TITLE={home:'Главная',les:'Уроки',dz:'Домашние задания',sk:'Успехи'};
let cur='home';
function show(t,anim){cur=t;const i=Object.keys(PAGES).indexOf(t);
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));const pg=$('#p-'+t);pg.innerHTML=PAGES[t]();pg.classList.add('on');
 document.querySelectorAll('.tabs button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false');});
 $('#lens').style.transform=`translateX(${i*100}%)`;$('#bar').textContent=TITLE[t];
 if(anim)window.scrollTo({top:0});onScroll();try{localStorage.setItem('rd-tab',t);}catch(e){}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.t!==cur)show(b.dataset.t,1);else window.scrollTo({top:0,behavior:'smooth'});});
document.addEventListener('click',e=>{const a=e.target.closest('[data-hw]');if(a){openHw(a.dataset.hw);return;}
 const l=e.target.closest('[data-les]');if(l){openLes(+l.dataset.les);return;}
 const s=e.target.closest('#seg button');if(s){dzSeg=+s.dataset.s;$('#seg').classList.toggle('r',!!dzSeg);s.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===s));
  setTimeout(()=>{$('#p-dz').innerHTML=dz();},230);return;}
 const g=e.target.closest('.tg');if(g){g.classList.toggle('on');g.setAttribute('aria-pressed',g.classList.contains('on'));return;}
 const d=e.target.closest('[data-demo]');if(d){toast(d.dataset.demo+' (в пробном варианте не работает)');return;}
 if(e.target.closest('#upd')){$('#updt').textContent='· сегодня, '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});toast('Данные обновлены');return;}});
$('#prof').onclick=openProf;
function onScroll(){$('#bar').classList.toggle('on',window.scrollY>70);}
window.addEventListener('scroll',onScroll,{passive:true});
let t0='home';try{const v=localStorage.getItem('rd-tab');if(v&&PAGES[v])t0=v;}catch(e){}
show(t0,0);
</script>
