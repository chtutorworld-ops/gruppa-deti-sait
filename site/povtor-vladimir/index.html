:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:34px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:19px;font-weight:800;color:var(--ink);line-height:1.15}

.wch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wch span{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--han);font-size:30px;color:var(--ac2)}
.wch span.cur{box-shadow:0 0 0 3px var(--ac)}.wch span.ok{background:#DDF5EC;color:#14855E}
.hint2{font-size:14.5px;font-weight:700;color:var(--mu)}
.chz{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:12px}
.chz .say:after{font-size:22px}.chz .zh{font-size:110px;line-height:1;color:var(--ac2)}
.chz .py{font-size:26px;color:var(--t3)}.chz small{display:block;font-size:15px;font-weight:700;color:var(--mu);line-height:1.4}
@media(max-width:600px){.chz .zh{font-size:84px}}
.bigname{font-family:var(--han);font-size:60px;color:var(--ac2);line-height:1.15;text-align:center;margin-top:6px}
.bigname+.py{text-align:center;font-size:24px}
.xm{display:grid;gap:12px;margin-top:14px}
.xm .ln{display:flex;gap:10px;align-items:flex-end}
.xm .ln.me{flex-direction:row-reverse}
.xm .av{flex:none;width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(43,50,112,.2)}
.xm .av.me{display:grid;place-items:center;background:var(--t2);color:#fff;font:900 22px Nunito}
.xm .bb{padding:12px 16px;border-radius:20px 20px 20px 6px;background:#fff;max-width:78%;text-align:left;box-shadow:0 4px 10px rgba(43,50,112,.08)}
.xm .me .bb{border-radius:20px 20px 6px 20px;background:#E3E8FF}
.xm .bb .zh{font-size:28px;color:var(--ink);line-height:1.25}.xm .bb .py{display:block;color:var(--ac);font-size:16px}.xm .bb small{display:block;color:var(--mu);font-weight:700;font-size:13.5px}
.xm .bb .nw{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--t4);border-radius:8px;padding:2px 7px;margin-bottom:4px}
.mic{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;margin:16px auto 4px;font-size:42px;background:var(--bg);box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2);transform:scale(var(--lvl,1));transition:transform .08s}
.mic.rec{background:#FFE3EB;box-shadow:0 0 0 6px rgba(255,92,138,.35)}.mic.busy{opacity:.5}
.chn{display:grid;gap:10px;margin-top:16px}
.chn .card{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chn .card>b{width:30px;height:30px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:15px}
.ztab{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ztab button{padding:14px 4px 10px;border-radius:20px;display:grid;justify-items:center;gap:2px}
.ztab b{font-family:Nunito;font-weight:900;font-size:40px;line-height:1;color:var(--ac2)}
.ztab .ru{font-size:15px;font-weight:800;color:var(--t4)}.ztab small{font-size:12.5px;font-weight:700;color:var(--mu)}
.ztab button.asp b{color:var(--t4)}.ztab button.on{box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.blk{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.blk b{color:#fff;padding:3px 9px;border-radius:9px;letter-spacing:.04em}

async function toPCM(ab){const buf=await new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});
 const sr=16000,len=Math.ceil(buf.duration*sr);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);
 const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start();const r=await oc.startRendering();return r.getChannelData(0);}
function yin(x,sr){const W=512,tmin=Math.floor(sr/550),tmax=Math.floor(sr/65),d=new Float32Array(tmax+1);
 for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
 let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
 for(let t=tmin;t<tmax;t++){if(d[t]<0.15){while(t+1<tmax&&d[t+1]<d[t])t++;const a=d[t-1],b=d[t],c=d[t+1],den=a+c-2*b;const p=den?t+(a-c)/(2*den):t;return [sr/p,b];}}
 return [0,1];}
// melody of the whole word: pitched frames only, gaps between syllables kept as gaps
function melody(pcm){const sr=16000,hop=160,F=512+Math.floor(sr/65)+2;let mx=0;const rms=[];
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<512;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/512);rms.push(r);if(r>mx)mx=r;}
 const thr=Math.max(0.01,mx*0.12),f=[];let k=0;
 for(let i=0;i+F<pcm.length;i+=hop,k++){const [v,ap]=rms[k]>=thr?yin(pcm.subarray(i,i+F),sr):[0,1];f.push(v>65&&v<550&&ap<0.2?v:0);}
 for(let i=0;i<f.length;i++){if(!f[i])continue;const nb=[];for(let d=1;d<=5;d++){if(f[i-d])nb.push(f[i-d]);if(f[i+d])nb.push(f[i+d]);}
  if(!nb.length){f[i]=0;continue;}nb.sort((p,q)=>p-q);if(Math.abs(12*Math.log2(f[i]/nb[nb.length>>1]))>5)f[i]=0;}
 let a=f.findIndex(x=>x>0),b=f.length-1;while(b>=0&&!f[b])b--;if(a<0||b-a<8)return null;
 const seg=f.slice(a,b+1),vs=seg.filter(x=>x>0).sort((p,q)=>p-q);if(vs.length<8)return null;const med=vs[vs.length>>1];
 return seg.map(x=>x>0?Math.max(-9,Math.min(9,12*Math.log2(x/med))):null);}
function melSvg(lines){const W=520,H=170,y=v=>H/2-v*(H-30)/18;let out=`<svg class="mel" viewBox="0 0 ${W} ${H}">${[-6,-3,0,3,6].map(v=>`<line x1="10" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#DDE1EA" stroke-width="1"/>`).join('')}`;
 lines.forEach(([m,col,w,dash])=>{if(!m)return;const n=m.length;let d='',pen=false;m.forEach((v,i)=>{if(v===null){pen=false;return;}const x=14+i*(W-28)/(n-1);d+=(pen?'L':'M')+x.toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true;});
  out+=`<path d="${d}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round" ${dash?'stroke-dasharray="2 9"':''}/>`;});
 return out+'</svg>';}

 add(mark((PAIRI[ini]||ini)+fin,t));add(mark(ini+fin,t===3?2:t===2?3:t===1?4:1));add(mark((PAIRI[ini]||ini)+fin,t===4?1:4));add(mark(ini+(FIN[fin]||fin),t));
 return out;}

/* ===================== Hanzi Writer ===================== */
const GRID='<svg class="grid" viewBox="0 0 100 100"><g stroke="#FFB3C8" stroke-width=".6" stroke-dasharray="2 2"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></g></svg>';
const hwOpts=sz=>({width:sz,height:sz,padding:sz*.08,showOutline:true,outlineColor:'#E1E5EE',strokeColor:'#2B3270',radicalColor:'#FF5C8A',drawingColor:'#5B6BD8',drawingWidth:Math.max(6,Math.round(sz/16)),highlightColor:'#2DBE8C',strokeAnimationSpeed:1.2,delayBetweenStrokes:250,charDataLoader:(ch,ok)=>ok(HZDATA[ch])});
// animate a small cell on click
function cellAnim(el,c){if(!window.HanziWriter||!HZDATA[c]){el.innerHTML=`<span class="zh" style="font-size:70px;display:grid;place-items:center;height:100%">${c}</span>`;return null;}
 const w=HanziWriter.create(el,c,Object.assign(hwOpts(el.clientWidth||96),{strokeAnimationSpeed:1.6,delayBetweenStrokes:150}));return w;}
// trace characters one by one; rounds = how many times each is written; cb(mistakes)
function tracer(box,chars,cb,rounds){rounds=rounds||1;const seq=[];for(let r=0;r<rounds;r++)seq.push(...chars);let k=0,mist=0,w=null;
 box.innerHTML=`<div class="wch">${seq.map((c,j)=>`<span class="n" data-j="${j}">${c}</span>`).join('')}</div><div class="wbox">${GRID}<div class="hw" data-hw></div></div>
  <p class="hint2" data-wh style="text-align:center;margin-top:8px"></p><div class="row" style="justify-content:center"><button class="btn g" data-wa>▶ Покажи порядок черт</button><button class="btn g" data-wr>↺ Заново</button></div>`;
 const wh=box.querySelector('[data-wh]');
 const one=()=>{const c=seq[k];const full=k<chars.length;box.querySelectorAll('[data-j]').forEach(s=>{s.classList.toggle('cur',+s.dataset.j===k);s.classList.toggle('ok',+s.dataset.j<k);});
  const el=box.querySelector('[data-hw]');el.innerHTML='';const sz=el.clientWidth||280;
  if(!window.HanziWriter||!HZDATA[c]){wh.textContent='Пропиши '+c+' пальцем в воздухе 🙂';later(()=>{k++;k<seq.length?one():cb(mist);},1500);return;}
  // first round: outline visible; next rounds: no outline, from memory (hint after 3 misses)
  w=HanziWriter.create(el,c,Object.assign(hwOpts(sz),{showCharacter:false,showOutline:full}));
  const quiz=()=>{wh.innerHTML=full?`Обведи <span class="zh" style="font-size:20px">${c}</span> пальцем или мышкой — по порядку черт`:`Теперь <b>по памяти</b>: напиши <span class="zh" style="font-size:20px">${c}</span> без подсказки`;
   w.quiz({showHintAfterMisses:full?2:3,highlightOnComplete:true,onMistake:()=>{mist++;},onComplete:()=>{wh.textContent='✓ Отлично!';later(()=>{k++;if(k<seq.length)one();else{box.querySelectorAll('[data-j]').forEach(s=>{s.classList.remove('cur');s.classList.add('ok');});cb(mist);}},900);}});};
  box.querySelector('[data-wa]').onclick=()=>{w.cancelQuiz();wh.textContent='Смотри порядок черт…';w.showOutline();w.hideCharacter({duration:0});w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();if(!full)w.hideOutline();quiz();},600)});};
  box.querySelector('[data-wr]').onclick=()=>{w.cancelQuiz();quiz();};
  if(full){w.animateCharacter({onComplete:()=>later(()=>{w.hideCharacter();quiz();},500)});wh.textContent='Смотри порядок черт…';}else quiz();};
 one();}
const charStep=(c,py,ru,parts,tips)=>({t:c+' — '+ru,h:()=>`${B4}<h2>${c} — ${ru}</h2>

  <div id="tr"></div><div class="fb" id="trf"></div>`,
 on:()=>tracer($('#tr'),[c],m=>{const k='w-'+({你:'ni',我:'wo',好:'hao',叫:'jiao'})[c];ST.res[k]={t:'Пропись '+c,ok:3,of:3,mist:m};keep();send(k,{t:'Пропись '+c,score:3,of:3,mist:m});
  const f=$('#trf');f.className='fb ok';f.textContent=m<=3?'✓ '+c+' прописан три раза, почти без ошибок! 🏆':'✓ '+c+' прописан три раза. Порядок черт приходит с практикой 💪';},3)});

 {t:'p или b? С выдохом и без',h:()=>`${B1}<h2>p или b? С выдохом и без</h2>

   <div class="card n"><span class="ic">🔥</span>Гадатели писали на кости вопрос, нагревали её и «читали» ответ по трещинам: будет ли дождь? будет ли урожай?</div>
  </div>
  <img class="ph" src="${IMG}bone.jpg" alt="Древняя кость быка с надписями" style="max-height:220px">
  <p class="lead">Многие древние знаки были похожи на <b>рисунки</b>. Посмотри на древний знак и угадай, что это. Потом нажми — откроется современный иероглиф.</p>
  <div class="pict">${[['ren','人','rén','человек'],['ri','日','rì','солнце'],['yue','月','yuè','луна'],['shan','山','shān','гора'],['mu','木','mù','дерево'],['kou','口','kǒu','рот']].map(([f,c,p,r])=>`<button class="n" data-open="${c}"><img src="${IMG}${f}.png" alt="древний знак"><span class="zh">${c}</span><span class="py">${p}</span><small>${r}</small></button>`).join('')}</div>
  <div class="qbox in" id="q5"></div>`,
  on:()=>{document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{b.classList.add('open');playHz(b.dataset.open,b);});
   const P=[['ri','日','солнце'],['shan','山','гора'],['ren','人','человек'],['kou','口','рот'],['mu','木','дерево'],['yue','月','луна']];const all=P.map(x=>x[1]);
   quiz('#q5','pict','Древний знак → иероглиф',P.map(([f,c,r])=>({q:`<img class="qimg" src="${IMG}${f}.png" alt="древний знак">Какой это иероглиф сейчас?`,opts:[c,...shuffle(all.filter(x=>x!==c)).slice(0,3)].map(x=>`<span class="zh" style="font-size:40px">${x}</span>`),right:`<span class="zh" style="font-size:40px">${c}</span>`,ok:`<span class="zh">${c}</span> — ${r}`})),4);}},

 {t:'Как менялась лошадь 马',h:()=>`${B2}<h2>Как менялась «лошадь» 马</h2>
  <div class="evo">${[['ma-oracle','на костях','3300 лет назад'],['ma-bronze','на бронзе','3000 лет назад'],['ma-seal','печатный','2200 лет назад']].map(([f,a,b])=>`<div class="card n"><img src="${IMG}${f}.png" alt="马 ${a}"><b>${a}</b><small>${b}</small></div>`).join('')}
   <div class="card n"><span class="zh">馬</span><b>полный</b><small>Тайвань, Гонконг</small></div>
   <div class="card n me"><button class="zh say" data-hz="马" style="background:none">马</button><b>упрощённый</b><small>мы учим этот!</small></div></div>
  <p class="lead">Голова с гривой, ноги, хвост — лошадь «повернули» вертикально, чтобы удобно писать столбиком. Потом знак становился всё проще. Мы учим <b>упрощённые</b> иероглифы, как в Китае сегодня. Помнишь слово <button class="chip n say" data-hz="马路"><span class="zh">马路</span> mǎlù</button> — «дорога», а дословно «лошадиная дорога»?</p>
  ${chk('Какие иероглифы мы учим?',['Упрощённые, как 马','Полные, как 馬','Древние, как на костях'],0,'Упрощённые иероглифы пишут в Китае сегодня.')}`},

 /* ---------- 3. radicals ---------- */
 {t:'Ключи 部首',h:()=>`${B3}<h2>Ключи — подсказки смысла</h2><div class="hz"><span class="zh">部首</span><span class="py">bùshǒu</span></div>
  <p class="lead">🔑 <b>Ключ</b> — часть иероглифа, которая подсказывает, <b>о чём он</b>. Как значок папки на компьютере: увидел 💧 — значит, что-то про воду.</p>
  <div class="rad">${[['亻','rén','человек','🧍',['你','他','们']],['口','kǒu','рот','👄',['叫','吃','喝']],['女','nǚ','женщина','👩',['好','妈','她']],['氵','shuǐ','вода','💧',['河','湖','海']]].map(([r,p,ru,e,ex])=>`<div class="card n"><div class="e">${e}</div><div class="k">${r}</div><div class="py" style="font-size:16px">${p} · ${ru}</div><div class="ex">${ex.map(c=>`<button class="n" data-hz="${c}">${c}</button>`).join('')}</div></div>`).join('')}</div>
  <h3>🔍 Слева — смысл, справа — звучание</h3>
  <p class="lead" style="margin-top:0">Во многих иероглифах две части. <b>Слева</b> часто стоит ключ — он подсказывает <b>смысл</b>. <b>Справа</b> — часть, которая подсказывает <b>звучание</b>.</p>
  <div class="lr">
   <div class="card n"><div class="big"><i>女</i>马</div><b>妈 mā — мама</b><div style="font-size:14.5px;margin-top:4px"><span style="color:var(--t4);font-weight:800">女</span> «женщина» — смысл, <b>马 mǎ</b> — звучание «ма»</div></div>
   <div class="card n"><div class="big"><i>口</i>马</div><b>吗 ma — вопрос?</b><div style="font-size:14.5px;margin-top:4px"><span style="color:var(--t4);font-weight:800">口</span> «рот» — что-то говорим, <b>马</b> — звучание «ма»</div></div>
  </div>
  ${chk('Где в иероглифе 妈 «мама» подсказка смысла?',['Слева: 女 «женщина»','Справа: 马 «лошадь»','Подсказки нет'],0,'Слева ключ 女 — смысл, справа 马 mǎ — звучание.')}`},

 {t:'Ключ-детектив',h:()=>`${B3}<h2>🕵️ Ключ-детектив</h2><div class="hz"><span class="zh">猜一猜</span><span class="py">cāi yi cāi</span></div>
  <p class="lead">Найди в каждом иероглифе ключ и угадай смысл. Нажми один раз — откроется подсказка про ключ, второй раз — ответ.</p>
  <div class="det">${[['河','hé','氵','💧 что-то про воду','река — помнишь 河马 hémǎ, «речная лошадь» = бегемот?'],['妈','mā','女','👩 что-то про женщину','мама'],['吃','chī','口','👄 что-то про рот','есть, кушать'],['你','nǐ','亻','🧍 что-то про человека','ты']].map(([c,p,r,h,a])=>`<button class="n" data-det="${c}"><span class="zh">${c}</span><span class="py" style="font-size:18px">${p}</span><span class="q1">ключ <span class="zh" style="font-size:24px">${r}</span> → ${h}</span><span class="a1">${a}</span></button>`).join('')}</div>
  ${chk('В иероглифе 湖 есть ключ 氵. О чём он, скорее всего?',['Про воду: 湖 — озеро','Про человека','Про рот: что-то сказать'],0,'氵 — вода. 湖 hú — озеро.')}`,
  on:()=>document.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>{if(b.classList.contains('half'))b.classList.add('open');else b.classList.add('half');playHz(b.dataset.det,b);})},

 {t:'Игра: найди смысл ключа',h:()=>`${B3}<h2>🎮 Игра: найди смысл ключа</h2><p class="lead">Видишь ключ — выбери значок, что он значит. Видишь значок — найди ключ. В конце — иероглифы целиком: найди в них ключ!</p><div class="qbox in" id="q6"></div>`,
  on:()=>quiz('#q6','rad','Ключи',RQ.map(([q,o,ru])=>({q:`<div class="qbig${isHz(q)?' zh':''}">${q}</div>${isHz(q)?(q.length===1&&'妈喝他海'.includes(q)?'Какой ключ в этом иероглифе? Что он значит?':'Что значит этот ключ?'):'Какой ключ подходит?'}`,opts:o.map(x=>`<span class="${isHz(x)?'zh':'em'}" style="${isHz(x)?'font-size:40px':''}">${x}</span>`),right:`<span class="${isHz(o[0])?'zh':'em'}" style="${isHz(o[0])?'font-size:40px':''}">${o[0]}</span>`,ok:`${isHz(q)?`<span class="zh">${q}</span>`:q} — ${ru}`})),2)},

 /* ---------- 4. writing ---------- */
 {t:'Правила порядка черт',h:()=>`${B4}<h2>В каком порядке писать черты</h2><div class="hz"><span class="zh">笔顺</span><span class="py">bǐshùn</span></div>
  <p class="lead">Иероглиф пишут не как попало, а <b>по правилам</b>. Нажми на клетку — иероглиф напишется сам. Следи за порядком черт.</p>
  <div class="rul">${[['三','Сверху вниз'],['川','Слева направо'],['十','Сначала горизонталь, потом вертикаль'],['人','Сначала влево, потом вправо'],['日','Сначала рамка, потом внутри, «дверь» закрываем в конце'],['小','Сначала середина, потом бока']].map(([c,t],i)=>`<div class="card n" data-rule="${c}"><div class="cell">${GRID}<div class="hw"></div></div><div><span class="k2">Правило ${i+1} · нажми ▶</span><b>${t}</b></div></div>`).join('')}</div>
  ${chk('Что пишем первым в 十?',['Горизонталь —','Вертикаль |','Неважно'],0,'Сначала горизонталь, потом вертикаль.')}
  ${chk('Как пишем 日?',['Рамка, потом внутри, дно в конце','Сначала середина, потом рамка','Снизу вверх'],0,'«Дверь» закрываем в самом конце.')}`,
  on:()=>document.querySelectorAll('[data-rule]').forEach(card=>{const el=card.querySelector('.hw');const w=cellAnim(el,card.dataset.rule);card.onclick=()=>{if(w)w.animateCharacter();};})},

 charStep('你','nǐ','ты','亻 человек + 尔 · 7 черт',[
  ['🧍','Слева ключ <span class="zh-i">亻</span> «человек»: «ты» — это человек.'],
  ['➡️','Пишем <b>слева направо</b>: сначала весь <span class="zh-i">亻</span>, потом правую часть.'],
  ['⚖️','Внизу справа: сначала <b>середина</b> (крючок), потом две точки по бокам.']]),
 charStep('我','wǒ','я','7 черт',[
  ['➖','Маленькая откидная сверху, потом <b>горизонталь</b>, и только потом вертикаль с крючком.'],
  ['↘️','Длинная косая черта с крючком — главная, она «держит» знак.'],
  ['🔴','Последняя черта — <b>точка справа вверху</b>. Не забывай её!']]),
 charStep('好','hǎo','хорошо','女 женщина + 子 ребёнок · 6 черт',[
  ['👩‍👦','<span class="zh-i">女</span> «женщина» + <span class="zh-i">子</span> «ребёнок»: мама с ребёнком — это <b>хорошо</b>.'],
  ['➡️','Слева направо: сначала <span class="zh-i">女</span>, потом <span class="zh-i">子</span>.'],
  ['↗️','Слева <span class="zh-i">女</span> узкий: последняя черта не ровная, а <b>поднимается вверх</b>.']]),
 charStep('叫','jiào','зваться','口 рот + 丩 · 5 черт',[
  ['👄','Ключ <span class="zh-i">口</span> «рот»: звать и кричать — это делает рот.'],
  ['📦','<span class="zh-i">口</span> — как коробка: левая стенка, потом верх и правая стенка одной чертой, <b>дно в конце</b>.'],
  ['⬆️','Слева <span class="zh-i">口</span> маленький и стоит повыше.']]),

 /* ---------- 5. name and 小明 ---------- */
 {t:'Моё имя по-китайски',h:()=>`${B5}<h2>Твоё имя по-китайски</h2>
  <div class="bigname">${ME.hz}</div><div class="py">${pyHtml(ME)}</div>
  <p class="lead" style="text-align:center;margin-top:6px">Владимир — <b>Fúlājīmǐ'ěr</b>. Пять иероглифов, каждый — один слог.</p>
  <div class="row" style="justify-content:center"><button class="btn g" data-hz="${ME.hz}">🔊 Моё имя</button><button class="btn g" data-hz="我叫${ME.hz}">🔊 我叫${ME.hz}</button></div>
  <div class="tip">🎶 Смотри на цвета тонов: <b style="color:var(--t2)">fú</b> 2-й, <b style="color:var(--t1)">lā jī</b> 1-й, а <b style="color:var(--t3)">mǐ ěr</b> — снова <b>3 + 3</b>! Значит, mǐ звучит как <b>mí</b>.</div>
  <h3>1. Скажи вслух</h3>
  ${recBox('rnm',[],'你好 我叫'+ME.hz)}
  <p class="lead" style="text-align:center;font-size:15px"><span class="zh-i">你好！我叫${ME.hz}。</span> nǐ hǎo! wǒ jiào Fúlājīmǐ'ěr.</p>
  <h3>2. Пропиши своё имя</h3><div id="tr"></div><div class="fb" id="trf"></div>`,
  on:()=>{bindRec('rnm',[['你好']],'你好 我叫'+ME.hz);tracer($('#tr'),[...ME.hz],m=>{ST.res.name={t:'Пропись имени',ok:1,of:1,mist:m};keep();send('name',{t:'Пропись имени',score:1,of:1,mist:m});const f=$('#trf');f.className='fb ok';f.textContent='✓ Ты прописал своё имя! '+ME.hz;});}},

 {t:'Знакомься: 小明',h:()=>`${B5}<h2>Знакомься: 小明</h2>
  <p class="lead">小明 <b>Xiǎo Míng</b> — мальчик из Китая. На уроке 5 группа с ним познакомилась. Нажимай на строчки, слушай и повторяй вслух.</p>
  <img class="ph" src="${IMG}xiaoming.jpg" alt="Китайский мальчик машет рукой и улыбается" style="max-height:240px;object-position:50% 25%">
  <div class="dlg">
   <button class="ln n" data-xm="你好！"><span class="zh">你好！</span><span><span class="py">Nǐ hǎo!</span><small>小明: Привет!</small></span></button>
   <div class="ln n r"><span class="zh">你好！</span><span><small>Ты здороваешься в ответ</small></span></div>
   <button class="ln n" data-xm="我叫小明。"><span class="zh">我叫小明。</span><span><span class="py">Wǒ jiào Xiǎo Míng.</span><small>Меня зовут Сяо Мин.</small></span></button>
   <button class="ln n" data-xm="你叫什么名字？"><span class="zh">你叫什么名字？</span><span><span class="py">Nǐ jiào shénme míngzi?</span><small>✨ новое, пока просто пойми: Как тебя зовут?</small></span></button>
   <div class="ln n r"><span class="zh">我叫${ME.hz}。</span><span><small>Ты называешь своё имя</small></span></div>
   <button class="ln n" data-xm="好！"><span class="zh">好！</span><span><span class="py">Hǎo!</span><small>Хорошо!</small></span></button>
  </div>
  ${chk('小明 спрашивает: <span class="zh-i">你叫什么名字？</span> Что ответишь?',['我叫弗拉基米尔。','你好！','好！'],0,'«Меня зовут Владимир».')}`,
  on:()=>document.querySelectorAll('[data-xm]').forEach(b=>b.onclick=()=>xmSay(b.dataset.xm,b))},

 {t:'Поговори с 小明',h:()=>`${B5}<h2>👋 Поговори с 小明</h2><p class="lead">Теперь по-настоящему: 小明 поздоровается и спросит, как тебя зовут. Отвечай <b>в микрофон</b>: нажми 🎤, скажи фразу, нажми ⏹.</p>
  <div class="xm" id="xc"></div><div id="ctl"></div>`,on:()=>xiaoming()},

 /* ---------- 6. z c s zh ch sh ---------- */
 {t:'Инициали z c s zh ch sh',h:()=>`${B6}<h2>Новые инициали: z c s zh ch sh</h2><div class="hz"><span class="zh">声母</span><span class="py">shēngmǔ</span></div>
  <p class="lead">Это последнее, что успели на уроке 5. Нажми на инициаль: прозвучит слог, которым её называют китайские школьники. Повтори вслух.</p>
  <div class="ztab">${[['z','дз','zī','без выдоха'],['c','цх','cí','с выдохом!'],['s','с','sì',''],['zh','дж','zhī','без выдоха'],['ch','чх','chī','с выдохом!'],['sh','ш','shí','']].map(([l,ru,s,n])=>`<button class="n${'c ch'.split(' ').includes(l)?' asp':''}" data-s="${s}"><b>${l}</b><span class="ru">«${ru}»</span><small>${s}${n?' · '+n:''}</small></button>`).join('')}</div>
  <div class="cards c2">
   <div class="card n"><span class="ic">👅</span><b class="h">Работает кончик языка</b>Все шесть инициалей делает <b>кончик языка</b>. В <b>z c s</b> он у передних зубов, в <b>zh ch sh</b> загибается вверх и назад.</div>
   <div class="card n"><span class="ic">💨</span><b class="h">c и ch — как p, t, k</b><b>c</b> и <b>ch</b> — с выдохом, как наши <b>p t k</b>: «цх», «чх». А <b>z</b> и <b>zh</b> — без выдоха.</div>
  </div>
  <img class="ph" src="${IMG}tongue.webp" alt="Язык: корень, спинка и кончик" style="max-height:220px;object-fit:contain;background:#fff">`},

 {t:'Важно запомнить',h:()=>`${B6}<h2>⚠️ Важно запомнить</h2><div class="hz"><span class="zh">注意</span><span class="py">zhùyì</span></div>
  <div class="cards">
   <div class="card n" style="border-left:6px solid var(--ac)"><b class="h">Ы</b>С этими шестью инициалями «i» звучит как <b>«Ы»</b>: ${['zī','cí','sì','zhī','chī','shí'].map(s=>`<button class="chip n" data-s="${s}">${s}</button>`).join(' ')}</div>
   <div class="card n" style="border-left:6px solid var(--t4)"><b class="h">💨 c и ch перед i</b>В слогах с «i» у <b>c</b> и <b>ch</b> придыхание пропадает: <b>cí</b> читаем как «ЦЫ», <b>chī</b> — как «ЧШЫ».</div>
   <div class="card n" style="border-left:6px solid var(--ok)"><b class="h">✗ o</b>Эти инициали <b>не сочетаются</b> с финалью «o»: слогов zo, co, so, zho, cho, sho нет.</div>
  </div>
  <div class="qbox in" id="q7"></div>`,
  on:()=>quiz('#q7','zcs','z c s zh ch sh',[
   {q:'Как звучит «i» в слоге <span class="ipy">zī</span>?',opts:['Как «Ы»','Как «И»','Как «Э»'],right:'Как «Ы»',ok:'zī — «дзы».'},
   {q:'Какие из этих инициалей — с выдохом?',opts:['c и ch','z и zh','s и sh'],right:'c и ch',ok:'c и ch — с выдохом, как p t k.'},
   {q:'Какого слога <b>нет</b> в китайском?',opts:['<span class="ipy">zo</span>','<span class="ipy">zi</span>','<span class="ipy">zhu</span>'],right:'<span class="ipy">zo</span>',ok:'z c s zh ch sh не сочетаются с «o».'},
   {play:[urlS('chī')],q:'Послушай. Какой слог прозвучал?',opts:['<span class="ipy">chī</span>','<span class="ipy">zhī</span>','<span class="ipy">shī</span>'],right:'<span class="ipy">chī</span>',ok:'chī — «чшы», 吃 «есть».'},
   {play:[urlS('sì')],q:'Послушай. Какой слог прозвучал?',opts:['<span class="ipy">sì</span>','<span class="ipy">shì</span>','<span class="ipy">cì</span>'],right:'<span class="ipy">sì</span>',ok:'sì — «сы», 四 «четыре».'}],3)},

 {t:'Финиш',h:()=>{const R=Object.values(ST.res);return `<span class="part"><b style="background:var(--ok)">🏁</b> финиш</span>
  <h2>${isTest()?'Проверка пройдена':'Владимир, ты всё повторил! 🎉'}</h2>
  <p class="lead">Теперь ты знаешь всё, что группа прошла на уроках 4 и 5: тоны <b>3 + 3</b> и <b>3 + 4</b>, <span class="zh-i">你好</span> и <span class="zh-i">我叫</span>, что такое иероглифы и ключи, как писать <span class="zh-i">你 我 好 叫</span> и своё имя <span class="zh-i">${ME.hz}</span>, а ещё новые инициали z c s zh ch sh. На следующем уроке продолжим вместе!</p>
  ${R.length?`<h3>Твои результаты</h3><div class="sumr">${R.map(r=>`<div class="n"><span>${r.t}</span><b class="${r.ok>=r.of-1?'g':'y'}">${r.ok} / ${r.of}${r.ok>=r.of-1?' ✓':' · можно повторить для закрепления'}</b></div>`).join('')}</div>`:''}

/* ===================== 小明: scripted dialog, the kid speaks into the mic ===================== */
let stream=null;
async function getMicXM(){if(stream&&stream.active)return stream;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}});return stream;}
function wav16(f32,sr){const n=f32.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f32[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);}return new Blob([buf],{type:'audio/wav'});}
async function toWav(blob){const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();const src=await ac.decodeAudioData(await blob.arrayBuffer());ac.close&&ac.close();
 const len=Math.ceil(src.duration*16000);const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const oc=new OAC(1,len,16000);const b=oc.createBufferSource();b.buffer=src;b.connect(oc.destination);b.start();return wav16((await oc.startRendering()).getChannelData(0),16000);}
function talkBtn(btn,onAudio,onFail){let rec=null,chunks=[],t0=0,toggle=false,raf=0,ac=null;
 async function start(){stopAll();try{await getMicXM();}catch(e){onFail();return false;}
  chunks=[];const type=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  try{rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);}catch(e){onFail();return false;}rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start();t0=performance.now();btn.classList.add('rec');btn.textContent='⏹';
  try{const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(stream).connect(an);const d=new Uint8Array(an.fftSize);
   const loop=()=>{an.getByteTimeDomainData(d);let s=0;for(const x of d){const y=(x-128)/128;s+=y*y;}btn.style.setProperty('--lvl',(1+Math.min(.3,Math.sqrt(s/d.length)*2.5)).toFixed(3));raf=requestAnimationFrame(loop);};loop();}catch(e){}
  return true;}
 function stop(){if(!rec)return;const r=rec;rec=null;btn.classList.remove('rec');btn.textContent='🎤';cancelAnimationFrame(raf);btn.style.removeProperty('--lvl');if(ac){ac.close();ac=null;}const dur=performance.now()-t0;
  r.onstop=async()=>{if(dur<500){toast('Слишком коротко. Скажи фразу целиком.');return;}btn.classList.add('busy');
   try{const raw=new Blob(chunks,{type:r.mimeType});await onAudio(await toWav(raw),raw);}catch(e){toast('Не расслышал. Попробуй ещё раз, чуть громче.');}finally{btn.classList.remove('busy');}};r.stop();}
 btn.addEventListener('pointerdown',async e=>{e.preventDefault();if(btn.classList.contains('busy'))return;if(rec&&toggle){toggle=false;stop();return;}const ok=await start();if(!ok)return;
  const up=()=>{btn.removeEventListener('pointerup',up);btn.removeEventListener('pointercancel',up);if(performance.now()-t0<400)toggle=true;else stop();};btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);});}
const clean=t=>String(t||'').replace(/[,]/g,'，').replace(/[?]/g,'？').replace(/[!]/g,'！').replace(/[.]/g,'。').replace(/[^㐀-鿿，。？！、]/g,'').trim();
async function stt(wav){const r=await fetch(II+'/stt',{method:'POST',headers:{'Content-Type':'audio/wav'},body:wav});const j=await r.json();if(j.error)throw new Error(j.error);return clean(j.text);}
function xiaoming(){const me=ME;
 const XS=[{xm:'你好！',py:'nǐ hǎo!',ru:'Привет!'},{me:'hi',zh:'你好！',py:'nǐ hǎo!',ru:'Привет!'},
  {xm:'我叫小明。',py:'wǒ jiào Xiǎo Míng.',ru:'Меня зовут Сяо Мин.'},{xm:'你叫什么名字？',py:'nǐ jiào shénme míngzi?',ru:'Как тебя зовут?',nw:1},
  {me:'name',zh:'我叫'+me.hz+'。',py:'wǒ jiào '+me.py.join(' ')+'.',ru:'Меня зовут Владимир.'},{xm:'好！',py:'hǎo!',ru:'Хорошо!'}];
 let k=0,ok=0,log=[],notes=[],noMic=false;$('#xc').innerHTML='';
 const line=(who,st,extra)=>{const d=document.createElement('div');d.className='ln'+(who==='me'?' me':'');
  d.innerHTML=(who==='me'?'<span class="av me">В</span>':`<img class="av" src="${IMG}xiaoming.jpg" alt="小明">`)+`<div class="bb">${st.nw?'<span class="nw">✨ новая фраза</span><br>':''}<span class="zh">${st.zh||st.xm}</span>${st.py?`<span class="py">${st.py}</span>`:''}${st.ru?`<small>${st.ru}</small>`:''}${extra||''}</div>`;
  $('#xc').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return d;};
 const next=async()=>{if(!$('#xc'))return;if(k>=XS.length)return end();const st=XS[k];
  if(st.xm){const d=line('xm',st,' <button class="btn g" style="padding:4px 10px;font-size:13px;margin-top:6px">🔊</button>');log.push({who:'xm',text:st.xm});d.querySelector('button').onclick=()=>xmSay(st.xm);
   $('#ctl').innerHTML='<p class="hint2" style="text-align:center;margin-top:14px">小明 говорит…</p>';await xmSay(st.xm);await new Promise(r=>later(r,st.nw?900:450));if(!$('#xc'))return;k++;return next();}
  turn(st,0);};
 const turn=(st,tries)=>{const say1=st.zh;
  $('#ctl').innerHTML=`<div class="qbox in"><div class="hint2">Твоя очередь! Скажи:</div><div class="zh" style="font-size:34px;color:var(--ac2);margin-top:4px">${say1}</div><div class="py" style="color:var(--ac)">${st.py}</div><small style="font-weight:700;color:var(--mu)">${st.ru}</small>
   ${noMic?'':'<button class="mic" id="mic" aria-label="Говорить">🎤</button><div class="hint2">Нажми 🎤 и говори, потом ⏹</div>'}<div class="fb" id="xf"></div>
   <div class="row" style="justify-content:center"><button class="btn g" id="hl">🔊 Как сказать</button>${noMic||tries>=2?`<button class="btn" id="tp">${noMic?'Сказал вслух ✓':'Дальше →'}</button>`:''}</div></div>`;
  $('#hl').onclick=()=>playHz(say1.replace(/[！。]/g,''));
  const goOn=(text,good,note)=>{if(good)ok++;if(note)notes.push(note);log.push({who:'me',text:text||'—',ok:good});line('me',{zh:text||say1,py:'',ru:good?'✓':''});k++;later(next,500);};
  const tp=$('#tp');if(tp)tp.onclick=()=>goOn(noMic?say1:'',noMic,noMic?'без микрофона: '+(st.me==='hi'?'приветствие':'представился')+' вслух':'не распознано: '+say1);
  const mic=$('#mic');if(!mic)return;
  talkBtn(mic,async(wav)=>{let t='';try{t=await stt(wav);}catch(e){toast('Распознавание не ответило. Попробуй ещё раз.');return;}
   const fb=$('#xf');if(!t){fb.className='fb no';fb.textContent='Не расслышал. Скажи чуть громче 🙂';if(tries>=1)turn(st,tries+1);return;}
   if(st.me==='hi'){const good=/好/.test(t)&&/[你您尼泥妳]/.test(t);if(good)return goOn(t,true);
    fb.className='fb no';fb.innerHTML=`Услышал: <span class="zh">${t}</span>. ${/好/.test(t)?'Начни с 你 nǐ.':'Скажи 你好 — nǐ hǎo.'} Попробуй ещё раз!`;notes.push('привет: «'+t+'»');if(tries>=1)later(()=>turn(st,tries+1),1600);return;}
   const jiao=/叫/.test(t),hit=[...me.hz].filter(c=>t.includes(c)).length;
   if(jiao){if(hit<Math.ceil(me.hz.length/2))notes.push('имя распознано как «'+t+'»');return goOn(t,true);}
   fb.className='fb no';fb.innerHTML=`Услышал: <span class="zh">${t}</span>. Начни с <b>我叫</b> wǒ jiào — «меня зовут». Попробуй ещё раз!`;notes.push('имя: «'+t+'»');if(tries>=1)later(()=>turn(st,tries+1),1600);},
  ()=>{noMic=true;toast('Микрофон недоступен — скажи вслух и нажми кнопку');turn(st,tries);});};
 const end=()=>{ST.res.xm={t:'Разговор с 小明',ok,of:2};keep();send('xm',{t:'Разговор с 小明',score:ok,of:2,log,notes});
  $('#ctl').innerHTML=`<div class="qbox in"><div style="font-size:54px">🎉</div><div class="res" style="font-size:30px">Вы познакомились!</div><p class="lead">${ok===2?'小明 понял тебя с первого раза. 好！':'Молодец! В следующий раз скажи ещё чётче.'}</p>
   <div class="row" style="justify-content:center"><button class="btn g" id="again">↺ Ещё раз</button></div></div>`;$('#again').onclick=xiaoming;};
 next();}

function chk(q,opts,c,ex,two){const order=arrange(opts.map((o,i)=>i),c);
 return `<div class="chk in" data-c="${c}"><div class="q">${q}</div><div class="mcq ${two?'two':''}">${order.map(i=>`<button class="opt n" data-i="${i}">${opts[i]}</button>`).join('')}</div><div class="fb" data-ex="${encodeURIComponent(ex||'')}"></div></div>`;}
function bind(){document.querySelectorAll('.chk').forEach(box=>{const c=+box.dataset.c,fb=box.querySelector('.fb');let done=false;
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;
  if(+b.dataset.i===c){done=true;b.classList.add('ok');fb.className='fb ok';fb.innerHTML='✓ Верно! '+decodeURIComponent(fb.dataset.ex);}
