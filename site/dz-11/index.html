 /* «сейчас» (текущее задание, шаг): проба синий / голубой / малиновый — выбирает Дарья */
 --now:#4F8BF0; --now-tint:#E3EEFF; --now-ink:#1F4FB0;
 /* «попробуй ещё»: мягкий малиновый */
 --wrong:#E8558A; --wrong-tint:#FCE6EF; --wrong-ink:#A3124A; --wrong-a:#FFF2F7; --wrong-b:#F9D2E1;
 /* нежный лосось: «осталось сделать», пометки */
 --ok:var(--mint); --hint:var(--wrong);
 --tone-1:#1F5FD6; --tone-2:#0B7285; --tone-3:#A61E8A; --tone-4:#C2185B; --tone-0:#68688A;
 --part-mean:#7048E8; --part-read:#1971C2;
 --grid:#E4E1EF; --hole:#D9D4EE; --hole-2:#C3BCE6; --mole:#B9AEEA; --mole-2:#8E80D6;
 --sans:Onest,system-ui,sans-serif; --han:'LXGW WenKai GB','LXGW WenKai',serif;
 --r1:8px; --r2:14px; --r3:24px; --r4:999px;
 --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.zh{font-family:var(--han);font-weight:400}
.py{font-family:var(--sans);font-weight:600}
.t1{color:var(--tone-1)}.t2{color:var(--tone-2)}.t3{color:var(--tone-3)}.t4{color:var(--tone-4)}.t0{color:var(--tone-0)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== каркас экрана ===== */
.scr{min-height:100vh;min-height:100dvh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.scr.list,.scr.res,.scr.start{height:auto}
.bar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -8px}
.back{height:40px;display:flex;align-items:center;gap:2px;padding:0 14px 0 6px;border-radius:var(--r4);color:var(--accent);background:var(--surface);font-size:16px;font-weight:700;box-shadow:2px 2px 6px var(--shade-dark),-2px -2px 6px var(--shade-light);white-space:nowrap}
.back svg.i{width:22px;height:22px}
.lab{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.cnt{min-width:44px;text-align:right;padding-right:8px;font-size:15px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.head{flex:none}
.plq{display:flex;align-items:center;gap:12px;background:var(--accent-tint);border-radius:var(--r3);padding:8px 8px 8px 8px;min-height:56px}
.num{flex:none;width:40px;height:40px;border-radius:var(--r4);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;font-weight:700}
.plq h1{font-size:24px;font-weight:700;line-height:1.15;flex:1}
.help{flex:none;width:44px;height:44px;border-radius:var(--r4);background:var(--surface);color:var(--accent);font-weight:700;font-size:20px;box-shadow:2px 2px 6px var(--shade-dark)}
.sub{font-size:18px;color:var(--ink-2);margin:8px 4px 0}
.scene{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 0;position:relative}
.pult{flex:none;display:flex;flex-direction:column;gap:12px}
.fb{min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:500;border-radius:var(--r2);padding:4px 12px;transition:background .3s var(--ease)}
.fb.ok{background:var(--mint-tint);color:var(--mint-ink)}
.fb.hint{background:var(--wrong-tint);color:var(--wrong-ink)}
.fb .zh{font-size:26px;vertical-align:-3px}

/* ===== кнопки ===== */
.main{height:56px;width:100%;border-radius:var(--r3);background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s var(--ease),opacity .2s}
.main:active{transform:scale(.98)}
.main[disabled]{opacity:.45;cursor:default}
.main.soft{background:var(--surface);color:var(--accent);box-shadow:-4px -4px 12px var(--shade-light),4px 4px 12px var(--shade-dark)}
.quiet{min-height:44px;color:var(--accent);font-weight:600;font-size:17px;padding:0 8px}
.keys{display:grid;gap:12px}
.keys.k2{grid-template-columns:1fr 1fr}.keys.k3{grid-template-columns:1fr 1fr 1fr}.keys.k4{grid-template-columns:1fr 1fr 1fr 1fr}
.key{position:relative;min-height:72px;border-radius:var(--r3);background:var(--surface);border:2px solid transparent;
 box-shadow:-6px -6px 14px var(--shade-light),6px 6px 14px var(--shade-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;
 transition:transform .14s var(--ease),box-shadow .14s var(--ease),background-color .35s var(--ease),border-color .35s var(--ease)}
.key:active{transform:translateY(1px);box-shadow:inset 4px 4px 10px var(--shade-dark),inset -4px -4px 10px var(--shade-light)}
.key .zh{font-size:48px;line-height:1}
.key .ru{font-size:18px;font-weight:600}
.key .py{font-size:26px}
.key small{font-size:15px;font-weight:600;color:var(--ink-2)}
.key.ok{background:var(--mint-tint);border-color:var(--mint);box-shadow:none}
.key.ok small:not(.py){color:var(--mint-ink)}
.key small.t1{color:var(--tone-1)}.key small.t2{color:var(--tone-2)}.key small.t3{color:var(--tone-3)}.key small.t4{color:var(--tone-4)}
.key.hint{background:var(--wrong-tint);border-color:var(--wrong);box-shadow:none;animation:shake .42s var(--ease)}
.key.sel{border-color:var(--accent)}
.key[disabled]{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* звук */
.snd{width:96px;height:96px;border-radius:var(--r4);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px -8px var(--accent)}
.snd svg.i{width:44px;height:44px}
.snd.sm{width:56px;height:56px;background:var(--surface);color:var(--accent);box-shadow:-4px -4px 12px var(--shade-light),4px 4px 12px var(--shade-dark)}
.snd.sm svg.i{width:28px;height:28px}
.snd.on{animation:pulse 1s var(--ease) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ===== список заданий ===== */
.top{padding:16px 0 8px}
.top .lab{display:block;margin-bottom:4px;color:var(--accent)}
.top h1{font-size:32px;font-weight:700;line-height:1.1}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:17px;color:var(--ink-2)}
.who b{color:var(--ink)}
.prog{margin:16px 0;background:var(--surface);border-radius:var(--r3);padding:16px;box-shadow:-6px -6px 14px var(--shade-light),6px 6px 14px var(--shade-dark)}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.prog .row b{font-size:28px;color:var(--accent)}
.pbar{height:14px;border-radius:var(--r4);background:var(--accent-tint);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:var(--r4);background:var(--mint);transition:width .6s var(--ease)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{position:relative;text-align:left;min-height:112px;border-radius:var(--r3);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;
 box-shadow:-6px -6px 14px var(--shade-light),6px 6px 14px var(--shade-dark);border:2px solid transparent;transition:transform .14s var(--ease)}
.tile:active{transform:translateY(1px)}
.tile .num{width:44px;height:44px;font-size:22px}
.tile b{font-size:18px;font-weight:600;line-height:1.2}
.tile .st{position:absolute;right:12px;top:14px;font-size:15px;font-weight:700}
.tile.now{border-color:var(--now);}
.tile.now .num{background-image:none;background-color:var(--now);color:#fff}
.tile.now .st{color:var(--now-ink)}
.tile.done{background:var(--mint-tint);box-shadow:inset 3px 3px 8px rgba(11,102,80,.10)}
.tile.done .num{background:var(--mint);color:var(--mint-ink)}
.tile.done .st{color:var(--mint-ink)}
.tbadge{display:inline-block;background:var(--now-tint);color:var(--now-ink);font-weight:700;font-size:15px;border-radius:var(--r1);padding:4px 8px;margin-top:8px}
.foot{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}

/* старт */
.start .hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px 0}
.start .big{font-family:var(--han);font-size:96px;line-height:1;color:var(--accent);letter-spacing:.04em}
.start h1{font-size:32px;font-weight:700}
.start p{font-size:18px;color:var(--ink-2)}
.inp{height:56px;width:100%;border-radius:var(--r3);border:2px solid var(--accent-line);background:var(--surface);padding:0 16px;font:500 20px var(--sans);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}

/* итоги */
.res h2{font-size:24px;font-weight:700;margin:16px 0 8px}
.rl{display:grid;gap:8px}
.ri{display:flex;align-items:center;gap:12px;border-radius:var(--r2);padding:12px;font-size:18px;font-weight:600}
.ri .num{width:36px;height:36px;font-size:18px}
.ri.y{background:var(--mint-tint)}.ri.y .num{background:var(--mint);color:var(--mint-ink)}
.ri.x{background:var(--salmon-tint)}.ri.x .num{background-image:none;background-color:var(--salmon-tint);color:var(--salmon-ink);box-shadow:inset 0 0 0 2px var(--salmon)}
.ri small{display:block;font-size:15px;font-weight:500;color:var(--ink-2)}
.ri .go{margin-left:auto;color:var(--accent);font-weight:700;min-height:44px;padding:0 8px}

/* ===== задание 1: пропись ===== */
.wbox{position:relative;width:min(100%,46dvh,420px);aspect-ratio:1;background:var(--surface);border-radius:var(--r3);box-shadow:-6px -6px 14px var(--shade-light),6px 6px 14px var(--shade-dark)}
.wbox svg.g{position:absolute;inset:0;width:100%;height:100%}
.wbox .hw{position:absolute;inset:0}
.wcap{display:flex;align-items:center;gap:16px}
.wcap .zh{font-size:56px;line-height:1}
.wcap .py{font-size:28px}
.wcap .ru{font-size:18px;color:var(--ink-2);font-weight:600}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps3 span{text-align:center;font-size:15px;font-weight:700;border-radius:var(--r1);padding:8px 4px;background:var(--accent-tint);color:var(--ink-2)}
.steps3 span.on{background:var(--now-tint);color:var(--now-ink);box-shadow:inset 0 0 0 2px var(--now)}
.steps3 span.ok{background:var(--mint-tint);color:var(--mint-ink)}

/* ===== задание 2: фото ===== */
.photo{height:min(40dvh,320px);aspect-ratio:3/4;border-radius:var(--r3);object-fit:cover;background:var(--accent-tint)}
.who2{font-size:22px;font-weight:700}

/* ===== задание 3 ===== */
.ru-big{font-size:44px;font-weight:700;color:var(--ink);text-align:center;line-height:1.1}
.ru-big small{display:block;font-size:18px;font-weight:600;color:var(--ink-2);margin-top:8px}
.key.w .zh{font-size:40px}

/* ===== задание 4–5: слух ===== */
.syl{font-size:64px;font-weight:700;min-height:80px;letter-spacing:.02em}
.slots{display:flex;gap:8px;align-items:center}
.slot{min-width:72px;height:72px;border-radius:var(--r2);border:2px dashed var(--accent-line);display:grid;place-items:center;font-size:32px;font-weight:700;padding:0 8px;background:var(--surface)}
.slot.on{border-style:solid;border-color:var(--now);background:var(--now-tint)}
.slot.ok{border-style:solid;border-color:var(--mint);background:var(--mint-tint)}
.tk{font-size:15px;font-weight:700;color:var(--ink-2)}
.key .tm{font-size:40px;font-weight:700;line-height:1}

/* ===== задание 6: крот ===== */
.field{width:100%;flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:8px;border-radius:var(--r3);background:var(--accent-tint)}
.hole{position:relative;overflow:hidden;border-radius:var(--r3);display:flex;align-items:flex-end;justify-content:center;min-height:88px}
.hole::after{content:'';position:absolute;left:6%;right:6%;bottom:8%;height:22%;border-radius:50%;background:var(--hole-2);z-index:0}
.mole{position:absolute;left:50%;bottom:16%;width:84%;max-width:132px;transform:translate(-50%,110%);transition:transform .26s var(--ease);z-index:1;display:flex;flex-direction:column;align-items:center}
.mole.up{transform:translate(-50%,0)}
.mole svg{width:70%;height:auto;display:block}
.mole .pl{margin-top:-14%;background:var(--surface);border-radius:var(--r2);padding:4px 8px;font-size:22px;font-weight:700;min-width:84%;text-align:center;box-shadow:0 2px 6px var(--shade-dark);border:2px solid transparent;transition:background-color .2s,border-color .2s}
.mole.hit .pl{background:var(--mint-tint);border-color:var(--mint)}
.mole.bad .pl{background:var(--wrong-tint);border-color:var(--wrong)}
.hole .lip{position:absolute;left:4%;right:4%;bottom:0;height:14%;background:var(--accent-tint);z-index:2;border-radius:0 0 var(--r3) var(--r3)}
.target{font-size:24px;font-weight:700;text-align:center}
.target .fin{display:inline-block;background:var(--now-tint);color:var(--now-ink);box-shadow:inset 0 0 0 2px var(--now);border-radius:var(--r2);padding:2px 12px;margin-left:4px}
.hud{display:flex;gap:8px;justify-content:center}
.hud span{background:var(--surface);border-radius:var(--r4);padding:4px 12px;font-size:16px;font-weight:700;box-shadow:2px 2px 6px var(--shade-dark)}
.pause-ov{position:absolute;inset:0;background:rgba(248,246,242,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;border-radius:var(--r3);text-align:center;padding:16px}
.pause-ov b{font-size:24px}

/* ===== задание 7: мемори ===== */
.mem{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px}
.mc{aspect-ratio:3/4;border-radius:var(--r2);position:relative;perspective:600px;min-height:64px}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform .4s var(--ease),background-color .3s;padding:4px;text-align:center}
.mc .ba{background:var(--accent);color:var(--accent-ink);font-family:var(--han);font-size:28px;box-shadow:3px 3px 8px var(--shade-dark)}
.mc .fa{background:var(--surface);transform:rotateY(180deg);box-shadow:3px 3px 8px var(--shade-dark);border:2px solid transparent}
.mc .fa.zh{font-size:34px}.mc .fa.ru{font-size:17px;font-weight:700;line-height:1.1}
.mc.up .ba{transform:rotateY(180deg)}.mc.up .fa{transform:rotateY(0)}
.mc.ok .fa{background:var(--mint-tint);border-color:var(--mint)}
.mc.no .fa{background:var(--wrong-tint);border-color:var(--wrong)}

/* вспомогательная панель «?» */
.sheet{position:fixed;inset:0;background:rgba(24,24,56,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:560px;border-radius:var(--r3) var(--r3) 0 0;padding:24px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px;font-size:18px}
.sheet h3{font-size:24px}
.teacher{display:inline-block;margin-top:8px;background:var(--salmon-tint);color:var(--salmon-ink);font-weight:700;font-size:15px;border-radius:var(--r1);padding:4px 8px}
.fin-box{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.fin-box .bigc{width:96px;height:96px;border-radius:var(--r4);background:var(--mint-tint);display:grid;place-items:center;color:var(--mint-ink)}
.fin-box .bigc svg.i{width:52px;height:52px;stroke-width:2.4}
.fin-box h2{font-size:28px}
.fin-box p{font-size:18px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips span{border-radius:var(--r1);padding:4px 10px;font-size:18px;font-weight:600;background:var(--mint-tint)}
.chips span.x{background:var(--salmon-tint)}
.chips .zh{font-size:28px}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-140%);visibility:hidden;background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r2);font-size:16px;transition:transform .3s var(--ease);z-index:30;max-width:90vw}
.toast.on{transform:translate(-50%,0);visibility:visible}
.fade{animation:fin .32s var(--ease)}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== компьютер: две колонки ===== */
@media (min-width:900px){
 .scr{max-width:1200px;padding:0 32px 24px}
 .scr.task{display:grid;grid-template-columns:58fr 42fr;grid-template-rows:56px auto 1fr auto;grid-template-areas:"bar bar" "scene head" "scene fbx" "scene pult";column-gap:48px;height:100dvh}
 .bar{grid-area:bar;height:56px;margin:0}
 .head{grid-area:head;padding-top:24px}
 .scene{grid-area:scene}
 .pult{grid-area:pult;padding-bottom:16px}
 .plq h1{font-size:32px}
 .sub{font-size:18px}
 .key:hover{transform:translateY(-2px)}
 .key{min-height:104px}.key .zh{font-size:64px}.key.w .zh{font-size:52px}.key .py{font-size:30px}
 .fb{font-size:20px;min-height:56px}
 .wbox{width:min(100%,62dvh,480px)}
 .photo{height:min(52dvh,420px)}
 .syl{font-size:96px}
 .ru-big{font-size:64px}
 .scr.list,.scr.res,.scr.start{max-width:1100px}
 .tiles{grid-template-columns:repeat(4,1fr)}
 .tile{min-height:136px}
 .field{max-width:640px}
 .mem{max-width:560px}
}

/* ===== объёмные кнопки-таблетки (по образцу Дарьи, Uiverse/FColombati, в цветах «Индиго») ===== */
:root{
 --edge:rgba(24,24,56,.38); --drop:rgba(24,24,56,.14); --in-dark:rgba(24,24,56,.16); --in-deep:rgba(24,24,56,.30); --in-light:rgba(255,255,255,1); --in-soft:rgba(255,255,255,.30);
 --key-a:#FFFFFF; --key-b:#E9E6F5;
 --acc-a:#5D4FD0; --acc-b:#3C2FA0;
 --mint-a:#E9FBF4; --mint-b:#BFEBDB;
 --sal-a:#FFF0EB; --sal-b:#FFD2C6;
}
.key,.main,.tile,.snd,.help{
 --a:var(--key-a); --b:var(--key-b);
 background-image:linear-gradient(135deg,var(--a),var(--b));
 box-shadow:0 1px 1px -.2px var(--edge),3px 6px 5px -2px var(--drop),
  inset -1px -1px 1px 0 var(--in-dark),inset 1px 2px 2px 0 var(--in-light),inset 0 0 1px 4px var(--in-soft),inset -2px -6px 7px 1px var(--in-dark);
 transition:box-shadow .3s ease,transform .25s ease,background-image .25s ease,border-color .3s ease;
}
.main,.snd:not(.sm),.num{--a:var(--acc-a);--b:var(--acc-b)}
.main{box-shadow:0 1px 1px -.2px var(--edge),3px 6px 6px -2px var(--drop),inset 1px 2px 2px 0 var(--in-soft),inset 0 0 1px 3px var(--in-soft),inset -2px -6px 8px 0 var(--in-deep)}
.main.soft{--a:var(--key-a);--b:var(--key-b);color:var(--accent)}
.num{background-image:linear-gradient(135deg,var(--a),var(--b));box-shadow:inset 1px 2px 2px var(--in-soft),inset -1px -3px 4px var(--in-deep),0 1px 2px var(--edge)}
.key:active,.key.pressed,.main:active,.tile:active,.snd:active,.help:active{transform:scale(.975);
 box-shadow:0 0 0 0 var(--edge),inset 2px 3px 2px 0 var(--in-deep),inset -1px -1px 2px 0 var(--in-dark),inset 5px 5px 7px 0 var(--in-dark),inset 0 0 1px 6px var(--in-soft)}
.key.ok,.tile.done{--a:var(--mint-a);--b:var(--mint-b);border-color:transparent;
 box-shadow:0 1px 1px -.2px var(--edge),inset 2px 3px 3px 0 var(--in-dark),inset 1px 2px 2px 0 var(--in-light),inset 0 0 1px 4px var(--in-soft)}
.key.hint{--a:var(--wrong-a);--b:var(--wrong-b);border-color:transparent}
.tile.now{border-color:var(--now)}
@media (hover:hover){.key:hover,.main:hover,.tile:hover{transform:translateY(-1px)}}

/* ===== главная кнопка: 3D (второй образец Дарьи), сплошной индиго, низ темнее, при нажатии опускается ===== */
:root{--accent-deep:#2E2386;--accent-base:rgba(24,24,56,.16)}
.main:not(.soft){background-image:none;background-color:var(--accent);border-radius:20px;margin-bottom:6px;
 text-shadow:0 -1px 0 var(--in-deep);
 box-shadow:inset 0 1px 0 var(--in-soft),inset 0 -2px 0 var(--in-dark),0 6px 0 var(--accent-deep),0 8px 3px var(--accent-base),0 9px 6px -2px var(--drop);
 transition:transform .2s ease,box-shadow .2s ease,border-radius .2s ease}
.main:not(.soft):active{transform:translateY(4px);border-radius:16px 16px 14px 14px;
 box-shadow:inset 0 1px 0 var(--in-soft),inset 0 -2px 0 var(--in-dark),0 2px 0 var(--accent-deep),0 3px 2px var(--accent-base)}
.main:not(.soft)[disabled]{opacity:.5;transform:none}
@media (hover:hover){.main:not(.soft):hover{transform:translateY(-1px)}}

/* ===== ПРЕМИУМ-ПРОБА: спокойно, дорого. Индиго дозированно (только главное действие и «сейчас»),
   остальное — белое и тёплый светлый фон, тонкие линии, мягкие тени. Без градиентов и кислотных цветов. ===== */
:root{
 --bg:#F7F5F0; --surface:#FFFFFF; --line:rgba(23,23,47,.10); --line-2:rgba(23,23,47,.16);
 --ink:#17172F; --ink-2:#44445E; --muted:#6B6B84;
 --accent:#443C97; --accent-deep:#302870; --accent-tint:#F2F0F9; --accent-line:#D6D1EE;
 --now:var(--accent); --now-tint:var(--accent-tint); --now-ink:var(--accent);
 --mint:#BFDCCF; --mint-tint:#EDF5F1; --mint-line:#BFDCCF; --mint-ink:#2D6A56;
 --wrong:#D9A3B6; --wrong-tint:#F8ECF0; --wrong-ink:#94304F;
 --salmon:#E8C3B6; --salmon-tint:#F8EDE8; --salmon-ink:#9A4F3D;
 --grid:#E9E5DD; --hole:#E6E1D7; --hole-2:#D8D1C4; --mole:#C8C1E2; --mole-2:#A79DD0;
 --sh1:0 1px 2px rgba(23,23,47,.05),0 4px 14px -6px rgba(23,23,47,.12);
 --sh2:0 1px 2px rgba(23,23,47,.06),0 12px 28px -12px rgba(23,23,47,.22);
 --shade-dark:rgba(23,23,47,.10);
}
/* все кнопки и карточки: плоский белый, тонкая линия, мягкая тень */
.key,.tile,.snd,.help,.main.soft,.prog,.wbox,.hud span,.mc .fa,.slot,.inp{
 background-image:none!important;background-color:var(--surface)!important;
 border:1px solid var(--line)!important;box-shadow:var(--sh1)!important;text-shadow:none}
.key:active,.tile:active,.snd:active,.help:active,.main:active{transform:scale(.98);box-shadow:0 1px 2px rgba(23,23,47,.08)!important}
@media (hover:hover){.key:hover,.tile:hover{border-color:var(--line-2)!important;transform:none}}
/* главная кнопка: сплошной глубокий индиго, без 3D-низа */
.main:not(.soft){background-image:none!important;background-color:var(--accent)!important;border:0!important;border-radius:16px;margin-bottom:0;
 box-shadow:0 1px 2px rgba(42,34,112,.25),0 10px 22px -10px rgba(42,34,112,.55)!important;text-shadow:none;letter-spacing:.01em}
.main:not(.soft):active{transform:scale(.985)}
.main:not(.soft)[disabled]{opacity:1;background-color:#ECEAF2!important;color:#9A98AE;box-shadow:none!important}
.main.soft{color:var(--accent)}
/* заголовок задания: белая плашка с тонкой линией, номер — индиго */
.plq{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);border-radius:18px}
.num{background-image:none!important;background-color:var(--accent);color:#fff;box-shadow:none!important}
.tile .num{background-color:var(--accent-tint)!important;color:var(--accent)}
.tile.now{border:1.5px solid var(--accent)!important}
.tile.now .num{background-color:var(--accent)!important;color:#fff}
.tile.now .st{color:var(--accent)}
.tile.done{background-color:var(--surface)!important}
.tile.done .num{background-color:var(--mint-tint)!important;color:var(--mint-ink)}
.tile.done .st{color:var(--mint-ink)}
/* ответы: верно — едва заметная шалфейная заливка, ошибка — пыльная роза */
.key.ok{background-color:var(--mint-tint)!important;border-color:var(--mint-line)!important;color:var(--mint-ink)}
.key.hint{background-color:var(--wrong-tint)!important;border-color:var(--wrong)!important}
.fb.ok{background:var(--mint-tint);color:var(--mint-ink)}
.fb.hint{background:var(--wrong-tint);color:var(--wrong-ink)}
.snd:not(.sm){background-color:var(--accent)!important;color:#fff;border:0!important;box-shadow:0 10px 24px -10px rgba(42,34,112,.6)!important}
.pbar{background:#ECE9E2}
.pbar i,.pbar span,.pbar b{background:var(--accent)!important}
.steps3 span{background:#EFECE6;color:var(--ink-2)}
.steps3 span.on{background:var(--accent);color:#fff;box-shadow:none}
.field{background:#F1EEE8}

/* ===== крупнее и без пустоты: задания 3 и 4, плитки ===== */
.tile .st{display:flex;align-items:center;gap:4px}

.plq{background:#352D76!important;border:0!important;box-shadow:0 10px 24px -12px rgba(42,34,112,.6)!important}

.steps3 span.on{background:#F6D3C8!important;color:#8E3F2E!important}

/* ===== крот: прежняя игра из ДЗ 8 (сцена 1280×720, на весь экран) ===== */

.kst{position:relative;width:min(100%,calc((100vh - 24px) * 16 / 9));margin-left:auto!important;margin-right:auto!important;aspect-ratio:16/9;border-radius:22px;overflow:hidden;margin:14px 0;background:#191B2E;box-shadow:0 10px 30px rgba(30,35,80,.25);
 --ink:#191B2E;--ink-3:#3E4262;--muted:#6C6982;--vio:#4E4C8E;--vio-2:#33315F;--jade:#2E7F6C;--rose:#A8456A;--serif:Onest,system-ui,sans-serif;--sans:Onest,system-ui,sans-serif;--ease-out:cubic-bezier(.22,.9,.3,1)}

:root{--neu-l:#FFFFFF;--neu-d:#DCD6CC}

/* ===== жемчужные: главная кнопка, шапка, плашки заданий ===== */
.main:not(.soft),.plq,.top{position:relative;overflow:hidden;background:#352D76!important;color:rgba(255,255,255,.95)!important;border:0!important;
 box-shadow:inset 0 .3rem .9rem rgba(255,255,255,.3),inset 0 -.1rem .3rem rgba(0,0,0,.6),inset 0 -.4rem .9rem rgba(255,255,255,.4),0 14px 22px -8px rgba(53,45,118,.55),0 6px 8px -5px rgba(20,16,60,.6)!important}

/*V3START*/
/* ===== ВИД «ЖЕМЧУГ-2» (2026-11-17, по правкам Дарьи и её ссылкам dribbble):
   светлый тёплый бежевый, мягкий неоморфизм (кнопки выпуклые, поля вдавленные), без обводок.
   Палитра Дарьи: #664796 #6A6DDE #C0B1F0 #A2C5F2 #574944 #FFE4D9 #F7B2D4.
   Цвет строки звуков — только цветом букв; при нажатии кнопка заливается цветом строки.
   Лосось убран, фиолетовый — только главное действие, номер и прогресс. ===== */
:root{
 --bg:#FAF4EE; --surface:var(--bg); --nl:#FFFFFF; --nd:#E2D5C9;
 --ink:#4A3C37; --ink-2:#6E5F59; --muted:#9F908A;
 --accent:#664796; --accent-2:#6A6DDE; --accent-line:#C0B1F0;
 --grad:linear-gradient(135deg,#6A6DDE 0%,#664796 100%);
 --glow:0 12px 24px -10px rgba(102,71,150,.55),0 4px 8px -4px rgba(102,71,150,.35);
 --c1-ink:#664796; --c1-g:var(--grad);
 --c2-ink:#3F79CC; --c2-g:linear-gradient(135deg,#5E95E0 0%,#3A6FC2 100%);
 --c3-ink:#2B9A77; --c3-g:linear-gradient(135deg,#86D8BA 0%,#3FAA85 100%);
 --ok:#7FCFB2; --ok-ink:#1E7457; --ok-t:#E1F4EC;
 --bad:#E07A9E; --bad-ink:#A3214F; --bad-t:#FBE5EC;
 --mint:var(--ok); --mint-tint:var(--ok-t); --mint-ink:var(--ok-ink); --mint-line:var(--ok);
 --wrong:var(--bad); --wrong-tint:var(--bad-t); --wrong-ink:var(--bad-ink);
 --raise:8px 8px 18px var(--nd),-8px -8px 18px var(--nl);
 --raise-s:5px 5px 11px var(--nd),-5px -5px 11px var(--nl);
 --well:inset 5px 5px 11px var(--nd),inset -5px -5px 11px var(--nl);
}
html,body{background:var(--bg)!important;color:var(--ink)}

/* --- выпуклые кнопки и карточки, без рамок --- */
body .key,body .tile,body .main.soft,body .snd.sm,body .help,body .slot,body .mc .fa,body .hud span,body .back,body .wbox,body .kcard,body .tc,body .prog{
 background-image:none!important;background-color:var(--surface)!important;border:0!important;
 box-shadow:var(--raise)!important;border-radius:20px;
 transition:box-shadow .18s ease,transform .18s ease,background .25s ease,color .2s ease!important}
body .key:active,body .tile:active,body .main.soft:active,body .snd.sm:active,body .back:active,body .key.pressed{transform:none!important;box-shadow:var(--well)!important}
@media (hover:hover){body .key:hover,body .tile:hover{transform:translateY(-1px)}}
body .key small{color:var(--ink-2)}
/* верно / ошибка: кнопка мягко заливается и «утапливается», без обводки */
body .key.ok{background:var(--ok-t)!important;box-shadow:inset 4px 4px 9px rgba(30,116,87,.16),inset -4px -4px 9px rgba(255,255,255,.85)!important;color:var(--ok-ink)}
body .key.ok small:not(.py){color:var(--ok-ink)}
body .key.hint{background:var(--bad-t)!important;box-shadow:inset 4px 4px 9px rgba(163,33,79,.14),inset -4px -4px 9px rgba(255,255,255,.85)!important}
body .key.sel{box-shadow:var(--well)!important;color:var(--accent)}

/* --- главная кнопка: фиолетово-синий градиент Дарьи, мягкое свечение --- */
body .main:not(.soft){background:var(--grad)!important;color:#fff!important;border:0!important;border-radius:999px!important;height:58px;
 box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.25)!important;text-shadow:none;font-size:19px;font-weight:600;letter-spacing:.01em;margin-bottom:4px;overflow:visible}
body .main:not(.soft)::before,body .main:not(.soft)::after,body .plq::before,body .plq::after,body .top::before,body .top::after{display:none!important}
body .main:not(.soft):active{transform:translateY(2px);box-shadow:0 4px 10px -6px rgba(102,71,150,.6)!important}
body .main:not(.soft)[disabled]{background:var(--surface)!important;color:var(--muted)!important;box-shadow:var(--well)!important}
body .quiet{color:var(--accent);font-weight:600}

/* --- шапка задания: номер в градиенте + крупный заголовок --- */
body .plq{background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;padding:2px 0!important;min-height:0;gap:14px;overflow:visible}
body .plq h1{color:var(--ink)!important;font-size:30px;font-weight:700;letter-spacing:-.01em}
body .plq .num{width:52px;height:52px;border-radius:16px;background:var(--grad)!important;color:#fff!important;font-size:24px;font-weight:600;box-shadow:var(--glow)!important}
body .sub{color:var(--ink-2);font-size:18px;margin:10px 2px 0;line-height:1.45}
.bar .lab{color:var(--muted);letter-spacing:.06em}
.bar .cnt{color:var(--ink-2)}
body .back{height:42px;border-radius:999px!important;color:var(--accent);box-shadow:var(--raise-s)!important}

/* --- ответ под заданием --- */
body .fb{border-radius:16px}
body .fb.ok{background:var(--ok-t);color:var(--ok-ink);font-weight:600}
body .fb.hint{background:var(--bad-t);color:var(--bad-ink);font-weight:600}

/* --- кнопка звука: выпуклый круг, при звучании «дышит» фиолетовым кольцом --- */
body .snd:not(.sm){width:128px!important;height:128px!important;border-radius:50%!important;background:var(--surface)!important;color:var(--accent)!important;border:0!important;
 box-shadow:var(--raise),inset 0 0 0 6px var(--surface)!important;animation:none}
body .snd:not(.sm):active{box-shadow:var(--well)!important}
body .snd:not(.sm).on{animation:sndRing 1.2s ease-out infinite!important}
@keyframes sndRing{0%{box-shadow:var(--raise),0 0 0 0 rgba(102,71,150,.4)}100%{box-shadow:var(--raise),0 0 0 20px rgba(102,71,150,0)}}
body .snd.sm{color:var(--accent);border-radius:50%!important}

/* --- вдавленные поля --- */
body .inp{background:var(--surface)!important;border:0!important;box-shadow:var(--well)!important;border-radius:18px}
body .inp:focus{box-shadow:var(--well),0 0 0 2px var(--accent-line)!important}
body .pbar{background:var(--surface)!important;box-shadow:inset 3px 3px 6px var(--nd),inset -3px -3px 6px var(--nl)!important;height:14px}
body .pbar i,body .pbar span,body .pbar b{background:var(--grad)!important}
body .steps3 span{background:var(--surface)!important;border:0;box-shadow:var(--raise-s)!important;color:var(--ink-2)}
body .steps3 span.on{background:var(--grad)!important;color:#fff!important;box-shadow:var(--glow)!important}
body .wbox{box-shadow:var(--well)!important}
/* правило про 2 строчку: голубая карточка, сразу видна */
body .srule{background:#EFEBFA!important;border:0!important;box-shadow:var(--raise-s)!important;color:var(--ink);font-weight:600;border-radius:18px}
body .srule b{color:var(--accent);font-size:1.3em}
body .srule{color:#3F2F6B!important}

/* --- задание 1: три вдавленные лунки; цвет строки — цветом букв, без обводки; нажата — заливка --- */
.sgrid{gap:12px!important}
.sgb{border-radius:22px;padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--well)}
.sgb .sgh{font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;margin:0 4px}
.sgb.g1 .sgh{color:var(--c1-ink)}.sgb.g2 .sgh{color:var(--c2-ink)}.sgb.gf .sgh{color:var(--c3-ink)}
body .key.g1 .py{color:var(--c1-ink)}body .key.g2 .py{color:var(--c2-ink)}body .key.gf .py{color:var(--c3-ink)}
body .key.g1 small{color:var(--c1-ink)!important;opacity:.8;font-weight:700}
body .key.g2 small{color:var(--c2-ink)!important;opacity:.8;font-weight:700}
body .key.gf small{color:var(--c3-ink)!important;opacity:.8;font-weight:700}
body .key.sk.g1.ok{background:var(--c1-g)!important;box-shadow:0 5px 10px -5px rgba(102,71,150,.55)!important}
body .key.sk.g2.ok{background:var(--c2-g)!important;box-shadow:0 5px 10px -5px rgba(58,111,194,.55)!important}
body .key.sk.gf.ok{background:var(--c3-g)!important;box-shadow:0 5px 10px -5px rgba(35,137,106,.55)!important}
body .key.sk.ok .py,body .key.sk.ok small{color:#fff!important;opacity:1}
/* задание 2: новые финали — розовым, как финали */
body .key.fk .fbig{color:var(--c3-ink)}
body .key.fk.ok{background:var(--c3-g)!important;box-shadow:0 6px 12px -6px rgba(35,137,106,.55)!important}
body .key.fk.ok *{color:#fff!important}

/* --- список заданий --- */
body .top{background:var(--grad)!important;box-shadow:var(--glow)!important;border-radius:0 0 30px 30px}
body .top h1{font-weight:700}
body .top .lab{color:#E4DDFB!important;letter-spacing:.06em}
body .prog .row b{color:var(--accent)}
body .tile .num{background:var(--surface)!important;color:var(--accent)!important;box-shadow:inset 3px 3px 6px var(--nd),inset -3px -3px 6px var(--nl)!important;border-radius:14px}
body .tile b{font-weight:600}
body .tile.now{border:0!important;outline:0!important;box-shadow:var(--raise)!important}
body .tile.now .num{background:var(--grad)!important;color:#fff!important;box-shadow:var(--glow)!important}
body .tile.now .st{color:var(--accent)!important}
body .tile.done{background:var(--ok-t)!important;box-shadow:inset 4px 4px 9px rgba(30,116,87,.14),inset -4px -4px 9px rgba(255,255,255,.85)!important}
body .tile.done .num{background:var(--ok)!important;color:#fff!important;box-shadow:none!important}
body .tile.done .st{color:var(--ok-ink)!important}

/* --- компьютер: всё в одной выпуклой карточке, поле задания — вдавленная лунка --- */
@media (min-width:900px){
 .scr.task{display:flex!important;flex-direction:column;max-width:1000px;height:calc(100dvh - 40px)!important;min-height:0!important;margin:20px auto;
  background:var(--bg);border-radius:36px;box-shadow:14px 14px 34px var(--nd),-14px -14px 34px var(--nl);padding:10px 34px 20px}
 .scr.task .bar{height:54px;flex:none}
 .scr.task .head{padding-top:0}
 .scr.task .plq h1{font-size:34px}
 .scr.task .sub{font-size:19px;margin-top:8px}
 .scr.task .scene{flex:1;min-height:0;border-radius:28px;margin:16px 0 14px;padding:18px 28px;overflow:auto;box-shadow:var(--well)}
 .scr.task .pult{flex:none;width:100%;max-width:580px;margin:0 auto;padding-bottom:0}
 .scr.task .fb{min-height:44px;font-size:19px}
 .scr.list,.scr.start,.scr.res{max-width:1000px;margin:20px auto;background:var(--bg);border-radius:36px;box-shadow:14px 14px 34px var(--nd),-14px -14px 34px var(--nl);padding:0 34px 26px;overflow:visible}
 .scr.list .top,.scr.res .top{margin:0 -34px;padding:30px 34px 26px;border-radius:36px 36px 30px 30px}
 .sgrid{display:grid!important;grid-template-columns:4fr 3fr;align-items:start}
 .sgb.gf,.srule{grid-column:1/-1}
 body .key.sk{min-height:62px!important}
 body .kcard{width:min(100%,420px)!important;min-height:min(40dvh,330px)!important}
 body .key.hk{min-height:min(34dvh,240px)!important}
 [data-t="6"] .wbox,body .wbox{width:min(100%,42dvh,420px)!important}
 .scr.task .scene{justify-content:safe center}
 [data-t="1"] .scene{box-shadow:none!important;padding:6px 4px!important}
 .sgb.g2 .sgr{grid-template-columns:repeat(3,1fr)}
}
/* --- телефон: задание 1 помещается без прокрутки --- */
@media (max-width:899px){
 [data-t="1"] .sub{font-size:16px;margin-top:4px}
 body .key.sk{min-height:46px!important;padding:2px!important}
 body .key.sk .py{font-size:22px!important;line-height:1.05}
 body .key.sk small{font-size:15px!important;line-height:1}
 .sgb{padding:6px 9px 10px;gap:8px}.sgr{gap:8px!important}.sgb .sgh{font-size:14px}
 body .srule{font-size:15px!important;padding:6px 10px!important}
 [data-t="1"] .scene{gap:8px;padding:6px 8px 14px}
 body .plq h1{font-size:26px}
 body .plq .num{width:44px;height:44px;font-size:21px;border-radius:14px}
}

/* ===== ИТОГ ПРОБ 17.11 (выбрано Дарьей): фон #F8F8F8, текст тёмно-фиолетовый, клавиши звуков вдавленные,
   1 строчка — фиолетовый градиент как цифра задания, 2 строчка — лазурь, финали — персик (нажатые — тёмно-коричневые буквы),
   «Задание N» — вдавленная плашка, правило — лаванда с тонкой рамочкой, «Дальше» — фиолетовая.
   ОБЩИЙ визуал для всех ДЗ и классных кабинетов. ===== */
:root{--bg:#F8F8F8!important;--nd:#DDDDDD!important}
body .plq h1{color:#1B1430!important} body .sub{color:#2C2248!important} .bar .lab{color:#62578A!important;font-weight:700}
 .bar .cnt,.bar *{color:#2C2248} body .fb{color:#1B1430!important} body .main:not(.soft)[disabled]{color:#62578A!important;opacity:1}body .key.sk{background:var(--bg)!important;
   box-shadow:inset 4px 4px 9px var(--nd),inset -4px -4px 9px #fff!important;border-radius:14px!important}
  .sgb{box-shadow:6px 6px 14px var(--nd),-6px -6px 14px #fff!important;background:var(--bg)!important;border-radius:20px!important}
  body .key.sk.ok{box-shadow:inset 3px 3px 7px rgba(0,0,0,.25),inset -2px -2px 6px rgba(255,255,255,.3)!important}.sgb.g2 .sgh,body .key.g2 .py,body .key.g2 small{color:#3F6FE6!important}
 .sgb.gf .sgh,body .key.gf .py,body .key.gf small{color:#1BA582!important}
 body .key.sk.g1.ok{background:linear-gradient(135deg,#6A6DDE,#664796)!important} body .key.sk.g2.ok{background:linear-gradient(135deg,#7FA8FF,#4F7DF3)!important}
 body .key.sk.gf.ok{background:linear-gradient(135deg,#B8F3E3,#7DE3C6)!important} body .key.sk.gf.ok .py,body .key.sk.gf.ok small{color:#0B5C46!important}
 body .srule b{color:#664796}.sgb.g1 .sgh{color:#3D3352!important}.sgb.g2 .sgh{color:#2E3F66!important}.sgb.gf .sgh{color:#24544A!important}.sgb .sgh{font-weight:800!important}.bar .lab{font-weight:800!important;color:#2C2248!important;padding:8px 16px;border-radius:999px;box-shadow:inset 3px 3px 7px var(--nd),inset -3px -3px 7px #fff}body .key.sk.g2.ok{background:linear-gradient(135deg,#80BDF7,#3D88E0)!important}.sgb.g2 .sgh{color:#28456E!important}
body .key.g2 .py,body .key.g2 small{color:#2C79D2!important}
body .key.sk.gf.ok{background:linear-gradient(135deg,#FFE4D8,#FEC2AE)!important}
body .key.gf .py,body .key.gf small{color:#D0725A!important}
body .key.sk.gf.ok .py,body .key.sk.gf.ok small{color:#2C2248!important}.sgb.gf .sgh{color:#6D3E33!important}
body .srule{background:#EFEBFA!important;color:#2C2248!important}
body .srule b{color:#664796!important}
body .key.g1 small,body .key.g2 small{opacity:1!important}
body .key.sk.gf.ok .py,body .key.sk.gf.ok small{color:#4A302B!important}
body .key.g1:not(.ok) .py,body .key.g1:not(.ok) small{color:#3D3352!important}
body .key.g2:not(.ok) .py,body .key.g2:not(.ok) small{color:#28456E!important}
body .key.gf:not(.ok) .py,body .key.gf:not(.ok) small{color:#6A4A47!important;opacity:1!important}.sgb.gf .sgh{color:#5C423F!important}
body .srule{background:#EFEBFA!important;color:#2C2248!important}
body .srule b{color:#664796!important}
body .srule{border:1px solid rgba(102,71,150,.22)!important}
body .main:not(.soft),body .main:not(.soft)[disabled]{background:linear-gradient(135deg,#6A6DDE,#664796)!important;color:#fff!important;box-shadow:0 10px 20px -10px rgba(102,71,150,.55)!important}
body .main:not(.soft)[disabled]{opacity:.6}
/* верно = бирюза (не мята), неверно = мягкий малиновый */
:root{--ok:#5CC2BE;--ok-ink:#16767A;--ok-t:#DDF3F2;--c1-ink:#3D3352;--c2-ink:#28456E;--c3-ink:#6A4A47;--c3-g:linear-gradient(135deg,#FFE4D8,#FEC2AE)}
body .key.ok{background:var(--ok-t)!important;color:var(--ok-ink)!important;box-shadow:inset 3px 3px 7px rgba(22,118,122,.18),inset -3px -3px 7px #fff!important}
body .key.ok *{color:var(--ok-ink)}
body .tile.done{box-shadow:inset 4px 4px 9px rgba(22,118,122,.14),inset -4px -4px 9px rgba(255,255,255,.85)!important}
/* задание 2: карточки финалей — как клавиши звуков (вдавленные, персик) */

body .bar .lab{white-space:nowrap}
@media (max-width:380px){body .bar .lab{padding:7px 12px!important;font-size:14px}}

/* ============ ДЗ 10: новые экраны в утверждённом виде ДЗ 9 (те же переменные, цвета эталона «ИТОГ ПРОБ 17.11») ============ */
:root{--lav:#EFEBFA;--lav-line:rgba(102,71,150,.22);--vio:#664796;--txt:#2C2248}
/* 1. диктант: клавиатура инициалей двумя строчками + финали */
#kk{display:flex;flex-direction:column;gap:10px}
.dk{display:flex;flex-direction:column;gap:10px}
.dkb{padding:8px 10px 10px!important;display:flex;flex-direction:column;gap:6px}
.dkb .sgh{font-size:14px;margin-left:4px}
.dkr{display:grid;gap:6px}.dkr.c6{grid-template-columns:repeat(6,1fr)}.dkr.c5{grid-template-columns:repeat(5,1fr)}.dkr.c4{grid-template-columns:repeat(4,1fr)}
.dkr .key.sk{min-height:48px!important;padding:2px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.dkr .key.sk .py{font-size:22px;line-height:1.05}.dkr .key.sk small{font-size:12px;line-height:1}
#kk .keys.k4 .key{min-height:72px}
.tm{font-size:40px;font-weight:700;line-height:1}
.tk b{color:var(--vio)}

/* 2. иероглифы в темноте: комнаты урока 10 + фонарик */
.rmlist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.rmroom{display:flex;flex-direction:column;gap:4px;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--raise-s);padding:0 0 10px;text-align:center}
.rmroom img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:brightness(.42) saturate(.8)}
.rmroom b{font-size:15px;color:var(--txt);padding:0 6px;line-height:1.2}.rmroom small{font-size:14px;color:var(--ink-2)}
.rmask{flex:none;background:var(--lav);border:1px solid var(--lav-line);border-radius:16px;padding:8px 16px;font-size:20px;font-weight:600;color:var(--txt);text-align:center}
.rmask b{color:var(--vio);font-size:24px}
.rmscene{position:relative;container-type:inline-size;flex:1 1 0;min-height:0;width:auto;aspect-ratio:619/1100;max-width:100%;border-radius:20px;overflow:hidden;box-shadow:var(--raise-s);touch-action:none;user-select:none;-webkit-user-select:none;cursor:none;
 --rad:clamp(70px,24cqw,140px)}
.rmscene>img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.rmdark{position:absolute;inset:0;pointer-events:none;--x:50%;--y:45%;
 background:radial-gradient(circle var(--rad) at var(--x) var(--y),rgba(12,8,28,0) 0,rgba(12,8,28,0) 55%,rgba(12,8,28,.82) 85%,rgba(12,8,28,.95) 100%)}
.rmh{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));padding:2cqw;line-height:1;min-width:44px;min-height:44px;display:grid;place-items:center;cursor:none}
.rmh .zh{font-size:calc(var(--s)*1cqw);opacity:var(--o);display:block;transition:opacity .3s,transform .3s}
.rmh.k-ink .zh{color:#1E1424;mix-blend-mode:multiply}

/* 3. an и en */
.anr{display:flex;gap:16px;align-items:center;width:100%}
.anim{width:42%;max-width:220px;border-radius:20px;box-shadow:var(--raise-s)}
.ans{flex:1;display:flex;flex-direction:column;gap:10px}
.anstep{display:flex;gap:10px;align-items:flex-start;font-size:17px;color:var(--txt);line-height:1.3}
.anstep span{flex:none;width:30px;height:30px;border-radius:999px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}

.srule{padding:12px 16px;border-radius:16px;font-size:18px;font-weight:600;text-align:center;line-height:1.35}
.anc{display:flex;flex-direction:column;gap:14px;width:100%}
.anb{padding:12px!important;display:flex;flex-direction:column;gap:10px}

.anx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.anx .key.sk{min-height:56px!important}.anx .key.sk .py{font-size:22px}

/* 4, 8, 9. диалог: реплики как в мессенджере (полицейский слева, мальчик справа) */
.dlimg{width:auto;max-width:100%;height:min(34dvh,300px);aspect-ratio:16/10;object-fit:cover;border-radius:20px;box-shadow:var(--raise-s);flex:none}

.dlb{max-width:88%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--raise-s);transition:box-shadow .18s,background .25s}
.dlb.p{align-self:flex-start;border-bottom-left-radius:8px}
.dlb.b{align-self:flex-end;border-bottom-right-radius:8px;background:var(--lav);box-shadow:var(--raise-s),inset 0 0 0 1px var(--lav-line)}
button.dlb:active{box-shadow:var(--well)}
.dlb.on{box-shadow:var(--raise-s),0 0 0 3px rgba(102,71,150,.35)}
.dlb.ok .dlw::after{content:' · прослушано';color:var(--ok-ink)}
.dlw{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.dlz{font-size:28px;line-height:1.25;color:var(--ink)}
.dlz em{font-style:normal;color:var(--vio);font-weight:700}
.dlp{font-size:18px;line-height:1.3}
.dlr{font-size:15px;color:var(--ink-2)}
.dll.gaps{gap:6px}.dll.gaps .dlb{padding:6px 12px}.dll.gaps .dlz{font-size:24px}.dll.gaps .dlw{display:none}.dll.gaps .dlp{font-size:16px}.dll.gaps .dlr{font-size:14px}
.dlimg.two{height:min(24dvh,220px)}
.dll.gaps .dlb.cur{box-shadow:var(--raise-s),0 0 0 2px rgba(102,71,150,.45)}
.gp{display:inline-block;min-width:1.2em;padding:0 4px;margin:0 2px;border-radius:8px;color:var(--ink-2);background:var(--bg);box-shadow:inset 2px 2px 5px var(--nd),inset -2px -2px 5px #fff}
.gp.on{color:var(--vio);background:var(--lav);box-shadow:inset 0 0 0 2px rgba(102,71,150,.45)}
.gp.ok{color:var(--ok-ink);background:var(--ok-t);box-shadow:none}
.pyt{align-self:flex-end;flex:none;height:40px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:var(--raise-s);font-size:16px;font-weight:600;color:var(--txt)}
.pyt.on{box-shadow:var(--well);color:var(--vio)}
[data-t="8"] .scene,[data-t="9"] .scene{justify-content:flex-start;overflow:auto}
.dll.ord{gap:6px}.dlb.sm{padding:6px 12px}.dlb.sm .dlz{font-size:22px}
.dlb.slotx{align-self:center;font-size:18px;font-weight:700;color:var(--vio);background:var(--lav);box-shadow:inset 0 0 0 2px rgba(102,71,150,.35);padding:8px 24px}
.obank{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px;padding-top:12px;border-top:1px dashed var(--lav-line)}
.ocard{padding:10px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--raise-s);text-align:left;font-size:22px;color:var(--ink);min-height:48px}

.ocard.help{box-shadow:var(--raise-s),0 0 0 3px var(--ok)}

/* 5–7. новое слово */
.wdr{display:flex;align-items:center;gap:16px;justify-content:center}
.wdimg{width:96px;height:96px;border-radius:20px;object-fit:cover;object-position:50% 0;box-shadow:var(--raise-s)}

.key.wdk{min-height:0!important;padding:10px 14px!important;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.key.wdk .zh{font-size:28px}.key.wdk .zh em{font-style:normal;color:var(--vio);font-weight:700}
.key.wdk .py{font-size:18px}.key.wdk small{font-size:15px}

/* печатаем по-китайски */
.imq{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}

.imph{font-size:15px;color:var(--ink-2)}
.imcur{display:inline-block;width:2px;height:30px;background:var(--vio);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.imin{width:100%;display:flex;gap:8px}
.imin .inp{flex:1;min-width:0;font-size:20px}
.key.imdel{min-height:56px!important;width:64px;flex:none;font-size:22px;padding:0!important}
.imc{width:100%;display:flex;flex-wrap:wrap;gap:8px;min-height:72px;align-items:flex-start;justify-content:center}
.imk{position:relative;min-width:72px;min-height:68px;padding:6px 10px 4px;border-radius:16px;background:var(--surface);box-shadow:var(--raise-s);display:flex;flex-direction:column;align-items:center;gap:0}

[data-t="5"] .scene,[data-t="6"] .scene,[data-t="7"] .scene{justify-content:safe center}
/* 10. мемори на 13 пар */

}

/* правило крупно (перекрывает сжатие правила на телефоне из ДЗ 9) */
body [data-t="3"] .srule,body [data-t="5"] .srule,body [data-t="6"] .srule,body [data-t="7"] .srule{font-size:18px!important;padding:10px 14px!important;line-height:1.35}

}

}

/* ===== СТАРЫЙ ВИД (как ДЗ 8 и задания урока 10): сиреневый фон, неоморфные серо-голубые карточки,
   цветные карточки правил, красная плашка «Задание №», синие кнопки. Дарья 24.11: «используем наш старый дизайн» ===== */
:root{--o-bg:#E9EDF4;--o-ink:#1E2350;--o-t:#3D4560;--o-mu:#7D86A3;--o-ac:#5B6BD8;--o-ac2:#2B3270;--o-ok:#2DBE8C;--o-no:#FF5C8A;--o-sh1:#C5CBD8;--o-sh2:#fff;
 --bg:#E9EDF4;--surface:#E9EDF4;--ink:#1E2350;--ink-2:#7D86A3;--txt:#2B3270;--vio:#5B6BD8;--lav:#E9EDF4;--lav-line:#C5CBD8;--nd:#C5CBD8;
 --raise-s:5px 5px 12px #C5CBD8,-5px -5px 12px #fff;--well:inset 4px 4px 9px #C5CBD8,inset -4px -4px 9px #fff;
 --ok-t:#DDF5EC;--ok-ink:#14855E;--ok:#2DBE8C;--bad-t:#FFE3EB;--grad:linear-gradient(135deg,#5B6BD8,#8E5BE8)}
html,body{background:transparent!important;color:var(--o-t)}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#D9D2F5 url(img/fon.webp) 50% 100%/cover no-repeat}
body .n{background:var(--o-bg);border-radius:24px;box-shadow:8px 8px 18px var(--o-sh1),-8px -8px 18px var(--o-sh2)}
html body .scr{max-width:760px!important;height:auto!important;min-height:0!important;display:block!important;margin:0 auto!important;padding:max(14px,env(safe-area-inset-top)) 14px 40px!important;grid-template-columns:none!important}
.otop{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.otop>.zh{font-size:32px;color:var(--o-ac2);line-height:1;white-space:nowrap}
.otop h1{font-size:18px;font-weight:800;color:var(--o-ink);line-height:1.15;font-family:var(--sans)}.otop small{display:block;font-size:13px;color:var(--o-mu);font-weight:600}
.ome{margin-left:auto;padding:8px 14px;border-radius:14px;font-size:14px;font-weight:800;color:var(--o-ac);background:var(--o-bg);box-shadow:4px 4px 10px var(--o-sh1),-4px -4px 10px var(--o-sh2);white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.opbar{padding:10px 16px 12px;border-radius:18px!important;margin:0 0 16px}
.opbar .pbt{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;color:var(--o-mu)}.opbar .pbt b{font-weight:900;font-size:18px;color:var(--o-ac2)}.opbar .pbt em{font-style:normal;font-weight:900;font-size:20px;color:var(--o-ac2)}
.opbar .pbl{height:12px;border-radius:7px;background:#D6DBE6;margin-top:6px;overflow:hidden}.opbar .pbl i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#2DBE8C,#5B6BD8)}
@media(max-width:600px){.otop small{display:none}.otop>.zh{font-size:26px}}
html body .pan{padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px}
@media(max-width:600px){html body .pan{padding:16px 14px 18px}}
html body .pan .bar{height:auto!important;margin:0!important;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-start}
html body .back{height:auto!important;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--o-ac)!important;padding:8px 14px!important;border-radius:14px!important;background:var(--o-bg)!important;box-shadow:4px 4px 10px var(--o-sh1),-4px -4px 10px var(--o-sh2)!important;border:0!important}
html body .pan .lab{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff!important;background:#B0284F!important;padding:4px 10px;border-radius:9px;box-shadow:none!important;height:auto!important}
html body .pan .cnt{margin-left:auto;font-weight:800;font-size:14px;color:var(--o-mu);background:none!important;box-shadow:none!important}
html body .pan .head{padding:0!important;display:block!important;grid-area:auto!important}
html body .pan h2,html body .pan .ttl{font-size:25px;font-weight:800;color:var(--o-ink);line-height:1.2;margin:4px 0 0}
html body .rbox{margin-top:10px!important;padding:16px 18px!important;border-radius:24px!important;background:linear-gradient(135deg,var(--c1),var(--c2))!important;color:#fff!important;font-size:17px!important;font-weight:700;line-height:1.45;box-shadow:0 12px 26px rgba(43,50,112,.22)!important;border:0!important;display:block!important}
html body .rbox b{color:#fff!important}html body .rbox.empty{display:none!important}
html body .lead{font-size:16.5px;line-height:1.5;margin-top:4px;color:var(--o-t)}.lead b{color:var(--o-ink)}
html body .pan h3{font-size:18px;font-weight:800;color:var(--o-ink);margin:18px 0 8px}
/* поле задания и пульт: в потоке, без фиксированной высоты */
html body .scr.task .scene{flex:none!important;min-height:0!important;margin:0!important;padding:4px 0!important;border-radius:0!important;box-shadow:none!important;background:none!important;overflow:visible!important;display:flex;flex-direction:column;align-items:center;gap:12px;justify-content:flex-start!important}
html body .scr.task .pult{flex:none!important;max-width:none!important;width:100%;margin:0!important;padding:0!important;display:flex;flex-direction:column;gap:10px}
/* главная кнопка — синяя, как в старых заданиях */
html body .main{width:100%;min-height:54px!important;border-radius:18px!important;background:var(--o-ac)!important;color:#fff!important;font-weight:800!important;font-size:17px!important;box-shadow:6px 6px 14px var(--o-sh1),-6px -6px 14px var(--o-sh2)!important;border:0!important;text-shadow:none!important;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px}

/* клавиши, плитки, кнопка звука — неоморфные серо-голубые */
html body .key,html body .imk,html body .ocard,html body .dlb,html body .snd,html body .slot,html body .tile,html body .rmroom,html body .pyt,html body .mc .fa,html body .key.wdk{background:var(--o-bg)!important;box-shadow:5px 5px 12px var(--o-sh1),-5px -5px 12px var(--o-sh2)!important;border:0!important;color:var(--o-ac2)!important}
html body .key .py,html body .key b{color:var(--o-ac2)}

html body .dlb.b{background:#E3E6FA!important}

html body .inp,html body .imo,html body .wbox{background:#fff!important;box-shadow:inset 4px 4px 9px var(--o-sh1),inset -4px -4px 9px #fff!important;border:0!important;border-radius:18px!important}
html body .wbox{box-shadow:inset 0 0 0 3px #FF8FA8!important}
html body .inp{width:100%;font-size:20px;padding:14px 18px;margin:12px 0;color:var(--o-ink)}
html body .srule{background:linear-gradient(135deg,#FF3D77,#FF8A3D)!important;color:#fff!important;border:0!important;border-radius:22px!important;box-shadow:0 12px 26px rgba(255,61,119,.28)!important}
html body .srule b,html body .srule .zh{color:#fff!important}
html body .fb{font-size:16px;font-weight:700;color:var(--o-t);text-align:center;min-height:24px;background:none!important;box-shadow:none!important}
html body .fb.ok{color:#14855E!important}html body .fb.hint{color:#D9366A!important}
html body .tk{color:var(--o-mu)}
html body .gp.on{background:#E3E6FA!important;color:var(--o-ac)!important}

html body .lv-slider{height:calc(var(--lv-card) + 30px)}
html body .lv-item{top:8px}
@media(hover:hover){html body .lvw .lv-slider:hover .lv-item{filter:none}}
html body .lv-card{position:relative;overflow:hidden;border:0;border-radius:22px;padding:0;background:var(--lv-g);cursor:pointer;
 transform:perspective(420px) rotateX(10deg);transform-origin:50% 100%;
 box-shadow:0 16px 18px -10px rgba(5,2,20,.8),0 0 0 1px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.45)}
.lv-gl{position:absolute;inset:6px;border-radius:18px;border-top-left-radius:78%;
 background:linear-gradient(0deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.82) 100%);
 border-right:1px solid rgba(255,255,255,.6);border-bottom:1px solid rgba(255,255,255,.6)}
.lv-o{position:absolute;border-radius:50%;background:rgba(147,112,219,.28);box-shadow:rgba(60,40,120,.22) 4px 4px 10px}
.lv-o.o1{width:52%;aspect-ratio:1;left:4px;top:4px}.lv-o.o2{width:38%;aspect-ratio:1;left:6px;top:6px}.lv-o.o3{width:24%;aspect-ratio:1;left:8px;top:8px;background:rgba(255,255,255,.55)}
html body .lv-card .zh{position:relative;font-size:calc(var(--lv-card) * .54);color:#2C2266;text-shadow:0 1px 0 rgba(255,255,255,.7);margin-top:8%}
html body .lv-card.lv-ok{background:linear-gradient(135deg,#5CC2BE,#16767A);box-shadow:0 0 0 4px rgba(92,194,190,.45),0 0 28px rgba(92,194,190,.8)}
html body .lv-card.lv-ok .zh{color:#0F4F52}
html body .lv-card.lv-no{background:linear-gradient(135deg,#E889AE,#A3214F)}
html body .lv-card.lv-help{box-shadow:0 0 0 4px #fff,0 0 30px 6px rgba(200,180,255,.9)}
html body .lvbar{color:var(--o-ac2)}
/* вариант Б: 3D-карусель */
.lv3dw{height:calc(var(--lv-card) * 1.9);display:grid;place-items:center;perspective:900px}
.lv3d{--lv-r:calc(var(--lv-card) * 1.75);position:relative;width:var(--lv-card);height:calc(var(--lv-card) * 1.25);transform-style:preserve-3d;animation:lv3dRun var(--lv-d) linear infinite}
@media(min-width:700px){.lv3d{--lv-r:calc(var(--lv-card) * 2.3)}}
@keyframes lv3dRun{from{transform:rotateX(-8deg) rotateY(-360deg)}to{transform:rotateX(-8deg) rotateY(0deg)}}
.lv3i{position:absolute;inset:0;transform:rotateY(calc(var(--lv-i) * 360deg / var(--lv-q))) translateZ(var(--lv-r));transform-style:preserve-3d}
.lv3i .lv-card{width:100%;height:100%;transform:none;backface-visibility:hidden}
.lv-paused .lv3d{animation-play-state:paused}
.lvdemo .lv3dw,.lvdemo .lv3d{pointer-events:none}
.lvdemo:has(.lv3d){height:calc(var(--lv-card) * 1.9);display:grid;place-items:center;perspective:900px}
@media (prefers-reduced-motion:reduce){.lv3d{animation-duration:var(--lv-d)!important;animation-iteration-count:infinite!important}}
html body .lvarena{width:100%;min-width:0;max-width:100%;box-sizing:border-box;margin:0;align-self:stretch;flex:none}
html body .lvarena .lvw,html body .lvarena .lvdemo{width:100%;min-width:0}
html body .lvarena .lv-slider{width:100%}
/* карточка «рубашка с пятнами» (Uiverse, syahrulnaufal/plastic-puma-91 — MIT) */
.lvarena[data-pal="o"]{--lc0:bisque;--lc1:#FFB84C;--lc2:#F266AB;--lc3:#A459D1;--lc4:#2CD3E1}
.lvarena[data-pal="n"]{--lc0:#EFEBFA;--lc1:#6A6DDE;--lc2:#B48AE6;--lc3:#664796;--lc4:#80BDF7}
html body .lv-card{background:var(--lc0);border-radius:15px;transform:none;box-shadow:0 0 22px 3px rgba(0,0,0,.35);overflow:hidden;isolation:isolate}
html body .lv-card .lb{position:absolute;width:92%;aspect-ratio:1;border-radius:50%;filter:blur(calc(var(--lv-card) * .16));animation:lvWave 1.5s infinite alternate;z-index:0}
.lv-card .b1{left:-34%;top:-30%;background:var(--lc1);animation-delay:calc(var(--lv-k) + 0s)!important}
.lv-card .b2{left:42%;top:-22%;background:var(--lc2);animation-delay:calc(var(--lv-k) + .5s)!important}
.lv-card .b3{left:-30%;top:46%;background:var(--lc3);animation-delay:calc(var(--lv-k) + 1s)!important}
.lv-card .b4{left:40%;top:52%;background:var(--lc4);animation-delay:calc(var(--lv-k) + 1.5s)!important}
@keyframes lvWave{0%{transform:translateY(-12%)}50%{transform:translateY(12%)}100%{transform:translateY(-12%)}}
.lv-card .la{position:absolute;inset:5% 6%;border-radius:12px;background:rgba(255,255,255,.6);z-index:1}
html body .lv-card .zh{z-index:2;margin:0;color:#303030;text-shadow:none;font-size:calc(var(--lv-card) * .56)}
.lvarena[data-pal="n"] .lv-card .zh{color:#2C2248}
html body .lv-card.lv-ok{--lc0:#DDF3F2;--lc1:#5CC2BE;--lc2:#16767A;--lc3:#5CC2BE;--lc4:#9ADEDA;background:var(--lc0);box-shadow:0 0 0 4px rgba(92,194,190,.6),0 0 28px rgba(92,194,190,.85)}
html body .lv-card.lv-no{--lc0:#FBE5EC;--lc1:#E889AE;--lc2:#A3214F;--lc3:#E889AE;--lc4:#F3B6CC;background:var(--lc0)}
html body .lv-card.lv-ok .zh{color:#0F4F52}
@media (prefers-reduced-motion:reduce){.lv-card .lb{animation:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// черты из данных Hanzi Writer: рисуем иероглиф, три черты пронумерованы, одна из них — первая

 return `<svg class="fs" viewBox="-20 -60 1064 1064" aria-label="${c}"><g transform="scale(1,-1) translate(0,-900)">${d.strokes.map((p,i)=>`<path d="${p}" class="${cand.includes(i)?'fc fc'+cand.indexOf(i):'fo'}" data-s="${i}"/>`).join('')}</g>
  ${cand.map((s,i)=>{const [x,y]=pt(s);return `<g class="fb${i}" data-s="${s}"><circle cx="${x}" cy="${y}" r="74"/><text x="${x}" y="${y+30}" text-anchor="middle">${i+1}</text></g>`;}).join('')}</svg>`;}

 let rest=shuffle([...Array(N).keys()].slice(1)).filter(far);
 const out=[0];for(const i of rest){if(out.length>=3)break;const m=d.medians[i][0];if(out.every(o=>{const q=d.medians[o][0];return Math.hypot(m[0]-q[0],m[1]-q[1])>170;}))out.push(i);}

function first(){const n=4;const items=shuffle(HZ.map(h=>h[0]));let k=0,score=0;const miss=[],ans=[];

   pult:`<div class="fb" id="fb">Первая черта подсвечена</div><button class="main" id="mn">Понятно, начнём</button>`});$('#mn').onclick=one;};

   if(s===0){solved=true;if(clean)score++;ans.push([c,clean]);$$('.fk').forEach(q=>q.disabled=true);b&&b.classList.add('ok');
    fb(clean?'Верно! Смотри весь порядок черт':'Да, эта. Смотри весь порядок черт','ok');

const GRID='<svg class="g" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#D3D8E6" stroke-width=".5" fill="none"><path d="M50 4V96M4 50H96" stroke-dasharray="2 2"/><path d="M4 4L96 96M96 4L4 96" stroke-dasharray="1.5 2.5"/></g></svg>';
function hwOpts(sz,extra){return Object.assign({width:sz,height:sz,padding:sz*.08,showOutline:false,showCharacter:false,

function writeBox(box,c,{outline=false,hintAfter=3}={},on={}){const sz=box.clientWidth||260;let mist=0;

const LAD=['我','好','你','他','她','们','吗','是'];

 const partA=()=>{const c=LAD.find(x=>L.a[x]==null);if(!c)return partB();const h=HZM[c];let stage=0,m1=0;
  const one=()=>{shell(n,{step:'5.1 · '+(LAD.indexOf(c)+1)+' / '+LAD.length,sub:stage===0?'Обведи по светлому образцу, черта за чертой.':'Теперь напиши <b>сам</b>, без образца.',
    scene:`<div class="wcap"><span class="zh">${stage===0?c:'?'}</span><div><div class="py t${h[2]}">${toned(h[1],h[2])}</div><div class="ru">${esc(h[3])}</div></div><button class="snd sm" id="ps" aria-label="Послушать">${IC.snd}</button></div>
     <div class="wbox" id="wb">${GRID}<div class="hw" id="hw"></div></div>`,
    pult:`<div class="fb" id="fb"></div><div class="steps3"><span class="${stage?'ok':'on'}">1. Обведи</span><span class="${stage?'on':''}">2. Сам</span><span>3. По памяти</span></div>${stage?'<button class="quiet" id="hn">Не помню — покажи образец</button>':''}`});
   $('#ps').onclick=()=>playWord(c,$('#ps'));
   writeBox($('#hw'),c,{outline:stage===0,hintAfter:stage===0?1:3},{mist:()=>fb(stage===0?'Веди по светлой черте':'Не та черта. После 3 ошибок черта подскажет','hint'),ok:()=>fb('Так, дальше','ok'),

   scene:`<div class="bq"><small>Напиши по памяти</small><b>«${esc(h[3])}»</b></div><div class="wbox" id="wb">${GRID}<div class="hw" id="hw"></div></div>`,
   pult:`<div class="fb" id="fb">${it.r?'Этот иероглиф вернулся: попробуй ещё раз':''}</div><button class="quiet" id="hn">Не помню — подскажи</button>`});

 const line=(i,y)=>{const r=S.done[i];return `<div class="ri ${y?'y':'x'}"><span class="num">${i}</span><span>${EMO[i]} ${esc(TASKS[i].t)}${y&&r?`<small>${i===7?(r.noMic?'прочитаю на уроке':'записано реплик: '+r.rec):'верно: '+r.score+' из '+r.of}</small>`:''}</span>${y?'<span class="st">✓</span>':`<button class="go" data-n="${i}">Сделать →</button>`}</div>`;};
 $('#app').innerHTML=`<div class="scr res fade">${topHTML()}${pbarHTML()}<div class="pan n"><div class="top"><h1>🏁 ${esc(S.name||'')}, сделано ${D.length} из ${NT}</h1></div>
  ${X.length?`<div class="left"><h3>⏳ Ещё не доделано (${X.length}):</h3><div class="rl">${X.map(i=>line(i,0)).join('')}</div></div>`:`<div class="allok">🏆 Все ${NT} заданий сделаны! Учитель увидит результаты.</div>`}
  ${D.length?`<h3>✓ Сделано</h3><div class="rl">${D.map(i=>line(i,1)).join('')}</div>`:''}
  <div class="foot"><button class="main" id="go">К списку заданий</button></div></div></div>`;
 $$('.go').forEach(b=>b.onclick=()=>TASKS[+b.dataset.n].run());$('#go').onclick=list;topOn();}

/* клавиатура на компьютере: цифры выбирают ответ, Enter — главная кнопка */
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if(/^[1-9]$/.test(e.key)){const k=$$('.keys .key:not(.pt), #kk [data-v]')[+e.key-1];if(k&&!k.disabled){k.click();e.preventDefault();}}
 else if(e.key==='Enter'){const m=$('#mn')||$('#nx')||$('#go');if(m&&!m.disabled){m.click();e.preventDefault();}}});


// голос учителя (записи Дарьи): audio/voice/<id>.wav
const VOICE=AUDIO+'voice/';
const playVoice=(id,el)=>tryURL(VOICE+id+'.wav',el);

/* ---------- каркас экрана задания ---------- */
const EMO={1:'🎧',2:'⌨️',3:'🧩',4:'☝️',5:'✍️',6:'🔍',7:'🎙️',8:'🖋️',9:'🎡'};
const RBX={1:'#5B6BD8,#8E5BE8',2:'#5B6BD8,#8E5BE8',3:'#8E5BE8,#5B6BD8',4:'#8E5BE8,#5B6BD8',5:'#5B6BD8,#8E5BE8',6:'#8E5BE8,#5B6BD8',7:'#5B6BD8,#8E5BE8',8:'#8E5BE8,#5B6BD8',9:'#5B6BD8,#8E5BE8'};
function topHTML(){return `<div class="otop n"><span class="zh">作业</span><div><h1>Домашнее задание 11</h1><small>Пишем по памяти · пиньинь · наш диалог</small></div>${S.name?`<button class="ome" id="me">${esc(S.name)} ✎</button>`:''}</div>`;}
function pbarHTML(){const d=Object.keys(S.done).filter(k=>S.done[k]).length,pc=Math.round(d*100/NT);
 return `<div class="opbar n prog"><div class="pbt"><span>Выполнено <b>${d} из ${NT}</b></span><em>${pc}%</em></div><div class="pbl"><i style="width:${pc}%"></i></div></div>`;}
function topOn(){const m=$('#me');if(m)m.onclick=()=>{clearTimers();stopGame();S.name='';keep();start();};}
function shell(n,{step='',scene='',pult='',sub}){clearTimers();try{curA&&curA.pause()}catch(e){}
 const T=TASKS[n],sb=sub!=null?sub:esc(T.s);
 $('#app').innerHTML=`<div class="scr task fade" data-t="${n}">${topHTML()}${pbarHTML()}<div class="pan n">
  <div class="bar"><button class="back" id="bk" aria-label="Вернуться ко всем заданиям">‹ Все задания</button><span class="lab">Задание № ${n}</span><span class="cnt" id="cnt">${step}</span></div>
  <div class="head"><h2 class="ttl">${EMO[n]||''} ${esc(T.t)}</h2><div class="sub rbox${sb?'':' empty'}" id="sub" style="--c1:${RBX[n].split(',')[0]};--c2:${RBX[n].split(',')[1]}">${sb}</div></div>
  <main class="scene" id="scene">${scene}</main>
  <div class="pult" id="pult">${pult}</div></div></div>`;
 $('#bk').onclick=()=>{clearTimers();stopGame();list();};topOn();
 // страница не прыгает наверх: внутри задания остаёмся на месте, при входе в задание — к самому заданию (не к шапке)
 const pan=$('.pan');if(pan)scrollTo(0,Math.max(0,pan.getBoundingClientRect().top+scrollY-8));
 S.cur=n;keep();}
const setCnt=t=>{const c=$('#cnt');if(c)c.textContent=t;};
function fb(html,cls){const f=$('#fb');if(!f)return;f.className='fb'+(cls?' '+cls:'');f.innerHTML=html?'<span>'+html+'</span>':'';}
function finish(n,res,sumHTML){S.done[n]=res;keep();send('t'+n,res);
 const left=[];for(let i=1;i<=NT;i++)if(!S.done[i])left.push(i);
 const next=left.find(i=>i>n)||left[0];
 shell(n,{step:'готово',sub:'',
  scene:`<div class="fin-box fade"><div class="bigc">${IC.ok}</div><h2>Задание ${n} сделано</h2>${sumHTML||''}</div>`,
  pult:next?`<button class="main" id="nx">Задание ${next}: ${esc(TASKS[next].t)}</button><button class="quiet" id="ls">К списку заданий</button>`
   :`<button class="main" id="nx">Мои итоги</button><button class="quiet" id="ls">К списку заданий</button>`});
 $('#nx').onclick=()=>next?TASKS[next].run():results();$('#ls').onclick=list;}

/* универсальный вопрос с клавишами: ответ верный → клавиша мягко окрашивается мятой */
function quiz(n,items,{scene,keys,cols=2,isRight,hint,okText,onShow,onOk,mainLabel='Дальше',audio,save}){
 let k=0,score=0;const miss=[],ans=[];
 const one=()=>{if(k>=items.length)return save(score,items.length,miss,ans);
  const it=items[k];let first=true,solved=false;const K=keys(it);
  shell(n,{step:(k+1)+' / '+items.length,scene:scene(it),
   pult:`<div class="fb" id="fb"></div><div class="keys k${cols}">${K.map((x,i)=>`<button class="key ${x.cls||''}" data-i="${i}">${x.html}</button>`).join('')}</div>
    <button class="main${audio?' soft':''}" id="mn" ${audio?'':'disabled'}>${audio?IC.snd+' Послушать ещё раз':esc(mainLabel)}</button>`});
  const mn=$('#mn');
  const play=()=>audio&&audio(it,$('#ps'));
  if(audio){mn.onclick=play;const ps=$('#ps');if(ps)ps.onclick=play;later(play,350);}
  onShow&&onShow(it);
  $$('.key').forEach(b=>b.onclick=()=>{if(solved)return;const x=K[+b.dataset.i];
   if(isRight(it,x)){solved=true;$$('.key').forEach(q=>q.classList.remove('hint'));b.classList.add('ok');if(first)score++;ans.push([it.id||k,x.v,first]);
    fb(okText(it,x),'ok');$$('.key').forEach(q=>q.disabled=true);
    mn.className='main';mn.disabled=false;mn.innerHTML=k+1<items.length?'Дальше':'Готово';mn.onclick=()=>{k++;one();};
    if(audio)later(()=>audio(it),150);else onOk&&onOk(it);
   }else{b.classList.remove('hint');void b.offsetWidth;b.classList.add('hint');
    if(first){first=false;miss.push(it.miss||it.id||String(k));}fb(hint(it,x),'hint');}
  });};
 one();}

/* правило в начале задания: карточки со звуком, «Дальше» открывается, когда всё прослушано */
function ruleStep(n,{sub,html,need,btn,onGo,play}){
 shell(n,{step:'правило',sub,scene:html,
  pult:`<div class="fb" id="fb"></div><button class="main" id="mn" disabled>${esc(btn)}</button>`});
 const heard=new Set(),mn=$('#mn');
 const upd=()=>{const left=need-heard.size;if(left<=0){mn.disabled=false;fb('Всё прослушано','ok');}else fb('Нажми на каждую карточку. Осталось: '+left,'');};
 $$('[data-snd]').forEach(b=>b.onclick=()=>{play(b.dataset.snd,b);b.classList.add('ok');heard.add(b.dataset.snd);upd();});
 mn.onclick=onGo;upd();}
// конец задания с двумя частями: общий счёт
const sumMiss=(score,of,miss)=>`<p>Верно с первого раза: ${score} из ${of}.</p>${miss.length?`<p>Можно повторить для закрепления:</p><div class="chips">${miss.map(m=>`<span class="x">${m}</span>`).join('')}</div>`:''}`;


try{const q=new URLSearchParams(location.search).get('name');if(q){if(q!==S.name){S.name=q;S.sid='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}keep();}}catch(e){}
flush();
const h=location.hash.match(/^#t(\d+)$/);
if(S.name&&h&&TASKS[+h[1]])TASKS[+h[1]].run();else list();
</script></body></html>
