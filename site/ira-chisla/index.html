:root { --ink: #191B2E; --ink-2: #242741; --ink-3: #3E4262; --paper: #F5F0E7; --paper-2: #EBE3D4; --muted: #6C6982; --muted-2: #8C88A2; --line: #DCD3C2; --hair: rgba(25,27,46,.10); --vio: #4E4C8E; --vio-2: #33315F; --vio-3: #8785C7; --vio-tint: #EAE8F5; --vio-soft: #F3F1FA; --jade: #2E7F6C; --jade-2: #1D5C4D; --jade-3: #4FA68D; --jade-tint: #E3F0EC; --gold: #BE9760; --gold-2: #8A6B34; --gold-tint: #F7EFDF; --red: #BF5B4A; --red-2: #8D3B2D; --red-tint: #F9EBE6; --rose: var(--red); --rose-tint: var(--red-tint); --grad: linear-gradient(165deg,#F6F4FD 0%,#F2EEE4 100%); --grad-soft: linear-gradient(165deg,#FAF8FE 0%,#F7F3EA 100%); --sh1: 0 1px 1px rgba(25,27,46,.04),0 2px 6px rgba(25,27,46,.06); --sh2: 0 2px 4px rgba(25,27,46,.05),0 14px 30px -18px rgba(25,27,46,.42); --sh3: 0 4px 8px rgba(25,27,46,.06),0 28px 60px -30px rgba(25,27,46,.5); --serif: 'Playfair Display',Georgia,serif; --sans: 'Manrope',system-ui,sans-serif; --han: 'LXGW WenKai GB','Noto Sans SC','Manrope',sans-serif; }

* { box-sizing: border-box; }

html { background: var(--ink); }

body { margin: 0px; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }

button { font-family: inherit; color: var(--ink); -webkit-text-fill-color: currentcolor; }

.page { max-width: 520px; margin: 0px auto; padding: 18px 16px 60px; position: relative; }

.pw { border-bottom: 1.5px dotted var(--gold); font-family: var(--han); }

.pw i { font-style: normal; font-family: var(--sans); font-size: 0.7em; color: var(--gold-2); font-weight: 700; vertical-align: 2px; }

.zh-i { font-family: var(--han); }

.gold-text { color: rgb(243, 227, 190); -webkit-text-fill-color: rgb(243, 227, 190); }

#toctrig { position: fixed; top: 0px; left: 0px; right: 0px; height: 14px; z-index: 90; cursor: pointer; }

#tocbar { position: fixed; top: 0px; left: 0px; right: 0px; z-index: 89; display: flex; gap: 8px; padding: 10px 12px; justify-content: center; flex-wrap: wrap; background: linear-gradient(165deg,var(--ink-2),var(--ink)); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(190, 151, 96, 0.35); box-shadow: var(--sh3); transform: translateY(-100%); transition: transform 0.32s cubic-bezier(0.32, 0.86, 0.28, 1); }

#tocbar.show { transform: translateY(0px); }

#tocbar a { font-family: var(--han); font-weight: 700; font-size: 12.5px; color: var(--paper); text-decoration: none; padding: 7px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16); white-space: nowrap; }

#tocbar a:active { background: rgba(255, 255, 255, 0.2); }

.hero { position: relative; border-radius: 22px; overflow: hidden; box-shadow: var(--sh3); margin-bottom: 18px; aspect-ratio: 900 / 410; background: var(--ink-2); }

.hero img { position: absolute; inset: 0px; width: 100%; height: 100%; object-fit: cover; display: block; }

.hero .herotext { position: absolute; left: 0px; right: 0px; bottom: 0px; padding: 20px 20px 18px; color: rgb(255, 255, 255); }

.hero .kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; color: rgb(231, 217, 187); opacity: 0.85; margin-bottom: 7px; }

.hero h1 { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.28; margin: 0px 0px 8px; letter-spacing: -0.01em; color: rgb(255, 255, 255); }

.hero .zh { font-family: var(--han); font-size: 27px; vertical-align: -2px; margin-right: 3px; }

.hero p { margin: 0px; font-size: 14px; line-height: 1.5; color: rgb(237, 233, 245); opacity: 0.92; }

.card { background: linear-gradient(rgb(255, 255, 255) 0%, rgb(245, 239, 225) 100%); border-radius: 20px; padding: 20px 18px; margin-bottom: 16px; box-shadow: rgba(70, 60, 40, 0.18) 0px 1.5px 2px, rgba(60, 50, 32, 0.18) 0px 3px 6px, rgb(255, 255, 255) 0px 2px 0px inset, rgba(130, 110, 70, 0.16) 0px -3px 5px inset; border-top: 1px solid rgba(90, 80, 60, 0.1); border-right: 1px solid rgba(90, 80, 60, 0.1); border-bottom: 1px solid rgba(90, 80, 60, 0.1); border-image: none; border-left: 6px solid var(--vio); }

.card.gold { border-top-color: rgba(190, 151, 96, 0.28); border-right-color: rgba(190, 151, 96, 0.28); border-bottom-color: rgba(190, 151, 96, 0.28); border-left-color: var(--gold); }

.bhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

.bnum { flex: 0 0 auto; min-width: 42px; height: 42px; padding: 0px 12px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(175deg,#B4B2E8 0%,var(--vio-3) 32%,var(--vio-2) 100%); color: rgb(255, 255, 255); font-family: var(--han); font-size: 20px; border: 1.5px solid rgb(42, 40, 86); box-shadow: rgba(25, 23, 50, 0.32) 0px 1.5px 2px, rgba(25, 23, 50, 0.34) 0px 3px 5px, rgba(255, 255, 255, 0.5) 0px 2px 1px inset, rgba(15, 14, 35, 0.42) 0px -4px 6px inset; }

.card.gold .bnum { background: linear-gradient(175deg, rgb(230, 218, 185) 0%, rgb(210, 190, 147) 32%, rgb(167, 139, 84) 100%); color: rgb(255, 255, 255); font-size: 24px; text-shadow: rgba(60, 42, 15, 0.4) 0px 1px 2px; border-color: rgb(138, 117, 72); box-shadow: rgba(90, 70, 30, 0.25) 0px 1.5px 2px, rgba(90, 70, 30, 0.22) 0px 3px 5px, rgba(255, 255, 255, 0.5) 0px 2px 1px inset, rgba(60, 42, 15, 0.28) 0px -4px 6px inset; }

.zh-sub { display: flex; flex-direction: column; gap: 2px; min-width: 0px; }

.zh-sub .p { font-family: var(--sans); font-style: italic; font-weight: 700; font-size: 13.5px; color: var(--muted); }

.zh-sub .r { font-family: var(--sans); font-weight: 700; font-size: 16px; color: var(--ink-3); }

.note { font-size: 15px; line-height: 1.6; color: var(--ink-3); margin: 0px 0px 14px; }

.note b { color: var(--ink); }

.task { font-size: 13px; line-height: 1.55; color: var(--muted); margin: 0px 0px 14px; font-style: italic; }

.task b { color: var(--ink-3); font-style: normal; font-weight: 800; }

.hzwrap { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

.hzcard .hzk { display: flex; align-items: baseline; gap: 7px; }

.hzcard .hzk b { font-family: var(--han); font-size: 21px; font-weight: 400; line-height: 1; color: var(--ink); }

.hzcard .hzk span { font-family: var(--sans); font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold-2); }

.hzbox { position: relative; width: 100%; max-width: 150px; aspect-ratio: 1 / 1; border-radius: 14px; background: rgb(253, 252, 250); border: 1.5px solid rgb(108, 105, 130); overflow: hidden; touch-action: none; }

.hzbox svg { position: absolute; inset: 0px; width: 100%; height: 100%; display: block; }

.hzgrid line { stroke: rgb(90, 87, 160); stroke-width: 3; opacity: 0.6; }

.hzghost { fill: rgb(231, 227, 220); }

.hzdone { fill: var(--ink-2); }

.hzink { fill: none; stroke: rgb(51, 49, 95); stroke-width: 120; stroke-linecap: round; stroke-linejoin: round; }

.hzuser { fill: none; stroke: rgb(111, 109, 190); stroke-width: 34; stroke-linecap: round; stroke-linejoin: round; }

.hzbox.quiz { cursor: crosshair; }

.hzstate { font-size: 12.5px; font-weight: 700; color: var(--muted); text-align: center; min-height: 18px; }

.hzstate.ok { color: var(--jade-2); }

.hzstate.no { color: var(--red-2); }

.hzbtns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

.btn { font-family: var(--sans); font-weight: 800; font-size: 12px; border-radius: 999px; padding: 9px 15px; cursor: pointer; box-shadow: rgba(0, 0, 0, 0.28) 0px 1.5px 2px, rgba(0, 0, 0, 0.22) 0px 3px 6px, rgba(255, 255, 255, 0.5) 0px 2px 1px inset, rgba(0, 0, 0, 0.22) 0px -4px 5px inset; }

.btn:active { transform: scale(0.97); }

.btn.vio { background: linear-gradient(175deg, rgb(166, 164, 196) 0%, rgb(124, 122, 168) 30%, rgb(57, 55, 92) 100%); border: 1.5px solid rgb(46, 44, 76); color: rgb(255, 255, 255); }

.btn.gold { background: linear-gradient(175deg, rgb(214, 195, 160) 0%, rgb(179, 159, 126) 30%, rgb(129, 106, 68) 100%); border: 1.5px solid rgb(102, 82, 49); color: rgb(255, 255, 255); text-shadow: rgba(0, 0, 0, 0.35) 0px 1px 2px; }

.hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }

.mh { font-family: var(--sans); font-weight: 800; font-size: 12.5px; color: var(--vio-2); text-transform: uppercase; letter-spacing: 0.03em; margin: 16px 0px 8px; }

.mh:first-child { margin-top: 0px; }

.mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-bottom: 4px; }

.mc { position: relative; background: linear-gradient(rgb(248, 247, 250) 0%, rgb(239, 237, 239) 45%, rgb(221, 218, 220) 100%); border: 1.5px solid rgb(148, 143, 148); border-radius: 14px; padding: 11px 8px; text-align: center; cursor: pointer; transition: background 0.15s; box-shadow: rgba(60, 55, 100, 0.14) 0px 1.5px 2px, rgba(55, 50, 95, 0.16) 0px 3px 6px, rgb(255, 255, 255) 0px 2px 0px inset, rgba(85, 80, 145, 0.14) 0px -3px 5px inset; }

.mc.open { background: linear-gradient(rgb(245, 244, 245) 0%, rgb(233, 230, 232) 100%); }

.mc:not(.open)::after { content: "?"; position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--vio); color: rgb(255, 255, 255); font-family: var(--sans); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; box-shadow: var(--sh1); }

.mc .eq { font-family: var(--sans); font-weight: 800; font-size: 14.5px; color: var(--vio-2); letter-spacing: -0.01em; }

.mc .ans .zh { font-family: var(--han); font-size: 22px; color: var(--ink); }

.mc .ans .py { font-family: var(--sans); font-style: italic; font-weight: 700; font-size: 12.5px; color: var(--muted); }

.qwrap { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed rgba(120, 112, 150, 0.25); }

.qwrap:last-child { border-bottom-width: medium; border-bottom-style: none; border-bottom-color: currentcolor; margin-bottom: 0px; padding-bottom: 0px; }

.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

.qnum { font-family: var(--sans); font-weight: 800; font-size: 13px; color: rgb(255, 255, 255); background: var(--vio); border-radius: 999px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

.qprompt.num { font-family: var(--sans); font-weight: 800; font-size: 30px; color: var(--ink); }

.qprompt.eq { font-family: var(--sans); font-weight: 800; font-size: 19px; color: var(--ink); line-height: 1.3; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }

.opt.numtxt { font-family: var(--sans); font-weight: 800; font-size: 19px; }

.opt.wordtxt { font-family: var(--sans); font-weight: 700; font-size: 15px; }

.opt:active { transform: scale(0.97); }

.opt.ok { background: linear-gradient(rgb(222, 245, 231) 0%, rgb(190, 232, 206) 45%, rgb(143, 207, 170) 100%); border-color: rgb(62, 143, 107); color: rgb(14, 74, 52); box-shadow: rgba(20, 90, 60, 0.28) 0px 1.5px 2px, rgba(20, 90, 60, 0.28) 0px 3px 7px, rgba(255, 255, 255, 0.9) 0px 2px 0px inset, rgba(15, 90, 55, 0.28) 0px -3px 5px inset; }

.opt.no { background: linear-gradient(180deg,#FBEFEC 0%,var(--rose-tint) 45%,#EFD2CA 100%); border-color: rgb(198, 131, 114); color: rgb(141, 59, 45); box-shadow: rgba(140, 60, 45, 0.2) 0px 1.5px 2px, rgba(140, 60, 45, 0.22) 0px 3px 6px, rgb(255, 255, 255) 0px 2px 0px inset, rgba(160, 80, 60, 0.2) 0px -3px 5px inset; }

.face.back { transform: rotateY(180deg); background: linear-gradient(rgb(253, 251, 245) 0%, rgb(248, 242, 229) 55%, rgb(240, 229, 204) 100%); border-color: rgb(183, 165, 124); box-shadow: rgba(90, 70, 30, 0.14) 0px 2px 4px, rgba(90, 70, 30, 0.14) 0px 6px 14px, rgba(255, 255, 255, 0.9) 0px 2px 0px inset, rgba(140, 110, 50, 0.14) 0px -4px 7px inset; }

.ctl { width: 46px; height: 46px; border-radius: 50%; font-size: 19px; cursor: pointer; background: linear-gradient(rgb(255, 255, 255), rgb(241, 237, 226)); border: 1.5px solid rgb(201, 191, 168); color: var(--ink-3); box-shadow: rgba(70, 60, 40, 0.16) 0px 1.5px 2px, rgba(70, 60, 40, 0.14) 0px 3px 6px, rgb(255, 255, 255) 0px 2px 0px inset, rgba(130, 110, 70, 0.14) 0px -3px 4px inset; }

.ctl.ok { background: linear-gradient(180deg,#EFFAF5 0%,var(--jade-tint) 45%,#C4E5D6 100%); border-color: rgb(111, 175, 151); color: rgb(29, 92, 77); box-shadow: rgba(25, 90, 70, 0.2) 0px 1.5px 2px, rgba(25, 90, 70, 0.2) 0px 3px 6px, rgb(255, 255, 255) 0px 2px 0px inset, rgba(25, 110, 85, 0.18) 0px -3px 4px inset; }

.ctl.no { background: linear-gradient(180deg,#FBEFEC 0%,var(--rose-tint) 45%,#EFD2CA 100%); border-color: rgb(198, 131, 114); color: rgb(141, 59, 45); box-shadow: rgba(140, 60, 45, 0.2) 0px 1.5px 2px, rgba(140, 60, 45, 0.2) 0px 3px 6px, rgb(255, 255, 255) 0px 2px 0px inset, rgba(160, 80, 60, 0.18) 0px -3px 4px inset; }

.dscore { font-family: var(--sans); font-weight: 800; font-size: 13px; color: var(--muted); min-width: 56px; }

.fin { border-radius: 22px; padding: 32px 22px; text-align: center; background: linear-gradient(rgb(249, 247, 250) 0%, rgb(238, 235, 240) 24%, rgb(200, 195, 211) 50%, rgb(122, 118, 143) 78%, rgb(51, 47, 76) 100%); border: 1.5px solid rgb(168, 162, 182); box-shadow: rgba(255, 255, 255, 0.45) 0px 2px 2px inset, rgba(40, 36, 60, 0.2) 0px 3px 8px, rgba(40, 36, 60, 0.34) 0px 12px 26px -8px; }
