:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:32px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15}.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.me{margin-left:auto;font-size:13px;font-weight:800;color:var(--ac);padding:8px 12px;border-radius:14px;white-space:nowrap}
@media(max-width:600px){.top small{display:none}.top .zh{font-size:26px}}
.main{padding:22px 20px}@media(max-width:600px){.main{padding:18px 14px}}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:14px;background:#FFF1D6;color:#7A5200;font-weight:800;font-size:14px;text-align:center}
h2{font-size:25px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:6px}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 8px}
.lead{font-size:16.5px;line-height:1.5;margin-top:10px}.lead b{color:var(--ink)}
.stepn{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ac);padding:4px 10px;border-radius:9px}
.list{display:grid;gap:12px;margin-top:16px}
.ti{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-align:left;width:100%}
.ti .e{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:24px}
.ti b{display:block;font-size:16.5px;color:var(--ink)}.ti small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}

/* a quiz round: shared look for every "listen and choose" task */
function quiz(idx,cfg){let i=0,ok=0;const res=[],MS=[];const items=cfg.items;
 const ask=()=>{if(i>=items.length){send(cfg.part,{score:ok,of:items.length,miss:MS});const k=ok/items.length;
   shell(`${STEP}<h2>${cfg.h} — готово!</h2><div class="res">${ok} / ${items.length}</div><p class="lead">${k>=.8?'Отлично! 🌟':k>=.5?'Хорошо! Можно пройти ещё разок для закрепления.':'Сделай ещё разок — во второй раз будет легче 💪'}</p>
    <div class="ans" style="grid-template-columns:repeat(${cfg.cols||2},1fr)">${items.map((x,j)=>`<span class="${res[j]?'ok':'no'}">${cfg.label(x)}</span>`).join('')}</div><div class="row"><button class="btn g" id="again">Ещё раз</button></div>`,idx);
   $('#again').onclick=()=>TASKS[idx].run(idx);return;}
  const it=items[i];let first=true,lock=false;
  shell(`${STEP}<h2>${cfg.h}</h2><div class="qcard in"><div class="qhead"><span>${cfg.unit||'Вопрос'} ${i+1} из ${items.length}</span><span>${ok} ✓</span></div>
   <div class="dots">${items.map((_,j)=>`<i class="${j<i?(res[j]?'ok':'no'):j===i?'cur':''}"></i>`).join('')}</div>
   ${it.play?'<button class="play n" id="pl">▶</button>':''}${it.q||''}
   <div class="opts" style="${it.cols?`grid-template-columns:repeat(${it.cols},1fr)`:''}">${it.o.map((x,k)=>`<button class="opt ${it.wide?'wide':''}" data-k="${k}">${it.show?it.show(x):x}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`,idx);
  const pl=$('#pl');if(pl){pl.onclick=()=>it.play(pl);setTimeout(()=>it.play(pl),300);}
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(lock)return;const fb=$('#fb'),x=it.o[+b.dataset.k];
   if(x===it.right){lock=true;b.classList.add('ok');if(first)ok++;else MS.push(cfg.miss(it));res[i]=first;fb.className='fb ok';fb.innerHTML=it.yes||'✓ Верно!';setTimeout(()=>{i++;ask();},it.yes?1700:1000);}
   else{first=false;b.classList.add('no');fb.className='fb no';fb.innerHTML=it.no?it.no(x):'Не совсем. Послушай ещё раз ▶';if(pl)it.play(pl);}});};
 ask();}

/* ===================== AI trainer: the melody of a pair of syllables ===================== */
// split a recording into two syllables (a voiceless initial b p d t g k f h makes a short silence between them),
// and draw each syllable's melody in semitones against the speaker's own middle voice
function pairTrack(pcm){const sr=16000,hop=160,W=512,F=W+Math.floor(sr/65)+2,f=[],rms=[];let mx=0;
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<W;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/W);rms.push(r);if(r>mx)mx=r;}
 if(!mx)return null;const thr=Math.max(0.01,mx*0.10);
 for(let i=0,k=0;i+F<pcm.length;i+=hop,k++){if(rms[k]<thr){f.push(0);continue;}const [v,ap]=yin(pcm.subarray(i,i+F),sr);f.push(v>65&&v<550&&ap<0.25?v:-1);}
 for(let pass=0;pass<2;pass++){const g=f.slice();for(let i=0;i<g.length;i++){if(g[i]<=0)continue;const nb=[];for(let d=1;d<=5&&nb.length<6;d++){if(g[i-d]>0)nb.push(g[i-d]);if(g[i+d]>0)nb.push(g[i+d]);}
  if(!nb.length){f[i]=-1;continue;}nb.sort((p,q)=>p-q);const m=nb[nb.length>>1];if(Math.abs(12*Math.log2(g[i]/m))>5)f[i]=-1;}}
 // groups of pitched frames; a gap splits them only when it holds a quiet stretch (the consonant) or is long
 const runs=[];let cur=null;f.forEach((x,i)=>{if(x>0){if(cur&&i-cur.e>1){const gap=rms.slice(cur.e+1,i);const quiet=gap.filter(r=>r<mx*0.12).length;if(quiet>=2||i-cur.e>25){runs.push(cur);cur=null;}}if(!cur)cur={s:i,e:i};cur.e=i;}});if(cur)runs.push(cur);

   const tr=rocks.find(r=>r.s===target[1]);if(tr&&tr.y>H()-150){miss.push(target[1]);toast('Пропустил! Это было '+target[1]);lose();if(!over)spawn();}requestAnimationFrame(tick);};
  const end=()=>{over=true;rocks.forEach(r=>r.el.remove());const prev=S.done.game||{};const b=Math.max(prev.best||0,score);send('game',{best:b,last:score,games:(prev.games||0)+1,miss:miss.slice(-10)});
   const c=document.createElement('div');c.className='cover';c.innerHTML=`<div style="font:900 28px Nunito;color:#fff">Игра окончена!</div><div style="font:900 60px Nunito;color:#FFE27A">${score}</div><div style="font-weight:800;color:#C9CCF5">${score>=b&&score>0?'🏆 Новый рекорд!':'Рекорд: '+b}</div><button class="btn" id="re" style="margin-top:8px">Ещё раз</button>`;sky.appendChild(c);$('#re').onclick=()=>game(idx);};
  $('#rp').onclick=sayT;hud();spawn();requestAnimationFrame(t=>{last=t;tick(t);});}}

/* ---- results: honest but always friendly ---- */
function results(idx){const rows=TASKS.filter(x=>!x.extra).map((x,i)=>{const d=S.done[x.id];let sc='',lv=0,msg;
  if(x.id==='brief'){lv=d?3:0;msg=d?'Прочитано и прослушано ✓':'Загляни сюда — тут всё, что было на уроке';}
  else if(NEED[x.id]){const n=Object.keys((d&&d.items)||{}).length,m=NEED[x.id];sc=n+' / '+m;lv=n>=m?3:n?1:0;msg=n>=m?'Все записи отправлены — молодец!':n?`Осталось отправить ${m-n} — это обязательное задание, учитель ждёт твой голос 🎤`:'Обязательное задание — учитель ждёт твой голос 🎤';}
  else if(x.id==='game'){lv=d?3:0;sc=d?'🏆 '+(d.best||0):'';msg=d?'Твой рекорд! Попробуй его побить 🚀':'Игра в конце — награда за работу!';}
  else if(x.id==='ai'){const p=(d&&d.passed)||0,m=PAIRS.length;sc=d?p+' / '+m:'';lv=!d?0:p>=m*.8?3:p>=m*.4?2:1;msg=!d?'Ещё не пробовал(а)':lv===3?'Сочетания тонов получаются отлично! 🌟':lv===2?'Хорошо! Потренируй ещё несколько пар для закрепления':'Сочетания тонов — это тренировка. Попробуй ещё разок, с каждым разом получается лучше 💪';}
  else{if(d){const k=d.of?d.score/d.of:0;sc=d.score+' / '+d.of;lv=k>=.8?3:k>=.5?2:1;msg=lv===3?'Отлично! 🌟':lv===2?'Хорошо! Можно сделать ещё разок для закрепления':'Сделай ещё разок — во второй раз будет легче 💪';}else msg='Ещё не сделано';}
  return {x,i,sc,lv,msg};});
 const dn=doneCnt(),stars=rows.filter(r=>r.lv===3).length,again=rows.filter(r=>r.lv===1||r.lv===2);
 const head=dn>=NT?'🎉 Все задания сделаны!':dn>=NT/2?'💪 Больше половины позади!':dn?'🚀 Хорошее начало!':'👋 Начнём?';
 shell(`<h2>🏁 Мои результаты</h2><div class="sum n"><div class="big2">${dn} / ${NT}</div><div><b>${head}</b><small>${'⭐'.repeat(stars)}${stars?` ${stars} ${stars===1?'задание':stars<5?'задания':'заданий'} на отлично`:'Звёзды появятся за задания на отлично'}</small></div></div>
  ${again.length?`<div class="tip">🔁 Для закрепления можно пройти ещё разок: <b>${again.map(r=>r.x.t).join(', ')}</b>. Это не страшно — так и тренируются!</div>`:''}
  <div class="rlist">${rows.map(r=>`<button class="rr n" data-go="${r.x.id}"><span class="e" style="background:${r.x.bg}">${r.x.e}</span><span><b>${r.i+1}. ${r.x.t}</b><small>${r.msg}</small></span><span class="rs l${r.lv}">${r.sc||(r.lv?'✓':'—')}</span></button>`).join('')}</div>
  <p class="lead" style="text-align:center">Нажми на задание, чтобы пройти его ещё раз. Ошибаться не страшно — не попробовать жалко!</p>`,idx);
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash='#'+b.dataset.go);}

// a shared link may carry #task from someone's address bar — always start from the menu
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
route();
</script></body></html>
