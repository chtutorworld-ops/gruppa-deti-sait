<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Голос для диктанта</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--bg:#EEF1F8;--ink:#20264A;--mu:#6B7290;--ac:#5B6BD8;--ok:#1FA77A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Manrope,sans-serif}
.w{max-width:900px;margin:0 auto;padding:18px 16px 40px}h1{font:900 28px Nunito;margin:6px 0}
.lead{color:var(--mu)}.v{margin-top:16px;padding:16px;border-radius:22px;background:#fff;box-shadow:0 8px 22px rgba(40,50,110,.08)}
.v.on{box-shadow:0 0 0 4px var(--ok),0 8px 22px rgba(40,50,110,.08)}
.vh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}.vh b{font:900 20px Nunito}.tag{padding:3px 10px;border-radius:10px;background:#E6F7EF;color:#14674A;font:800 13px Manrope}
.st{color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.g button{padding:10px 4px;border:0;border-radius:14px;background:#F2F4FB;font:900 22px Nunito;color:var(--ac);cursor:pointer}
.g button small{display:block;font:700 12px Manrope;color:var(--mu)}.g button.pl{background:#FFF1B8}
</style></head><body><div class="w">
<h1>🎙 Голос для диктанта</h1>
<p class="lead">Один голос для всех диктантов: говорит протяжно, 3-й тон с ямкой и «кряхтением». Голос выбран автоматически: у него больше всего слогов звучат ярко и правильно (проверяет программа по мелодии голоса). Ниже можно послушать все голоса-кандидаты и сравнить.</p>
<div id="out"><p class="lead">Загружаю…</p></div></div>
<script>
const A='../audio/dict/';const code=c=>[...c].map(x=>x.codePointAt(0).toString(16)).join('-');
const NM={'zh-CN-YunyangNeural':'Юньян (мужской, дикторский)','zh-CN-YunxiNeural':'Юньси (молодой мужской)','zh-CN-YunjianNeural':'Юньцзянь (мужской)','zh-CN-XiaoyiNeural':'Сяои (женский, звонкий)','zh-CN-XiaoxiaoNeural':'Сяосяо (женский)'};
let cur=null;
fetch(A+'check.json?'+Date.now()).then(r=>r.json()).then(j=>{
 const it=Object.values(j.items);const py={};it.forEach(x=>py[x.c]=x.s);
 document.getElementById('out').innerHTML=Object.entries(j.voices).sort((a,b)=>b[1].score-a[1].score).map(([v,s])=>`<div class="v${v===j.voice?' on':''}">
  <div class="vh"><b>${NM[v]||v}</b>${v===j.voice?'<span class="tag">✓ выбран для диктантов</span>':''}<span class="st">ярко и верно: ${s.ok} из ${s.of} слогов · 3-й тон: ${s.t3ok} из ${s.t3of}, с кряхтением ${s.t3creak}</span></div>
  <div class="g">${[...j.sample].map(c=>`<button data-u="${A}cmp/${v}/${code(c)}.mp3">${py[c]||c}<small>${c}</small></button>`).join('')}</div></div>`).join('');
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{try{cur&&cur.pause()}catch(e){}document.querySelectorAll('.pl').forEach(x=>x.classList.remove('pl'));b.classList.add('pl');cur=new Audio(b.dataset.u);cur.onended=()=>b.classList.remove('pl');cur.play().catch(()=>b.classList.remove('pl'));});
}).catch(()=>{document.getElementById('out').innerHTML='<p class="lead">Голоса ещё готовятся — обновите страницу через 10–15 минут.</p>';});
</script></body></html>
