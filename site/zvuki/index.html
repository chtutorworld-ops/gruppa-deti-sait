:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:32px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15}.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.main{padding:22px 20px}
@media(max-width:600px){.main{padding:18px 14px}}
h2{font-size:25px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:6px}
.lead{font-size:16.5px;line-height:1.5;margin-top:10px}
.lead b{color:var(--ink)}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 10px}
.list{display:grid;gap:12px;margin-top:16px}
.ti{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-align:left;width:100%}
.ti .no{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font:900 22px Nunito;color:#fff;background:var(--ac)}
.ti b{display:block;font-size:16.5px;color:var(--ink);line-height:1.25}.ti small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.ti .st{margin-left:auto;font-size:13px;font-weight:800;color:var(--ok);white-space:nowrap}
.ti.hot{box-shadow:0 0 0 3px var(--t2),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--ac);padding:8px 14px;border-radius:14px;margin-bottom:12px}
.tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#B0284F;padding:4px 10px;border-radius:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:16.5px;background:var(--ac);color:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.btn.g{background:var(--bg);color:var(--ac2)}.btn:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.qcard{padding:20px;margin-top:16px;text-align:center}
.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px}.dots i{width:22px;height:6px;border-radius:3px;background:#D6DBE6}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}.dots i.cur{background:var(--ac)}
.play{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:16px auto 6px;font-size:38px;color:var(--ac)}
.play.on{color:var(--ok);box-shadow:inset 6px 6px 12px var(--sh1),inset -6px -6px 12px var(--sh2)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.opts.o3{grid-template-columns:repeat(3,1fr)}
.opt{padding:16px 8px;border-radius:18px;font-family:Nunito;font-weight:900;font-size:30px;color:var(--ac2);box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.opt.ok{background:#DDF5EC;box-shadow:inset 3px 3px 8px #B9DCCD;color:#14855E}.opt.no{background:#FFE3EB;box-shadow:inset 3px 3px 8px #F0C2D0;color:#B0284F}
.fb{margin-top:12px;font-size:16px;font-weight:700;line-height:1.45;min-height:24px}.fb.ok{color:#14855E}.fb.no{color:#D9366A}
.res{font-size:46px;font-weight:900;font-family:Nunito;color:var(--ac2);margin-top:8px}
.ans{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.ans span{padding:8px 4px;border-radius:12px;font-family:Nunito;font-weight:800;font-size:18px;text-align:center}
.ans .ok{background:#DDF5EC;color:#14855E}.ans .no{background:#FFE3EB;color:#B0284F}
@media(max-width:480px){.ans{grid-template-columns:repeat(4,1fr)}}
.cards{display:grid;gap:12px;margin-top:14px}@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{padding:14px 16px;border-radius:20px;font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.chip{padding:8px 15px;border-radius:15px;font-family:Nunito;font-weight:900;font-size:21px;line-height:1.1}
.chip.on{box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 7px var(--sh2)}
.vow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.vow .col{padding:10px 2px;border-radius:20px;display:grid;gap:2px;justify-items:center}
.vow .col small{font-size:13px;font-weight:800;color:var(--mu)}
.vow button{font-family:Nunito;font-weight:900;font-size:30px;line-height:1.2;padding:2px 6px;border-radius:12px}
.vow button.on{box-shadow:inset 3px 3px 7px var(--sh1),inset -3px -3px 7px var(--sh2)}
@media(max-width:480px){.vow button{font-size:25px}}
.tip{margin-top:14px;padding:12px 16px;border-radius:16px;background:#FFF6DC;color:#6B5310;font-size:15px;line-height:1.45}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.hole{position:relative;height:170px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#E9EDF4 0 55%,#D3D9E6 55%)}
.hole::after{content:'';position:absolute;left:10%;right:10%;bottom:14px;height:34px;border-radius:50%;background:#2B3270;opacity:.85}
.ml{position:absolute;left:50%;bottom:-150px;transform:translateX(-50%);width:96px;transition:bottom .22s ease-out;z-index:1;cursor:pointer;border:0;background:none;padding:0}
.ml.up{bottom:26px}.ml svg{width:96px;height:110px;display:block}
.ml b{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:#fff;border-radius:10px;padding:2px 8px;font:900 22px Nunito;color:#2B3270;white-space:nowrap;box-shadow:0 2px 0 #C5CBD8}
.ml.hit b{background:#2DBE8C;color:#fff}.ml.bad b{background:#FF5C8A;color:#fff}
.tbar{height:8px;border-radius:5px;background:#D6DBE6;margin-top:14px;overflow:hidden}.tbar i{display:block;height:100%;background:linear-gradient(90deg,#F5A524,#FF5C8A);width:100%}
@media(max-width:600px){.top small{display:none}.top .zh{font-size:26px}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ti.lk{opacity:.5}.ti.lk .no{background:#AEB5C8!important}
.ti .st.lk{color:var(--mu)}
/* shooter */
.arena{position:relative;height:min(62vh,430px);border-radius:22px;overflow:hidden;margin-top:12px;background:linear-gradient(180deg,#DCE6FF,#F3E9FF 70%,#FFE9F1);touch-action:manipulation}
.bub{position:absolute;bottom:-110px;width:74px;height:74px;margin-left:-37px;border-radius:50%;display:grid;place-items:center;font:900 23px Nunito;color:#2B3270;
 background:radial-gradient(circle at 32% 28%,#fff 0 12%,rgba(255,255,255,.55) 13% 30%,rgba(255,255,255,.18) 60%),var(--bc,#9FB4FF);box-shadow:inset -6px -8px 14px rgba(43,50,112,.18),0 6px 14px rgba(43,50,112,.15)}
.bub.pop{transform:scale(1.5);opacity:0;transition:transform .25s,opacity .25s}
.bub.bad{animation:shake .35s}.bub.show{outline:4px solid var(--ok);outline-offset:3px}
@keyframes shake{25%{translate:-8px 0}75%{translate:8px 0}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font:900 18px Nunito;color:var(--ac2)}
.hud .cmb{color:var(--t4)}
/* dictation keyboard */
.kb h4{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px;text-align:left}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{min-width:52px;padding:10px 10px;border-radius:14px;font:900 23px Nunito;color:var(--ac2);box-shadow:4px 4px 10px var(--sh1),-4px -4px 10px var(--sh2)}
.key.on{background:var(--ac);color:#fff;box-shadow:inset 3px 3px 7px #3D4BB0}
.key.tn{min-width:66px;font-size:26px}.key.tn small{display:block;font:800 11px Manrope}
.prev{font:900 54px Nunito;color:var(--ac2);min-height:66px;margin-top:6px}
.prev i{color:#C5CBD8;font-style:normal}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;margin-top:10px;font-size:16px;align-items:center}
.cmp .py{font-size:28px}
.why{text-align:left;margin-top:10px;display:grid;gap:8px}
.why div{padding:10px 14px;border-radius:14px;background:#FFF0F4;color:#7A1F3D;font-size:15px;line-height:1.45}
.why div.ok{background:#E6F7EF;color:#14674A}
/* cards to say aloud */
.say{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.sc{padding:14px 10px;border-radius:20px;text-align:center}
.sc .zh{font-size:44px;color:var(--ac2);line-height:1.1}.sc .py{font-size:19px;color:var(--ac)}.sc small{display:block;font-size:13px;color:var(--mu);font-weight:700}
.sc .row{justify-content:center;margin-top:8px;gap:8px}.sc .btn{padding:9px 14px;font-size:14.5px}
.sc.done{box-shadow:0 0 0 3px var(--ok),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
/* radicals */
.radq{font-size:96px;line-height:1.1;margin:12px 0 4px}
.radq.zh{color:var(--ac2)}
.opts .opt.em{font-size:46px;font-family:inherit}.opts .opt.zh{font-family:var(--han);font-size:48px;font-weight:400}
/* writing */
.wbox{position:relative;width:min(300px,78vw);height:min(300px,78vw);margin:14px auto 0;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;touch-action:none}
.wbox svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wbox .hw{position:absolute;inset:0}
.wch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.wch span{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--han);font-size:30px;color:var(--ac2)}
.wch span.cur{box-shadow:0 0 0 3px var(--ac)}.wch span.ok{background:#DDF5EC;color:#14855E}
/* name */
.nmch{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.nmch button{padding:12px 18px;border-radius:16px;font-weight:800;font-size:17px;box-shadow:5px 5px 12px var(--sh1),-5px -5px 12px var(--sh2)}
.bigname{font-family:var(--han);font-size:64px;color:var(--ac2);line-height:1.15;margin-top:6px}
/* xiaoming */
.xm{display:grid;gap:12px;margin-top:14px}
.xm .ln{display:flex;gap:10px;align-items:flex-end}
.xm .ln.me{flex-direction:row-reverse}
.xm .av{flex:none;width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(43,50,112,.2)}
.xm .av.me{display:grid;place-items:center;background:var(--t2);color:#fff;font:900 22px Nunito}
.xm .bb{padding:12px 16px;border-radius:20px 20px 20px 6px;background:#fff;max-width:78%;text-align:left;box-shadow:0 4px 10px rgba(43,50,112,.08)}
.xm .me .bb{border-radius:20px 20px 6px 20px;background:#E3E8FF}
.xm .bb .zh{font-size:30px;color:var(--ink);line-height:1.25}.xm .bb .py{display:block;color:var(--ac);font-size:16px}.xm .bb small{display:block;color:var(--mu);font-weight:700;font-size:13.5px}
.xm .bb .nw{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--t4);border-radius:8px;padding:2px 7px;margin-bottom:4px}
.mic{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;margin:16px auto 4px;font-size:44px;background:var(--bg);box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2);transform:scale(var(--lvl,1));transition:transform .08s}
.mic.rec{background:#FFE3EB;box-shadow:0 0 0 6px rgba(255,92,138,.35)}.mic.busy{opacity:.5}
.hint2{font-size:14.5px;font-weight:700;color:var(--mu)}
/* lesson 6 */
.pc2 .row{gap:6px}.pc2 .btn{padding:9px 12px;font-size:14px}
.pc2{min-width:0}.say:has(.pc2){grid-template-columns:repeat(2,minmax(0,1fr))}
.scl{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.scl button{display:grid;justify-items:center;gap:4px;padding:14px 6px;border-radius:20px}.scl span{font-size:40px;line-height:1}.scl small{font-size:13px;font-weight:800;color:var(--mu)}
.scl button.on{box-shadow:0 0 0 3px var(--ac),inset 3px 3px 8px var(--sh1)}
.chip.n{box-shadow:4px 4px 10px var(--sh1),-4px -4px 10px var(--sh2)}.chip.on{background:var(--ac);color:#fff;box-shadow:inset 3px 3px 7px #3D4BB0}
.fd{position:relative;height:300px;margin-top:8px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,rgba(10,6,40,.15),rgba(10,6,40,.35)),url(img/fon.jpg) 30% 50%/cover,#1A1050;box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.fd::before{content:'';position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 48% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 66% 8%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 22% 44%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 58% 52%,#fff 50%,transparent 51%);opacity:.8;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
.fd .mt{position:absolute;left:0;right:0;bottom:0;height:120px}
.fd .lan{position:absolute;font-size:22px;filter:drop-shadow(0 0 8px #FF7A3D);animation:lf 5s ease-in-out infinite alternate}
@keyframes lf{to{transform:translateY(-14px) rotate(6deg)}}
.fd .dr{position:absolute;left:-4%;bottom:34px;width:230px;height:160px;display:grid;place-items:center;font-size:118px;line-height:1;animation:dfl 2.4s ease-in-out infinite alternate;transform-origin:50% 60%}
.fd .dr img{width:100%;height:100%;object-fit:contain}
@keyframes dfl{to{transform:translateY(-12px)}}
.fd .orb{position:absolute;right:14%;top:-80px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:900 30px Nunito;color:#fff;background:radial-gradient(circle at 35% 30%,#FFFFFF 0,#9AE8FF 18%,#3B6BFF 55%,#1A1E7A 100%);box-shadow:0 0 30px #5BB8FF,0 0 70px rgba(91,184,255,.6);animation:fall var(--t,7s) linear forwards}
@keyframes fall{to{top:200px}}
.fd .fire{position:absolute;left:18%;bottom:120px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#FFF7C2 0,#FFB23D 40%,#FF4D1A 75%,rgba(255,77,26,0) 100%);box-shadow:0 0 30px #FF7A1A;opacity:0}
.fd.hit .fire{animation:shoot .45s ease-in forwards}
@keyframes shoot{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:1;transform:translate(var(--fx,220px),var(--fy,-60px)) scale(1.6)}}
.fd.hit .orb{animation-play-state:paused;animation:boom .55s .4s forwards}
@keyframes boom{50%{transform:scale(1.8);filter:brightness(2.5);opacity:1}100%{transform:scale(2.4);opacity:0}}
.fd.hit .dr{animation:roar .5s}
@keyframes roar{40%{transform:scale(1.18) rotate(-6deg)}}
.fd.miss .orb{animation-play-state:paused}
.fd.miss{animation:quake .45s}
@keyframes quake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.fd .tag{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 16px;border-radius:14px;background:rgba(255,255,255,.14);backdrop-filter:blur(4px);color:#FFE59A;font:900 22px Nunito;letter-spacing:.04em;white-space:nowrap}
.fd .wall{position:absolute;right:0;bottom:0;width:38%;height:62px;background:linear-gradient(180deg,#7A2E3A,#4A1A28);clip-path:polygon(0 30%,10% 30%,10% 0,20% 0,20% 30%,40% 30%,40% 0,50% 0,50% 30%,70% 30%,70% 0,80% 0,80% 30%,100% 30%,100% 100%,0 100%)}
.zk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.zk .opt{font-size:34px;padding:18px 6px;background:linear-gradient(160deg,#1E5F4C,#0E3B30);color:#E9FFF6;box-shadow:0 6px 14px rgba(14,59,48,.35),inset 0 0 0 2px rgba(120,255,200,.35);text-shadow:0 0 10px rgba(120,255,200,.8)}
.zk .opt.ok{background:linear-gradient(160deg,#2DBE8C,#16865F)}.zk .opt.no{background:linear-gradient(160deg,#FF5C8A,#C2335C)}
.gst{background:linear-gradient(180deg,rgba(18,11,58,.25) 0,rgba(18,11,58,.92) 62%),url(img/dragon-hero.jpg) 50% 0/100% auto no-repeat,#120B3A;color:#fff;border-radius:26px;padding:210px 22px 22px;text-align:center}
.gst h3{margin:0 0 6px;font-size:28px;color:#FFE59A}.gst p{margin:4px 0;color:#DCD6FF;font-size:17px;line-height:1.45}
.xm .ln .btn{flex:none;align-self:center}
/* ===== ДЗ 7 ===== */
.pbar{position:relative;margin:-6px 0 16px;padding:10px 16px 12px;border-radius:18px}
.pbt{display:flex;justify-content:space-between;align-items:baseline;font:800 14px Manrope;color:var(--mu)}.pbt b{font:900 20px Nunito;color:var(--ac2)}
.pbl{height:12px;border-radius:7px;background:#D6DBE6;margin-top:6px;overflow:hidden}.pbl i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#2DBE8C,#5B6BD8);transition:width .5s}
.ti .sc7{margin-left:auto;font:900 15px Nunito;color:var(--ok);white-space:nowrap}
.ti.todo .no{background:#AEB5C8}
.left{margin-top:18px;padding:16px 18px;border-radius:22px;background:#FFF0F4;box-shadow:inset 0 0 0 3px #FFB3C8}
.left h3{margin:0 0 8px;color:#B0284F;font-size:20px}
.left button{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px;margin-top:8px;border-radius:16px;background:#fff;text-align:left;font-weight:800;color:var(--ink);font-size:16px}
.left button .no{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#FF5C8A;color:#fff;font:900 19px Nunito}
.left button small{margin-left:auto;color:var(--ac);font-weight:800;white-space:nowrap}
.allok{margin-top:18px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#2DBE8C,#5B6BD8);color:#fff;text-align:center;font:900 22px Nunito}
/* tones */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.tc{position:relative;padding:14px 10px 12px;border-radius:24px;color:#fff;text-align:center;background:var(--tc);box-shadow:0 10px 22px rgba(30,35,80,.18)}
.tc .tn{position:absolute;left:10px;top:10px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--tc);display:grid;place-items:center;font:900 26px Nunito}
.tc .tm{font:900 74px/1 Nunito;height:70px;display:grid;place-items:center}
.tc svg{width:100%;max-width:150px;height:46px;margin:2px auto 0;display:block}
.tc .ts{font:900 34px Nunito;margin-top:2px}
.tc small{display:block;font:800 14.5px Manrope;line-height:1.3;opacity:.95;margin-top:4px}
.tc button{margin-top:8px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.25);color:#fff;font-weight:900;font-size:16px}
@media(max-width:420px){.tc .tm{font-size:60px;height:58px}.tc .ts{font-size:28px}.tc small{font-size:13px}}
.big7{font:900 96px/1.1 Nunito;color:var(--ac2);margin:10px 0 0}
.big7.zh{font-family:var(--han);font-weight:400}
.big7 .num{display:inline-grid;place-items:center;width:120px;height:120px;border-radius:50%;color:#fff;font-size:76px}
.opt.num{font-size:34px}.opt.num small{display:block;font:800 13px Manrope;color:var(--mu)}
.opt.mk{font-size:60px;line-height:1}
.opt.tx{font:800 19px Manrope;padding:16px 8px}
.opt.zh{font-family:var(--han);font-weight:400;font-size:52px}
.opts.o4{grid-template-columns:repeat(2,1fr)}
.qq{font-size:20px;font-weight:800;color:var(--ink);line-height:1.35;margin-top:12px}.qq b{color:#B0284F}
.nxt{margin-top:14px;width:100%}
/* the ci / chi rule */
.zwarn{margin-top:14px;padding:18px 18px 16px;border-radius:26px;background:linear-gradient(135deg,#FF3D77,#FF8A3D);color:#fff;box-shadow:0 14px 30px rgba(255,61,119,.35)}
.zwarn .k2{display:inline-block;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.25);font:900 14px Manrope;letter-spacing:.06em;text-transform:uppercase}
.zwarn .h{font:900 27px/1.2 Nunito;margin-top:8px}
.zwarn p{font:700 17px/1.45 Manrope;margin-top:8px}.zwarn p b{background:rgba(255,255,255,.22);padding:0 6px;border-radius:8px}
.zpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.zpair div{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;color:var(--ink)}
.zpair .a{font:900 30px Nunito;color:#FF3D77}.zpair .a s{color:#9AA2BC;text-decoration-thickness:3px}
.zpair .r{font:900 24px Nunito;color:var(--ac2)}.zpair small{display:block;font:800 13px Manrope;color:var(--mu)}
.zrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.zrow button{padding:10px 4px;border-radius:18px;text-align:center}.zrow b{display:block;font:900 26px Nunito;color:var(--ac2)}.zrow small{font:800 15px Manrope;color:var(--mu)}
.zrow button.hot{box-shadow:0 0 0 3px #FF3D77,6px 6px 14px var(--sh1)}.zrow button.hot b{color:#FF3D77}
/* radicals */
.keyh{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;padding:12px;border-radius:22px;background:linear-gradient(135deg,#FFE3EB,#FFF1D6)}
.keyh .zh{font-size:72px;line-height:1;color:#FF3D77}.keyh b{display:block;font:900 22px Nunito;color:var(--ink)}.keyh small{font:800 13px Manrope;color:var(--mu)}
.newb{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:10px;background:#5B6BD8;color:#fff;font:900 12.5px Manrope;letter-spacing:.05em}
.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.reveal div{padding:8px 4px;border-radius:16px;background:#fff;text-align:center}.reveal .zh{font-size:40px;color:var(--ac2);line-height:1.1}.reveal .py{font-size:16px;color:var(--ac)}.reveal small{display:block;font:800 13px Manrope;color:var(--ink)}
.reveal div.ok{box-shadow:inset 0 0 0 3px var(--ok);background:#E6F7EF}
.reveal i{font-style:normal;color:#FF3D77}
.split{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font:900 22px Nunito;color:var(--mu)}.split .zh{font-size:48px;color:var(--ac2)}
/* stroke order */
.sopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sopts button{padding:8px;border-radius:20px;background:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.sopts svg{width:100%;aspect-ratio:1/1;display:block}
.sopts button.ok{box-shadow:inset 0 0 0 4px var(--ok);background:#E6F7EF}.sopts button.no{box-shadow:inset 0 0 0 4px var(--no);background:#FFE3EB}
.sbig{width:min(150px,40vw);margin:10px auto 0;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;position:relative}
.sbig svg{display:block;width:100%;aspect-ratio:1/1}
.anim{width:min(220px,60vw);height:min(220px,60vw);margin:12px auto 0;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;position:relative}
.anim .hw{position:absolute;inset:0}.anim svg.grid{position:absolute;inset:0;width:100%;height:100%}
.srules{display:grid;gap:8px;margin-top:10px}.srules span{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);border-radius:16px;padding:9px 12px}.srules .zh{font-size:32px;line-height:1;min-width:40px;text-align:center}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#D9D2F5 url(img/fon.webp) 50% 100%/cover no-repeat}
html,body{background:transparent}
.opt.sv{padding:8px;background:#fff}.opt.sv svg{width:100%;aspect-ratio:1/1;display:block}
.opt.sv.ok{background:#DDF5EC}.opt.sv.no{background:#FFE3EB}
.zpair .a,.zpair .r{display:block}
.opts:has(.opt.sv){max-width:520px;margin-left:auto;margin-right:auto}
body{font-family:Manrope,'LXGW WenKai GB',system-ui,-apple-system,sans-serif}
/* ===== Звуки: таблица инициалей и финалей ===== */
.app.wide{max-width:980px}
.hero .tg{margin-bottom:6px}
.hc{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:14px;background:#E6F7EF;color:#14674A;font-weight:700;font-size:15px}.hc b{font:900 18px Nunito;color:#14855E}
.zh3{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:26px 0 12px;font-family:var(--han);font-weight:400;color:var(--ac2);font-size:30px}.zh3 span{font-family:Manrope,sans-serif;font-weight:800;color:var(--ink)}
.zgs{display:grid;gap:12px;grid-template-columns:4fr 4fr 3fr}
.zgs.two{grid-template-columns:1fr 1fr;margin-top:12px}
.zg{padding:10px;border-radius:24px;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 16%,#fff),color-mix(in srgb,var(--b) 10%,#fff));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--a) 35%,transparent)}
.zgh{font:800 13px Manrope;color:var(--b);text-transform:uppercase;letter-spacing:.05em;margin:0 4px 8px}
.zgr{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.zc{position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s}
.zi{display:grid;justify-items:center;align-content:center;gap:0;padding:12px 2px 8px;min-height:104px;border-radius:20px;color:#fff;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 8px 18px color-mix(in srgb,var(--b) 35%,transparent)}
.zi b{font:900 46px/1.05 Nunito}
.zi .ru{font:800 15px Manrope;opacity:0;transform:translateY(4px);transition:.2s;min-height:20px}
.zi .pf,.lgd .pf{font-style:normal}.zi .pf{position:absolute;right:6px;top:4px;font-size:18px}
.zc:hover,.zc.cur{transform:translateY(-3px) scale(1.04)}.zc:hover .ru,.zc.cur .ru,.zc.seen .ru{opacity:1;transform:none}
.zc.on{box-shadow:0 0 0 4px #FFE066,0 8px 18px rgba(0,0,0,.2)}
.zc.seen::after{content:'✓';position:absolute;left:7px;top:5px;font:900 13px Nunito;color:#fff;opacity:.85}
.zf.seen::after{color:var(--ok)}
.lgd{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:14.5px;font-weight:600;color:var(--t)}.lgd span{padding:6px 12px;border-radius:12px;background:#fff}
.zfs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.zfs.sm{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.zf{display:grid;justify-items:center;padding:14px 2px 10px;border-radius:22px;background:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.zf b{font:900 52px/1.05 Nunito;color:var(--ac2)}.zf .ru{font:800 17px Manrope;color:var(--ac);opacity:0;transition:.2s;min-height:22px}
.zwarn.big{margin-top:24px}
.zwarn .h2w{margin-top:14px;padding:10px 14px;border-radius:16px;background:#fff;color:#E0245E;font:900 21px/1.25 Nunito;text-align:center}
.zrow6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.zrow6 button{padding:10px 2px;border-radius:16px;background:#fff;text-align:center;color:var(--ink)}
.zrow6 b{display:block;font:900 28px Nunito;color:var(--ac2)}.zrow6 small{font:900 17px Manrope;color:#E0245E}
.zrow6 button.hot{box-shadow:0 0 0 4px #FFE066}.zrow6 button.on{background:#FFF6C9}
.zrow6.sm b{font-size:22px}.zrow6.sm small{font-size:14px}
@media(max-width:700px){.zgs{grid-template-columns:1fr}.zgs.two{grid-template-columns:1fr}.zi{min-height:88px}.zi b{font-size:38px}

 while(i<w.length){const c=w[i],nx=w[i+1]||'';

const firstT=b=>tonesOf(b)[0];
const sylS=(b,t)=>mark(b,t);
// чистый звук инициали — запись учителя (b0 … h0); у z c s zh ch sh записи нет — звучит слог с a
const CLEAN=['b','p','m','f','d','t','n','l','g','k','h'];
const iniDemo=l=>CLEAN.includes(l)?null:{b:l+'a',t:firstT(l+'a')};

/* ===================== звук (без пауз: всё заранее загружено) ===================== */
const AC={};
function aud(u){let a=AC[u];if(!a){a=new Audio(u);a.preload='auto';AC[u]=a;}return a;}
let unlockHint=false;
function play(u,el){return new Promise(res=>{const a=aud(u);try{if(curA&&curA!==a)curA.pause();}catch(e){}curA=a;el&&el.classList.add('on');let d=false;
 const end=ok=>{if(d)return;d=true;el&&el.classList.remove('on');res(ok);};
 try{a.currentTime=0;}catch(e){}a.onended=()=>end(true);a.onerror=()=>end(false);
 a.play().catch(e=>{if(e&&e.name==='NotAllowedError'&&!unlockHint){unlockHint=true;toast('Нажми на звук один раз — дальше он будет звучать сам, когда наводишь мышку');}end(false);});});}
const sylURL=(b,t)=>{const v=SYL.variant(b,t);return v?fn(v.c):null;};
async function playSyl(b,t,el){const u=sylURL(b,t||firstT(b));if(u)return play(u,el);}
async function playIni(l,el){if(CLEAN.includes(l)){if(await play(VOICE+l+'0.wav',el))return;return playSyl(l+(l==='f'?'u':'a'),0,el);}const d=iniDemo(l);return playSyl(d.b,d.t,el);}
const playFin=(l,el)=>playSyl(l==='i'?'i':l,0,el);
// заранее грузим то, что звучит при наведении (инициали, финали, первый тон каждого слога); остальные тоны — когда открылась подсказка
function preload(){CLEAN.forEach(l=>aud(VOICE+l+'0.wav'));INI.forEach(I=>{const d=iniDemo(I.l);if(d)aud(sylURL(d.b,d.t));});FIN.forEach(F=>aud(sylURL(F.l,firstT(F.l))));SY.forEach(s=>aud(sylURL(s.b,firstT(s.b))));}
// кнопки звука внутри правил
function introOn(){document.querySelectorAll('[data-sy]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [x,t]=b.dataset.sy.split('|');playSyl(x,+t,b);});}

/* ===================== всплывающая подсказка (наведи — на телефоне нажми) ===================== */
const PUFF='<span class="puff">💨 предыхательный</span>',NOP='<span class="nopf">непредыхательный</span>';
function popIni(l){const I=IN[l],g=GRP[I.grp],ex=FIN.map(F=>I.l+F.l).filter(b=>tonesOf(b).length);
 return `<div class="pp-h" style="--a:${g[2]};--b:${g[3]}"><b class="pp-l">${l}</b><span class="pp-eq">=</span><b class="pp-r">«${I.ru2||I.ru}»</b></div>
 <div class="pp-tag">${I.asp===1?PUFF:I.asp===0?NOP:''}<span class="pp-g">${g[0]}</span></div>
 ${CLEAN.includes(l)?'':`<div class="pp-n">Звучит слог <b>${sylS(I.l+'a',firstT(I.l+'a'))}</b></div>`}
 <div class="pp-x">${ex.map(b=>`<button data-sy="${b}|${firstT(b)}"><b>${sylS(b,firstT(b))}</b><small>${ruSyl(I.l,b.slice(I.l.length))}</small></button>`).join('')}</div>`;}
function popFin(l){const F=FN[l];
 return `<div class="pp-h" style="--a:#5B6BD8;--b:#2B3270"><b class="pp-l">${l}</b><span class="pp-eq">=</span><b class="pp-r">«${F.ru}»</b></div>
 ${l==='i'?'<div class="pp-warn">⚠️ После <b>z c s zh ch sh</b> буква i читается <b>«ы»</b>!</div>':''}
 <div class="pp-x">${tonesOf(l).map(t=>`<button data-sy="${l}|${t}"><b>${sylS(l,t)}</b><small>${t}-й тон</small></button>`).join('')}</div>`;}
function popSyl(b){const s=SY.find(x=>x.b===b);
 return `<div class="pp-h" style="--a:${GRP[IN[s.i].grp][2]};--b:${GRP[IN[s.i].grp][3]}"><b class="pp-l">${b}</b><span class="pp-eq">=</span><b class="pp-r">«${ruSyl(s.i,s.f)}»</b></div>
 <div class="pp-tag">${puffSyl(s.i,s.f)?PUFF:''}${noPuff(s.i,s.f)?'<span class="pp-hot">без 💨! предыхание исчезает</span>':''}${s.f==='i'&&ZG.includes(s.i)&&!noPuff(s.i,s.f)?'<span class="pp-hot">i = «ы»</span>':''}</div>
 <div class="pp-x">${tonesOf(b).map(t=>`<button data-sy="${b}|${t}"><b>${sylS(b,t)}</b><small>${t}-й тон</small></button>`).join('')}</div>`;}
let POPT=0,POPEL=null;
function showPop(el){const p=$('#pop');if(!p)return;const k=el.dataset;
 p.innerHTML=(k.ini?popIni(k.ini):k.fin?popFin(k.fin):popSyl(k.syl))+'<button class="pp-close" aria-label="Закрыть">✕</button>';
 p.hidden=false;POPEL=el;document.querySelectorAll('.zc.cur').forEach(x=>x.classList.remove('cur'));el.classList.add('cur');
 p.querySelectorAll('[data-sy]').forEach(b=>{const [x,t]=b.dataset.sy.split('|');aud(sylURL(x,+t));b.onclick=e=>{e.stopPropagation();playSyl(x,+t,b);};});
 p.querySelector('.pp-close').onclick=e=>{e.stopPropagation();hidePop();};
 if(matchMedia('(max-width:700px)').matches){p.className='pop sheet';p.style.left=p.style.top='';return;}
 p.className='pop';const r=el.getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;
 let x=r.left+r.width/2-pw/2;x=Math.max(10,Math.min(innerWidth-pw-10,x));let y=r.bottom+10;if(y+ph>innerHeight-10)y=r.top-ph-10;if(y<10)y=10;
 p.style.left=x+'px';p.style.top=y+'px';}
function hidePop(){const p=$('#pop');if(p)p.hidden=true;POPEL=null;document.querySelectorAll('.zc.cur').forEach(x=>x.classList.remove('cur'));}
function sound(el){const k=el.dataset;if(k.ini)return playIni(k.ini,el);if(k.fin)return playFin(k.fin,el);return playSyl(k.syl,0,el);}
function heard(el){const k=el.dataset.ini||el.dataset.fin;if(!k)return;el.classList.add('seen');if(!S.heard.includes(k)){S.heard.push(k);keepS();
 const m=$('#hcnt');if(m)m.innerHTML=hcnt();if(S.heard.length>=22&&!DONE[1]){finish(1,22,22,{heard:S.heard.slice()});const pb=$('#pbar');if(pb)pb.outerHTML=pbar();toast('🏆 Задание № 1 готово: ты послушал(а) все звуки!');const m2=$('#hcnt');if(m2)m2.innerHTML=hcnt();}}}
const hcnt=()=>{const h=S.heard.length;return DONE[1]?'✓ Задание № 1 сделано: все 22 звука прослушаны':`Прослушано <b>${Math.min(h,22)}</b> из 22 звуков (17 инициалей и 5 финалей)`;};
const hover=matchMedia('(hover:hover) and (pointer:fine)').matches;
function bindCells(){document.querySelectorAll('.zc').forEach(el=>{
  if(hover){el.addEventListener('mouseenter',()=>{clearTimeout(POPT);if(POPEL===el)return;showPop(el);sound(el);heard(el);});
   el.addEventListener('mouseleave',()=>{clearTimeout(POPT);POPT=setTimeout(hidePop,350);});}
  el.addEventListener('click',e=>{e.stopPropagation();clearTimeout(POPT);showPop(el);sound(el);heard(el);});});
 const p=$('#pop');p.onmouseenter=()=>clearTimeout(POPT);p.onmouseleave=()=>{if(hover){POPT=setTimeout(hidePop,350);}};p.onclick=e=>e.stopPropagation();}
document.addEventListener('click',()=>{if(POPEL)hidePop();});

/* ===================== главная: № 1 таблица + список тренировок ===================== */
const iniCard=l=>{const I=IN[l];return `<button class="zc zi${S.heard.includes(l)?' seen':''}" data-ini="${l}" style="--a:${GRP[I.grp][2]};--b:${GRP[I.grp][3]}"><b>${l}</b>${I.asp===1?'<i class="pf">💨</i>':''}<span class="ru">«${I.ru2||I.ru}»</span></button>`;};
const finCard=l=>`<button class="zc zf${S.heard.includes(l)?' seen':''}" data-fin="${l}"><b>${l}</b><span class="ru">«${FN[l].ru}»</span></button>`;
const grpBox=g=>{const G=GRP[g];return `<div class="zg" style="--a:${G[2]};--b:${G[3]}"><div class="zgh">${G[0]}</div><div class="zgr">${INI.filter(x=>x.grp===g).map(x=>iniCard(x.l)).join('')}</div></div>`;};
function sylTable(){return `<div class="stw"><table class="st"><tr><th></th>${FIN.map(F=>`<th>${F.l}</th>`).join('')}</tr>
 ${INI.map(I=>`<tr><th style="color:${GRP[I.grp][3]}">${I.l}</th>${FIN.map(F=>{const b=I.l+F.l;if(!tonesOf(b).length)return '<td></td>';
   const hot=F.l==='i'&&ZG.includes(I.l);return `<td><button class="zc zs${hot?' hot':''}${noPuff(I.l,F.l)?' np':''}" data-syl="${b}">${b}</button></td>`;}).join('')}</tr>`).join('')}</table></div>`;}
function home(scroll){const nx=TASKS.findIndex((x,i)=>x&&!DONE[i]);
 shell(`<div class="hero"><div class="tg">${tag(1)}</div><h2>🔊 Таблица звуков</h2><p class="lead">${hover?'<b>Наведи мышку</b>':'<b>Нажми</b>'} на любой звук: увидишь, как он звучит <b>по-русски</b>, и услышишь его. Послушай <b>все 22 звука</b> — это задание № 1.</p>
  <div class="hc" id="hcnt">${hcnt()}</div></div>
  <h3 class="zh3">声母 <span>Инициали — начало слога</span></h3>
  <div class="zgs">${['lips','tip','root'].map(grpBox).join('')}</div>
  <div class="zgs two">${['teeth','up'].map(grpBox).join('')}</div>
  <div class="lgd"><span><i class="pf">💨</i> <b>предыхательные</b>: p t k c ch — с сильным выдохом</span><span><b>b d g z zh</b> — непредыхательные, без выдоха</span></div>
  <h3 class="zh3">韵母 <span>Финали — конец слога</span></h3>
  <div class="zfs">${FIN.map(F=>finCard(F.l)).join('')}</div>
  <div class="zwarn big"><div class="k2">⚠️ Самое важное правило</div>
   <div class="h">После z c s zh ch sh буква <u>i</u> читается «ы»</div>
   <div class="zrow6">${ZG.map(l=>`<button data-sy="${l}i|${firstT(l+'i')}" class="${noPuff(l,'i')?'hot':''}"><b>${l}i</b><small>«${YI[l]}»</small></button>`).join('')}</div>
   <div class="h2w">ci = «цы», chi = «чшы» — ПРЕДЫХАНИЕ ИСЧЕЗАЕТ!</div>
   <p>Сами по себе <b>c</b> и <b>ch</b> предыхательные 💨. Но вместе с <b>i</b> выдох пропадает: <b>ci</b> = «цы», <b>chi</b> = «чшы».</p></div>
  <h3 class="zh3">拼音 <span>Инициаль + финаль = слог</span></h3>
  <p class="lead" style="margin-top:0">${hover?'Наведи':'Нажми'} на слог — услышишь его и увидишь все тоны. Розовые клетки — где i читается «ы».</p>
  ${sylTable()}
  <h3 class="zh3" style="margin-top:28px">🏋️ <span>Тренировки</span></h3>
  <div class="list">${TASKS.map((x,i)=>{if(!x||i===1)return '';return `<button class="ti n${i===nx?' hot':''}${DONE[i]?'':' todo'}" data-n="${i}"><span class="no" style="${DONE[i]?'background:var(--ok)':i===nx?'background:var(--ac)':''}">${i}</span><span><b>${x.t}</b><small>${x.d}</small></span><span class="sc7">${DONE[i]?'✓ '+DONE[i]:''}</span></button>`;}).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn" id="it">🏁 Мои итоги</button></div>`,true);
 $('#app').insertAdjacentHTML('beforeend','<div class="pop" id="pop" hidden></div>');
 bindCells();introOn();
 document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{location.hash='#'+b.dataset.n;});$('#it').onclick=()=>{location.hash='#itogi';};
 if(scroll===true)later(()=>{const h=document.querySelector('.hero');h&&h.scrollIntoView({block:'start'});},50);}

/* ===================== № 2 узнай инициаль ===================== */
const ruleIni=`<div class="rbox" style="--c1:#5B6BD8;--c2:#8E5BE8"><b>Как делать</b>Прозвучит слог. Слушай <b>самое начало</b> — это инициаль. Выбери её. Кнопка 🔊 — послушать ещё раз.</div>`;
function tIni(){quiz(2,{title:'👂 Узнай инициаль',intro:ruleIni,
 items:()=>{const L=shuffle(INI.map(x=>x.l)).concat(shuffle(INI.map(x=>x.l))).slice(0,10);return L.map(l=>{const I=IN[l];const ss=SY.filter(s=>s.i===l&&!(noPuff(s.i,s.f)));const s=rnd(ss);const t=rnd(tonesOf(s.b));
  const others=new Set();if(I.pair)others.add(I.pair);const near={s:'sh',sh:'s',z:'zh',zh:'z',c:'ch',ch:'c',n:'l',l:'n',f:'h',h:'f',m:'n'}[l];if(near)others.add(near);
  shuffle(INI.map(x=>x.l)).forEach(x=>{if(others.size<3&&x!==l)others.add(x);});
  const o=[l,...[...others].slice(0,3)];return {q:'<div class="qq">С какой инициали начинается слог?</div>',snd:()=>playSyl(s.b,t),o,r:l,cls:'py',
   why:`Это <b>${sylS(s.b,t)}</b> — «${ruSyl(s.i,s.f)}».`,lab:sylS(s.b,t)+' — инициаль?'};});}});}

/* ===================== № 3 предыхательный или нет ===================== */
const AO=['💨 предыхательный','непредыхательный'];
const ruleAsp=`<div class="rbox" style="--c1:#22A6C9;--c2:#5B6BD8"><b>Правило</b><div class="rr2"><span>💨 <b>p t k c ch</b> — предыхательные: с сильным выдохом</span><span><b>b d g z zh</b> — непредыхательные: без выдоха</span></div></div>
 <div class="tip" style="font-size:16px">Проверь рукой или листочком у рта: на 💨 он дрожит. Послушай пары: ${[['ba','pa'],['da','ta'],['ge','ke'],['za','ca'],['zha','cha']].map(([a,b])=>`<button class="chip n" data-sy="${a}|${firstT(a)}">${sylS(a,firstT(a))}</button>–<button class="chip n" data-sy="${b}|${firstT(b)}">${sylS(b,firstT(b))} 💨</button>`).join(' ')}</div>`;
function tAsp(){quiz(3,{title:'💨 Предыхательный или нет?',intro:ruleAsp,
 items:()=>{const P=SY.filter(s=>IN[s.i].pair&&s.f!=='i');const asp=shuffle(P.filter(s=>IN[s.i].asp===1)).slice(0,5),no=shuffle(P.filter(s=>IN[s.i].asp===0)).slice(0,5);
  return shuffle(asp.concat(no)).map(s=>{const t=rnd(tonesOf(s.b));const r=IN[s.i].asp===1?AO[0]:AO[1];
   return {q:'<div class="qq">Слушай: есть сильный выдох?</div>',snd:()=>playSyl(s.b,t),o:AO,r,cls:'tx',
    why:`Это <b>${sylS(s.b,t)}</b>: ${IN[s.i].asp===1?`<b>${s.i}</b> — предыхательный 💨, пара к ${IN[s.i].pair}`:`<b>${s.i}</b> — непредыхательный, пара к ${IN[s.i].pair} 💨`}.`,lab:sylS(s.b,t)};});}});}

/* ===================== № 4 как читается по-русски ===================== */
const ruleRu=`<div class="zwarn"><div class="k2">⚠️ Запомни</div><div class="h">После z c s zh ch sh: i = «ы»</div>
 <div class="zrow6 sm">${ZG.map(l=>`<button data-sy="${l}i|${firstT(l+'i')}" class="${noPuff(l,'i')?'hot':''}"><b>${l}i</b><small>«${YI[l]}»</small></button>`).join('')}</div>
 <p><b>ci</b> = «цы», <b>chi</b> = «чшы» — предыхание исчезает!</p></div>`;
function ruOpts(i,f){const r=ruSyl(i,f);if(f==='i'&&ZG.includes(i)){const alt={z:'цы',c:'сы',s:'шы',zh:'дзы',ch:'шы',sh:'сы'}[i];return [r,YI_WRONG[i],alt];}
 const o=new Set([r]);if(IN[i].pair)o.add(IN[i].ru+FN[f].ru);[...shuffle(INI)].forEach(I=>{if(o.size<3&&I.l!==i)o.add(I.ru+FN[f].ru);});return [...o].slice(0,3);}
function tRu(){quiz(4,{title:'🔤 Как читается по-русски?',intro:ruleRu,
 items:()=>{const zi=ZG.map(l=>SY.find(s=>s.b===l+'i')).filter(Boolean);const oth=shuffle(SY.filter(s=>!(s.f==='i'&&ZG.includes(s.i)))).slice(0,4);
  return shuffle(zi.concat(oth)).map(s=>{const t=rnd(tonesOf(s.b));const o=ruOpts(s.i,s.f);
   return {q:`<div class="qq">Как читается этот слог?</div><div class="big7">${sylS(s.b,t)}</div>`,o,r:o[0],cls:'tx ru',show:x=>'«'+esc(x)+'»',rshow:'«'+o[0]+'»',
    why:noPuff(s.i,s.f)?'Вместе с i выдох пропадает!':s.f==='i'&&ZG.includes(s.i)?'После z c s zh ch sh i = «ы».':'',after:()=>playSyl(s.b,t),wait:2000,lab:sylS(s.b,t)};});}});}

/* ===================== № 5 какая финаль ===================== */
const ruleFin=`<div class="rbox" style="--c1:#2DBE8C;--c2:#5B6BD8"><b>Как делать</b>Прозвучит слог. Слушай <b>конец</b> — это финаль. Помни: после z c s zh ch sh финаль <b>i</b> звучит «ы».</div>
 <div class="zfs sm">${FIN.map(F=>`<button class="chip n" data-sy="${F.l}|${firstT(F.l)}">${F.l} «${F.ru}»</button>`).join('')}</div>`;
function tFin(){quiz(5,{title:'🎧 Какая финаль?',intro:ruleFin,
 items:()=>{const L=[];const fs=shuffle(FIN.map(F=>F.l).concat(FIN.map(F=>F.l)));fs.forEach(f=>{const c=SY.filter(s=>s.f===f);L.push(rnd(c));});
  return L.map(s=>{const t=rnd(tonesOf(s.b));const o=[s.f,...pick(FIN.map(F=>F.l).filter(x=>x!==s.f),2)];
   return {q:'<div class="qq">Какая финаль в конце слога?</div>',snd:()=>playSyl(s.b,t),o,r:s.f,cls:'py',show:x=>esc(x)+(x==='i'&&ZG.includes(s.i)?'<small>«ы»</small>':`<small>«${FN[x].ru}»</small>`),
    why:`Это <b>${sylS(s.b,t)}</b> — «${ruSyl(s.i,s.f)}».`,lab:sylS(s.b,t)+' — финаль?'};});}});}

/* ===================== № 6 диктант: выбери слог ===================== */
const ruleDict=`<div class="rbox" style="--c1:#FF5C8A;--c2:#F5A524"><b>Диктант, как на уроке</b>Прозвучит слог — выбери, какой. Тон не важен, важны <b>инициаль и финаль</b>. Не спеши: можно послушать ещё раз 🔊</div>`;
function tDict(){quiz(6,{title:'📝 Диктант: выбери слог',intro:ruleDict,
 items:()=>{const L=shuffle(SY).slice(0,10);return L.map(s=>{const t=rnd(tonesOf(s.b));const o=new Set([s.b]);
  const near={s:'sh',sh:'s',z:'zh',zh:'z',c:'ch',ch:'c',n:'l',l:'n',f:'h',h:'f'}[s.i];
  [IN[s.i].pair,near].forEach(x=>{if(x&&SY.find(y=>y.b===x+s.f))o.add(x+s.f);});
  shuffle(SY.filter(y=>y.f===s.f)).forEach(y=>{if(o.size<4)o.add(y.b);});
  shuffle(SY.filter(y=>y.i===s.i)).forEach(y=>{if(o.size<4)o.add(y.b);});
  return {q:'<div class="qq">Какой слог прозвучал?</div>',snd:()=>playSyl(s.b,t),o:[...o].slice(0,4),r:s.b,cls:'py',
   why:`Это <b>${sylS(s.b,t)}</b> — «${ruSyl(s.i,s.f)}».`,lab:sylS(s.b,t)};});}});}

preload();route();
</script></body></html>
