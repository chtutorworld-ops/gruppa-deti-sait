:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}

<script>
const HW='dz2';
const API=/workers\.dev$/.test(location.hostname)?'/api/dz/':'https://gruppa-deti.ch-tutor-world.workers.dev/api/dz/';
const AUDIO=(/^https?:$/.test(location.protocol)&&!/claude/i.test(location.hostname))&&!/workers\.dev$/.test(location.hostname)?new URL('../audio/',location.href).href:'https://chtutorworld-ops.github.io/gruppa-deti-sait/audio/';
const VOICE=AUDIO+'voice/';let VOK=null;const VOKP=fetch(VOICE+'index.json?'+Date.now()).then(r=>r.json()).then(j=>VOK=j).catch(()=>{});
const fn=t=>AUDIO+[...t].map(c=>c.codePointAt(0).toString(16)).join('-')+'.mp3';
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
const V={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù'};
const mark=(b,t)=>{if(!t)return b;let k=b.search(/a|e/);if(k<0)k=b.indexOf('ou');if(k<0){for(let j=b.length-1;j>=0;j--)if('aeiou'.includes(b[j])){k=j;break;}}return b.slice(0,k)+V[b[k]][t-1]+b.slice(k+1);};
const vkey=s=>{const t=SYL.tone(s);let b=SYL.plain(s);if(b==='i')b='yi';return b+t;};

/* ---------- audio: the teacher's voice first, then the course voice ---------- */
let curA=null,curSrc=[],playTok=0;const BUF={};
const acx=()=>window.AC||(window.AC=new (window.AudioContext||window.webkitAudioContext)());
addEventListener('pointerdown',()=>{try{acx().resume()}catch(e){}},{passive:true});
function trimB(b){const d=b.getChannelData(0),sr=b.sampleRate;let pk=0;for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>pk)pk=v;}const th=pk*0.04;
 let a=0,e=d.length-1;while(a<d.length&&Math.abs(d[a])<th)a++;while(e>a&&Math.abs(d[e])<th)e--;a=Math.max(0,a-Math.round(sr*.015));e=Math.min(d.length,e+Math.round(sr*.06));
 if(e-a<sr*.05)return b;const o=acx().createBuffer(1,e-a,sr);o.copyToChannel(d.slice(a,e),0);return o;}
function loadB(u){return BUF[u]||(BUF[u]=fetch(u).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);})).then(trimB).catch(e=>{delete BUF[u];throw e;}));}
const preload=us=>us.filter(Boolean).forEach(u=>loadB(u).catch(()=>{}));
function stopAll(){playTok++;try{curA&&curA.pause()}catch(e){}curSrc.forEach(x=>{try{x.stop()}catch(e){}});curSrc=[];}
function playOld(u,el){return new Promise(res=>{const a=new Audio(u);curA=a;el&&el.classList.add('on');const end=()=>{el&&el.classList.remove('on');res();};a.onended=end;a.onerror=end;a.play().catch(end);});}
// play several files back to back with a short gap — no network pause between them
async function playList(urls,el,gap){urls=urls.filter(Boolean);if(!urls.length)return;stopAll();const tok=playTok;el&&el.classList.add('on');
 let bufs=null;const ctx=acx();try{ctx.resume();bufs=await Promise.all(urls.map(loadB));}catch(e){bufs=null;}
 if(tok!==playTok){return;}
 if(!bufs){for(const u of urls){if(tok!==playTok)return;await playOld(u);}el&&el.classList.remove('on');return;}
 let t=ctx.currentTime+0.02;const g=gap==null?0.22:gap;curSrc=bufs.map(b=>{const x=ctx.createBufferSource();x.buffer=b;x.connect(ctx.destination);x.start(t);t+=b.duration+g;return x;});
 await new Promise(r=>setTimeout(r,Math.max(0,(t-g-ctx.currentTime)*1000)));if(tok===playTok)el&&el.classList.remove('on');}
const urlS=s=>{const k=vkey(s);if(VOK&&VOK[k])return VOICE+k+'.wav';const c=SYL.char(s);return c?fn(c):null;};
const urlK=(k,fb)=>VOK&&VOK[k]?VOICE+k+'.wav':urlS(fb);
const playURL=(u,el)=>playList([u],el);
const playS=(s,el)=>playList([urlS(s)],el);
const hasAudio=s=>(VOK&&VOK[vkey(s)])||SYL.char(s);
const playSeq=(list,el,gap)=>playList(list.map(urlS),el,gap);

/* ===================== pitch (YIN) ===================== */
const ac=acx;
async function toPCM(blobOrBuf){const ab=blobOrBuf instanceof Blob?await blobOrBuf.arrayBuffer():blobOrBuf;
 const buf=await new Promise((ok,bad)=>{const p=ac().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});
 const sr=16000,len=Math.ceil(buf.duration*sr);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);
 const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start();const r=await oc.startRendering();return r.getChannelData(0);}
function yin(x,sr){const W=512,tmin=Math.floor(sr/550),tmax=Math.floor(sr/65),d=new Float32Array(tmax+1);
 for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}
 let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}
 for(let t=tmin;t<tmax;t++){if(d[t]<0.15){while(t+1<tmax&&d[t+1]<d[t])t++;const a=d[t-1],b=d[t],c=d[t+1],den=a+c-2*b;const p=den?t+(a-c)/(2*den):t;return [sr/p,b];}}
 return [0,1];}
/* pitch track with creak ("кряхтение") support: loud frames where pitch can't be measured
   inside the syllable are vocal fry = the lowest point of the voice, so they are filled LOW */
function track(pcm){const sr=16000,hop=160,F=512+Math.floor(sr/65)+2,f=[],rms=[];let mx=0;
 for(let i=0;i+F<pcm.length;i+=hop){let s=0;for(let j=0;j<512;j++)s+=pcm[i+j]*pcm[i+j];const r=Math.sqrt(s/512);rms.push(r);if(r>mx)mx=r;}
 const thr=Math.max(0.01,mx*0.10),cthr=mx*0.05;let k=0;
 for(let i=0;i+F<pcm.length;i+=hop,k++){const [v,ap]=rms[k]>=cthr?yin(pcm.subarray(i,i+F),sr):[0,1];
  if(v>65&&v<550&&rms[k]>=thr&&ap<0.2)f.push(v);else f.push(rms[k]>=cthr?-1:0);}
 // a pitch that jumps away from its neighbours is a measuring error (octave slip), not the voice
 for(let pass=0;pass<2;pass++){const g=f.slice();for(let i=0;i<g.length;i++){if(g[i]<=0)continue;const nb=[];
  for(let d=1;d<=5&&nb.length<6;d++){if(g[i-d]>0)nb.push(g[i-d]);if(g[i+d]>0)nb.push(g[i+d]);}
  if(!nb.length){f[i]=-1;continue;}nb.sort((p,q)=>p-q);const m=nb[nb.length>>1];if(Math.abs(12*Math.log2(g[i]/m))>5)f[i]=-1;}}   // lonely blips too

  const hud=()=>{$('#sc').textContent=score;$('#lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('#wv').textContent='Волна '+(1+Math.floor(score/5));};
  const spawn=()=>{rocks.forEach(r=>r.el.remove());rocks=[];
   let t;for(let k=0;k<20;k++){t=pool[Math.random()*pool.length|0];if(t!==prevT&&iniOf(t)!==iniOf(prevT))break;}target=t;prevT=t;
   const n=score<5?2:3;const others=shuffle(optsN(target,4).filter(x=>x!==target)).slice(0,n-1);
   const slots=n===2?[.28,.72]:[.17,.5,.83];const [ord,ti]=arrange(others.concat(target),target,prevSlot);prevSlot=ti;
   ord.forEach((s,k)=>{const el=document.createElement('button');el.className='ast';el.innerHTML=`<span class="rk" style="animation-duration:${6+k*2}s">${ROCK(seed++)}</span><b>${s}</b>`;
    const r={el,s,x:slots[k],y:-100-Math.random()*50};el.style.left=(r.x*100)+'%';el.style.top=r.y+'px';el.onclick=()=>hit(r);sky.appendChild(el);rocks.push(r);});
   setTimeout(()=>playS(target),250);};
  const aim=r=>{const sx=W()/2,sy=H()-70,tx=r.x*W(),ty=r.y+46;const ang=Math.atan2(tx-sx,sy-ty)*180/Math.PI;ship.style.transform=`translateX(-50%) rotate(${ang}deg)`;setTimeout(()=>{if(!over)ship.style.transform='translateX(-50%)';},450);
   const l=document.createElement('div');l.className='laser';const len=Math.hypot(tx-sx,sy-ty);l.style.left=(sx-3)+'px';l.style.top=(sy-len)+'px';l.style.height=len+'px';l.style.transform=`rotate(${ang}deg)`;sky.appendChild(l);setTimeout(()=>l.remove(),280);};
  const burst=(x,y,txt)=>{for(let k=0;k<10;k++){const p=document.createElement('i');p.className='spark';const a=k/10*Math.PI*2;p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',Math.cos(a)*60+'px');p.style.setProperty('--dy',Math.sin(a)*60+'px');sky.appendChild(p);setTimeout(()=>p.remove(),600);}
   const s=document.createElement('div');s.className='plus';s.textContent=txt;s.style.left=x+'px';s.style.top=y+'px';sky.appendChild(s);setTimeout(()=>s.remove(),800);};
  const lose=()=>{lives--;hud();sky.classList.add('hit');setTimeout(()=>sky.classList.remove('hit'),300);if(lives<=0)end();};
  const hit=r=>{if(over)return;aim(r);
   if(r.s===target){r.el.classList.add('boom');burst(r.x*W(),r.y+46,'+1');score++;speed=Math.min(105,30+score*2.4);hud();rocks=rocks.filter(x=>x!==r);setTimeout(()=>{if(!over)spawn();},480);}
   else{r.el.classList.add('shake');setTimeout(()=>r.el.classList.remove('shake'),360);miss.push(target);toast('Это '+r.s+' — слушай ещё раз');playS(target);lose();}};
  const tick=t=>{if(over)return;const dt=Math.min(.05,(t-last)/1000);last=t;for(const r of rocks){r.y+=speed*dt;r.el.style.top=r.y+'px';}
   const tr=rocks.find(r=>r.s===target);if(tr&&tr.y>H()-150){miss.push(target);toast('Пропустил! Это был '+target);lose();if(!over)spawn();}requestAnimationFrame(tick);};
  const end=()=>{over=true;rocks.forEach(r=>r.el.remove());const prev=S.done.game||{};const b=Math.max(prev.best||0,score);send('game',{best:b,last:score,games:(prev.games||0)+1,miss:miss.slice(-10)});
   const c=document.createElement('div');c.className='cover';c.innerHTML=`<div style="font:900 28px Nunito;color:#fff">Игра окончена!</div><div style="font:900 60px Nunito;color:#FFE27A">${score}</div><div style="font-weight:800;color:#C9CCF5">${score>=b&&score>0?'🏆 Новый рекорд!':'Рекорд: '+b}</div><button class="btn" id="re" style="margin-top:8px">Ещё раз</button>`;sky.appendChild(c);$('#re').onclick=()=>game(idx);};
  $('#rp').onclick=()=>target&&playS(target);hud();spawn();requestAnimationFrame(t=>{last=t;tick(t);});}}

/* ---- results: honest but always friendly ---- */
function results(idx){const rows=TASKS.filter(x=>!x.extra).map((x,i)=>{const d=S.done[x.id];let sc='',lv=0,msg;
  if(x.id==='brief'){lv=d?3:0;msg=d?'Прочитано и прослушано ✓':'Загляни сюда — тут всё, что было на уроке';}
  else if(NEED[x.id]){const n=Object.keys((d&&d.items)||{}).length,m=NEED[x.id];sc=n+' / '+m;lv=n>=m?3:n?1:0;msg=n>=m?'Все записи отправлены — молодец!':n?`Осталось отправить ${m-n} — это обязательное задание, учитель ждёт твой голос 🎤`:'Обязательное задание — учитель ждёт твой голос 🎤';}
  else if(x.id==='game'){lv=d?3:0;sc=d?'🏆 '+(d.best||0):'';msg=d?'Твой рекорд! Попробуй его побить 🚀':'Игра в конце — награда за работу!';}
  else if(x.id==='speak'){const p=(d&&d.passed)||0,m=SP2.length;sc=d?p+' / '+m:'';lv=!d?0:p>=m*.8?3:p>=m*.4?2:1;msg=!d?'Ещё не пробовал(а)':lv===3?'Тоны получаются отлично! 🌟':lv===2?'Хорошо! Потренируй ещё несколько слогов для закрепления':'Тоны — это тренировка. Попробуй ещё разок, с каждым разом получается лучше 💪';}
  else{if(d){const k=d.of?d.score/d.of:0;sc=d.score+' / '+d.of;lv=k>=.8?3:k>=.5?2:1;msg=lv===3?'Отлично! 🌟':lv===2?'Хорошо! Можно сделать ещё разок для закрепления':'Сделай ещё разок — во второй раз будет легче 💪';}else msg='Ещё не сделано';}
  return {x,i,sc,lv,msg};});
 const dn=doneCnt(),stars=rows.filter(r=>r.lv===3).length,again=rows.filter(r=>r.lv===1||r.lv===2);
 const head=dn>=NT?'🎉 Все задания сделаны!':dn>=NT/2?'💪 Больше половины позади!':dn?'🚀 Хорошее начало!':'👋 Начнём?';
 shell(`<h2>🏁 Мои результаты</h2><div class="sum n"><div class="big2">${dn} / ${NT}</div><div><b>${head}</b><small>${'⭐'.repeat(stars)}${stars?` ${stars} ${stars===1?'задание':stars<5?'задания':'заданий'} на отлично`:'Звёзды появятся за задания на отлично'}</small></div></div>
  ${again.length?`<div class="tip">🔁 Для закрепления можно пройти ещё разок: <b>${again.map(r=>r.x.t).join(', ')}</b>. Это не страшно — так и тренируются!</div>`:''}
  <div class="rlist">${rows.map(r=>`<button class="rr n" data-go="${r.x.id}"><span class="e" style="background:${r.x.bg}">${r.x.e}</span><span><b>${r.i+1}. ${r.x.t}</b><small>${r.msg}</small></span><span class="rs l${r.lv}">${r.sc||(r.lv?'✓':'—')}</span></button>`).join('')}</div>
  <p class="lead" style="text-align:center">Нажми на задание, чтобы пройти его ещё раз. 犯错不可怕，不试才可惜！</p>`,idx);
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash='#'+b.dataset.go);}

// a shared link may carry #task from someone's address bar — always start from the menu
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
route();
</script></body></html>
