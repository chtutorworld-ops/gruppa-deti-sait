/* ---- 8. review: parts of the syllable + how many syllables ---- */
async function parts(idx){await W8(3000);
 const SY=shuffle([['b','ā',1],['m','á',2],['d','ǎ',3],['t','ù',4],['n','ǐ',3],['p','ō',1],['k','è',4],['g','ú',2],['h','ē',1],['f','ó',2],['l','ù',4],['','é',2]]).slice(0,7);
 let W=[];for(let k=0;k<400;k++){const w=shuffle(['ini','ini','fin','fin','ton','ton','fin']);if(w.some((x,j)=>j>=2&&x===w[j-1]&&x===w[j-2]))continue;if(w.some((x,j)=>x==='ini'&&!SY[j][0]))continue;W=w;break;}
 if(!W.length)W=SY.map(s=>s[0]?'ini':'fin');
 const CNT=shuffle([['我','wǒ','я',1],['老师','lǎoshī','учитель',2],['外国人','wàiguórén','иностранец',3],['电子邮件','diànzǐ yóujiàn','e-mail',4],['熊猫','xióngmāo','панда',2],['中国','Zhōngguó','Китай',2]]).slice(0,3);
 const qs=SY.map((s,j)=>({type:'part',s,want:W[j]})).concat(CNT.map(c=>({type:'cnt',c})));
 const pz=q=>q.type==='cnt'?'c':(q.s[0]?{ini:0,ton:1,fin:2}:{ton:0,fin:1})[q.want];let ORD=qs;for(let k=0;k<400;k++){const a=spread(qs,q=>q.type==='cnt'?'cnt':q.want);if(a.every((q,j)=>!j||pz(q)==='c'||pz(q)!==pz(a[j-1])))ORD=a;if(ORD!==qs)break;}
 const NM={ini:'инициаль',fin:'финаль',ton:'тон'},MARK={1:'ˉ',2:'ˊ',3:'ˇ',4:'ˋ'},base=v=>v.normalize('NFD').replace(/[̀-ͯ]/g,'');
 let i=0,ok=0,prevC=-1;
 const ask=()=>{if(i>=ORD.length){send('parts',{score:ok,of:ORD.length});shell(`<span class="stepn">Задание 8 из 10</span><h2>🧩 Готово!</h2><div class="res">${ok} / ${ORD.length}</div><p class="lead">${ok>=9?'Ты отлично разбираешься в слоге! 🎉':'Хорошо! Загляни в урок «Догоняем» или спроси учителя, если что-то непонятно.'}</p><div class="row"><button class="btn g" id="again">Ещё раз</button></div>`,idx);$('#again').onclick=()=>parts(idx);return;}
  const q=ORD[i];let first=true;const done=()=>{if(first)ok++;i++;setTimeout(ask,1300);};
  if(q.type==='part'){const [ini,fin,t]=q.s;prevC=[].concat(prevC,(ini?{ini:0,ton:1,fin:2}:{ton:0,fin:1})[q.want]);
   shell(`<span class="stepn">Задание 8 из 10</span><h2>🧩 Слог по частям</h2><div class="qcard in"><div class="qhead"><span>Вопрос ${i+1} из ${ORD.length}</span><span>${ok} ✓</span></div>
    <div class="fb" style="font-size:19px;color:var(--ink)">Нажми на <b style="color:${q.want==='ini'?'#5B6BD8':q.want==='fin'?'#17936A':'#E2456E'}">${NM[q.want].toUpperCase()}</b></div>
    <div style="display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:14px 0 6px">${ini?`<button class="opt" data-a="ini" style="font-size:60px;padding:8px 18px">${ini}</button>`:''}
     <div style="display:grid;justify-items:center;gap:6px"><button class="opt" data-a="ton" style="padding:8px 14px">${mini(t).replace('width="30" height="26"','width="54" height="46"')}</button><button class="opt" data-a="fin" style="font-size:60px;padding:8px 18px">${base(fin)}</button></div></div>
    <button class="btn g" id="pl" style="padding:8px 14px;font-size:14px">🔊 ${ini}${fin}</button><div class="fb" id="fb"></div></div>`,idx);
   $('#pl').onclick=()=>playS(ini+fin,$('#pl'));
   document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const fb=$('#fb');if(b.dataset.a===q.want){b.classList.add('ok');fb.className='fb ok';fb.innerHTML=`✓ Верно! В слоге <b>${ini}${fin}</b>: ${ini?`инициаль <b>${ini}</b>, `:'инициали нет, '}финаль <b>${base(fin)}</b>, ${t}-й тон.`;done();}
    else{first=false;b.classList.add('no');fb.className='fb no';fb.textContent=`Это ${NM[b.dataset.a]}. Найди ${NM[q.want]}!`;}});}
  else{const c=q.c;const [o,ci]=arrange(['1','2','3','4'],String(c[3]),prevC);prevC=[].concat(prevC,ci);
   shell(`<span class="stepn">Задание 8 из 10</span><h2>🧩 Сколько слогов?</h2><div class="qcard in"><div class="qhead"><span>Вопрос ${i+1} из ${ORD.length}</span><span>${ok} ✓</span></div>
    <button class="play n" id="pl">▶</button><div class="zh" style="font-size:46px;color:var(--ac2)">${c[0]}</div><div style="font-size:15px;font-weight:700;color:var(--mu)">${c[2]}</div>
    <div class="opts" style="grid-template-columns:repeat(4,1fr)">${o.map(x=>`<button class="opt" data-n="${x}">${x}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`,idx);
   const pl=$('#pl');pl.onclick=()=>playURL(fn(c[0]),pl);
   document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const fb=$('#fb');if(+b.dataset.n===c[3]){b.classList.add('ok');fb.className='fb ok';fb.innerHTML=`✓ Да! ${c[3]} ${c[3]===1?'иероглиф':'иероглифа'} — ${c[3]} ${c[3]===1?'слог':'слога'}: <span class="py">${c[1]}</span>`;done();}
    else{first=false;b.classList.add('no');fb.className='fb no';fb.textContent='Подсказка: сколько иероглифов — столько и слогов!';}});}};
 ask();}

/* ---- 9. interesting about China ---- */
const FACTS=[
 {e:'4️⃣',h:'Почему китайцы не любят число 4',t:'Число <span class="zh">四</span> <b>sì</b> «четыре» звучит почти как <span class="zh">死</span> <b>sǐ</b> «смерть» — разница только в тоне! Поэтому во многих домах и больницах Китая нет 4-го этажа, а номера телефонов с четвёрками стоят дешевле.',say:[['四','sì'],['死','sǐ']]},

 {e:'👤',h:'Сначала фамилия, потом имя',t:'В имени <span class="zh">李明</span> <b>Lǐ Míng</b> «Ли» — это фамилия, а «Мин» — имя. Китайцы всегда ставят фамилию первой. Самые частые фамилии — <b>Ван, Ли и Чжан</b>: их носят сотни миллионов людей.',say:[['李明','Lǐ Míng']]},
 {e:'🍚',h:'«Ты поел?» — это «привет»',t:'<span class="zh">你好</span> <b>nǐ hǎo</b> = <span class="zh">你</span> «ты» + <span class="zh">好</span> «хорошо». А раньше при встрече часто спрашивали <span class="zh">吃了吗？</span> <b>chī le ma</b> «Ты уже поел?» — так заботливо здоровались.',say:[['你好','nǐ hǎo'],['吃了吗','chī le ma']]},
 {e:'🐴',h:'Скороговорка про маму и лошадь',t:'<span class="zh">妈妈骂马</span> <b>māma mà mǎ</b> — «мама ругает лошадь». Тут почти одни слоги <b>ma</b>, и только тоны помогают понять смысл!',say:[['妈妈骂马','māma mà mǎ']]}];
const FQ=[['Почему в Китае часто нет 4-го этажа?',['四 sì звучит почти как 死 sǐ «смерть»','Четыре — слишком большое число','Так требует закон','Это просто совпадение'],0],
 ['Какое число в Китае считают счастливым?',['8','4','13','7'],0],
 ['В имени 王小明 Wáng Xiǎomíng где фамилия?',['Wáng — первый слог','Xiǎomíng — в конце','Фамилии нет','Посередине'],0],
 ['Что раньше часто спрашивали при встрече вместо «привет»?',['吃了吗？ «Ты поел?»','你几岁？ «Сколько тебе лет?»','你去哪儿？ «Куда идёшь?»','几点了？ «Который час?»'],0],
 ['Что значит mǎ в скороговорке 妈妈骂马?',['лошадь','мама','ругать','вопрос'],0]];
async function china(idx){let f=0;
 const card=()=>{const F=FACTS[f];shell(`<span class="stepn">Задание 9 из 10</span><h2>🏮 Интересно о Китае</h2><div class="dots">${FACTS.map((_,j)=>`<i class="${j<f?'ok':j===f?'cur':''}"></i>`).join('')}</div>
  <div class="fact n"><div style="font-size:54px">${F.e}</div><h3 style="margin:8px 0">${F.h}</h3><p class="lead" style="margin-top:0">${F.t}</p>
   <div class="row">${F.say.map(([z,p])=>`<button class="btn g" data-w="${z}">🔊 <span class="zh">${z}</span> ${p}</button>`).join('')}</div></div>
  <div class="row" style="justify-content:space-between">${f?'<button class="btn g" id="fp">‹ Назад</button>':'<span></span>'}<button class="btn" id="fn">${f<FACTS.length-1?'Дальше →':'Проверь себя →'}</button></div>`,idx);
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>playURL(fn(b.dataset.w),b));
  $('#fn').onclick=()=>{if(f<FACTS.length-1){f++;card();}else quiz();};const fp=$('#fp');fp&&(fp.onclick=()=>{f--;card();});};
 const quiz=()=>{let i=0,ok=0,prev=-1;const ask=()=>{if(i>=FQ.length){send('china',{score:ok,of:FQ.length});shell(`<span class="stepn">Задание 9 из 10</span><h2>🏮 Готово!</h2><div class="res">${ok} / ${FQ.length}</div><p class="lead">Теперь ты знаешь про Китай больше, чем многие взрослые 😉</p><div class="row"><button class="btn g" id="again">Ещё раз</button></div>`,idx);$('#again').onclick=()=>china(idx);return;}
   const [q,opts,c]=FQ[i];const [o,ci]=arrange(opts,opts[c],prev);prev=[].concat(prev,ci);let first=true,lock=false;
   shell(`<span class="stepn">Задание 9 из 10</span><h2>🏮 Проверь себя</h2><div class="qcard in" style="text-align:left"><div class="qhead"><span>Вопрос ${i+1} из ${FQ.length}</span><span>${ok} ✓</span></div>
    <h3>${q}</h3><div style="display:grid;gap:10px">${o.map(x=>`<button class="opt" data-o="${esc(x)}" style="font:700 16px Manrope;text-align:left;padding:14px 16px">${x}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`,idx);
   document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(lock)return;const fb=$('#fb');if(b.dataset.o===opts[c]){lock=true;b.classList.add('ok');if(first)ok++;fb.className='fb ok';fb.textContent='✓ Верно!';setTimeout(()=>{i++;ask();},1000);}

/* ---- 10. space shooter (endless) ---- */
const POOL='bō pō mō fó bā pá mǎ fā bǐ pí mí fū bù pǔ mù dé tè dà tā ná lā dī tí nǐ lí dú tú lù dǔ tǔ gē kē hē gǔ kǔ hú gè kè hè kū'.split(' ');
const ROCKET=`<svg viewBox="0 0 80 120" width="64" height="96"><defs><linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#E9ECF8"/><stop offset=".55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C3C8DE"/></linearGradient></defs>
 <path class="flame" d="M30 92 Q40 122 50 92 Z" fill="#FFB547"/><path class="flame2" d="M34 92 Q40 110 46 92 Z" fill="#FFF1A8"/>
 <path d="M20 70 L8 92 L24 88 Z" fill="#FF5C8A"/><path d="M60 70 L72 92 L56 88 Z" fill="#FF5C8A"/>
 <path d="M40 4 C58 22 62 50 58 90 L22 90 C18 50 22 22 40 4 Z" fill="url(#rb)" stroke="#9AA2BC" stroke-width="2"/>
 <path d="M40 4 C48 12 53 20 55 28 L25 28 C27 20 32 12 40 4 Z" fill="#5B6BD8"/>
 <circle cx="40" cy="48" r="10" fill="#7C6FFF" stroke="#2B3270" stroke-width="3"/><circle cx="37" cy="45" r="3" fill="#fff" opacity=".8"/>
 <rect x="36" y="76" width="8" height="18" rx="3" fill="#FF5C8A"/></svg>`;
const ROCK=(seed)=>{const pts=[];const n=11;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,r=40+((seed*7+i*13)%9)-4;pts.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1));}
 return `<svg viewBox="0 0 100 100" width="92" height="92"><defs><radialGradient id="rk${seed}" cx="35%" cy="30%"><stop offset="0" stop-color="#C9B3A3"/><stop offset=".6" stop-color="#8A6E5E"/><stop offset="1" stop-color="#4E3B33"/></radialGradient></defs>
 <polygon points="${pts.join(' ')}" fill="url(#rk${seed})" stroke="#3A2C26" stroke-width="2"/><circle cx="36" cy="40" r="8" fill="#6E5649" opacity=".7"/><circle cx="64" cy="62" r="11" fill="#6E5649" opacity=".6"/><circle cx="62" cy="32" r="5" fill="#6E5649" opacity=".7"/></svg>`;};
function game(idx){const best=(S.done.game&&S.done.game.best)||0;
 shell(`<span class="stepn">Задание 10 из 10</span><h2>🚀 Космический шутер</h2><p class="lead">Звучит слог — сбей астероид, на котором он написан! Не сбивай чужие и не пропусти нужный. 3 жизни, с каждой волной быстрее.</p>
  <div class="sky" id="sky"><div class="st1"></div><div class="st2"></div><div class="st3"></div><div class="planet"></div>
   <div class="hudin"><span>⭐ <b id="sc">0</b></span><span id="wv">Волна 1</span><span id="lv">❤️❤️❤️</span></div>
   <div class="ship" id="ship">${ROCKET}</div>
   <div id="cover" class="cover"><div style="font:900 30px Nunito;color:#fff">Космический шутер</div><div style="color:#C9CCF5;font-weight:700">Рекорд: ${best}</div><button class="btn" id="st" style="font-size:20px;padding:16px 34px;margin-top:10px">▶ Старт</button></div></div>
  <div class="row" style="justify-content:center"><button class="btn g" id="rp">🔊 Ещё раз слог</button></div>`,idx);
 $('#st').onclick=()=>{$('#cover').remove();run();};
 function run(){const sky=$('#sky'),ship=$('#ship'),W=()=>sky.clientWidth,H=()=>sky.clientHeight;let score=0,lives=3,over=false,target=null,rocks=[],last=performance.now(),speed=30,miss=[],prevT='',seed=1,prevSlot=-1;
  const pool=POOL.filter(hasAudio);
  const hud=()=>{$('#sc').textContent=score;$('#lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('#wv').textContent='Волна '+(1+Math.floor(score/5));};
  const spawn=()=>{rocks.forEach(r=>r.el.remove());rocks=[];
   let t;for(let k=0;k<20;k++){t=pool[Math.random()*pool.length|0];if(t!==prevT&&iniOf(t)!==iniOf(prevT))break;}target=t;prevT=t;
   const n=score<5?2:3;const others=shuffle(optsN(target,4).filter(x=>x!==target)).slice(0,n-1);
   const slots=n===2?[.28,.72]:[.17,.5,.83];const [ord,ti]=arrange(others.concat(target),target,prevSlot);prevSlot=ti;
   ord.forEach((s,k)=>{const el=document.createElement('button');el.className='ast';el.innerHTML=`<span class="rk" style="animation-duration:${6+k*2}s">${ROCK(seed++)}</span><b>${s}</b>`;
    const r={el,s,x:slots[k],y:-100-Math.random()*50};el.style.left=(r.x*100)+'%';el.style.top=r.y+'px';el.onclick=()=>hit(r);sky.appendChild(el);rocks.push(r);});
   setTimeout(()=>playS(target),250);};
  const aim=r=>{const sx=W()/2,sy=H()-70,tx=r.x*W(),ty=r.y+46;const ang=Math.atan2(tx-sx,sy-ty)*180/Math.PI;ship.style.transform=`translateX(-50%) rotate(${ang}deg)`;setTimeout(()=>{if(!over)ship.style.transform='translateX(-50%)';},450);
   const l=document.createElement('div');l.className='laser';const len=Math.hypot(tx-sx,sy-ty);l.style.left=(sx-3)+'px';l.style.top=(sy-len)+'px';l.style.height=len+'px';l.style.transform=`rotate(${ang}deg)`;sky.appendChild(l);setTimeout(()=>l.remove(),280);};
  const burst=(x,y,txt)=>{for(let k=0;k<10;k++){const p=document.createElement('i');p.className='spark';const a=k/10*Math.PI*2;p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',Math.cos(a)*60+'px');p.style.setProperty('--dy',Math.sin(a)*60+'px');sky.appendChild(p);setTimeout(()=>p.remove(),600);}
   const s=document.createElement('div');s.className='plus';s.textContent=txt;s.style.left=x+'px';s.style.top=y+'px';sky.appendChild(s);setTimeout(()=>s.remove(),800);};
  const lose=()=>{lives--;hud();sky.classList.add('hit');setTimeout(()=>sky.classList.remove('hit'),300);if(lives<=0)end();};
  const hit=r=>{if(over)return;aim(r);
   if(r.s===target){r.el.classList.add('boom');burst(r.x*W(),r.y+46,'+1');score++;speed=Math.min(105,30+score*2.4);hud();rocks=rocks.filter(x=>x!==r);setTimeout(()=>{if(!over)spawn();},480);}
   else{r.el.classList.add('shake');setTimeout(()=>r.el.classList.remove('shake'),360);miss.push(target);toast('Это '+r.s+' — слушай ещё раз');playS(target);lose();}};
  const tick=t=>{if(over)return;const dt=Math.min(.05,(t-last)/1000);last=t;for(const r of rocks){r.y+=speed*dt;r.el.style.top=r.y+'px';}
   const tr=rocks.find(r=>r.s===target);if(tr&&tr.y>H()-150){miss.push(target);toast('Пропустил! Это был '+target);lose();if(!over)spawn();}requestAnimationFrame(tick);};
  const end=()=>{over=true;rocks.forEach(r=>r.el.remove());const prev=S.done.game||{};const b=Math.max(prev.best||0,score);send('game',{best:b,last:score,games:(prev.games||0)+1,miss:miss.slice(-10)});
   const c=document.createElement('div');c.className='cover';c.innerHTML=`<div style="font:900 28px Nunito;color:#fff">Игра окончена!</div><div style="font:900 60px Nunito;color:#FFE27A">${score}</div><div style="font-weight:800;color:#C9CCF5">${score>=b&&score>0?'🏆 Новый рекорд!':'Рекорд: '+b}</div><button class="btn" id="re" style="margin-top:8px">Ещё раз</button>`;sky.appendChild(c);$('#re').onclick=()=>game(idx);};
  $('#rp').onclick=()=>target&&playS(target);hud();spawn();requestAnimationFrame(t=>{last=t;tick(t);});}}

route();
</script></body></html>
