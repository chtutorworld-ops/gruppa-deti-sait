:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:32px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15}.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.me{margin-left:auto;font-size:13px;font-weight:800;color:var(--ac);padding:8px 12px;border-radius:14px;white-space:nowrap}
@media(max-width:600px){.top small{display:none}.top .zh{font-size:26px}}
.main{padding:22px 20px}@media(max-width:600px){.main{padding:18px 14px}}
.banner{margin-bottom:14px;padding:10px 14px;border-radius:14px;background:#FFF1D6;color:#7A5200;font-weight:800;font-size:14px;text-align:center}
h2{font-size:25px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:6px}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 8px}
.lead{font-size:16.5px;line-height:1.5;margin-top:10px}.lead b{color:var(--ink)}
.stepn{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ac);padding:4px 10px;border-radius:9px}
.list{display:grid;gap:12px;margin-top:16px}
.ti{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-align:left;width:100%}
.ti .e{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:24px}
.ti b{display:block;font-size:16.5px;color:var(--ink)}.ti small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.ti .st{margin-left:auto;font-size:13px;font-weight:800;color:var(--mu);white-space:nowrap}.ti .st.ok{color:var(--ok)}
.prog{margin-top:14px;font-size:13px;font-weight:800;color:var(--mu)}.prog .bar{height:8px;border-radius:5px;background:#D6DBE6;margin-top:6px;overflow:hidden}.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:16.5px;background:var(--ac);color:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.btn.g{background:var(--bg);color:var(--ac2)}.btn.red{background:var(--no)}.btn.okb{background:var(--ok)}.btn:disabled{opacity:.45}.btn:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.nextbar{display:flex;gap:12px;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid #D6DBE6;flex-wrap:wrap}.nextbar .btn{flex:1 1 auto}.nextbar .nx{flex:2 1 240px}
.cards{display:grid;gap:12px;margin-top:12px}@media(min-width:640px){.cards.c2{grid-template-columns:1fr 1fr}.cards.c3{grid-template-columns:repeat(3,1fr)}}
.card{padding:14px 16px;border-radius:20px;font-size:15.5px;line-height:1.5}.card b.h{display:block;font-size:17px;color:var(--ac2);margin-bottom:4px}
.tip{margin-top:14px;padding:12px 16px;border-radius:16px;background:#FFF6DC;color:#6B5310;font-size:15px;line-height:1.45}
.ig{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.ig button{width:84px;padding:12px 0 8px;border-radius:18px;display:grid;justify-items:center;gap:2px}
.ig button b{font:900 34px Nunito;color:var(--ac2);line-height:1}.ig button small{font-size:13px;font-weight:700;color:var(--mu)}
.ig button.on{box-shadow:inset 4px 4px 9px var(--sh1),inset -4px -4px 9px var(--sh2)}
.pairs{display:grid;gap:10px;margin-top:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair button{padding:12px 6px;border-radius:18px;font:900 30px Nunito;color:var(--ac2)}.pair button.air{color:#D9366A}
.pair button small{display:block;font:700 12px Manrope;color:var(--mu)}
.qcard{padding:20px;margin-top:16px;text-align:center}
.qhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}.dots i{width:20px;height:6px;border-radius:3px;background:#D6DBE6}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}.dots i.cur{background:var(--ac)}
.play{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;margin:14px auto 6px;font-size:38px;color:var(--ac)}
.play.on{color:var(--ok);box-shadow:inset 6px 6px 12px var(--sh1),inset -6px -6px 12px var(--sh2)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.opt{padding:16px 8px;border-radius:18px;font:900 28px Nunito;color:var(--ac2);box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.opt small{display:block;font:700 13px Manrope;color:var(--mu);margin-top:2px}
.opt.ok{background:#DDF5EC;box-shadow:inset 3px 3px 8px #B9DCCD;color:#14855E}.opt.no{background:#FFE3EB;box-shadow:inset 3px 3px 8px #F0C2D0;color:#B0284F}
.fb{margin-top:12px;font-size:16px;font-weight:700;line-height:1.45;min-height:24px}.fb.ok{color:#14855E}.fb.no{color:#D9366A}
.res{font:900 46px Nunito;color:var(--ac2);margin-top:8px}
.ans{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.ans span{padding:8px 4px;border-radius:12px;font:800 17px Nunito;text-align:center}
.ans .ok{background:#DDF5EC;color:#14855E}.ans .no{background:#FFE3EB;color:#B0284F}@media(max-width:480px){.ans{grid-template-columns:repeat(4,1fr)}}
.rc{padding:16px 18px;border-radius:22px;margin-top:12px}
.rc .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.rc .hd .py{font-size:24px;color:var(--ac2)}
.rc .st{margin-left:auto;font-size:13px;font-weight:800;color:var(--mu)}.rc .st.ok{color:var(--ok)}
.rc .row{margin-top:10px;gap:8px}.rc .btn{padding:11px 14px;font-size:15px;border-radius:15px}
/* shooter */
.sky{position:relative;height:min(62vh,520px);border-radius:22px;overflow:hidden;margin-top:12px;touch-action:manipulation;
 background:radial-gradient(120% 80% at 50% 0%,#3B3F8F 0%,#1E2154 55%,#11132F 100%)}
.sky::before{content:'';position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 20%,#fff9,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff6,transparent),radial-gradient(1px 1px at 85% 60%,#fff8,transparent),radial-gradient(1px 1px at 10% 85%,#fff7,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff5,transparent);background-size:220px 220px;animation:stars 20s linear infinite}
@keyframes stars{to{background-position:0 220px}}
.ast{position:absolute;width:96px;height:96px;margin-left:-48px;display:grid;place-items:center;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 35% 30%,#B9A59A,#7D6458 60%,#4E3B33);box-shadow:inset -8px -10px 0 rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.08)}
.ast b{font:900 22px Nunito;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);background:rgba(17,19,47,.55);padding:2px 8px;border-radius:10px}
.ast.boom{animation:boom .4s forwards}@keyframes boom{to{transform:scale(1.8);opacity:0;filter:brightness(3)}}
.ast.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ship{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:46px;filter:drop-shadow(0 0 10px #7C6FFF)}
.laser{position:absolute;width:4px;background:linear-gradient(#FFE27A,#FF5C8A);border-radius:2px;transform-origin:bottom center;animation:las .25s forwards}
@keyframes las{to{opacity:0}}
.hud{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:800;color:var(--ink)}
.hud .lv{font-size:22px;letter-spacing:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac2);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:15px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.login{max-width:460px;margin:8vh auto 0;padding:28px 24px;text-align:center}
.login input{width:100%;font:inherit;font-size:20px;padding:14px 18px;border:0;outline:none;margin-top:18px;color:var(--ink)}
</style></head><body>

 const end=()=>{el&&el.classList.remove('on');res();};a.onended=end;let tried=0;
 const fail=()=>{if(tried++<2){setTimeout(()=>{if(curA!==a)return end();a.load();a.play().catch(fail);},350);return;}end();};
 a.onerror=fail;a.play().catch(fail);});}

function optsN(s,n){const t=SYL.tone(s),b=SYL.plain(s),[ini,fin]=split(b);const out=[s];
 const tryAdd=(bb,tt)=>{if(out.length>=n||!bb||!tt)return;const x=mark(bb,tt);if(!out.includes(x))out.push(x);};
 const other=shuffle([1,2,3,4].filter(x=>x!==t));const swap=ini&&PAIR[ini]?PAIR[ini]+fin:'',swap2=ini&&PAIR2[ini]?PAIR2[ini]+fin:'';
 const real=(bb,tt)=>bb&&SYL.char(mark(bb,tt));
 if(swap&&real(swap,t))tryAdd(swap,t);tryAdd(b,other[0]);if(swap2&&real(swap2,t))tryAdd(swap2,t);tryAdd(b,other[1]);if(swap)tryAdd(swap,other[0]);tryAdd(b,other[2]);
 return shuffle(out.slice(0,n));}

async function record(maxMs,onStart){const s=await getMic();const type=pickType();
 const mr=new MediaRecorder(s,type?{mimeType:type,audioBitsPerSecond:32000}:{});const ch=[];mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const done=new Promise(r=>mr.onstop=()=>r(new Blob(ch,{type:mr.mimeType||type||'audio/webm'})));mr.start();onStart&&onStart(()=>mr.state==='recording'&&mr.stop());setTimeout(()=>mr.state==='recording'&&mr.stop(),maxMs);return done;}

  catch(e){stop=null;cur=null;b.classList.remove('red');b.textContent='● Записать';toast('Нет доступа к микрофону — разреши его в браузере');}});
 document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{const bl=blobs[b.dataset.pl];if(!bl)return;try{curA&&curA.pause()}catch(e){}const a=new Audio(URL.createObjectURL(bl));curA=a;a.play();});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{const id=b.dataset.up,bl=blobs[id];if(!bl)return;
  const mark2=()=>{const d=S.done[part]||{items:{}};d.items=d.items||{};d.items[id]=Date.now();return d.items;};
  if(isTest()){S.done[part]={items:mark2()};keep();$('#st-'+id).className='st ok';$('#st-'+id).textContent='✓ (режим учителя — не отправлено)';return;}
  b.disabled=true;b.textContent='Отправляю…';
  try{const r=await fetch(API+`audio?hw=${HW}&sid=${S.sid}&item=${id}`,{method:'POST',headers:{'Content-Type':bl.type||'audio/webm'},body:bl});if(!r.ok)throw 0;
   send(part,{items:mark2()});$('#st-'+id).className='st ok';$('#st-'+id).textContent='✓ отправлено';b.textContent='Отправлено ✓';toast('Запись отправлена учителю');}
  catch(e){b.disabled=false;b.textContent='Ещё раз';toast('Не отправилось. Проверь интернет и нажми ещё раз');}});}

/* ---- 5. space shooter (endless) ---- */
const POOL='bō pō mō fó bā pá mǎ fā bǐ pí mí fū bù pǔ mù dé tè dà tā ná lā dī tí nǐ lí dú tú lù dǔ tǔ gē kē hē gǔ kǔ hú gè kè hè kū'.split(' ');
function game(idx){const best=(S.done.game&&S.done.game.best)||0;
 shell(`<span class="stepn">Задание 6 из 6</span><h2>🚀 Космический шутер</h2><p class="lead">Звучит слог — сбей астероид, на котором он написан! Не сбивай чужие и не пропусти нужный: 3 жизни. Чем дальше, тем быстрее.</p>
  <div class="hud"><span>Счёт: <b id="sc">0</b></span><span class="lv" id="lv">❤️❤️❤️</span><span>Рекорд: <b>${best}</b></span></div>
  <div class="sky" id="sky"><div class="ship">🚀</div><div id="cover" style="position:absolute;inset:0;display:grid;place-items:center"><button class="btn" id="st" style="font-size:20px;padding:18px 34px">▶ Старт</button></div></div>
  <div class="row" style="justify-content:center"><button class="btn g" id="rp">🔊 Ещё раз слог</button></div>`,idx);
 $('#st').onclick=()=>{$('#cover').remove();run();};
 function run(){const sky=$('#sky'),W=()=>sky.clientWidth,H=()=>sky.clientHeight;let score=0,lives=3,over=false,target=null,rocks=[],last=performance.now(),speed=34,miss=[];
  const pool=POOL.filter(hasAudio);
  const paintHud=()=>{$('#sc').textContent=score;$('#lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);};
  const spawn=()=>{rocks.forEach(r=>r.el.remove());rocks=[];target=pool[Math.random()*pool.length|0];
   const n=score<8?2:3;const opts=shuffle(optsN(target,4).filter(x=>x!==target)).slice(0,n-1).concat(target);const xs=shuffle(n===2?[.3,.7]:[.18,.5,.82]);
   shuffle(opts).forEach((s,k)=>{const el=document.createElement('button');el.className='ast';el.innerHTML=`<b>${s}</b>`;const r={el,s,x:xs[k],y:-90-Math.random()*60};el.style.left=(r.x*100)+'%';el.style.top=r.y+'px';
    el.onclick=()=>hit(r);sky.appendChild(el);rocks.push(r);});playS(target);};
  const laser=r=>{const l=document.createElement('div');l.className='laser';const sx=W()/2,sy=H()-40,tx=r.x*W(),ty=r.y+48;const len=Math.hypot(tx-sx,sy-ty);
   l.style.left=(sx-2)+'px';l.style.top=(sy-len)+'px';l.style.height=len+'px';l.style.transform=`rotate(${Math.atan2(tx-sx,sy-ty)}rad)`;sky.appendChild(l);setTimeout(()=>l.remove(),260);};
  const lose=()=>{lives--;paintHud();if(lives<=0)end();};
  const hit=r=>{if(over)return;if(r.s===target){laser(r);r.el.classList.add('boom');score++;speed=Math.min(110,34+score*2.2);paintHud();rocks=rocks.filter(x=>x!==r);setTimeout(()=>{if(!over)spawn();},420);}
   else{r.el.classList.add('shake');setTimeout(()=>r.el.classList.remove('shake'),360);miss.push(target);toast('Это '+r.s+' — слушай ещё раз');playS(target);lose();}};
  const tick=t=>{if(over)return;const dt=Math.min(.05,(t-last)/1000);last=t;
   for(const r of rocks){r.y+=speed*dt;r.el.style.top=r.y+'px';}
   const tr=rocks.find(r=>r.s===target);if(tr&&tr.y>H()-110){miss.push(target);toast('Пропустил! Это был '+target);lose();if(!over)spawn();}
   requestAnimationFrame(tick);};
  const end=()=>{over=true;rocks.forEach(r=>r.el.remove());const prev=S.done.game||{};const b=Math.max(prev.best||0,score);
   send('game',{best:b,last:score,games:(prev.games||0)+1,miss:miss.slice(-10)});
   const c=document.createElement('div');c.style.cssText='position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;color:#fff';
   c.innerHTML=`<div style="font:900 30px Nunito">Игра окончена!</div><div style="font:900 56px Nunito">${score}</div><div style="font-weight:700">${score>=b&&score>0?'🏆 Новый рекорд!':'Рекорд: '+b}</div><button class="btn" id="re">Ещё раз</button>`;
   sky.appendChild(c);$('#re').onclick=()=>game(idx);};
  $('#rp').onclick=()=>target&&playS(target);paintHud();spawn();requestAnimationFrame(t=>{last=t;tick(t);});}}

route();
</script></body></html>
