<script>
const R={"a": "阿,,,", "o": "噢,哦,,", "e": "婀,鹅,,饿", "yi": "衣,移,以,意", "wu": "乌,无,五,物", "ma": "妈,麻,马,骂", "ba": "八,拔,把,爸", "po": "坡,婆,叵,破", "mo": "摸,魔,抹,默", "fa": "发,罚,法,珐", "da": "搭,达,打,大", "ni": "妮,泥,你,逆", "mi": "眯,迷,米,密", "bi": "逼,鼻,笔,必", "di": "低,敌,底,地", "ti": "梯,题,体,替", "ge": "哥,格,舸,个", "ke": "科,咳,渴,客", "hu": "呼,湖,虎,户", "lu": "噜,炉,鲁,路", "tu": "突,图,土,兔", "du": "督,读,赌,杜", "pu": "扑,葡,普,瀑", "fu": "夫,服,府,父"};
const WORDS=[["中国", "Zhōngguó", "Китай", [1, 2]], ["老师", "lǎoshī", "учитель", [3, 1]], ["北京", "Běijīng", "Пекин", [3, 1]], ["熊猫", "xióngmāo", "панда", [2, 1]], ["足球", "zúqiú", "футбол", [2, 2]], ["牛奶", "niúnǎi", "молоко", [2, 3]], ["面包", "miànbāo", "хлеб", [4, 1]], ["咖啡", "kāfēi", "кофе", [1, 1]], ["唱歌", "chànggē", "петь", [4, 1]], ["上海", "Shànghǎi", "Шанхай", [4, 3]], ["美国", "Měiguó", "Америка", [3, 2]], ["汉语", "Hànyǔ", "китайский язык", [4, 3]], ["中文", "Zhōngwén", "китайский язык", [1, 2]], ["火车", "huǒchē", "поезд", [3, 1]], ["电视", "diànshì", "телевизор", [4, 4]], ["手机", "shǒujī", "телефон", [3, 1]], ["学校", "xuéxiào", "школа", [2, 4]], ["医生", "yīshēng", "врач", [1, 1]], ["天气", "tiānqì", "погода", [1, 4]], ["地图", "dìtú", "карта", [4, 2]], ["大米", "dàmǐ", "рис", [4, 3]], ["公园", "gōngyuán", "парк", [1, 2]], ["汽车", "qìchē", "машина", [4, 1]], ["西瓜", "xīguā", "арбуз", [1, 1]], ["蛋糕", "dàngāo", "торт", [4, 1]], ["飞机", "fēijī", "самолёт", [1, 1]], ["苹果", "píngguǒ", "яблоко", [2, 3]], ["米饭", "mǐfàn", "рис (варёный)", [3, 4]], ["汉字", "hànzì", "иероглиф", [4, 4]], ["拼音", "pīnyīn", "пиньинь", [1, 1]], ["电话", "diànhuà", "телефонный звонок", [4, 4]], ["茶杯", "chábēi", "чашка", [2, 1]], ["黄色", "huángsè", "жёлтый", [2, 4]], ["北方", "běifāng", "север", [3, 1]]];

/* ===================== settings ===================== */
const HW='dz1';
const API=/workers\.dev$/.test(location.hostname)?'/api/dz/':'https://gruppa-deti.ch-tutor-world.workers.dev/api/dz/';
const AUDIO=(/^https?:$/.test(location.protocol)&&!/claude/i.test(location.hostname))?new URL('../audio/',location.href).href:'https://chtutorworld-ops.github.io/gruppa-deti-sait/audio/';
const V={a:'āáǎà',o:'ōóǒò',e:'ēéěè',i:'īíǐì',u:'ūúǔù'};
const mark=(b,t)=>{if(!t)return b;let k=b.search(/a|e/);if(k<0)k=b.indexOf('ou');if(k<0){for(let j=b.length-1;j>=0;j--)if('aeiou'.includes(b[j])){k=j;break;}}return b.slice(0,k)+V[b[k]][t-1]+b.slice(k+1);};
const plain=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ü/g,'u');
const fn=t=>AUDIO+[...t].map(c=>c.codePointAt(0).toString(16)).join('-')+'.mp3';
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}

/* ===================== state + saving ===================== */
let S={};try{S=JSON.parse(localStorage.getItem('zh-'+HW)||'{}')}catch(e){}
const keep=()=>{try{localStorage.setItem('zh-'+HW,JSON.stringify(S))}catch(e){}};
S.done=S.done||{};S.queue=S.queue||[];
let syncState='';
async function send(part,data){S.done[part]=Object.assign({},S.done[part]||{},data,{ts:Date.now()});S.queue=S.queue.filter(q=>q.part!==part);S.queue.push({part,data:S.done[part]});keep();flush();}
const isTest=()=>/^(учитель|учительница|teacher|тест)$/i.test((S.name||'').trim());
async function flush(){if(isTest()){S.queue=[];keep();syncState='test';paintSync();return;}if(!S.sid||!S.queue.length)return;const q=S.queue[0];
 try{const r=await fetch(API+'save',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({hw:HW,sid:S.sid,name:S.name,part:q.part,data:q.data})});
  if(!r.ok)throw 0;S.queue.shift();keep();syncState='ok';paintSync();if(S.queue.length)flush();}
 catch(e){syncState='err';paintSync();clearTimeout(flush._t);flush._t=setTimeout(flush,15000);}}
function paintSync(){const el=$('#sync');if(!el)return;el.className='sync'+(syncState==='err'?' err':'');el.textContent=isTest()?'🧑‍🏫 режим учителя — ответы не сохраняются':syncState==='err'?'⚠ нет связи — отправлю позже':S.queue.length?'отправляю…':'✓ учитель видит';}
window.addEventListener('online',flush);

/* ===================== audio ===================== */
let curA=null;
function play(text,el,rate){return new Promise(res=>{try{curA&&curA.pause()}catch(e){}
 const a=new Audio(fn(text));curA=a;a.playbackRate=rate||1;a.preservesPitch=true;el&&el.classList.add('on');
 const end=()=>{el&&el.classList.remove('on');res();};a.onended=end;
 a.onerror=()=>{end();if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.8;speechSynthesis.speak(u);}};
 a.play().catch(a.onerror);});}
/* textbook tones re-synthesised from a clean recording (audio/syn/<syllable><tone>.wav) */
const SYN=AUDIO+'syn/';let SYNOK=null;fetch(SYN+'index.json').then(r=>r.json()).then(j=>SYNOK=j).catch(()=>{});
const synKey=(b,t)=>({yi:'i',wu:'u'}[b]||b)+t;
const VOICE=AUDIO+'voice/';let VOK=null;const VOKP=fetch(VOICE+'index.json?'+Date.now()).then(r=>r.json()).then(j=>VOK=j).catch(()=>{});
const waitVoice=()=>Promise.race([VOKP,new Promise(r=>setTimeout(r,4000))]);
const hasVoice=(b,t)=>!!(VOK&&VOK[b+t]);
const hasSyn=(b,t)=>hasVoice(b,t);   // only the teacher's real voice (synthetic re-pitching sounded bad)
const sylURL=(b,t)=>hasVoice(b,t)?VOICE+b+t+'.wav':SYN+synKey(b,t)+'.wav';
function playSyl(b,t,el,rate){if(!hasSyn(b,t)){const c=chOf(b,t);return c?play(c,el,rate):Promise.resolve();}
 return new Promise(res=>{try{curA&&curA.pause()}catch(e){}const a=new Audio(sylURL(b,t));curA=a;a.playbackRate=rate||1;a.preservesPitch=true;el&&el.classList.add('on');
  const end=()=>{el&&el.classList.remove('on');res();};a.onended=end;a.onerror=()=>{el&&el.classList.remove('on');const c=chOf(b,t);(c?play(c,el,rate):Promise.resolve()).then(res);};a.play().catch(a.onerror);});}
async function playSylSeq(b,el){
 if([1,2,3,4].every(t=>hasVoice(b,t))){const as=[1,2,3,4].map(t=>{const a=new Audio(sylURL(b,t));a.preload='auto';a.load();return a;});
  el&&el.classList.add('on');for(const a of as){try{curA&&curA.pause()}catch(e){}curA=a;await new Promise(r=>{a.onended=r;a.onerror=r;a.play().catch(r);});await new Promise(r=>setTimeout(r,180));}el&&el.classList.remove('on');return;}
 for(const t of [1,2,3,4]){await playSyl(b,t,el);await new Promise(r=>setTimeout(r,200));}}
async function playSeq(list,el){for(const t of list){await play(t,el);await new Promise(r=>setTimeout(r,250));}}
let micStream=null;
async function getMic(){if(micStream&&micStream.active)return micStream;
 micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});return micStream;}
function pickType(){for(const t of ['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'])if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))return t;return '';}
async function record(maxMs,onStart){const s=await getMic();const type=pickType();
 const mr=new MediaRecorder(s,type?{mimeType:type,audioBitsPerSecond:32000}:{});const ch=[];
 mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
 const done=new Promise(r=>mr.onstop=()=>r(new Blob(ch,{type:mr.mimeType||type||'audio/webm'})));
 mr.start();onStart&&onStart(()=>mr.state==='recording'&&mr.stop());setTimeout(()=>mr.state==='recording'&&mr.stop(),maxMs);return done;}

/* ===================== pitch (YIN) ===================== */
let AC=null;const ac=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
async function toPCM(blobOrBuf){const ab=blobOrBuf instanceof Blob?await blobOrBuf.arrayBuffer():blobOrBuf;
 const buf=await new Promise((ok,bad)=>{const p=ac().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});
 const sr=16000,len=Math.ceil(buf.duration*sr);const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,sr);
 const src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start();const r=await oc.startRendering();return r.getChannelData(0);}
function yin(x,sr){const W=512,tmin=Math.floor(sr/550),tmax=Math.floor(sr/65),d=new Float32Array(tmax+1);
 for(let t=1;t<=tmax;t++){let s=0;for(let i=0;i<W;i++){const v=x[i]-x[i+t];s+=v*v;}d[t]=s;}

  shell(`${backBtn}<h2>Уровень ${lv} пройден!</h2><div class="res">${sc} / 10</div><p class="lead">${sc>=9?'Супер-уши! 🎧':sc>=6?'Хорошо! Попробуй ещё раз, чтобы стало 10.':'Тоны — это сложно, 犯错不可怕! Пройди ещё раз.'}</p><div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn g" id="other">${lv===1?'Уровень 2 →':'Уровень 1'}</button></div>`);
  $('#again').onclick=()=>startL(lv);$('#other').onclick=()=>startL(lv===1?2:1);return;}
 let opts,correct,title;
 if(lv===1){correct=it.t;opts=[1,2,3,4].map(t=>({k:t,h:`<span class="py">${mark(it.b,t)}</span>${mini(t)}`}));title=`<div class="big py">${it.b}</div>`;}
 else{const w=it.w;correct=w[3].join('');const wrong=shuffle(PAIRS.filter(p=>p.join('')!==correct)).slice(0,3);opts=shuffle([w[3],...wrong]).map(p=>({k:p.join(''),h:`<span style="display:flex;gap:4px">${mini(p[0])}${mini(p[1])}</span><small>${p[0]} + ${p[1]} тон</small>`}));title=`<div class="big zh">${w[0]}</div><div class="py" style="font-size:20px;color:var(--mu)">${plain(w[1]).toLowerCase()}</div>`;}
 shell(`${backBtn}<h2>Уровень ${lv} · ${lv===1?'слоги':'слова'}</h2><div class="qcard n"><div class="qhead"><span>Вопрос ${L.i+1} из 10</span><span>${L.res.filter(Boolean).length} ✓</span></div>
 <div class="dots">${L.items.map((_,j)=>`<i class="${j<L.i?(L.res[j]?'ok':'no'):j===L.i?'cur':''}"></i>`).join('')}</div>
 <button class="play n" id="pl">▶</button>${title}<div class="opts ${lv===1?'o4':''}">${opts.map(o=>`<button class="opt" data-k="${o.k}">${o.h}</button>`).join('')}</div><div class="fb" id="lfb"></div></div>`);
 const pb=$('#pl');const say=()=>lv===1?playSyl(it.b,it.t,pb):play(it.w[0],pb);pb.onclick=say;setTimeout(say,250);
 let lock=false;document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=String(b.dataset.k)===String(correct);L.res[L.i]=ok;L.log.push(lv===1?{q:it.b,want:it.t,got:+b.dataset.k}:{q:it.w[0],want:it.w[3].join(''),got:String(b.dataset.k)});
  document.querySelector(`[data-k="${correct}"]`).classList.add('ok');if(!ok)b.classList.add('no');
  const fb=$('#lfb');fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✓ Верно! ':'Не совсем. ')+(lv===1?`Это <span class="py">${mark(it.b,it.t)}</span> — ${it.t}-й тон.`:`<span class="zh">${it.w[0]}</span> <span class="py">${it.w[1]}</span> — ${it.w[2]}.`)+` <br><button class="btn" id="nx" style="margin-top:12px">Следующий вопрос →</button>`;
  $('#nx').onclick=()=>{L.i++;askL();};});}

/* ---------- 3. speak & check ---------- */
const SP=[['mo',1],['mo',2],['mo',3],['mo',4],['wu',1],['wu',2],['wu',3],['wu',4]].map(([b,t])=>({b,t,get ch(){return chOf(b,t);}}));
let spI=0;
function calibV(){shell(`${backBtn}<h2><span class="zh">说</span>Сначала настроим микрофон</h2><p class="lead">Скажи протяжно <b>«а-а-а»</b> своим обычным, спокойным голосом — не высоко и не низко. Так система узнает твой голос и будет точнее слышать тоны.</p>
 <button class="mic n" id="cmic">🎤</button><div style="text-align:center;font-size:14px;font-weight:700;color:var(--mu)" id="clab">Нажми и скажи «а-а-а» (2 секунды)</div><div class="fb" id="cfb"></div>`);
 $('#cmic').onclick=async()=>{const m=$('#cmic'),fb=$('#cfb');try{const bl=await record(2200,()=>{m.classList.add('rec');m.textContent='■';$('#clab').textContent='Тяни «а-а-а»…';});m.classList.remove('rec');m.textContent='🎤';
  const c=contour(await toPCM(bl));if(!c){fb.className='fb no';fb.textContent='Не расслышал. Скажи громче и дольше.';return;}S.base=c.hz;keep();speakV();}
  catch(e){m.classList.remove('rec');m.textContent='🎤';fb.className='fb no';fb.textContent='Нет доступа к микрофону. Разреши микрофон в браузере и попробуй снова.';}};}
function speakV(){if(!S.base)return calibV();const it=SP[spI],d=S.done.speak||{passed:0,items:{}};const items=d.items||{};
 shell(`${backBtn}<h2><span class="zh">说</span>Скажи тон — система проверит</h2><p class="lead">Послушай образец, нажми 🎤 и скажи слог. Я нарисую твой голос поверх образца и скажу, какой тон получился. Пробуй, пока не совпадёт!</p>
 <div class="chips">${SP.map((x,j)=>`<button class="chip ${j===spI?'on':''} ${items[x.b+x.t]?'ok':''}" data-sp="${j}">${mark(x.b,x.t)}${items[x.b+x.t]?' ✓':''}</button>`).join('')}</div>
 <div class="qcard n"><div class="qhead"><span>Слог ${spI+1} из ${SP.length}</span><span>получилось: ${Object.keys(items).length}/${SP.length}</span></div>
 <div style="display:flex;justify-content:center;align-items:center;gap:22px;margin-top:10px"><div class="big py" style="color:var(--t${it.t})">${mark(it.b,it.t)}</div>${mini(it.t)}<span style="font-size:15px;font-weight:700;color:var(--mu)">${it.t}-й тон</span></div>
 <div class="row" style="justify-content:center"><button class="btn g" id="ref">▶ Образец</button><button class="btn g" id="refs">🐢 Медленно</button></div>
 <button class="mic n" id="mic">🎤</button><div style="font-size:14px;font-weight:700;color:var(--mu)" id="mlab">Нажми и скажи «${mark(it.b,it.t)}»</div>
 <div id="chart">${chartSVG(TT[it.t][0].map(v=>v+LV[it.t]),null)}</div><div class="legend"><span><i style="background:repeating-linear-gradient(90deg,#9AA2BC 0 4px,transparent 4px 8px)"></i>серая пунктирная — образец</span><span><i style="background:#3B4BD8;height:5px"></i>синяя — твой голос</span></div>
 <div class="fb" id="sfb"></div><div style="margin-top:14px;text-align:center"><button class="back n" id="recal" style="margin:0">🎚 Настроить голос заново</button></div></div>`);
 $('#recal').onclick=()=>{S.base=0;keep();calibV();};
 document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{spI=+b.dataset.sp;speakV();});
 $('#ref').onclick=()=>playSyl(it.b,it.t,$('#ref'));$('#refs').onclick=()=>playSyl(it.b,it.t,$('#refs'),0.75);
 let ref=TT[it.t][0].map(v=>v+LV[it.t]);if(hasSyn(it.b,it.t)||(GOOD&&GOOD[it.ch]===true))refContour(hasSyn(it.b,it.t)?sylURL(it.b,it.t):it.ch).then(r=>{if(r&&classify(r.c)===it.t){ref=r.c.map(v=>v+LV[it.t]);$('#chart').innerHTML=chartSVG(ref,null);}});
 let stopFn=null,busy=false;
 $('#mic').onclick=async()=>{if(stopFn){stopFn();return;}if(busy)return;busy=true;const mic=$('#mic'),lab=$('#mlab'),fb=$('#sfb');
  try{const blob=await record(2600,s=>{stopFn=s;mic.classList.add('rec');mic.textContent='■';lab.textContent='Говори! (нажми ещё раз, чтобы закончить)';});
   stopFn=null;mic.classList.remove('rec');mic.textContent='🎤';lab.textContent='Считаю…';
   const c=contour(await toPCM(blob));
   if(!c){fb.className='fb no';fb.textContent='Не расслышал голос. Скажи громче и протяни гласную подольше, вот так: «а-а-а».';lab.textContent='Нажми и попробуй ещё раз';busy=false;return;}
   if(!S.base){S.base=c.hz;keep();}
   const J=judge(c.c,c.hz,S.base,it.t),got=J.ok?it.t:J.got;const off=12*Math.log2(c.hz/S.base);$('#chart').innerHTML=chartSVG(ref,c.c.map(v=>v+off),got);
   const ok=J.ok;fb.className='fb '+(ok?'ok':'no');
   fb.innerHTML=ok?`✓ Получился ${it.t}-й тон — то, что нужно! ${spI<SP.length-1?'<br><button class="btn okb" id="snx" style="margin-top:12px">Следующий слог →</button>':''}`:`Похоже на <b>${got}-й тон</b> ${mini(got)}, а нужен ${it.t}-й. ${{1:'Держи голос ровно и высоко, как длинная нота.',2:'Подними голос снизу вверх, как будто удивляешься: «а?»',3:'Опусти голос вниз, а потом чуть подними.',4:'Резко опусти голос сверху вниз, как будто сердишься.'}[it.t]}`;
   lab.textContent='Нажми и попробуй ещё раз';
   const d2=S.done.speak||{items:{}};d2.items=d2.items||{};d2.tries=(d2.tries||0)+1;if(ok)d2.items[it.b+it.t]=1;d2.passed=Object.keys(d2.items).length;const k2=it.b+it.t,st2=(d2.stat||{});st2[k2]=st2[k2]||{tries:0,got:[]};st2[k2].tries++;st2[k2].got=(st2[k2].got.concat(J.got)).slice(-6);if(ok)st2[k2].ok=1;send('speak',{items:d2.items,passed:d2.passed,tries:d2.tries,stat:st2});
   if(ok&&$('#snx'))$('#snx').onclick=()=>{spI++;speakV();};
  }catch(e){fb.className='fb no';fb.textContent='Нет доступа к микрофону. Разреши микрофон в браузере (значок 🔒 или «аА» у адреса) и попробуй снова.';mic.classList.remove('rec');mic.textContent='🎤';stopFn=null;}
  busy=false;};}

/* ---------- 4. record for teacher ---------- */
const RECS=[['a','a','ā á ǎ à'],['o','o','ō ó ǒ ò'],['e','e','ē é ě è'],['i','yi','yī yí yǐ yì'],['u','wu','wū wú wǔ wù']];
const blobs={};
function recV(){const items=(S.done.rec&&S.done.rec.items)||{};
 shell(`${backBtn}<h2><span class="zh">录音</span>Запиши голос учителю</h2><p class="lead">Для каждой гласной: послушай образец, нажми «Записать» и произнеси её 4 раза — с 1-м, 2-м, 3-м и 4-м тоном. Только гласную, без согласных: «ā — á — ǎ — à». Потом прослушай себя и нажми «Отправить». Можно перезаписать сколько угодно раз.</p>
 <div class="grid2">${RECS.map(([id,b,txt])=>`<div class="rc n" id="rc-${id}"><div class="hd"><span class="py">${txt}</span><span class="st ${items[id]?'ok':''}" id="st-${id}">${items[id]?'✓ отправлено':''}</span></div>
  <div class="row"><button class="btn g" data-ref="${id}">▶ Образец</button><button class="btn" data-rec="${id}">● Записать</button><button class="btn g" data-pl="${id}" ${blobs[id]?'':'disabled'}>▶ Я</button><button class="btn okb" data-up="${id}" ${blobs[id]?'':'disabled'}>Отправить</button></div></div>`).join('')}</div>
 <div class="tip">💡 Говори чётко и не спеши: <b>ā — á — ǎ — à</b>. Если отправка не проходит, в конце будет запасная кнопка «Отправить через мессенджер».</div>`);
 document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{const r=RECS.find(x=>x[0]===b.dataset.ref);playSylSeq(r[1],b);});
 let stop=null,cur=null;
 document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=async()=>{const id=b.dataset.rec;
  if(stop&&cur===id){stop();return;}if(stop)return;cur=id;
  try{const bl=await record(12000,s=>{stop=s;b.classList.add('red');b.textContent='■ Стоп';});
   stop=null;cur=null;b.classList.remove('red');b.textContent='● Перезаписать';blobs[id]=bl;
   document.querySelector(`[data-pl="${id}"]`).disabled=false;document.querySelector(`[data-up="${id}"]`).disabled=false;
   $('#st-'+id).className='st';$('#st-'+id).textContent='записано, не отправлено';}
  catch(e){stop=null;cur=null;b.classList.remove('red');b.textContent='● Записать';toast('Нет доступа к микрофону — разреши его в браузере');}});
 document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{const bl=blobs[b.dataset.pl];if(!bl)return;try{curA&&curA.pause()}catch(e){}const a=new Audio(URL.createObjectURL(bl));curA=a;a.play();});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=async()=>{const id=b.dataset.up,bl=blobs[id];if(!bl)return;if(isTest()){$('#st-'+id).className='st ok';$('#st-'+id).textContent='✓ (режим учителя — не отправлено)';toast('Режим учителя: запись не отправляется');const d=S.done.rec||{items:{}};d.items=d.items||{};d.items[id]=Date.now();S.done.rec=d;keep();return;}b.disabled=true;b.textContent='Отправляю…';
  try{const r=await fetch(API+`audio?hw=${HW}&sid=${S.sid}&item=${id}`,{method:'POST',headers:{'Content-Type':bl.type||'audio/webm'},body:bl});if(!r.ok)throw 0;
   const d=S.done.rec||{items:{}};d.items=d.items||{};d.items[id]=Date.now();send('rec',{items:d.items});$('#st-'+id).className='st ok';$('#st-'+id).textContent='✓ отправлено';b.textContent='Отправлено ✓';toast('Запись отправлена учителю');}
  catch(e){b.disabled=false;b.textContent='Ещё раз';toast('Не отправилось. Попробуй ещё раз или используй запасной способ в конце');}});}

/* ---------- 5. theory ---------- */
const TQ=[
 ['Что такое пиньинь?',['Отдельный китайский язык','Запись звучания китайских слов латинскими буквами','Старинные иероглифы'],1],
 ['Сколько систем записи в китайском языке?',['Одна — только иероглифы','Две — иероглифы и пиньинь','Три'],1],
 ['Как китайцы печатают иероглифы на телефоне?',['Рисуют пальцем каждый иероглиф','Набирают пиньинь, а телефон предлагает иероглифы','Используют клавиатуру с тысячами кнопок'],1],
 ['Чему равен один иероглиф?',['Одному слогу','Целому предложению','Одной букве'],0],
 ['Сколько примерно слогов в китайском языке (без тонов)?',['Около 40','Около 400','Около 4000'],1],
 ['Из каких частей состоит китайский слог?',['Инициаль + финаль + тон','Корень + суффикс','Только из гласных'],0],
 ['В слоге mā что такое «m»?',['Финаль','Тон','Инициаль'],2],
 ['Почему китаец скажет «сыпутыник» вместо «спутник»?',['В китайском нет стечений согласных — он вставляет гласную','Он шутит','В китайском нет звука «с»'],0],
 ['Сколько тонов в путунхуа, если не считать нейтральный?',['Два','Четыре','Восемь'],1],
 ['妈 mā — «мама», 马 mǎ — «лошадь». Что меняет смысл?',['Инициаль','Тон','Финаль'],1],
 ['Какой значок у третьего тона?',['ˉ (ровная черта)','ˋ (вниз)','ˇ (галочка)'],2],
 ['Какие финали мы выучили первыми?',['a o e i u','b p m f','zh ch sh'],0]];
let T=null;
function theoryV(){T={i:0,res:[],pick:[]};askT();}
function askT(){if(T.i>=TQ.length){const sc=T.res.filter(Boolean).length;const pv=S.done.theory||{};send('theory',{score:Math.max(sc,pv.score||0),last:sc,of:TQ.length,ans:T.res.map(x=>x?1:0),pick:T.pick,attempts:(pv.attempts||0)+1});
  shell(`${backBtn}<h2>Теория пройдена!</h2><div class="res">${sc} / ${TQ.length}</div><p class="lead">${sc>=11?'Отлично! 🏆':sc>=8?'Хорошо! Можно пройти ещё раз.':'Повтори слайды урока и попробуй снова.'}</p><div class="row"><button class="btn" id="tag">Пройти ещё раз</button></div>`);$('#tag').onclick=theoryV;return;}
 const [q,o,c]=TQ[T.i];
 shell(`${backBtn}<h2><span class="zh">问题</span>Вопросы по теории</h2><div class="qcard n" style="text-align:left"><div class="qhead"><span>Вопрос ${T.i+1} из ${TQ.length}</span><span>${T.res.filter(Boolean).length} ✓</span></div>
 <h3 style="margin-top:14px">${q}</h3><div class="mcq">${o.map((t,k)=>`<button class="opt" data-o="${k}">${'АБВ'[k]}) ${t}</button>`).join('')}</div><div class="fb" id="tfb"></div></div>`);
 let lock=false;document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=+b.dataset.o===c;T.res[T.i]=ok;T.pick[T.i]=+b.dataset.o;
  document.querySelector(`[data-o="${c}"]`).classList.add('ok');if(!ok)b.classList.add('no');
  const fb=$('#tfb');fb.className='fb '+(ok?'ok':'no');fb.innerHTML=(ok?'✓ Верно!':'Правильный ответ подсвечен зелёным.')+'<br><button class="btn" id="tnx" style="margin-top:12px">Следующий вопрос →</button>';$('#tnx').onclick=()=>{T.i++;askT();};});}

/* ---------- finish ---------- */
function summary(){return `ДЗ 1 — ${S.name}\n`+TASKS.map(t=>`${status(t.id)[1]?'✅':'⬜'} ${t.t}: ${status(t.id)[0]||'не сделано'}`).join('\n');}
function finishV(){const all=TASKS.every(t=>status(t.id)[1]);
 shell(`${backBtn}<h2><span class="zh">完成</span>${all?'Всё сделано! 🎉':'Итог'}</h2><p class="lead">${all?'Молодец! Учитель уже видит твои ответы.':'Ещё не всё готово — задания без ✓ можно доделать.'}</p>
 <pre class="in" style="white-space:pre-wrap;padding:16px;margin-top:14px;font:600 15px/1.6 Manrope">${esc(summary())}</pre>
 <h3>Запасной способ</h3><p class="lead">Если внизу слева горит «⚠ нет связи», отправь итог и записи учителю в Telegram или WhatsApp:</p>
 <div class="row"><button class="btn" id="share">📨 Отправить через мессенджер</button><button class="btn g" id="copy">Скопировать итог</button></div>`);
 $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());toast('Скопировано');}catch(e){toast('Не получилось скопировать');}};
 $('#share').onclick=async()=>{const files=Object.entries(blobs).map(([id,b])=>new File([b],`${S.name}-${id}.${/mp4/.test(b.type)?'m4a':'webm'}`,{type:b.type}));
  try{if(files.length&&navigator.canShare&&navigator.canShare({files}))await navigator.share({title:'ДЗ 1',text:summary(),files});
   else if(navigator.share)await navigator.share({title:'ДЗ 1',text:summary()});
   else{files.forEach(f=>{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();});await navigator.clipboard.writeText(summary());toast('Записи скачаны, итог скопирован — отправь учителю');}}
  catch(e){}};}

/* ---------- login ---------- */
function login(){$('#app').innerHTML=`<div class="login n"><div class="zh" style="font-size:54px;color:var(--ac2)">作业</div><span class="py" style="color:var(--ac)">zuòyè</span><h2 style="margin-top:8px">Домашнее задание 1</h2><p class="lead">Напиши своё имя и фамилию, чтобы учитель знал, чьё это задание.</p>
 <input class="in" id="nm" placeholder="Имя Фамилия" autocomplete="name"><button class="btn" id="go" style="width:100%;margin-top:16px">Начать</button></div>`;
 const go2=()=>{const v=$('#nm').value.trim();if(v.length<2){toast('Напиши имя');return;}S.name=v.slice(0,60);S.sid=S.sid||(Date.now().toString(36)+Math.random().toString(36).slice(2,8));S.done=S.done||{};keep();send('hello',{plat:PLAT});go('home');};
 $('#go').onclick=go2;$('#nm').onkeydown=e=>{if(e.key==='Enter')go2();};}
if(S.name&&S.sid){go('home');flush();}else login();
</script></body></html>
