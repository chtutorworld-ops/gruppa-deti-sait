:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:34px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:19px;font-weight:800;color:var(--ink);line-height:1.15}
.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.prog{margin-left:auto;min-width:120px;font-size:13px;font-weight:800;color:var(--mu);text-align:right}
.prog .bar{height:8px;border-radius:5px;background:#D6DBE6;margin-top:6px;overflow:hidden}.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));border-radius:5px;transition:width .4s}
@media(max-width:600px){.top small{display:none}.top .zh{font-size:28px}.top h1{font-size:16px}.prog{min-width:90px}}
.main{padding:24px 24px 22px}
@media(max-width:600px){.main{padding:18px 14px}}
.part{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.part b{color:#fff;background:var(--ac);padding:3px 9px;border-radius:9px;letter-spacing:.04em}
.part b.l1{background:var(--t2)}
h2{font-size:28px;font-weight:800;color:var(--ink);line-height:1.15;letter-spacing:-.01em;margin-top:10px}
@media(max-width:600px){h2{font-size:23px}}
.hz{display:flex;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap}.hz .zh{font-size:34px;color:var(--ac2)}.hz .py{font-size:18px;color:var(--ac)}
.lead{font-size:17px;line-height:1.55;margin-top:12px}
.lead b{color:var(--ink)}
.lead em,.zh-i{font-family:var(--han);font-style:normal;color:var(--ac2);font-size:1.15em}
.ipy{font-family:Nunito;font-weight:800;color:var(--ac)}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:16.5px;background:var(--ac);color:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2);transition:transform .1s;text-decoration:none}
.btn:active{transform:scale(.97)}.btn.g{background:var(--bg);color:var(--ac2)}.btn.okb{background:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.cards{display:grid;gap:14px;margin-top:16px}@media(min-width:700px){.cards.c2{grid-template-columns:1fr 1fr}.cards.c3{grid-template-columns:repeat(3,1fr)}.cards.c4{grid-template-columns:repeat(4,1fr)}}
.card{padding:16px 18px;border-radius:22px;font-size:15.5px;line-height:1.5}
.card b.h{display:block;font-size:18px;color:var(--ac2);margin-bottom:4px;line-height:1.25}
.card .ic{font-size:26px;display:block;margin-bottom:4px}
.tip{margin-top:16px;padding:12px 16px;border-radius:16px;background:#FFF6DC;color:#6B5310;font-size:15.5px;line-height:1.5}
.say{display:inline-flex;align-items:center;gap:8px}
.say:after{content:'🔊';font-size:.6em;opacity:.55}
.say.on{color:var(--ok)!important}
/* check */
.chk{margin-top:22px;padding:18px;border-radius:22px}
.chk .q{font-size:17px;font-weight:800;color:var(--ink);line-height:1.4}
.chk .q:before{content:'✏️ Проверь себя';display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.mcq{display:grid;gap:10px;margin-top:12px}@media(min-width:700px){.mcq.two{grid-template-columns:1fr 1fr}}
.opt{padding:13px 16px;border-radius:18px;font-size:16px;font-weight:700;text-align:left;line-height:1.35;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.opt.ok{background:#DDF5EC;box-shadow:inset 3px 3px 8px #B9DCCD}.opt.no{background:#FFE3EB;box-shadow:inset 3px 3px 8px #F0C2D0}
.opt .zh{font-size:1.25em}
.fb{margin-top:12px;font-size:15.5px;font-weight:700;line-height:1.45;min-height:22px}.fb.ok{color:#14855E}.fb.no{color:#D9366A}
/* nav */
.nextbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid #D6DBE6;flex-wrap:wrap}
.nextbar .btn{flex:1 1 auto}.nextbar .btn.nx{flex:2 1 240px}
/* pieces */
.motto{text-align:center;padding:26px 10px 10px}
.motto .zh{font-size:46px;line-height:1.3;color:var(--ac2);letter-spacing:.04em}
.motto .py{font-size:19px;color:var(--ac);margin-top:8px}
.motto .ru{font-size:22px;font-weight:800;color:var(--ink);margin-top:12px}
@media(max-width:600px){.motto .zh{font-size:34px}}
.sys{padding:20px;border-radius:26px;color:#fff;text-align:center;display:grid;gap:4px;justify-items:center}
.sys .zh{font-size:58px;line-height:1.1;color:#fff}.sys .py{font-size:22px}.sys small{font-size:14.5px;font-weight:700;opacity:.92;line-height:1.4}
.phone{width:290px;max-width:100%;margin:18px auto 0;border-radius:40px;padding:12px;background:#1E2350;box-shadow:10px 10px 24px var(--sh1),-8px -8px 18px var(--sh2)}
.phone .sc{background:#F2F3F7;border-radius:30px;overflow:hidden;display:flex;flex-direction:column;min-height:440px}
.phone .hd{text-align:center;font-weight:800;font-size:14px;padding:14px 0 8px;color:#111}
.chat{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:9px 13px;border-radius:18px;font-size:19px;font-family:var(--han);line-height:1.3}
.bub.l{background:#fff;align-self:flex-start;border-bottom-left-radius:6px}.bub.r{background:#5B6BD8;color:#fff;align-self:flex-end;border-bottom-right-radius:6px;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.kbd{background:#D5D8E0;padding:8px 5px 12px}
.ipt{background:#fff;border-radius:10px;padding:8px 10px;font-size:18px;font-weight:800;font-family:Nunito;min-height:38px;color:#111}
.ipt i{color:var(--ac);font-style:normal;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.cand{display:flex;gap:6px;padding:7px 2px;min-height:44px;overflow-x:auto}
.cand button{padding:4px 12px;border-radius:9px;font-family:var(--han);font-size:22px;background:#fff;white-space:nowrap}
.cand button.best{background:#5B6BD8;color:#fff;animation:pop .3s}
.kr{display:flex;justify-content:center;gap:4px;margin-top:6px}

.tk .why div{padding:10px 14px;border-radius:14px;background:#FFF0F4;color:#7A1F3D;font-size:15px;line-height:1.45}.tk .why div.ok{background:#E6F7EF;color:#14674A}
.tk .sayg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.tk .sc{padding:14px 10px;border-radius:20px;text-align:center}
.tk .sc .zh{font-size:44px;color:var(--ac2);line-height:1.1}.tk .sc .py{font-size:19px;color:var(--ac)}.tk .sc small{display:block;font-size:13px;color:var(--mu);font-weight:700}
.tk .sc .row{justify-content:center;margin-top:8px;gap:8px}.tk .sc .btn{padding:9px 14px;font-size:14.5px}
.tk .sc.done{box-shadow:0 0 0 3px var(--ok),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.tk .wbox{position:relative;width:min(300px,78vw);height:min(300px,78vw);margin:14px auto 0;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;touch-action:none}
.tk .wbox svg.grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tk .wbox .hw{position:absolute;inset:0}
.tk .wch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tk .wch span{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--han);font-size:30px;color:var(--ac2)}
.tk .wch span.cur{box-shadow:0 0 0 3px var(--ac)}.tk .wch span.ok{background:#DDF5EC;color:#14855E}
.tk .bigname{font-family:var(--han);font-size:64px;color:var(--ac2);line-height:1.15;margin-top:6px}
.hint2{font-size:14.5px;font-weight:700;color:var(--mu)}
.btn.done{background:var(--ok)}

async function toPCM(ab){const buf=await new Promise((ok,bad)=>{const p=acx().decodeAudioData(ab,ok,bad);p&&p.catch&&p.catch(bad);});

 let run=0;for(let t=1;t<=tmax;t++){run+=d[t];d[t]=run?d[t]*t/run:1;}

const STEPS=[
 {t:'Начало',h:()=>`<span class="part"><b>补课</b> bǔkè · догоняем</span>
  <h2>Привет, Радмир! Догоняем урок 5 👋</h2>

 /* ---------- warm-up ---------- */
 {t:'Разминка: цепочки тонов',h:()=>`${P1}<h2>Разминка: 4 цепочки</h2><div class="hz"><span class="zh">热身</span><span class="py">rèshēn</span></div>

 {t:'С выдохом и без',h:()=>`${P1}<h2>С выдохом и без: b — p, d — t, g — k</h2>
  <p class="lead">Самая частая ошибка: читать <b>p</b> как русское «п». Китайское <b>p</b> — это «<b>пх</b>»: звук с <b>сильным выдохом</b>. Так же <b>t</b> = «тх», <b>k</b> = «кх». А <b>b, d, g</b> — без выдоха, мягкие.</p>
  <div class="cards c2"><div class="card n"><span class="ic">📄</span><b class="h">Проверка листком</b>Поднеси листок бумаги ко рту: на <b>p, t, k</b> он должен шевелиться, на <b>b, d, g</b> — нет.</div>
   <div class="card n"><span class="ic">✋</span><b class="h">Проверка ладонью</b>Ладонь у рта: на <b>pā</b> чувствуешь струю воздуха, на <b>bā</b> — почти ничего.</div></div>

  <div class="qbox in" id="q2"></div>`,

   quiz('#q2','asp','С выдохом или без?',order.map(([b,t,alt])=>({play:[urlS(mark(b,t))],q:'Какой слог прозвучал?',opts:[mark(b,t),mark(alt,t)],right:mark(b,t),ok:'Да, '+mark(b,t)+('ptk'.includes(b[0])?' — с выдохом':' — без выдоха')})),2);}},

 {t:'Шутер',h:()=>`${P1}${task(1,'🎯 Шутер: лови слог','На уроке это задание делали на телефоне, на скорость. Слог звучит — стреляй по шарику с этим слогом. Слоги из инициалей <b>b p m f d t n l g k h</b> и финалей <b>a o e i u</b>.')}`,on:shooter},

 {t:'Иероглифы-рисунки',h:()=>`${P3}<h2>Иероглифы были рисунками</h2><div class="hz"><span class="zh">象形字</span><span class="py">xiàngxíngzì</span></div>

 {t:'Как менялась лошадь',h:()=>`${P3}<h2>Как менялась «лошадь» 马</h2>

 /* ---------- radicals ---------- */
 {t:'Ключи 部首',h:()=>`${P4}<h2>Ключи — подсказки смысла</h2><div class="hz"><span class="zh">部首</span><span class="py">bùshǒu</span></div>

 {t:'Ключи — задание',h:()=>`${P4}${task(4,'🔑 Найди смысл ключа','Видишь ключ — выбери значок, что он значит. Видишь рисунок — найди ключ.')}`,on:radicals},

 /* ---------- writing ---------- */
 {t:'Правила порядка черт',h:()=>`${P5}<h2>В каком порядке писать черты</h2><div class="hz"><span class="zh">笔顺</span><span class="py">bǐshùn</span></div>
  <p class="lead">Иероглиф пишут не как попало, а <b>по порядку черт</b>. Вот 6 главных правил — смотри, как рисуется каждый пример.</p>
  <div class="rules">${[['三','Сверху вниз'],['川','Слева направо'],['十','Сначала горизонталь, потом вертикаль'],['人','Сначала влево, потом вправо'],['日','Сначала рамка, потом внутри, «дверь» закрываем в конце'],['小','Сначала середина, потом бока']].map(([c,t],i)=>`<div class="card n">${hzcell(c,120)}<small>Правило ${i+1}</small><b>${t}</b></div>`).join('')}</div>
  ${chk('Что пишем раньше в 十?',['Горизонталь, потом вертикаль','Вертикаль, потом горизонталь'],0,'Правило 3: сначала горизонталь.',true)}
  ${chk('Как пишем 日?',['Рамка, потом внутри, низ рамки в конце','Сначала середину, потом рамку','Снизу вверх'],0,'Правило 5: «дверь» закрываем в конце.')}`,
  on:animCells},
 charStep('你','nǐ','ты','亻 человек + 尔 · 7 черт',[
  ['🧍','Слева ключ '+zh('亻')+' «человек»: «ты» — это человек.'],
  ['➡️','Пишем <b>слева направо</b>: сначала весь '+zh('亻')+', потом правую часть.'],
  ['⚖️','Внизу справа: сначала <b>середина</b> (крючок), потом две точки по бокам.']]),
 charStep('我','wǒ','я','7 черт',[
  ['➖','Маленькая откидная сверху, потом <b>горизонталь</b>, и только потом вертикаль с крючком: горизонталь раньше вертикали.'],
  ['↘️','Длинная косая черта с крючком — главная, она «держит» знак.'],
  ['🔴','Последняя черта — <b>точка справа вверху</b>. Не забывай её!']]),
 charStep('好','hǎo','хорошо','女 женщина + 子 ребёнок · 6 черт',[
  ['👩‍👦',zh('女')+' «женщина» + '+zh('子')+' «ребёнок»: мама с ребёнком — это <b>хорошо</b>.'],
  ['➡️','Слева направо: сначала '+zh('女')+', потом '+zh('子')+'.'],
  ['↗️','Слева '+zh('女')+' узкий: последняя черта не ровная, а <b>поднимается вверх</b>.']]),
 charStep('叫','jiào','зваться, звать','口 рот + 丩 · 5 черт',[
  ['👄','Ключ '+zh('口')+' «рот»: звать и кричать — это делает рот.'],
  ['📦',zh('口')+' — как коробка: левая стенка, верх и правая стенка одной чертой, <b>дно в конце</b>.'],
  ['⬆️','Слева '+zh('口')+' маленький и стоит повыше.']]),
 {t:'Пропись — задание',h:()=>`${P5}${task(5,'✍️ Пропись: 你 我 好 叫','Теперь все четыре иероглифа подряд, как у группы на уроке.')}`,on:writing},

 /* ---------- names, greetings, 小明 ---------- */
 {t:'Наши имена',h:()=>`${P6}<h2>Наши имена по-китайски</h2><div class="hz"><span class="zh">我们班</span><span class="py">wǒmen bān</span></div>
  <p class="lead">Русские имена по-китайски записывают иероглифами, которые <b>звучат похоже</b>. Нажми на имя — послушай. Цвет пиньиня — это тон.</p>
  <div class="nmg">${NAMES.map(n=>`<button class="n${n===ME?' me':''}" data-w="${n.hz}">${n===ME?'<span class="tag2">это ты!</span>':n.tch?'<span class="tag2" style="background:var(--ac)">老师 · учитель</span>':''}<span class="zh" style="font-size:${n.hz.length>4?34:n.hz.length>3?40:46}px">${n.hz}</span><span class="py">${pyHtml(n)}</span><small>${n.ru} 🔊</small></button>`).join('')}</div>
  <div class="tip">🎶 В твоём имени ${zh('拉德米尔')} <span class="ipy">lā dé mǐ ěr</span> в конце два 3-х тона подряд: <b>mǐ ěr</b>. Помнишь правило 3 + 3? Первый звучит как 2-й: «mí ěr».</div>`},
 {t:'Моё имя — задание',h:()=>`${P6}${task(6,'✍️ Моё имя по-китайски','Послушай своё имя, скажи вслух 我叫拉德米尔 и пропиши имя по порядку черт.')}`,on:myname},
 {t:'Здороваемся',h:()=>`${P6}<h2>你好！我叫… — здороваемся</h2>
  <p class="lead">На уроке каждый по очереди здоровался с классом и называл себя. А класс отвечал хором ${zh('你们好')} — «привет всем!».</p>
  <div class="dlg">
   <button class="ln n" data-w="你好 我叫拉德米尔"><span class="zh">你好！我叫拉德米尔。</span><span><span class="py">nǐ hǎo! wǒ jiào Lādémǐ'ěr.</span><small>Привет! Меня зовут Радмир.</small></span></button>
   <button class="ln n r" data-w="你们好"><span class="zh">你们好！</span><span><span class="py">nǐmen hǎo!</span><small>Привет всем!</small></span></button>
  </div>
  <h3>Теперь ты</h3><p class="lead" style="margin-top:0">Нажми «● Скажи», скажи <b>${zh('你好！我叫拉德米尔。')}</b>, потом «▶ Я» — послушай себя и сравни с образцом.</p>
  ${recBox('rme',[],'你好 我叫拉德米尔')}
  <div class="tip">✔️ В <b>nǐ hǎo</b> первый слог поднимается (ní), в <b>wǒ jiào</b> первый слог низкий и короткий. Запись никуда не отправляется.</div>`,
  on:()=>bindRec('rme',[['你好']],'你好 我叫拉德米尔')},
 {t:'Знакомься: 小明',h:()=>`${P6}<h2>Знакомься: 小明</h2><div class="hz"><span class="zh">认识一下</span><span class="py">rènshi yíxià</span></div>
  <p class="lead">Это ${zh('小明')} <span class="ipy">Xiǎo Míng</span> — мальчик из Китая. Вот как вы познакомитесь. Нажимай на реплики 小明 и слушай, а свои говори вслух.</p>
  <div class="xmc">${[['xm','你好！','Nǐ hǎo!','Привет!'],['me','你好！','','Ты здороваешься в ответ'],['xm','我叫小明。','Wǒ jiào Xiǎo Míng.','Меня зовут Сяо Мин.'],['xm','你叫什么名字？','Nǐ jiào shénme míngzi?','Как тебя зовут?',1],['me','我叫拉德米尔。','wǒ jiào Lādémǐ\'ěr.','Ты называешь своё имя'],['xm','好！','Hǎo!','Хорошо!']].map(([w,z,p,r,nw])=>`<div class="ln${w==='me'?' me':''}">${w==='me'?'<span class="av me">Р</span>':`<img class="av" src="${IMG}xiaoming.jpg" alt="小明">`}<div class="bb">${nw?'<span class="nw">✨ новое · пока просто пойми</span><br>':''}${w==='xm'?`<button class="zh say" data-w="${z.replace(/[！？。]/g,'')}">${z}</button>`:`<span class="zh">${z}</span>`}${p?`<span class="py">${p}</span>`:''}<small>${r}</small></div></div>`).join('')}</div>
  <div class="tip">🎤 Настоящий разговор с 小明 в микрофон — в <b>домашнем задании</b>. Там он сам поздоровается и спросит, как тебя зовут!</div>
  ${chk('小明 спрашивает: <span class="zh-i">你叫什么名字？</span> Что ты ответишь?',['<span class="zh">我叫拉德米尔。</span>','<span class="zh">你好！</span>','<span class="zh">好！</span>'],0,'Он спросил «Как тебя зовут?» — отвечаем 我叫… и имя.')}`},

 {t:'Финиш',h:()=>{const R=Object.values(ST.res);return `<span class="part"><b style="background:var(--ok)">🏁</b> финиш</span>
  <h2>Радмир, ты догнал группу! 🎉</h2>
  <p class="lead">Теперь ты знаешь всё, что прошли на уроке 5: откуда взялись иероглифы, что такое ключи, как писать ${zh('你 我 好 叫')} и своё имя ${zh('拉德米尔')} и как знакомиться.</p>
  ${R.length?`<h3>Мои результаты</h3><div class="sumr">${R.map(r=>`<div class="n"><span>${r.t}</span><b class="${r.ok>=r.of-1||r.of===30&&r.ok>=24?'g':'y'}">${r.ok} / ${r.of}${r.ok>=r.of-1||r.of===30&&r.ok>=24?' ✓':' · можно повторить для закрепления'}</b></div>`).join('')}</div>`:''}
  <div id="godz"></div>`;},
  on:()=>{send('dg',{done:true,res:ST.res});
   fetch('../dz-5/',{method:'HEAD',cache:'no-store'}).then(r=>r.ok).catch(()=>false).then(ok=>{const g=$('#godz');if(!g)return;
    if(!ok){g.innerHTML='<div class="tip" style="text-align:center">📚 Домашнее задание к уроку 5 скоро появится — учитель пришлёт ссылку.</div>';return;}
    const url='../dz-5/'+(isTest()?'':'?name='+encodeURIComponent('Радмир'));
    g.innerHTML=`<div class="row" style="justify-content:center;margin-top:24px"><a class="btn okb" href="${url}" style="font-size:19px;padding:18px 30px">Домашнее задание к уроку 5 → <span id="cd">через 10 с</span></a></div>
     <p class="lead" style="text-align:center;font-size:15px;color:var(--mu)">Сейчас откроется домашнее задание — его делает вся группа. Там будет много прописей, игры с ключами и разговор с 小明.</p>`;
    let n=10;const t=setInterval(()=>{const c=$('#cd');if(!c){clearInterval(t);return;}n--;c.textContent=n>0?'через '+n+' с':'';if(n<=0){clearInterval(t);location.href=url;}},1000);});}}
];

/* ===================== shell ===================== */
const wordBtns=(list,showSay)=>`<div class="wl">${list.map(([hz,py,say,ru])=>`<button class="n" data-w="${hz}"><span class="zh">${hz}</span><span class="py">${tpy(py)}</span>${showSay&&say?`<span class="snd">звучит: <span class="py" style="font-size:16px">${tpy(say)}</span></span>`:''}<small>${ru} 🔊</small></button>`).join('')}</div>`;
let cur=0;try{cur=Math.min(STEPS.length-1,+localStorage.getItem('zh-dogon5-step')||0);}catch(e){}
function render(){const s=STEPS[cur];try{localStorage.setItem('zh-dogon5-step',cur)}catch(e){}LASTPOS=[];stopAll();stopTM();
 $('#app').innerHTML=`<div class="top n"><span class="zh">补课</span><div><h1>Догоняем урок 5</h1><small>${isTest()?'🧑‍🏫 режим учителя — результаты не сохраняются':'Иероглифы, ключи, 你 我 好 叫, имена, 小明'}</small></div>
   <div class="prog">Шаг ${cur} из ${STEPS.length-1}<div class="bar"><i style="width:${cur/(STEPS.length-1)*100}%"></i></div></div></div>
  <div class="main n">${s.h()}
   <div class="nextbar">${cur?'<button class="btn g" id="pv">‹ Назад</button>':''}${cur<STEPS.length-1?`<button class="btn nx" id="nx">${!cur?'Начать →':cur===STEPS.length-2?'Финиш →':'Дальше: '+STEPS[cur+1].t+' →'}</button>`:''}</div></div>`;
 bind();s.on&&s.on();
 const nx=$('#nx'),pv=$('#pv');nx&&(nx.onclick=()=>{if(!cur&&!ST.name){toast('Сначала выбери, кто занимается 🙂');return;}cur++;render();scrollTo({top:0,behavior:'smooth'});});pv&&(pv.onclick=()=>{cur--;render();scrollTo({top:0,behavior:'smooth'});});}
Promise.race([VOKP,new Promise(r=>setTimeout(r,2500))]).then(()=>{render();flush();preload(['你好','我叫','拉德米尔'].map(urlW));});
</script></body></html>
