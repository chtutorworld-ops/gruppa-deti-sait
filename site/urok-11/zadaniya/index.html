:root{--bg:#E9EDF4;--ink:#1E2350;--t:#3D4560;--mu:#7D86A3;--ac:#5B6BD8;--ac2:#2B3270;--ok:#2DBE8C;--no:#FF5C8A;--sh1:#C5CBD8;--sh2:#fff;
 --t1:#2DBE8C;--t2:#F5A524;--t3:#7C6FFF;--t4:#FF5C8A;--t0:#9AA2BC;--han:'LXGW WenKai GB','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Manrope,'PinyinFix','LXGW WenKai GB',system-ui,-apple-system,sans-serif;color:var(--t);min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 40px}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.zh{font-family:var(--han);font-weight:400}.py{font-family:Nunito,'PinyinFix','LXGW WenKai GB',Manrope,sans-serif;font-weight:800}
.n{background:var(--bg);border-radius:24px;box-shadow:8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.in{background:var(--bg);border-radius:18px;box-shadow:inset 5px 5px 10px var(--sh1),inset -5px -5px 10px var(--sh2)}
.app{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
.top .zh{font-size:32px;color:var(--ac2);line-height:1;white-space:nowrap}
.top h1{font-size:18px;font-weight:800;color:var(--ink);line-height:1.15}.top small{display:block;font-size:13px;color:var(--mu);font-weight:600}
.main{padding:22px 20px}
@media(max-width:600px){.main{padding:18px 14px}}
h2{font-size:25px;font-weight:800;color:var(--ink);line-height:1.15;margin-top:6px}
.lead{font-size:16.5px;line-height:1.5;margin-top:10px}
.lead b{color:var(--ink)}
h3{font-size:18px;font-weight:800;color:var(--ink);margin:22px 0 10px}
.list{display:grid;gap:12px;margin-top:16px}
.ti{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-align:left;width:100%}
.ti .no{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font:900 22px Nunito,'PinyinFix','LXGW WenKai GB';color:#fff;background:var(--ac)}
.ti b{display:block;font-size:16.5px;color:var(--ink);line-height:1.25}.ti small{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-top:2px}
.ti .st{margin-left:auto;font-size:13px;font-weight:800;color:var(--ok);white-space:nowrap}
.ti.hot{box-shadow:0 0 0 3px var(--t2),8px 8px 18px var(--sh1),-8px -8px 18px var(--sh2)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;color:var(--ac);padding:8px 14px;border-radius:14px;margin-bottom:12px}
.tag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#B0284F;padding:4px 10px;border-radius:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:18px;font-weight:800;font-size:16.5px;background:var(--ac);color:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.btn.g{background:var(--bg);color:var(--ac2)}.btn:active{transform:scale(.97)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}

 --ink:#191B2E;--ink-3:#3E4262;--muted:#6C6982;--vio:#4E4C8E;--vio-2:#33315F;--jade:#2E7F6C;--rose:#A8456A;--serif:'Lora','PinyinFix','LXGW WenKai GB',Georgia,serif;--sans:'Manrope','PinyinFix','LXGW WenKai GB',system-ui,sans-serif;--ease-out:cubic-bezier(.22,.9,.3,1)}

.kfs,.kx{position:absolute;right:8px;bottom:8px;z-index:50;width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.85);font-size:20px;cursor:pointer;color:#2B3270}

.khint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:55;display:none;align-items:center;gap:10px;padding:10px 18px;border-radius:18px;background:rgba(18,14,50,.85);color:#fff;font:900 18px Nunito,'PinyinFix','LXGW WenKai GB';pointer-events:none;white-space:nowrap}

@keyframes khint{0%,80%{opacity:1}100%{opacity:0}}

.kst:fullscreen,.kst:-webkit-full-screen{width:100vw;height:100vh}
/* ===== ДЗ 7 ===== */
.pbar{position:relative;margin:-6px 0 16px;padding:10px 16px 12px;border-radius:18px}
.pbt{display:flex;justify-content:space-between;align-items:baseline;font:800 14px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu)}.pbt b{font:900 20px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2)}
.pbl{height:12px;border-radius:7px;background:#D6DBE6;margin-top:6px;overflow:hidden}.pbl i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#2DBE8C,#5B6BD8);transition:width .5s}
.ti .sc7{margin-left:auto;font:900 15px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ok);white-space:nowrap}
.ti.todo .no{background:#AEB5C8}
.left{margin-top:18px;padding:16px 18px;border-radius:22px;background:#FFF0F4;box-shadow:inset 0 0 0 3px #FFB3C8}
.left h3{margin:0 0 8px;color:#B0284F;font-size:20px}
.left button{display:flex;width:100%;align-items:center;gap:12px;padding:10px 12px;margin-top:8px;border-radius:16px;background:#fff;text-align:left;font-weight:800;color:var(--ink);font-size:16px}
.left button .no{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#FF5C8A;color:#fff;font:900 19px Nunito,'PinyinFix','LXGW WenKai GB'}
.left button small{margin-left:auto;color:var(--ac);font-weight:800;white-space:nowrap}
.allok{margin-top:18px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#2DBE8C,#5B6BD8);color:#fff;text-align:center;font:900 22px Nunito,'PinyinFix','LXGW WenKai GB'}
/* tones */
.tgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.tc{position:relative;padding:14px 10px 12px;border-radius:24px;color:#fff;text-align:center;background:var(--tc);box-shadow:0 10px 22px rgba(30,35,80,.18)}
.tc .tn{position:absolute;left:10px;top:10px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--tc);display:grid;place-items:center;font:900 26px Nunito,'PinyinFix','LXGW WenKai GB'}
.tc .tm{font:900 74px/1 Nunito,'PinyinFix','LXGW WenKai GB';height:70px;display:grid;place-items:center}
.tc svg{width:100%;max-width:150px;height:46px;margin:2px auto 0;display:block}
.tc .ts{font:900 34px Nunito,'PinyinFix','LXGW WenKai GB';margin-top:2px}
.tc small{display:block;font:800 14.5px Manrope,'PinyinFix','LXGW WenKai GB';line-height:1.3;opacity:.95;margin-top:4px}
.tc button{margin-top:8px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.25);color:#fff;font-weight:900;font-size:16px}
@media(max-width:420px){.tc .tm{font-size:60px;height:58px}.tc .ts{font-size:28px}.tc small{font-size:13px}}
.big7{font:900 96px/1.1 Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2);margin:10px 0 0}
.big7.zh{font-family:var(--han);font-weight:400}
.big7 .num{display:inline-grid;place-items:center;width:120px;height:120px;border-radius:50%;color:#fff;font-size:76px}
.opt.num{font-size:34px}.opt.num small{display:block;font:800 13px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu)}
.opt.mk{font-size:60px;line-height:1}
.opt.tx{font:800 19px Manrope,'PinyinFix','LXGW WenKai GB';padding:16px 8px}
.opt.zh{font-family:var(--han);font-weight:400;font-size:52px}
.opts.o4{grid-template-columns:repeat(2,1fr)}
.qq{font-size:20px;font-weight:800;color:var(--ink);line-height:1.35;margin-top:12px}.qq b{color:#B0284F}
.nxt{margin-top:14px;width:100%}
/* the ci / chi rule */
.zwarn{margin-top:14px;padding:18px 18px 16px;border-radius:26px;background:linear-gradient(135deg,#FF3D77,#FF8A3D);color:#fff;box-shadow:0 14px 30px rgba(255,61,119,.35)}
.zwarn .k2{display:inline-block;padding:4px 12px;border-radius:12px;background:rgba(255,255,255,.25);font:900 14px Manrope,'PinyinFix','LXGW WenKai GB';letter-spacing:.06em;text-transform:uppercase}
.zwarn .h{font:900 27px/1.2 Nunito,'PinyinFix','LXGW WenKai GB';margin-top:8px}
.zwarn p{font:700 17px/1.45 Manrope,'PinyinFix','LXGW WenKai GB';margin-top:8px}.zwarn p b{background:rgba(255,255,255,.22);padding:0 6px;border-radius:8px}
.zpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.zpair div{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;color:var(--ink)}
.zpair .a{font:900 30px Nunito,'PinyinFix','LXGW WenKai GB';color:#FF3D77}.zpair .a s{color:#9AA2BC;text-decoration-thickness:3px}
.zpair .r{font:900 24px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2)}.zpair small{display:block;font:800 13px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu)}
.zrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.zrow button{padding:10px 4px;border-radius:18px;text-align:center}.zrow b{display:block;font:900 26px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2)}.zrow small{font:800 15px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu)}
.zrow button.hot{box-shadow:0 0 0 3px #FF3D77,6px 6px 14px var(--sh1)}.zrow button.hot b{color:#FF3D77}
/* radicals */
.keyh{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;padding:12px;border-radius:22px;background:linear-gradient(135deg,#FFE3EB,#FFF1D6)}
.keyh .zh{font-size:72px;line-height:1;color:#FF3D77}.keyh b{display:block;font:900 22px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ink)}.keyh small{font:800 13px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu)}
.newb{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:10px;background:#5B6BD8;color:#fff;font:900 12.5px Manrope,'PinyinFix','LXGW WenKai GB';letter-spacing:.05em}
.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.reveal div{padding:8px 4px;border-radius:16px;background:#fff;text-align:center}.reveal .zh{font-size:40px;color:var(--ac2);line-height:1.1}.reveal .py{font-size:16px;color:var(--ac)}.reveal small{display:block;font:800 13px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--ink)}
.reveal div.ok{box-shadow:inset 0 0 0 3px var(--ok);background:#E6F7EF}
.reveal i{font-style:normal;color:#FF3D77}
.split{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;font:900 22px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--mu)}.split .zh{font-size:48px;color:var(--ac2)}
/* stroke order */
.sopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sopts button{padding:8px;border-radius:20px;background:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2)}
.sopts svg{width:100%;aspect-ratio:1/1;display:block}
.sopts button.ok{box-shadow:inset 0 0 0 4px var(--ok);background:#E6F7EF}.sopts button.no{box-shadow:inset 0 0 0 4px var(--no);background:#FFE3EB}
.sbig{width:min(150px,40vw);margin:10px auto 0;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;position:relative}
.sbig svg{display:block;width:100%;aspect-ratio:1/1}
.anim{width:min(220px,60vw);height:min(220px,60vw);margin:12px auto 0;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 3px #FF8FA8;position:relative}
.anim .hw{position:absolute;inset:0}.anim svg.grid{position:absolute;inset:0;width:100%;height:100%}
.srules{display:grid;gap:8px;margin-top:10px}.srules span{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.2);border-radius:16px;padding:9px 12px}.srules .zh{font-size:32px;line-height:1;min-width:40px;text-align:center}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#D9D2F5 url(img/fon.webp) 50% 100%/cover no-repeat}
html,body{background:transparent}
.opt.sv{padding:8px;background:#fff}.opt.sv svg{width:100%;aspect-ratio:1/1;display:block}
.opt.sv.ok{background:#DDF5EC}.opt.sv.no{background:#FFE3EB}
.zpair .a,.zpair .r{display:block}
.opts:has(.opt.sv){max-width:520px;margin-left:auto;margin-right:auto}
body{font-family:Manrope,'LXGW WenKai GB',system-ui,-apple-system,sans-serif}
/* ===== Урок 8 ===== */
.dots{flex-wrap:wrap}.dots i{flex:0 1 22px}
.tleg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tleg div{background:var(--tc);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.tleg span{display:block;height:32px}.tleg small{display:block;font:900 14px Manrope,'PinyinFix','LXGW WenKai GB';color:#fff}
.mkb{display:inline-grid;place-items:center;vertical-align:middle;background:var(--tc);border-radius:9px;padding:1px 8px;height:30px}
.pz8{margin-top:12px;padding:12px 16px;border-radius:18px;background:#FFF1D6;box-shadow:inset 0 0 0 3px #F5A524;color:#6B4A00;font:800 16px/1.4 Manrope,'PinyinFix','LXGW WenKai GB'}
/* dictation of tones */
.dl8{display:grid;gap:10px;margin-top:14px}
.dr8{display:grid;grid-template-columns:44px minmax(64px,auto) 1fr;align-items:center;gap:10px;padding:10px 12px;border-radius:20px}
.dr8 .no,.in8 .no{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#AEB5C8;color:#fff;font:900 20px Nunito,'PinyinFix','LXGW WenKai GB'}
.dr8.cur{box-shadow:0 0 0 3px var(--ac),6px 6px 14px var(--sh1)}.dr8.cur .no{background:var(--ac)}
.dr8.ok{background:#E6F7EF}.dr8.ok .no{background:var(--ok)}.dr8.no{background:#FFF0F4}.dr8.no .no{background:var(--no)}
.sy8{font:900 34px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2);letter-spacing:.02em}
.mk8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.mk8 button.ok{box-shadow:inset 0 0 0 4px var(--ok);background:#DDF5EC}.mk8 button.no{box-shadow:inset 0 0 0 4px var(--no);background:#FFE3EB}
.mk8.big{margin-top:10px;gap:10px}.mk8.big button{height:68px}
.mk8.five{grid-template-columns:repeat(5,1fr)}.mk8.five small{font:800 11.5px/1.15 Manrope,'PinyinFix','LXGW WenKai GB';color:var(--ac2)}
.ear8{justify-self:start;width:46px;height:46px;border-radius:50%;background:#fff;font-size:20px;box-shadow:4px 4px 10px var(--sh1)}
.ear8.on{box-shadow:inset 0 0 0 3px var(--ok)}
.dr8 .vr8{display:none}
.dr8 .why8{grid-column:1/-1}
.why8{margin-top:8px;padding:10px 14px;border-radius:14px;background:#fff;color:#7A1F3D;font:700 15.5px/1.5 Manrope,'PinyinFix','LXGW WenKai GB';text-align:left}
.why8 b{color:#B0284F}
.ans8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.ans8 button{padding:8px 4px;border-radius:14px;text-align:center}.ans8 b{display:block;font:900 22px Nunito,'PinyinFix','LXGW WenKai GB'}.ans8 small{display:block;font:800 12px Manrope,'PinyinFix','LXGW WenKai GB';margin-top:2px}
.ans8 .ok{background:#DDF5EC;color:#14855E}.ans8 .no{background:#FFE3EB;color:#B0284F}
/* dictation with letters */
.in8{display:flex;align-items:center;gap:10px;margin-top:12px;justify-content:center}
.in8 input{width:min(200px,48vw);font:900 34px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2);text-align:center;padding:8px 10px;border:0;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 3px #C9CFF5;outline:none}
.in8 input:focus{box-shadow:inset 0 0 0 3px var(--ac)}
.tm8{min-width:40px;height:40px;display:grid;place-items:center}
.kb8{display:grid;gap:6px;margin-top:12px}
.kb8>div{display:flex;justify-content:center;gap:4px}
.kb8 button{flex:1 1 0;max-width:42px;height:44px;border-radius:10px;background:#fff;font:900 20px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2);box-shadow:0 3px 0 #C5CBD8}
.kb8 button:active{transform:translateY(2px);box-shadow:none}.kb8 .bs{max-width:58px;flex:1.4 1 0;color:#B0284F}
.kb8 button:disabled,.mk8 button:disabled{opacity:.55}
.mk8 button.ok:disabled,.mk8 button.no:disabled{opacity:1}
.big8{font:900 56px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2);margin:4px 0}
.lcs8{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lc8{border-radius:16px;background:#FFF0F4;padding:8px;text-align:center;color:#7A1F3D}
.lc8 b{display:block;font:900 64px/1 Nunito,'PinyinFix','LXGW WenKai GB';color:#B0284F}.lc8 span{display:block;font:900 14px Manrope,'PinyinFix','LXGW WenKai GB'}.lc8 small{display:block;font:700 12.5px/1.3 Manrope,'PinyinFix','LXGW WenKai GB';margin-top:2px}
.lc8.hot{background:#E6F7EF;color:#14674A;box-shadow:inset 0 0 0 3px var(--ok)}.lc8.hot b{color:#14855E}
.ru8{display:block;margin-top:8px;font:700 13.5px/1.4 Manrope,'PinyinFix','LXGW WenKai GB';color:#6B5310;background:#FFF6DC;border-radius:10px;padding:6px 10px}
/* writing */
.ph8{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:6px;text-align:left}
.ph8 .zh{font-size:58px;line-height:1;color:var(--ac2)}.ph8 .py{font-size:22px;color:var(--ac)}.ph8 small{display:block;font:700 13.5px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu)}
.cw8{display:flex;justify-content:center;gap:8px;margin-top:6px}
.cw8 span{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:400 34px var(--han);background:#fff;color:#C5CBD8;box-shadow:inset 0 0 0 2px #D6DBE6}

.py8{font:900 40px Nunito,'PinyinFix','LXGW WenKai GB';color:var(--ac2);margin-top:4px}.py8 .cur{color:var(--ac);text-decoration:underline 4px;text-underline-offset:6px}.py8 .dim{color:#B6BDCF}
/* the table */
.tb8{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.th8{text-align:center;font:900 14px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.tc8{min-height:104px;border-radius:20px;background:#fff;box-shadow:6px 6px 14px var(--sh1),-6px -6px 14px var(--sh2);display:grid;justify-items:center;align-content:center;gap:2px;padding:8px 4px;position:relative}
.tc8 small{font:800 14px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu)}
.tc8 .zh{font-size:40px;line-height:1.1;color:var(--ac2)}.tc8 .py{font-size:19px}
.tc8 .q8{font-size:30px;opacity:.6}
.tc8.done{background:#F2FBF7;box-shadow:inset 0 0 0 3px #9BE0C6}
.tc8.empty{background:transparent;box-shadow:inset 0 0 0 2px #D6DBE6}
.tc8 i{position:absolute;right:8px;top:6px;font-style:normal;font-size:15px}
.tc8.pop{animation:pop8 .6s ease-out}@keyframes pop8{0%{transform:scale(1.12)}100%{transform:scale(1)}}
.tb8.small .tc8{min-height:84px}.tb8.small .zh{font-size:32px}
.tb8.rec .tc8.on{box-shadow:inset 0 0 0 3px var(--ac)}
/* cards: drag & drop */
.bd81{display:grid;gap:8px;margin-top:14px}
.r81{display:grid;grid-template-columns:minmax(92px,32%) 1fr;gap:10px;align-items:center}
.lb81{font:900 18px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--ink);background:#fff;border-radius:14px;padding:12px 10px;text-align:center;box-shadow:inset 0 0 0 2px #D6DBE6}
.slot8{min-height:60px;border-radius:16px;border:3px dashed #B8C0D6;background:rgba(255,255,255,.45);display:grid;place-items:stretch;transition:background .2s,border-color .2s}
.slot8.over{border-color:var(--ac);background:#EEF0FF}.slot8.full{border-style:solid;border-color:transparent;background:transparent}
.slot8.ok{border-color:var(--ok)}.slot8.bad{border-color:var(--no);background:#FFE3EB}
.pool8{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;padding:12px;border-radius:20px;background:rgba(255,255,255,.55);min-height:70px}
.pool8.hide{display:none}
.cd8{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #C5CBD8,0 6px 14px rgba(30,35,80,.12);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;min-height:54px}

.cd8.lift{opacity:.35}
.cd8.used{box-shadow:none;background:#E6F7EF;cursor:default;width:100%;justify-content:center}
.cd8.shk{animation:shk8 .45s}@keyframes shk8{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.dg8{position:fixed;z-index:2000;pointer-events:none;opacity:.95;transform:rotate(-3deg) scale(1.05);box-shadow:0 14px 30px rgba(30,35,80,.3)!important;margin:0}
.snd8{width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:15px;flex:none}
.snd8.on{box-shadow:inset 0 0 0 3px var(--ok)}
.ru8c{font:800 15px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--ink)}
.bd82{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.h82{text-align:center;font:900 12.5px Manrope,'PinyinFix','LXGW WenKai GB';color:var(--mu);text-transform:uppercase}
.s82{min-height:52px}

<script>/* Ядро каталога: голос, звуки, картинки, реестр игр. */
(function(){
  const K = window.KAT = window.KAT || {};
  K.AUDIO = K.AUDIO || {};   // 'текст' или 'голос:текст' -> data:audio/mpeg;base64,...
  K.IMG = K.IMG || {};       // имя -> data:image/webp;base64,...
  K.GAMES = K.GAMES || [];
  K.TTS_FALLBACK = K.TTS_FALLBACK || '';   // в тестовой обвязке — адрес сервера голоса
  K.reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let AC = null;
  K.ac = () => { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; };
  K.img = name => K.IMG[name] || '';
  // ДЗ 6: голос берём из озвучки сайта (window.KSAY), звуки заранее загружены — без паузы
  K.say = (text) => window.KSAY ? window.KSAY(text) : Promise.resolve();
  K.stopVoice = () => { if (window.KSTOP) window.KSTOP(); };

  /* ---- синтезированные звуки ---- */
  function env(g, t, a, d, peak = .3){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone(type, f1, f2, dur, peak = .25, delay = 0){
    const c = K.ac(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    env(g, t, .005, dur, peak); o.connect(g).connect(K.master()); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, filt = 'lowpass', f1 = 2000, f2 = 400, peak = .3, delay = 0){
    const c = K.ac(), t = c.currentTime + delay, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = filt; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); env(g, t, .004, dur, peak); s.connect(f).connect(g).connect(K.master()); s.start(t); s.stop(t + dur + .05);
  }
  let M = null;
  K.volume = .8;
  K.master = () => { const c = K.ac(); if (!M) { M = c.createGain(); M.gain.value = K.volume; M.connect(c.destination); } return M; };
  const SFX = {
    pop:   () => { noise(.12, 'bandpass', 1800, 600, .5); tone('sine', 700, 180, .1, .25); },
    laser: () => tone('square', 1400, 180, .16, .12),
    boom:  () => { noise(.55, 'lowpass', 1200, 80, .6); tone('sine', 120, 40, .4, .35); },
    coin:  () => { tone('square', 988, 0, .08, .12); tone('square', 1319, 0, .25, .12, .08); },
    ok:    () => { tone('triangle', 523, 0, .12, .25); tone('triangle', 659, 0, .12, .25, .09); tone('triangle', 784, 0, .25, .25, .18); },
    no:    () => { tone('sawtooth', 220, 180, .18, .12); tone('sawtooth', 180, 140, .25, .12, .16); },
    win:   () => { [523, 659, 784, 1047].forEach((f, i) => tone('triangle', f, 0, .22, .25, i * .11)); tone('triangle', 1319, 0, .5, .2, .48); },
    whoosh:() => noise(.35, 'bandpass', 400, 3000, .25),
    click: () => tone('square', 1800, 900, .03, .08),
    tick:  () => tone('sine', 1500, 0, .03, .12),
    bell:  () => { tone('sine', 1760, 0, .9, .2); tone('sine', 2640, 0, .6, .08); },
    paper: () => noise(.28, 'highpass', 1500, 5000, .18),
    chew:  () => { noise(.07, 'bandpass', 900, 500, .3); noise(.07, 'bandpass', 800, 450, .25, .12); },
    pour:  () => noise(.9, 'bandpass', 900, 1400, .12),
    cash:  () => { tone('sine', 2093, 0, .5, .18); tone('sine', 2637, 0, .6, .12, .05); noise(.25, 'highpass', 4000, 8000, .12, .1); },
    step:  () => noise(.06, 'lowpass', 600, 200, .25),
    zap:   () => tone('sawtooth', 600, 1800, .12, .1),
    gem:   () => { tone('sine', 1047, 1568, .15, .2); tone('sine', 1568, 2093, .2, .15, .08); },
  };
  K.sfx = name => { try { (SFX[name] || SFX.click)(); } catch (e) {} };
  K.register = g => { K.GAMES.push(g); };
  // координаты указателя на сцене 1280×720 (сцена может быть повёрнута на телефоне)
  K.toXY = (stage, e) => { const q = stage._rot; if (q) return [(e.clientY - q.ty) / q.k, (q.tx - e.clientX) / q.k]; const r = stage.getBoundingClientRect(); return [(e.clientX - r.left) * 1280 / r.width, (e.clientY - r.top) * 720 / r.height]; };
  K.game = id => K.GAMES.find(g => g.id === id);
  // черты иероглифов: из данных Hanzi Writer, которые вшиты в страницу
  K.HZ = K.HZ || {};
  if (window.HZDATA) for (const c in window.HZDATA) { const d = window.HZDATA[c]; K.HZ[c] = {s: d.strokes, m: d.medians, r: d.radStrokes || []}; }
  // вспомогательные
  K.shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  K.pick = a => a[Math.floor(Math.random() * a.length)];
})();</script>

const D2=['mā','bà','tǔ','dí','kě','fó','lù','hē','nǐ','pō'];

function dragKit(onDrop){let sel=null;

   if(moved&&ghost){e.preventDefault();ghost.style.left=(e.clientX-ghost._ox)+'px';ghost.style.top=(e.clientY-ghost._oy)+'px';document.querySelectorAll('.slot8.over').forEach(s=>s.classList.remove('over'));const s=slotAt(e.clientX,e.clientY);if(s)s.classList.add('over');}});

   if(was){const s=slotAt(e.clientX,e.clientY);if(s)onDrop(card,s);}else pick(card);};

 const ask=()=>{if(k>=Q.length)return end();const q=Q[k];const pool=['他','她','我','你们','我们','他们','叫','好','小明','小美','妈妈','爸爸'];

  if(q.w.includes('他')&&!extra.includes('她')){extra.pop();extra.push('她');}if(q.w.includes('她')&&!extra.includes('他')){extra.pop();extra.push('他');}
  const tiles=shuffle([...q.w,...extra]);let got=[],bad=0;
  shell(`${backBtn}${tag(n)}<h2>🧱 Собери фразу</h2>

    if(got.length===q.w.length){playW(q.say);const fb=$('#fb');fb.className='fb ok';fb.innerHTML=`✓ Верно! <b class="zh">${q.w.join('')}</b> <span class="py">${q.w.map(x=>FZT[x]).join(' ')}</span>`;
     $('#nx').innerHTML=`<div class="row" style="justify-content:center"><button class="btn g" id="ls">🔊 Ещё раз</button><button class="btn" id="nb">${k+1<Q.length?'Дальше →':'Готово →'}</button></div>`;

   else{errs++;bad++;if(bad===1)miss.push(q.ru);shake(b);const fb=$('#fb');fb.className='fb no';
    fb.innerHTML=`<div class="why8">✗ ${t==='他'&&want==='她'?'Тут <b>она</b> — нужен 她 с ключом <b>女</b> «женщина».':t==='她'&&want==='他'?'Тут <b>он</b> — нужен 他 с ключом <b>亻</b> «человек».':`Сейчас нужно слово «${FZT[want]}». Посмотри ещё раз 🙂`}</div>`;}});};
 const end=()=>{finish(n,Q.length-miss.length,Q.length,{errs,miss});

   later(()=>{shell(doneBox(n,`<div class="res" style="text-align:center">🧩 Собрано!</div><p class="lead" style="text-align:center">${errs?`Ошибок: ${errs}. Можно повторить для закрепления 🙂`:'Без единой ошибки! 🏆'}</p>

 ['Она твоя мама?','她是你妈妈吗？','tā shì nǐ māma ma?',1,'她是你妈妈吗？',''],
 ['Ты моя мама?','吗你是我妈妈？','ma nǐ shì wǒ māma?',0,'你是我妈妈吗？','<b class="zh">吗</b> ставим в <b>конец</b> предложения.'],
 ['Они мои папа и мама.','他们是我爸爸妈妈。','tāmen shì wǒ bàba māma.',1,'他们是我爸爸妈妈。',''],
 ['Он мой папа.','他不是我爸爸。','tā bú shì wǒ bàba.',0,'他是我爸爸。','Здесь нет «не» — <b class="zh">不</b> лишнее.'],
 ['Нет, она не моя мама.','不是，她不是我妈妈。','bú shì, tā bú shì wǒ māma.',1,'不是，她不是我妈妈。','']];
function verno11(){const n=4;const Q=shuffle(VN.map((_,i)=>i));let k=0,ok=0;const res=[];
 const ask=()=>{if(k>=Q.length)return end();const [ru,zh,py,right,fix,why]=VN[Q[k]];
  shell(`${backBtn}${tag(n)}<h2>✅ Верно или неверно?</h2>
   <div class="rbox" style="--c1:#6A6DDE;--c2:#664796"><b>Правило</b><b class="zh">吗</b> в конце — вопрос «да или нет?» · <b class="zh">是</b> — связка · <b class="zh">不是</b> — «не является»</div>
   <div class="qcard n"><div class="qhead"><span>Предложение ${k+1} из ${Q.length}</span><span>✓ ${ok}</span></div>
    <div class="vn11ru">${esc(ru)}</div><div class="vn11zh zh">${zh}</div><div class="vn11py py">${pySent8(py)}</div>
    <p class="hint2" style="text-align:center">Правильно ли переведено?</p>
    <div class="vn11b"><button class="btn" data-a="1">Верно</button><button class="btn" data-a="0">Неверно</button></div>
    <div class="fb" id="fb"></div><div id="nx"></div></div>`);
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=+b.dataset.a,good=a===right;if(good)ok++;res.push([VN[Q[k]][0],zh,a,right]);
   document.querySelectorAll('[data-a]').forEach(x=>{x.disabled=true;x.classList.toggle('pick',x===b);});
   const fb=$('#fb');fb.className='fb '+(good?'ok':'no');
   fb.innerHTML=(good?'✓ Правильно! ':'Не совсем. ')+(right?`Перевод верный: <b class="zh">${fix}</b>`:`<div class="why8">${why}</div>Правильно: <b class="zh">${fix}</b>`);
   playW(fix);$('#nx').innerHTML=`<div class="row" style="justify-content:center"><button class="btn g" id="ls">🔊 Ещё раз</button><button class="btn" id="nb">${k+1<Q.length?'Дальше →':'Готово →'}</button></div>`;
   $('#ls').onclick=()=>playW(fix,$('#ls'));$('#nb').onclick=()=>{k++;ask();};});};
 const end=()=>{finish(n,ok,Q.length,{res,miss:res.filter(r=>r[2]!==r[3]).map(r=>r[1])});
  shell(doneBox(n,`<div class="res" style="text-align:center">${ok} / ${Q.length}</div><p class="lead" style="text-align:center">${ok===Q.length?'Все ответы верные! 🏆':'Хорошо! Где были ошибки — можно повторить для закрепления 🙂'}</p>`));againOn(verno11);};
 ask();}
const pySent8=p=>p.split(' ').map(w=>`<span style="color:${TCV[toneS(w)]}">${esc(w)}</span>`).join(' ');

// 5. Собери предложение из слов-плиток
const FZ11=[{ru:'Он мой папа.',w:['他','是','我','爸爸']},{ru:'Она не моя мама.',w:['她','不是','我','妈妈']},{ru:'Он твой папа?',w:['他','是','你','爸爸','吗']},
 {ru:'Она твоя мама?',w:['她','是','你','妈妈','吗']},{ru:'Он не твой папа.',w:['他','不是','你','爸爸']},{ru:'Они мои папа и мама.',w:['他们','是','我','爸爸','妈妈']}];
const FZT11={'他':'tā','她':'tā','我':'wǒ','你':'nǐ','是':'shì','不是':'bú shì','吗':'ma','妈妈':'māma','爸爸':'bàba','他们':'tāmen','我们':'wǒmen'};
function fraza11(){const n=5;const Q=shuffle(FZ11);let k=0,errs=0;const miss=[];
 const ask=()=>{if(k>=Q.length)return end();const q=Q[k];const say=q.w.join('');
  const sw={'他':'她','她':'他','是':'不是','不是':'是','你':'我','我':'你','妈妈':'爸爸','爸爸':'妈妈'};
  let extra=[...new Set(q.w.map(x=>sw[x]).filter(x=>x&&!q.w.includes(x)))];if(!q.w.includes('吗'))extra.push('吗');
  extra=shuffle(extra).slice(0,Math.max(2,7-q.w.length));const tiles=shuffle([...q.w,...extra]);let got=[],bad=0;
  shell(`${backBtn}${tag(n)}<h2>🧱 Собери предложение</h2>
   <div class="rbox" style="--c1:#6A6DDE;--c2:#664796"><b>Как играть</b>Прочитай по-русски и нажимай плитки <b>по порядку</b>. Вопрос «да или нет?» — <b class="zh">吗</b> в конце.</div>
   <div class="qcard n"><div class="qhead"><span>Предложение ${k+1} из ${Q.length}</span><span>ошибок: ${errs}</span></div>
    <div class="fz9ru">${q.ru}</div><div class="fz9line" id="ln">${q.w.map(()=>'<span class="fz9gap"></span>').join('')}</div>
    <div class="fz9tiles">${tiles.map((t,i)=>`<button class="fz9t" data-i="${i}"><b class="zh">${t}</b><small>${FZT11[t]}</small></button>`).join('')}</div>
    <div class="fb" id="fb"></div><div id="nx"></div></div>`);
  document.querySelectorAll('.fz9t').forEach(b=>b.onclick=()=>{const t=tiles[+b.dataset.i],want=q.w[got.length];if(got.length>=q.w.length)return;
   if(t===want){got.push(t);b.disabled=true;b.classList.add('used');const g=document.querySelectorAll('#ln .fz9gap')[got.length-1];g.innerHTML=`<b class="zh">${t}</b>`;g.classList.add('ok');$('#fb').className='fb';$('#fb').innerHTML='';
    if(got.length===q.w.length){playW(say);const fb=$('#fb');fb.className='fb ok';fb.innerHTML=`✓ Верно! <b class="zh">${say}</b> <span class="py">${q.w.map(x=>FZT11[x]).join(' ')}</span>`;
     $('#nx').innerHTML=`<div class="row" style="justify-content:center"><button class="btn g" id="ls">🔊 Ещё раз</button><button class="btn" id="nb">${k+1<Q.length?'Дальше →':'Готово →'}</button></div>`;
     $('#ls').onclick=()=>playW(say,$('#ls'));$('#nb').onclick=()=>{k++;ask();};}}
   else{errs++;bad++;if(bad===1)miss.push(q.ru);shake(b);const fb=$('#fb');fb.className='fb no';
    const why=(t==='他'&&want==='她')?'Тут <b>она</b> — нужен 她 с ключом <b>女</b>.':(t==='她'&&want==='他')?'Тут <b>он</b> — нужен 他 с ключом <b>亻</b>.':(t==='吗')?'<b class="zh">吗</b> ставим только в <b>конец</b> вопроса.':(t==='不是'&&want==='是')?'Здесь нет «не» — нужен просто <b class="zh">是</b>.':(t==='是'&&want==='不是')?'Здесь «не» — нужен <b class="zh">不是</b>.':`Сейчас нужно слово «${FZT11[want]}». Посмотри ещё раз 🙂`;
    fb.innerHTML=`<div class="why8">${why}</div>`;}});};
 const end=()=>{finish(n,Q.length-miss.length,Q.length,{errs,miss});
  shell(doneBox(n,`<div class="res" style="text-align:center">${Q.length-miss.length} / ${Q.length}</div><p class="lead" style="text-align:center">${errs?'Хорошо! Где были ошибки — можно повторить для закрепления 🙂':'Все предложения без ошибок! 🏆'}</p>
   <div class="mlist">${FZ11.map(q=>`<button class="n" data-say="${q.w.join('')}"><span class="zh" style="font-size:22px">${q.w.join('')}</span><small>${q.ru}</small>🔊</button>`).join('')}</div>`));
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>playW(b.dataset.say,b));againOn(fraza11);};
 ask();}

// 6. Напиши предложение иероглифами (пальцем). Подсказки можно включить: пиньинь + серый образец
const PS11=[['Привет всем!','你们好','nǐmen hǎo'],['Она моя мама.','她是我妈妈','tā shì wǒ māma'],['Он не мой папа.','他不是我爸爸','tā bú shì wǒ bàba'],['Она твоя мама?','她是你妈妈吗','tā shì nǐ māma ma']];
function pishi11(){const n=6;S.ps=S.ps||{};const A=S.ps;let k=PS11.findIndex((_,i)=>!A[i]);if(k<0)return end();
 const [ru,zh,py]=PS11[k];const ch=[...zh];let j=0,mist=0,hints=0;
 const draw=()=>{const H=!!S.hints;
  shell(`${backBtn}${tag(n)}<h2>✍️ Напиши иероглифами</h2>
   <div class="qcard n"><div class="qhead"><span>Предложение ${k+1} из ${PS11.length}</span><button class="ps11sw${H?' on':''}" id="sw" aria-pressed="${H}"><i></i>Подсказки</button></div>
    <div class="dk11ru">${esc(ru)}${/吗$/.test(zh)?'':''}</div>
    ${H?`<div class="vn11py py">${pySent8(py)}</div>`:''}
    <div class="ps11ln">${ch.map((c,i)=>`<span class="${i<j?'ok':i===j?'cur':''}">${i<j?`<b class="zh">${c}</b>`:''}</span>`).join('')}${/吗$/.test(zh)?'<em>？</em>':'<em>。</em>'}</div>
    <div class="wbox">${GRID}<div class="hw" id="hw"></div></div><p class="hint2" id="wh" style="text-align:center;margin-top:8px">${H?'Обведи по серому образцу':'Пиши по памяти. Не помнишь — включи подсказки'}</p></div>`);
  $('#sw').onclick=()=>{S.hints=!S.hints;keepS();if(S.hints)hints++;draw();};
  writeOne($('#hw'),ch[j],{outline:H,hintAfter:H?1:3},$('#wh'),r=>{mist+=r.mist;j++;if(j<ch.length)draw();else done();});};
 const done=()=>{A[k]={mist,hints:hints||(S.hints?1:0)};keepS();send('ps',{a:PS11.map((_,i)=>A[i]||null)});playW(zh);
  shell(`${backBtn}${tag(n)}<h2>✍️ Напиши иероглифами</h2><div class="qcard n"><div class="qhead"><span>Предложение ${k+1} из ${PS11.length}</span><span>✓</span></div>
   <div class="dk11ru">${esc(ru)}</div><div class="vn11zh zh">${zh}${/吗$/.test(zh)?'？':'。'}</div><div class="vn11py py">${pySent8(py)}</div>
   <div class="fb ${mist<=3?'ok':'no'}">${mist<=3?'✓ Написано!':'Написано! Ошибок в чертах: '+mist+' — можно повторить для закрепления 🙂'}</div>
   <div class="row" style="justify-content:center"><button class="btn g" id="ls">🔊 Послушать</button><button class="btn" id="nb">${k+1<PS11.length?'Дальше →':'Готово →'}</button></div></div>`);
  $('#ls').onclick=()=>playW(zh,$('#ls'));$('#nb').onclick=pishi11;};
 draw();
 function end(){const clean=PS11.filter((_,i)=>A[i]&&A[i].mist<=3).length;
  finish(n,clean,PS11.length,{res:PS11.map((p,i)=>[p[1],(A[i]||{}).mist||0,(A[i]||{}).hints||0]),miss:PS11.filter((_,i)=>!(A[i]&&A[i].mist<=3)).map(p=>p[1])});
  shell(doneBox(n,`<div class="res" style="text-align:center">${clean} / ${PS11.length}</div><p class="lead" style="text-align:center">Все предложения написаны! ${clean===PS11.length?'🏆':'Где были ошибки — можно повторить для закрепления 🙂'}</p>
   <div class="mlist">${PS11.map(p=>`<button class="n" data-say="${p[1]}"><span class="zh" style="font-size:22px">${p[1]}</span><small>${p[0]}</small>🔊</button>`).join('')}</div>`));
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>playW(b.dataset.say,b));againOn(()=>{S.ps={};keepS();pishi11();});}}
route();
</script></body></html>
