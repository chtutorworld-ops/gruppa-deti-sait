<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Выбор голоса для диктанта</title>
<style>
:root{--bg:#F8F8F8;--nd:#DDDDDD;--ink:#1B1430;--ink2:#2C2248;--vio:#664796;--ok-t:#DDF3F2;--ok-ink:#16767A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink2);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{color:var(--ink);font-size:28px;margin:0 0 6px}p{margin:6px 0 18px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.v{background:var(--bg);border-radius:22px;padding:16px;box-shadow:6px 6px 14px var(--nd),-6px -6px 14px #fff}
.v h2{margin:0 0 10px;font-size:20px;color:var(--ink)}
.r{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:700;color:var(--ink2);border:0;border-radius:14px;padding:9px 12px;min-width:62px;background:var(--bg);cursor:pointer;
 box-shadow:inset 3px 3px 7px var(--nd),inset -3px -3px 7px #fff}
button.on{background:var(--ok-t);color:var(--ok-ink)}
button.all{background:linear-gradient(135deg,#6A6DDE,#664796);color:#fff;box-shadow:none;margin-top:10px;width:100%}
small{display:block;margin-top:28px;color:#62578A}
</style></head><body><main>
<h1>Какой голос поставить в диктант?</h1>
<p>Это живые носители, не синтезатор. Послушай каждый голос и напиши номер, например «женский 2». Этим голосом будут звучать все слоги в диктантах и «угадай на слух».</p>
<div class="g" id="g"></div>
<small>Записи: Tone Perfect, Michigan State University Libraries (tone.lib.msu.edu), учебное использование.</small>
</main>
<script>
const SP=[['FV1','Женский 1'],['FV2','Женский 2'],['FV3','Женский 3'],['MV1','Мужской 1'],['MV2','Мужской 2'],['MV3','Мужской 3']];
const S=[['ma1','mā'],['ma2','má'],['ma3','mǎ'],['ma4','mà'],['bai3','bǎi'],['hao3','hǎo'],['wo3','wǒ'],['lv3','lǚ'],['mei2','méi'],['dou4','dòu']];
let cur=null;
function play(u,b){return new Promise(r=>{try{cur&&cur.pause()}catch(e){}const a=new Audio(u);cur=a;b.classList.add('on');
 const end=()=>{b.classList.remove('on');r()};a.onended=end;a.onerror=end;a.play().catch(end);});}
document.getElementById('g').innerHTML=SP.map(([k,n])=>`<div class="v"><h2>${n}</h2><div class="r">${S.map(([s,p])=>`<button data-u="../audio/tp/cmp/${k}/${s}.mp3">${p}</button>`).join('')}</div><button class="all" data-k="${k}">Послушать все подряд</button></div>`).join('');
document.querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>play(b.dataset.u,b));
document.querySelectorAll('button.all').forEach(b=>b.onclick=async()=>{for(const x of b.parentNode.querySelectorAll('button[data-u]')){await play(x.dataset.u,x);await new Promise(r=>setTimeout(r,250));}});
</script></body></html>
