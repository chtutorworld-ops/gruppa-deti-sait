name: Выложить сайт
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Взять готовую озвучку из прошлых выкладок
        uses: actions/cache@v4
        with:
          path: |
            site/audio
            .audio-cand
          key: audio2-${{ hashFiles('tools/audio-list.txt', 'tools/audio-tones.json', 'tools/make_audio.py') }}
          restore-keys: audio2-
      - name: Озвучить новые слоги (голос Microsoft Edge)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          pip install edge-tts numpy miniaudio
          python tools/make_audio.py
          ls site/audio | wc -l
      - name: Эталонные тоны (перерисовать мелодию по учебнику)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python tools/make_tones.py
          ls site/audio/syn | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
