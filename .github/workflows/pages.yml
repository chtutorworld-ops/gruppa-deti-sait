name: Выложить сайт
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Взять готовую озвучку из прошлых выкладок
        uses: actions/cache@v4
        with:
          path: |
            site/audio
            .audio-cand
          key: audio2-${{ hashFiles('tools/audio-list.txt', 'tools/audio-tones.json', 'tools/make_audio.py', 'tools/make_dict.py', 'tools/make_tp.py') }}
          restore-keys: audio2-
      - name: Озвучить новые слоги (голос Microsoft Edge)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          pip install edge-tts numpy miniaudio
          python tools/make_audio.py
          ls site/audio | wc -l
      - name: Голос для диктантов (один голос, протяжно, 3-й тон — ямка с кряхтением)
        continue-on-error: true
        timeout-minutes: 40
        run: |
          pip install lameenc
          python tools/make_dict.py
          ls site/audio/dict | wc -l
      - name: Живые голоса для диктантов (Tone Perfect, носители, все слоги в 4 тонах)
        continue-on-error: true
        timeout-minutes: 25
        run: python tools/make_tp.py
      - name: Сразу сохранить озвучку (если выкладку прервёт новая — не озвучивать заново)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            site/audio
            .audio-cand
          key: audio2-${{ hashFiles('tools/audio-list.txt', 'tools/audio-tones.json', 'tools/make_audio.py', 'tools/make_dict.py', 'tools/make_tp.py') }}
      - name: Эталонные тоны (перерисовать мелодию по учебнику)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          python tools/make_tones.py
          ls site/audio/syn | wc -l
      - name: Голос учителя (записи из хранилища)
        continue-on-error: true
        timeout-minutes: 5
        run: python tools/fetch_voice.py
      - name: Проверить тоны в записях учителя (тем же анализатором, что в ДЗ)
        continue-on-error: true
        run: node tools/voice_report.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
